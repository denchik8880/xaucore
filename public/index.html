/* ---------- "🔒 Доступ к сайту" card (Settings) ----------
   Talks to /api/lock + /api/owner. The real enforcement is server-side
   (middleware.js); this card is just the switch + owner sign-in. */
async function refreshLockCard(){
  const card = document.getElementById("lockCard");
  if(!card) return;
  let info;
  try{ info = await xcApi("GET", "/api/lock"); }
  catch(e){ return; }                              // leave the card hidden on error

  if(!info.configured){ card.remove(); return; }   // feature not set up on the server — stays hidden
  card.style.display = "";

  const stateRow = (locked)=>`<div class="row" style="margin-bottom:8px">
      <span class="k">Для обычных посетителей</span>
      <span class="v" style="color:${locked?'var(--red)':'var(--green)'}">${locked?'ЗАКРЫТ':'ОТКРЫТ'}</span></div>`;

  if(info.isOwner){
    card.innerHTML = `<h3>🔒 САЙТ ЗАКРЫТ</h3>
      ${stateRow(info.locked)}
      <div class="pill-toggle" id="lockPills">
        <button data-lock="1" class="${info.locked?'on':''}">ON · закрыт</button>
        <button data-lock="0" class="${info.locked?'':'on'}">OFF · открыт</button>
      </div>
      <div class="hint" style="margin-top:8px">«ON» — посетители видят страницу технических работ. Ваш вход владельца, симулятор, данные и прогресс не сбрасываются. Применяется в течение ~5 секунд.</div>
      <button class="btn ghost" id="ownerLogout" style="margin-top:10px">Выйти из режима владельца</button>`;
    card.querySelectorAll("[data-lock]").forEach(b=> b.onclick = async ()=>{
      const want = b.dataset.lock === "1";
      if(want === !!info.locked) return;
      b.disabled = true;
      try{
        await xcApi("POST", "/api/lock", { locked: want });
        toast("", want ? "🔒 Сайт закрыт для посетителей" : "🔓 Сайт снова открыт");
      }catch(e){ toast("o", e.message || "Не удалось изменить"); }
      refreshLockCard();
    });
    card.querySelector("#ownerLogout").onclick = async ()=>{
      try{ await xcApi("DELETE", "/api/owner"); }catch(e){}
      toast("", "Режим владельца выключен на этом устройстве");
      refreshLockCard();
    };
    return;
  }

  // not the owner — show status + an inline owner sign-in
  card.innerHTML = `<h3>🔒 Доступ к сайту</h3>
    <div class="row"><span class="k">Статус</span><span class="v">${info.locked?'закрыт для посетителей':'открыт'}</span></div>
    <div class="field" style="margin:10px 0 0">
      <label>Ключ владельца</label>
      <input id="ownerKey" type="password" autocomplete="off" placeholder="••••••••">
      <div class="hint" id="ownerMsg" style="min-height:14px"></div>
    </div>
    <button class="btn ghost" id="ownerLogin">Войти как владелец</button>`;
  const doLogin = async ()=>{
    const inp = card.querySelector("#ownerKey"), msg = card.querySelector("#ownerMsg"), btn = card.querySelector("#ownerLogin");
    if(!inp.value){ inp.focus(); return; }
    btn.disabled = true; msg.textContent = "";
    try{
      await xcApi("POST", "/api/owner", { key: inp.value });
      toast("", "Вы вошли как владелец");
      refreshLockCard();
    }catch(e){ msg.style.color = "var(--red)"; msg.textContent = "Неверный ключ"; btn.disabled = false; }
  };
  card.querySelector("#ownerLogin").onclick = doLogin;
  card.querySelector("#ownerKey").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
}

        <div class="row"><span class="k">Медианный дневной диапазон</span><span class="v mono">$${r.medianRange}</span></div>

  act("logout", async ()=>{
    if(XC.token && !confirm("Выйти из аккаунта? Локальная копия останется на этом устройстве.")) return;
    xcPushState(true);
    try{ if(XC.token) await xcApi("POST","/api/auth/logout"); }catch(e){}
    xcClearSession();
    stopLoop(); XC.booted = false;
    _authMode = "login"; screenAuth("Вы вышли из аккаунта");
  });
  act("upgrade", ()=>{
    openSheet(`
      <h2>Создать аккаунт</h2>
      <div class="hint" style="margin-bottom:10px">Текущий прогресс сохранится за новым аккаунтом. После этого симулятор доступен с любого устройства.</div>
      <div class="field"><label>Email</label><input id="up-email" type="email" inputmode="email"></div>
      <div class="field"><label>Пароль (мин. 6 символов)</label><input id="up-pass" type="password"></div>
      <button class="btn green" id="up-go">Создать</button>
      <button class="btn ghost" data-close>Отмена</button>
    `);
    document.getElementById("up-go").onclick = async ()=>{
      const b = document.getElementById("up-go"); b.disabled = true; b.textContent = "…";
      try{
        const res = await xcApi("POST","/api/auth/upgrade",{ email:(document.getElementById("up-email").value||"").trim(), password:document.getElementById("up-pass").value||"" });
        XC.email = res.email; XC.guest = false;
        localStorage.setItem("xc_email", XC.email); localStorage.setItem("xc_guest","0");
        xcPushState(true);
        closeModal(); render();
        toast("g","Аккаунт создан: "+XC.email);
      }catch(e){ b.disabled = false; b.textContent = "Создать"; toast("r", e.message||"Ошибка"); }
    };
  });
  act("newsresult", ()=>{ if(S.newsLog[0]) showNewsResult(S.newsLog[0]); });

  root.querySelectorAll("[data-news]").forEach(b=> b.onclick = ()=>{
    let t = b.dataset.news;
    if(t === "RANDOM") t = NEWS_TYPES[Math.floor(Math.random()*NEWS_TYPES.length)];
    startNews(t);
    render();
  });

  // Manual Market Control — only reachable when S.manual.enabled (panel not rendered otherwise)
  root.querySelectorAll("[data-god]").forEach(b=> b.onclick = ()=>{
    const a = b.dataset.god;
    const rd = id => { const el = document.getElementById(id); return el ? parseFloat((el.value||"").replace(/[\s,]/g,"")) : NaN; };
    const st = rd("gpStep"); if(isFinite(st) && st > 0) S.manual.stepSize = roundTo(st, 2);
    const mv = rd("gpMove"); if(isFinite(mv) && mv > 0) S.manual.moveSize = roundTo(mv, 2);
    if(a === "pause"){ manualPause(true); render(); }
    else if(a === "resume"){ manualPause(false); render(); }
    else if(a === "setpx"){ manualSetPrice(rd("gpSet")); }
    else if(a === "up"){ manualNudge(+b.dataset.v); }
    else if(a === "dn"){ manualNudge(-b.dataset.v); }
    else if(a === "tickup"){ manualTick(1); }
    else if(a === "tickdn"){ manualTick(-1); }
    else if(a === "moveup"){ manualMove(1); }
    else if(a === "movedn"){ manualMove(-1); }
    else if(a === "idir"){ S.manual.impDir = +b.dataset.d; render(); }
    else if(a === "impulse"){
      const u = rd("gpImpUsd"), s = rd("gpImpSec");
      if(isFinite(u) && u > 0) S.manual.impUsd = u;
      if(isFinite(s) && s > 0) S.manual.impSec = s;

    const apply = (raw)=>{
      let v = parseFloat(raw);
      if(!isFinite(v)) v = S.market.ticksPerSecond;
      v = clamp(Math.round(v*10)/10, 0.1, 20);
      S.market.ticksPerSecond = v;
      if(numI && document.activeElement !== numI) numI.value = v;
      if(sld && document.activeElement !== sld) sld.value = v;
      if(valEl) valEl.textContent = fmt(v,1);
      markPreset(v);
      restartNormalTicks();          // instant, no reload
      save();
    };

    if(numI){ numI.oninput = ()=> apply(numI.value); numI.onchange = ()=> apply(numI.value); }

function setTradeEnabled(on){
  ["btnBuy","btnSell"].forEach(id=>{ const el = document.getElementById(id); if(el) el.disabled = !on; });
}
function stepLot(dir){
  if(guardLock()) return;
  const step = S.symbol.lotStep;
  let v = roundTo(S.ui.lot + dir*step, 2);
  v = clamp(v, S.symbol.minLot, S.symbol.maxLot);
  S.ui.lot = v;
  const li = document.getElementById("lotInput");
  if(li) li.value = fmt(v,2);
  const errEl = document.getElementById("lotErr"); if(errEl) errEl.textContent="";
  setTradeEnabled(true);
  save();
  // update quick trade button labels elsewhere
  updateLive();
}

/* ---------- market confirm ---------- */
function confirmMarket(side){
  if(guardLock()) return;
  const v = S.ui.lot;
  const err = validateLot(v);
  if(err){ toast("r", err); return; }
  const px = side==="buy" ? S.price.ask : S.price.bid;
  const comm = commissionFor(v, px);
  const reqM = (v*S.symbol.contractSize*S.price.mid)/S.symbol.leverage;
  openSheet(`
    <h2>${side==="buy"?"КУПИТЬ (BUY)":"ПРОДАТЬ (SELL)"} XAUUSD</h2>
    <div class="card">
      <div class="row"><span class="k">Объём</span><span class="v mono">${fmt(v,2)} lot (${fmt(v*S.symbol.contractSize,0)} oz)</span></div>
      <div class="row"><span class="k">Цена (${side==="buy"?"Ask":"Bid"})</span><span class="v mono" id="ck-px">${pxfmt(px)}</span></div>
      <div class="row"><span class="k">Execution</span><span class="v">Market${S.trading.slippageOn?" (± slippage)":""}</span></div>
      <div class="row"><span class="k">Commission (open)</span><span class="v mono">${money(comm)}</span></div>
      <div class="row"><span class="k">Commission round-trip</span><span class="v mono">${money(comm*2)}</span></div>
      <div class="row"><span class="k">Required Margin</span><span class="v mono">${money(reqM)}</span></div>
      <div class="row"><span class="k">Free Margin</span><span class="v mono">${money(S._acc.freeMargin)}</span></div>
    </div>
    <div class="field"><label>Stop Loss (price, optional)</label><input id="ck-sl" inputmode="decimal" placeholder="—"></div>
    <div class="field"><label>Take Profit (price, optional)</label><input id="ck-tp" inputmode="decimal" placeholder="—"></div>
    <button class="btn ${side==="buy"?"green":"red"}" id="ck-go">${side==="buy"?"Купить":"Продать"} ${fmt(v,2)} XAUUSD</button>
    <button class="btn ghost" data-close>Отмена</button>
  `);
  const upd = ()=>{ const e = document.getElementById("ck-px"); if(e) e.textContent = pxfmt(side==="buy"?S.price.ask:S.price.bid); };
  modalEl._live = upd;
  document.getElementById("ck-go").onclick = ()=>{
    const sl = parseFloat((document.getElementById("ck-sl").value||"").replace(/[\s,]/g,""));
    const tp = parseFloat((document.getElementById("ck-tp").value||"").replace(/[\s,]/g,""));
    const opts = {};
    if(isFinite(sl)) opts.sl = sl;
    if(isFinite(tp)) opts.tp = tp;
    // sanity check SL/TP sides
    const ref = side==="buy"?S.price.ask:S.price.bid;
    if(opts.sl){ if(side==="buy" && opts.sl>=ref){ toast("r","SL для BUY должен быть ниже цены"); return; } if(side==="sell" && opts.sl<=ref){ toast("r","SL для SELL должен быть выше цены"); return; } }
    if(opts.tp){ if(side==="buy" && opts.tp<=ref){ toast("r","TP для BUY должен быть выше цены"); return; } if(side==="sell" && opts.tp>=ref){ toast("r","TP для SELL должен быть ниже цены"); return; } }
    const p = openPosition(side, v, opts);
    if(p){ closeModal(); render(); }
  };
}

/* ---------- order ticket (market + pending) ---------- */
let ticketState = { mode:"market", side:"buy", ptype:"buy_limit" };
function openTicket(){
  if(guardLock()) return;
  ticketState = { mode:"market", side:"buy", ptype:"buy_limit" };
  drawTicket();
}
function drawTicket(){
  const v = S.ui.lot;
  const t = ticketState;
  openSheet(`
    <h2>Новый ордер · XAUUSD</h2>
    <div class="seg" style="margin-bottom:12px">
      <button data-tmode="market" class="${t.mode==="market"?"on":""}">Market</button>
      <button data-tmode="pending" class="${t.mode==="pending"?"on":""}">Pending</button>
    </div>
    <div class="field"><label>Объём (Лоты) — ${fmt(S.symbol.minLot,2)}…${fmt(S.symbol.maxLot,2)}, шаг ${fmt(S.symbol.lotStep,2)}</label>
      <input id="tk-vol" inputmode="decimal" value="${fmt(v,2)}"></div>
    ${t.mode==="market" ? `
      <div class="seg" style="margin-bottom:12px">
        <button data-tside="sell" class="${t.side==="sell"?"on":""}" style="color:var(--red)">SELL @ <span id="tk-bid" class="mono">${pxfmt(S.price.bid)}</span></button>
        <button data-tside="buy" class="${t.side==="buy"?"on":""}" style="color:var(--green)">BUY @ <span id="tk-ask" class="mono">${pxfmt(S.price.ask)}</span></button>
      </div>
    ` : `
      <div class="field"><label>Тип</label>
        <select id="tk-ptype">
          ${["buy_limit","sell_limit","buy_stop","sell_stop"].map(x=>`<option value="${x}" ${t.ptype===x?"selected":""}>${x.replace("_"," ").toUpperCase()}</option>`).join("")}
        </select>
        <div class="hint">Limit: Buy ниже рынка / Sell выше. Stop: Buy выше / Sell ниже.</div>
      </div>
      <div class="field"><label>Entry Price</label><input id="tk-price" inputmode="decimal" value="${pxfmt(t.ptype.includes("buy")? S.price.ask - 3 : S.price.bid + 3)}"></div>
    `}
    <div class="grid2">
      <div class="field"><label>Stop Loss (price)</label><input id="tk-sl" inputmode="decimal" placeholder="—"></div>
      <div class="field"><label>Take Profit (price)</label><input id="tk-tp" inputmode="decimal" placeholder="—"></div>
    </div>
    <div class="card" id="tk-calc"></div>
    <button class="btn dark" id="tk-go">Разместить</button>
    <button class="btn ghost" data-close>Отмена</button>
  `);
  modalEl.querySelectorAll("[data-tmode]").forEach(b=> b.onclick = ()=>{ ticketState.mode = b.dataset.tmode; drawTicket(); });
  modalEl.querySelectorAll("[data-tside]").forEach(b=> b.onclick = ()=>{ ticketState.side = b.dataset.tside; drawTicket(); });
  const pt = document.getElementById("tk-ptype");
  if(pt) pt.onchange = ()=>{ ticketState.ptype = pt.value; drawTicket(); };
  const recalc = ()=>{
    const vol = parseFloat((document.getElementById("tk-vol").value||"").replace(/[\s,]/g,""));
    const err = validateLot(vol);
    const cal = document.getElementById("tk-calc");
    if(err){ cal.innerHTML = `<span class="neg">⚠ ${err}</span>`; return; }
    const px = ticketState.mode==="market" ? (ticketState.side==="buy"?S.price.ask:S.price.bid)
              : parseFloat((document.getElementById("tk-price").value||"").replace(/[\s,]/g,""));
    const comm = commissionFor(vol, px||S.price.mid);
    const reqM = (vol*S.symbol.contractSize*(px||S.price.mid))/S.symbol.leverage;
    cal.innerHTML = `
      <div class="row"><span class="k">Volume</span><span class="v mono">${fmt(vol,2)} lot · ${fmt(vol*S.symbol.contractSize,0)} oz</span></div>
      <div class="row"><span class="k">Commission / side</span><span class="v mono">${money(comm)}</span></div>
      <div class="row"><span class="k">Round-trip commission</span><span class="v mono">${money(comm*2)}</span></div>
      <div class="row"><span class="k">Required Margin</span><span class="v mono">${money(reqM)}</span></div>`;
  };
  ["tk-vol","tk-price"].forEach(id=>{ const e = document.getElementById(id); if(e) e.oninput = recalc; });
  recalc();
  modalEl._live = ()=>{
    const b = document.getElementById("tk-bid"), a = document.getElementById("tk-ask");
    if(b) b.textContent = pxfmt(S.price.bid);
    if(a) a.textContent = pxfmt(S.price.ask);
  };
  document.getElementById("tk-go").onclick = ()=>{
    const vol = parseFloat((document.getElementById("tk-vol").value||"").replace(/[\s,]/g,""));
    const sl = parseFloat((document.getElementById("tk-sl").value||"").replace(/[\s,]/g,""));
    const tp = parseFloat((document.getElementById("tk-tp").value||"").replace(/[\s,]/g,""));
    const opts = {}; if(isFinite(sl)) opts.sl = sl; if(isFinite(tp)) opts.tp = tp;
    if(ticketState.mode === "market"){
      const p = openPosition(ticketState.side, vol, opts);
      if(p){ S.ui.lot = roundTo(vol,2); closeModal(); render(); }
    }else{
      const price = parseFloat((document.getElementById("tk-price").value||"").replace(/[\s,]/g,""));
      if(!isFinite(price)){ toast("r","Укажите Entry Price"); return; }
      const o = addPending({ type: ticketState.ptype, volume: vol, price: roundTo(price,S.symbol.digits), sl:opts.sl, tp:opts.tp });
      if(o){ closeModal(); render(); }
    }
  };
}

/* ---------- settings save ---------- */
function num(id, def){ const v = parseFloat((document.getElementById(id).value||"").replace(/[\s,]/g,"")); return isFinite(v)?v:def; }
function saveSettingsFromForm(silent){
  const T = S.trading, M = S.market, sym = S.symbol, NE = S.newsEngine, A = S.account;
  A.currency = document.getElementById("set_cur").value || "USD";
  // Account balance — applied here (via the normal "Сохранить" button). Open
  // positions and pending orders are KEPT; only cash balance / equity change.
  const nb = num("set_bal", A.balance);
  if(isFinite(nb) && nb >= 0 && Math.abs(nb - A.balance) > 0.005){
    A.balance = roundTo(nb, 2);
    A.initialBalance = A.balance;
    recalcAccount();
  }
  sym.contractSize = num("set_cs", sym.contractSize);
  sym.minLot = num("set_minlot", sym.minLot);
  sym.maxLot = num("set_maxlot", sym.maxLot);
  sym.lotStep = num("set_step", sym.lotStep);
  sym.leverage = parseInt(document.getElementById("set_lev").value)||100;
  T.commissionType = document.getElementById("set_ctype").value;
  T.commission = num("set_comm", T.commission);
  T.spreadMode = document.getElementById("set_spmode").value;
  T.fixedSpread = num("set_fsp", T.fixedSpread);
  T.slippageOn = document.getElementById("set_slon").value === "true";
  T.swapLong = num("set_swl", T.swapLong);
  T.swapShort = num("set_sws", T.swapShort);
  T.tripleSwapDay = parseInt(document.getElementById("set_3day").value);
  T.stopOutLevel = num("set_so", T.stopOutLevel);
  T.marginCallLevel = num("set_mc", T.marginCallLevel);
  // Normal Market
  M.initialBid = num("set_ib", M.initialBid);
  M.initialAsk = num("set_ia", M.initialAsk);
  M.dayDurationMin = clamp(num("set_ddur", M.dayDurationMin), 1, 600);
  M.intradayNoise = clamp(num("set_inoise", M.intradayNoise), 0.1, 5);
  M.regimeDriftScale = clamp(num("set_rds", M.regimeDriftScale), 0, 4);
  M.macroBull = clamp(num("set_mb", M.macroBull), -3, 5);
  M.volClusterPersist = clamp(num("set_vcp", M.volClusterPersist), 0.90, 0.999);
  M.ticksPerSecond = clamp(Math.round(num("set_tps", M.ticksPerSecond)*10)/10, 0.1, 20);
  const tsEl = document.getElementById("set_ts");
  if(tsEl){ const ts = parseInt(tsEl.value); if(TIME_SCALES.includes(ts)) M.timeScale = ts; }
  M.baseSpread = clamp(num("set_bsp", M.baseSpread), 0.02, 20);
  M.normalSlippage = clamp(num("set_nsl", M.normalSlippage), 0, 5);
  M.forceOpen = document.getElementById("set_fo").value === "true";
  // Daily volatility band probabilities
  if(!M.dayVolProbs) M.dayVolProbs = dayVolProbDefaults();

function setTxt(id, txt, cls){

/* guarantee a value ALWAYS shows in full — shrink font (to a readable floor) only if it would clip.
   Skips the work when neither the text length nor the box width changed. */
function fitText(el, minPx){
  if(!el) return;
  const key = el.textContent.length + "@" + el.clientWidth;
  if(el._fitKey === key) return;
  el._fitKey = key;
  el.style.fontSize = "";                          // let CSS drive the natural size first
  const floor = minPx || 12;
  let guard = 0;
  while(el.scrollWidth > el.clientWidth + 1 && guard++ < 22){
    const cur = parseFloat(getComputedStyle(el).fontSize) || 20;
    const next = Math.max(floor, cur - 1);
    el.style.fontSize = next + "px";
    if(next === floor) break;
  }
}

/* =========================================================================
   Candlestick chart (canvas) — zoom / pan / crosshair
   ========================================================================= */
const _coarse = window.matchMedia && window.matchMedia("(pointer:coarse)").matches;
let chart = { barW: _coarse ? 10 : 7, gap: 2, offset: 0, cross: null, drag:null, pinch:null, holdT:0 };
const CHART_BW_DEF = _coarse ? 10 : 7;
function chartZoom(k){ chart.barW = clamp(chart.barW*k, 1.6, 64); drawChart(); }
function chartReset(){ chart.barW = CHART_BW_DEF; chart.offset = 0; chart.cross = null; drawChart(); }
let _chartWinDrag = null;   // shared window mousemove/up handler, added once
function setupChartCanvas(){
  const c = document.getElementById("chartCanvas");
  if(!c) return;
  c._w = 0; fitCanvas(c);
  chart.cross = null; chart.drag = null; chart.pinch = null;
  const rc = () => c.getBoundingClientRect();
  const getX = e => (e.touches?e.touches[0].clientX:e.clientX) - rc().left;
  const getY = e => (e.touches?e.touches[0].clientY:e.clientY) - rc().top;

  /* WHEEL: plain wheel scrolls the PAGE (no preventDefault). Ctrl/Cmd+wheel zooms. */
  c.onwheel = e=>{
    if(e.ctrlKey || e.metaKey){ e.preventDefault(); chartZoom(e.deltaY < 0 ? 1.12 : 0.89); }
  };

  /* MOUSE: drag to pan, hover for crosshair. Window listeners live only during a drag. */
  c.onmousedown = e=>{
    if(e.button !== 0) return;
    chart.drag = { x:getX(e), off:chart.offset };
    const mv = ev=>{ if(!chart.drag) return;
      chart.offset = clamp(chart.drag.off + (getX(ev) - chart.drag.x)/(chart.barW+chart.gap), 0, 5000);
      drawChart(); };
    const up = ()=>{ chart.drag = null; window.removeEventListener("mousemove", mv); window.removeEventListener("mouseup", up); };
    window.addEventListener("mousemove", mv);
    window.addEventListener("mouseup", up);
  };
  c.onmousemove = e=>{ if(!chart.drag){ chart.cross = { x:getX(e), y:getY(e) }; drawChart(); } };
  c.onmouseleave = ()=>{ chart.cross = null; drawChart(); };

  /* TOUCH: touch-action:pan-y already lets a vertical swipe scroll the page.
     We only take over (and preventDefault) for a clearly HORIZONTAL drag or a pinch. */
  c.ontouchstart = e=>{
    if(e.touches.length >= 2){
      chart.pinch = { d: tdist(e), w: chart.barW };
      chart.drag = null;
    }else{
      chart.drag = { x:getX(e), y:getY(e), off:chart.offset, active:false, dx:0, dy:0 };
      chart.holdT = Date.now();
      chart.cross = null;
    }
  };
  c.ontouchmove = e=>{
    if(e.touches.length >= 2 && chart.pinch){
      e.preventDefault();
      chart.barW = clamp(chart.pinch.w * tdist(e)/chart.pinch.d, 1.6, 64);
      drawChart();
      return;
    }
    if(!chart.drag) return;
    const nx = getX(e), ny = getY(e);
    chart.drag.dx = nx - chart.drag.x;
    chart.drag.dy = ny - chart.drag.y;
    const held = Date.now() - chart.holdT;
    // commit to a chart pan only when the move is horizontal-dominant
    if(!chart.drag.active && Math.abs(chart.drag.dx) > 10 && Math.abs(chart.drag.dx) > Math.abs(chart.drag.dy)*1.3){
      chart.drag.active = true;
    }
    if(chart.drag.active){
      if(e.cancelable) e.preventDefault();
      chart.offset = clamp(chart.drag.off + chart.drag.dx/(chart.barW+chart.gap), 0, 5000);
      chart.cross = null;
    }else if(held > 380 && Math.abs(chart.drag.dx) < 10 && Math.abs(chart.drag.dy) < 10){
      chart.cross = { x:nx, y:ny };          // long press without moving -> crosshair
      if(e.cancelable) e.preventDefault();
    }
    drawChart();
  };
  c.ontouchend = e=>{
    chart.drag = null; chart.pinch = null;
    if(e.touches.length === 0) setTimeout(()=>{ chart.cross = null; drawChart(); }, 1800);
  };
  drawChart();
}
function tdist(e){ const a=e.touches[0], b=e.touches[1]; return Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); }
function fitCanvas(c){
  const dpr = window.devicePixelRatio||1;
  const w = (c.parentElement && c.parentElement.clientWidth) || c.clientWidth || 320;
  // logical height comes ONLY from data-h — never from the height attribute, which
  // canvas mirrors from the .height property we set below (would double each call).
  const h = parseInt(c.dataset.h) || 200;
  c.width = Math.round(w*dpr); c.height = Math.round(h*dpr);
  c.style.width = w + "px";           // keep CSS size independent of the bitmap size (fixes 2x on hi-dpi)
  c.style.height = h + "px";
  const ctx = c.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  c._w = w; c._h = h;
}
/* rounded pill label used for position / pending markers on the chart */
function chartChip(ctx, x, y, text, o){
  ctx.font = "700 10px 'Open Sans',sans-serif";
  const padX = 5, h = 15, w = Math.ceil(ctx.measureText(text).width) + padX*2;
  const ry = y - h/2;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(x, ry, w, h, 4); else ctx.rect(x, ry, w, h);
  if(o.fill){ ctx.fillStyle = o.fill; ctx.fill(); }
  if(o.stroke){ ctx.setLineDash(o.dash ? [3,2] : []); ctx.lineWidth = 1; ctx.strokeStyle = o.stroke; ctx.stroke(); ctx.setLineDash([]); }
  ctx.fillStyle = o.text; ctx.textAlign = "left"; ctx.textBaseline = "middle";
  ctx.fillText(text, x + padX, y + 0.5);
  ctx.textBaseline = "alphabetic";
  return w;
}
/* push a sorted list of {y} apart so labels/tags don't overlap; keep inside [top,bot] */
function spreadYs(items, gap, top, bot){
  items.sort((a,b)=> a.y - b.y);
  for(let i=1;i<items.length;i++) if(items[i].y - items[i-1].y < gap) items[i].y = items[i-1].y + gap;
  for(let i=items.length-1;i>=0;i--){
    if(items[i].y > bot) items[i].y = bot;
    if(i>0 && items[i].y - items[i-1].y < gap) items[i-1].y = items[i].y - gap;
  }
  for(const it of items) if(it.y < top) it.y = top;
  return items;
}
/* Display reshape of the visible candles into a BID series (like cTrader):
   every visible bar drops half a spread (clamped so a news spread spike doesn't
   lurch the whole chart) so the LIVE bar's close sits exactly ON the Bid line —
   no floating gap, any direction or size — and so a bar doesn't hop when it
   stops being the live one. The live bar, when it's a DOWN bar, additionally has
   its body top capped at the Ask line: the Ask then sits on the body's top EDGE
   instead of slicing through it, and the real open shows as an upper wick.
   Raw S.candles / Price Engine / spread / P&L are untouched; the two lines still
   anchor to the real S.price.bid / S.price.ask. */
function bidCandles(vis, isLive){
  const base = (S.trading.spreadMode === "fixed" ? S.trading.fixedSpread : S.market.baseSpread) || 0;
  const hs = base > 0 ? clamp(S.price.spread, base * 0.5, base * 4) / 2 : 0;
  const ask = S.price.ask, n = vis.length;
  return vis.map((b, i) => {
    let o = b.o - hs, c = b.c - hs, h = b.h - hs, l = b.l - hs;
    if(isLive && i === n - 1 && c < o){                 // live down bar
      if(o > ask) o = ask;                              // body top -> Ask edge
      h = Math.max(h, ask);                             // wick still reaches the real open / Ask
    }
    return { t: b.t, o, h, l, c, v: b.v };
  });
}

function drawChart(){
  if(!S) return;
  const c = document.getElementById("chartCanvas");
  if(!c) return;
  if(!c._w) fitCanvas(c);
  const ctx = c.getContext("2d");
  const TC = themeColors();
  const W = c._w, H = c._h;
  const padR = W < 420 ? 52 : 62, padB = 20, padT = 8;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = TC.bg; ctx.fillRect(0,0,W,H);

  const tf = S.ui.chartTF;
  const data = S.candles[tf] || [];
  if(!data.length) return;
  const bw = chart.barW, gap = chart.gap, unit = bw+gap;
  const plotW = W - padR;
  const nVisible = Math.floor(plotW/unit);
  let endIdx = data.length - Math.round(chart.offset);
  endIdx = clamp(endIdx, 1, data.length);
  let startIdx = Math.max(0, endIdx - nVisible);
  const vis = bidCandles(data.slice(startIdx, endIdx), endIdx === data.length);
  if(!vis.length) return;

  let hi = -Infinity, lo = Infinity;
  for(const b of vis){ hi = Math.max(hi,b.h); lo = Math.min(lo,b.l); }
  hi = Math.max(hi, S.price.ask); lo = Math.min(lo, S.price.bid);
  const pad = (hi-lo)*0.08 || 1;
  hi += pad; lo -= pad;
  const y = p => padT + (hi - p)/(hi - lo) * (H - padT - padB);
  const xOf = i => plotW - (vis.length - i)*unit + gap/2;

  // grid + price scale
  ctx.strokeStyle = TC.grid; ctx.fillStyle = TC.axis; ctx.font = "10px 'Open Sans',sans-serif";
  ctx.textAlign = "left";
  const steps = 5;
  for(let i=0;i<=steps;i++){
    const p = lo + (hi-lo)*i/steps;
    const yy = y(p);
    ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(plotW, yy); ctx.stroke();
    ctx.fillText(pxfmt(p), plotW+4, yy+3);
  }
  // time scale
  ctx.textAlign = "center";
  for(let i=0;i<vis.length;i+=Math.max(1,Math.floor(vis.length/6))){
    const d = new Date(vis[i].t*1000);
    const lbl = (tf==="D1")? (pad2(d.getUTCMonth()+1)+"/"+pad2(d.getUTCDate()))
              : pad2(d.getUTCHours())+":"+pad2(d.getUTCMinutes());
    ctx.fillText(lbl, xOf(i)+bw/2, H-6);
  }

  // candles
  for(let i=0;i<vis.length;i++){
    const b = vis[i];
    const up = b.c >= b.o;
    ctx.strokeStyle = up ? TC.up : TC.down;
    ctx.fillStyle = up ? TC.up : TC.down;
    const cx = xOf(i) + bw/2;
    ctx.beginPath(); ctx.moveTo(cx, y(b.h)); ctx.lineTo(cx, y(b.l)); ctx.stroke();
    const yo = y(b.o), yc = y(b.c);
    const top = Math.min(yo,yc), hgt = Math.max(1, Math.abs(yc-yo));
    ctx.fillRect(xOf(i), top, Math.max(1,bw), hgt);
  }

  // bid / ask price lines — cTrader style: GREEN Ask on top, RED Bid below.
  // Ask > Bid and higher price = higher on screen, so green always ends up above red,
  // at every price level and on every timeframe.
  const CL_ASK = TC.up, CL_BID = TC.down;
  const yAsk = y(S.price.ask), yBid = y(S.price.bid);
  const priceLine = (yy, col)=>{
    ctx.strokeStyle = col; ctx.setLineDash([4,3]);
    ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(plotW, yy); ctx.stroke();
    ctx.setLineDash([]);
  };
  priceLine(yAsk, CL_ASK);
  priceLine(yBid, CL_BID);
  // right-scale tags — keep both readable when the spread is only a few pixels
  let tAsk = yAsk, tBid = yBid;
  if(tBid - tAsk < 17){ const mid = (yAsk + yBid)/2; tAsk = mid - 8.5; tBid = mid + 8.5; }
  const priceTag = (yTag, yLine, col, label)=>{
    ctx.fillStyle = col; ctx.fillRect(plotW, yTag-8, padR, 16);
    ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.font = "10px 'Open Sans',sans-serif";
    ctx.fillText(label, plotW+3, yTag+3);
    if(Math.abs(yTag - yLine) > 1){
      ctx.strokeStyle = col; ctx.beginPath(); ctx.moveTo(plotW, yLine); ctx.lineTo(plotW+3, yTag); ctx.stroke();
    }
  };
  priceTag(tAsk, yAsk, CL_ASK, pxfmt(S.price.ask));
  priceTag(tBid, yBid, CL_BID, pxfmt(S.price.bid));

  /* ---- OPEN POSITIONS + PENDING ORDERS ----------------------------------
     Bound directly to S.positions / S.pendings — no separate viz state.
     open BUY  = solid green line   ·  open SELL = solid red line
     BUY LIMIT/STOP = dashed green  ·  SELL LIMIT/STOP = dashed red        */
  const sym = S.symbol.name;
  const wide = W >= 430;
  const hline = (yy, col, dashed, wpx)=>{
    ctx.strokeStyle = col; ctx.lineWidth = wpx || 1;
    ctx.setLineDash(dashed ? [6,4] : []);
    ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(plotW, yy); ctx.stroke();
    ctx.setLineDash([]); ctx.lineWidth = 1;
  };
  const chips = [];   // left-edge markers  {y, text, fill, stroke, textCol, dash}
  const rtags = [];   // right-axis price tags  {y, price, col}

  // SL / TP first (thin, behind the entry lines)
  for(const p of S.positions){
    if(p.symbol !== sym) continue;
    if(p.sl){ const ys=y(p.sl); ctx.strokeStyle=TC.down; ctx.setLineDash([2,3]); ctx.beginPath(); ctx.moveTo(0,ys); ctx.lineTo(plotW,ys); ctx.stroke(); ctx.setLineDash([]); }
    if(p.tp){ const yt=y(p.tp); ctx.strokeStyle=TC.up;   ctx.setLineDash([2,3]); ctx.beginPath(); ctx.moveTo(0,yt); ctx.lineTo(plotW,yt); ctx.stroke(); ctx.setLineDash([]); }
  }
  // open positions — SOLID line at the entry price
  for(const p of S.positions){
    if(p.symbol !== sym) continue;
    const col = p.side === "buy" ? TC.up : TC.down;
    const yy = y(p.entry);
    hline(yy, col, false, 1.6);
    const arrow = p.side === "buy" ? "↑" : "↓";
    chips.push({ y: yy, text: wide ? `${fmt(p.volume,2)} Лоты ${arrow}` : `${fmt(p.volume,2)} ${arrow}`,
                 fill: col, stroke: null, textCol: "#fff", dash: false });
    rtags.push({ y: yy, price: p.entry, col });
  }
  // pending orders — DASHED line at the order price
  for(const o of S.pendings){
    if(o.symbol !== sym) continue;
    const isBuy = o.type.includes("buy");
    const col = isBuy ? TC.up : TC.down;
    const yy = y(o.price);
    hline(yy, col, true, 1.4);
    const kind = o.type.includes("limit") ? "LIMIT" : "STOP";
    chips.push({ y: yy, text: wide ? `${isBuy?"BUY":"SELL"} ${kind} ${fmt(o.volume,2)}` : `${kind} ${fmt(o.volume,2)} ${isBuy?"↑":"↓"}`,
                 fill: TC.bg, stroke: col, textCol: col, dash: true });
    rtags.push({ y: yy, price: o.price, col });
  }
  // de-collide the left chips, then draw. Shift a chip right of the on-canvas
  // zoom buttons (bottom-left ~[8..46] x [H-150..H-20]) so it isn't hidden.
  spreadYs(chips, 16, 24, H - 9);
  const zoomZone = (yy)=> yy > H - 150 && yy < H - 18;
  for(const ch of chips) chartChip(ctx, zoomZone(ch.y) ? 48 : 2, ch.y, ch.text, { fill: ch.fill, stroke: ch.stroke, text: ch.textCol, dash: ch.dash });
  // right-axis price tags — skip any that would sit on top of the Bid/Ask tags
  spreadYs(rtags, 15, 22, H - 9);
  for(const rt of rtags){
    if(Math.abs(rt.y - tAsk) < 15 || Math.abs(rt.y - tBid) < 15) continue;
    ctx.fillStyle = rt.col; ctx.fillRect(plotW, rt.y - 7, padR, 14);
    ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.font = "10px 'Open Sans',sans-serif";
    ctx.fillText(pxfmt(rt.price), plotW + 3, rt.y + 3);
  }

  // crosshair
  const info = document.getElementById("chartInfo");
  if(chart.cross && chart.cross.x < plotW){
    const cx = chart.cross.x, cy = chart.cross.y;
    ctx.strokeStyle = TC.cross; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx,H-padB); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,cy); ctx.lineTo(plotW,cy); ctx.stroke();
    ctx.setLineDash([]);
    const idx = clamp(Math.round((cx - (plotW - vis.length*unit))/unit), 0, vis.length-1);
    const b = vis[idx];
    const price = lo + (hi-lo)*(1 - (cy-padT)/(H-padT-padB));
    ctx.fillStyle = TC.tag; ctx.fillRect(plotW, cy-8, padR, 16);
    ctx.fillStyle = "#fff"; ctx.textAlign="left"; ctx.fillText(pxfmt(price), plotW+3, cy+3);
    if(b && info){
      const rb = data[startIdx + idx] || b;         // raw OHLC for the text readout
      const d = new Date(rb.t*1000);
      info.style.display = "block";
      info.textContent = `${pad2(d.getUTCMonth()+1)}/${pad2(d.getUTCDate())} ${pad2(d.getUTCHours())}:${pad2(d.getUTCMinutes())}  О ${pxfmt(rb.o)}  Н ${pxfmt(rb.h)}  Л ${pxfmt(rb.l)}  З ${pxfmt(rb.c)}`;
    }
  }else if(info){
    const last = data[data.length-1];
    info.style.display = "block";
    info.textContent = `${tf}   О ${pxfmt(last.o)}  Н ${pxfmt(last.h)}  Л ${pxfmt(last.l)}  З ${pxfmt(last.c)}`;
  }
}

/* mini chart on overview */
function drawMini(){
  if(!S) return;
  const c = document.getElementById("miniCanvas");
  if(!c) return;
  if(!c._w) fitCanvas(c);
  const ctx = c.getContext("2d");
  const TC = themeColors();
  const W = c._w, H = c._h, padR = 52;
  ctx.clearRect(0,0,W,H); ctx.fillStyle=TC.bg; ctx.fillRect(0,0,W,H);
  const data = bidCandles((S.candles.M1||[]).slice(-90), true);
  if(!data.length) return;
  let hi=-Infinity, lo=Infinity;
  for(const b of data){ hi=Math.max(hi,b.h); lo=Math.min(lo,b.l); }
  hi=Math.max(hi,S.price.ask); lo=Math.min(lo,S.price.bid);
  const pad=(hi-lo)*0.1||1; hi+=pad; lo-=pad;
  const plotW = W-padR;
  const y = p => 6 + (hi-p)/(hi-lo)*(H-12);
  const bw = plotW/data.length;
  for(let i=0;i<data.length;i++){
    const b=data[i], up=b.c>=b.o;
    ctx.strokeStyle=up?TC.up:TC.down; ctx.fillStyle=up?TC.up:TC.down;
    const cx=i*bw+bw/2;
    ctx.beginPath(); ctx.moveTo(cx,y(b.h)); ctx.lineTo(cx,y(b.l)); ctx.stroke();
    const yo=y(b.o),yc=y(b.c);
    ctx.fillRect(i*bw+0.5, Math.min(yo,yc), Math.max(1,bw-1.5), Math.max(1,Math.abs(yc-yo)));
  }
  // open positions (solid) + pending orders (dashed) — same S.positions / S.pendings
  const mSym = S.symbol.name;
  ctx.lineWidth = 1;
  for(const p of S.positions){ if(p.symbol!==mSym) continue;
    ctx.strokeStyle = p.side==="buy"?TC.up:TC.down; ctx.setLineDash([]);
    const yy=y(p.entry); ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(plotW,yy); ctx.stroke(); }
  for(const o of S.pendings){ if(o.symbol!==mSym) continue;
    ctx.strokeStyle = o.type.includes("buy")?TC.up:TC.down; ctx.setLineDash([5,3]);
    const yy=y(o.price); ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(plotW,yy); ctx.stroke(); }
  ctx.setLineDash([]);
  // GREEN Ask on top, RED Bid below (cTrader style) — holds at any price / timeframe
  const yb=y(S.price.bid), ya=y(S.price.ask);
  ctx.setLineDash([4,3]);
  ctx.strokeStyle=TC.up; ctx.beginPath(); ctx.moveTo(0,ya); ctx.lineTo(plotW,ya); ctx.stroke();
  ctx.strokeStyle=TC.down; ctx.beginPath(); ctx.moveTo(0,yb); ctx.lineTo(plotW,yb); ctx.stroke();
  ctx.setLineDash([]);
  let la=ya, lb=yb;
  if(lb-la<15){ const mid=(ya+yb)/2; la=mid-7.5; lb=mid+7.5; }
  ctx.font="10px 'Open Sans',sans-serif"; ctx.textAlign="left";
  ctx.fillStyle=TC.up; ctx.fillRect(plotW,la-7,padR,14); ctx.fillStyle="#fff"; ctx.fillText(pxfmt(S.price.ask),plotW+3,la+3);
  ctx.fillStyle=TC.down; ctx.fillRect(plotW,lb-7,padR,14); ctx.fillStyle="#fff"; ctx.fillText(pxfmt(S.price.bid),plotW+3,lb+3);
}

let rtTimer = null, uiTimer = null, _lastCounts = "", _loopRunning = false;
function restartLoop(){
  if(rtTimer){ clearInterval(rtTimer); rtTimer = null; }
  if(!_loopRunning) return;                        // paused / tab hidden -> stay stopped
  rtTimer = setInterval(()=>{ try{ engineFrame(); }catch(e){ console.error(e); } }, RT_MS);
  restartNormalTicks();
}
/* fully STOP the simulation — used while the tab is hidden so nothing advances */
function stopLoop(){
  _loopRunning = false;
  if(rtTimer){ clearInterval(rtTimer); rtTimer = null; }
  if(normalTickTimer){ clearInterval(normalTickTimer); normalTickTimer = null; }
  saveNow();
}
function startLoop(){
  _loopRunning = true;
  _lastFrameReal = Date.now();     // discard any gap since the last active frame
  _lastShockMin = Math.floor((S.simClock||Date.now())/60000);
  restartLoop();
  if(uiTimer) clearInterval(uiTimer);
  uiTimer = setInterval(()=>{

}

/* ---------------- news self-test (20×4 offline simulations) ---------------- */
function runNewsTests(n){
  n = n || 20;
  const out = {};
  for(const ty of NEWS_TYPES){
    const runs = [];
    for(let i=0;i<n;i++) runs.push(simulateNewsOffline(ty));
    const R = runs.map(r=>r.totalRange);
    const fm = runs.map(r=>r.finalMove);
    const up = runs.filter(r=>r.finalMove>0).length;
    out[ty] = {
      n, meanRange:+avg(R).toFixed(1), minRange:+Math.min(...R).toFixed(1), maxRange:+Math.max(...R).toFixed(1),
      medRange:+median(R).toFixed(1),
      pctOver35:+(R.filter(x=>x>=35).length/n*100).toFixed(0),
      pctOver75:+(R.filter(x=>x>=75).length/n*100).toFixed(0),
      pctOver100:+(R.filter(x=>x>=100).length/n*100).toFixed(0),
      up, down:n-up,
      fakeouts:runs.filter(r=>r.fakeout).length, reversals:runs.filter(r=>r.reversal).length,
      twoWay:runs.filter(r=>r.twoWay).length,
      meanFinalAbs:+avg(fm.map(Math.abs)).toFixed(1)
    };
  }
  return out;
}
function avg(a){ return a.reduce((x,y)=>x+y,0)/(a.length||1); }
function median(a){ const s=[...a].sort((x,y)=>x-y); const m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; }

/* =========================================================================
   CLOUD SYNC + ACCOUNTS
   The full simulator state (S) is the save. It is stored locally (fast, offline)
   and mirrored to the server so the SAME frozen state resumes on any device.
   ========================================================================= */
const XC = {
  token: localStorage.getItem("xc_token") || null,
  email: localStorage.getItem("xc_email") || null,
  guest: localStorage.getItem("xc_guest") === "1",
  online: false, remoteAt: 0, _pushT: null, _pushMax: 0, _dirty: false, _inflight: false, booted: false
};
async function xcApi(method, path, body){
  const h = { "Content-Type": "application/json" };
  if(XC.token) h["Authorization"] = "Bearer " + XC.token;
  const r = await fetch(path, { method, headers: h, body: body ? JSON.stringify(body) : undefined });
  let data = null; try{ data = await r.json(); }catch(e){}
  if(!r.ok){ const err = new Error((data && data.error) || ("HTTP " + r.status)); err.status = r.status; throw err; }
  return data;
}
function xcSetSession(res){
  XC.token = res.token; XC.email = res.email || null; XC.guest = !!res.isGuest;
  localStorage.setItem("xc_token", XC.token);
  if(XC.email) localStorage.setItem("xc_email", XC.email); else localStorage.removeItem("xc_email");
  localStorage.setItem("xc_guest", XC.guest ? "1" : "0");
}
function xcClearSession(){
  XC.token = null; XC.email = null; XC.guest = false; XC.online = false;
  LS_KEY = "xc_state_local";   // stop writing to the previous account's local cache
  localStorage.removeItem("xc_token"); localStorage.removeItem("xc_email"); localStorage.removeItem("xc_guest");
}
function xcPushState(force){
  if(!XC.token) return;
  XC._dirty = true;
  const go = ()=>{
    clearTimeout(XC._pushT); clearTimeout(XC._pushMax); XC._pushT = null; XC._pushMax = 0;
    if(!XC._dirty || XC._inflight) return;
    XC._inflight = true; XC._dirty = false;
    xcApi("PUT", "/api/state", { state: S })
      .then(res=>{ XC._inflight = false; XC.online = true; XC.remoteAt = res.updatedAt; syncBadge(); })
      .catch(()=>{ XC._inflight = false; XC._dirty = true; XC.online = false; syncBadge(); });
  };
  if(force){ go(); return; }
  clearTimeout(XC._pushT);
  XC._pushT = setTimeout(go, 3500);
  // the 3.5 s debounce gets starved during continuous play -> hard flush at least every 15 s
  if(!XC._pushMax) XC._pushMax = setTimeout(go, 15000);
}
/* Reliable save on the way out. visibilitychange->hidden already fired an async
   force-push; this is the belt-and-suspenders path for real page teardown.
   The state (mostly chart candles) is well over sendBeacon's 64 KB limit, so a
   synchronous same-origin XHR is used during unload (permitted for unload handlers). */
function xcPushBeacon(){
  saveNow();
  if(!XC.token) return;                 // always flush the latest state on the way out
  const t = Date.now();
  if(t - (XC._beaconAt || 0) < 1500) return;   // pagehide + beforeunload both fire -> send once
  XC._beaconAt = t;
  const body = JSON.stringify({ state: S });
  try{
    if(body.length < 60000 && navigator.sendBeacon){
      const blob = new Blob([body], { type: "application/json" });
      if(navigator.sendBeacon("/api/state?token=" + encodeURIComponent(XC.token), blob)){ XC._dirty = false; return; }
    }
    const xhr = new XMLHttpRequest();
    xhr.open("PUT", "/api/state", false);   // sync: must complete before the page is gone
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.setRequestHeader("Authorization", "Bearer " + XC.token);
    xhr.send(body);
    XC._dirty = false;
  }catch(e){
    try{
      fetch("/api/state", { method:"PUT", keepalive:true,
        headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + XC.token }, body }).catch(()=>{});
    }catch(e2){}
  }
}
function syncBadge(){
  const el = document.getElementById("xcSync");
  if(!el) return;
  el.textContent = XC.token ? (XC.online ? "● облако" : "○ офлайн") : "○ локально";
  el.style.color = XC.online ? "var(--green)" : "var(--ink3)";
}

/* ---------- state fixups applied whenever S is (re)loaded ---------- */
function normalizeState(){
  const d = DEFAULTS();
  if(!S.candles || !S.candles.M1 || !S.candles.M1.length) seedMarket();
  if(!S.news) S.news = d.news;
  if(!S.lock) S.lock = { active:false, until:0 };
  if(!S.newsLog) S.newsLog = [];
  if(!S.dayLog) S.dayLog = [];
  if(!S.newsEngine) S.newsEngine = { tickHzNewsMin:20, tickHzNewsMax:50, perEvent: newsEngineDefaults() };
  S.news.active = false; S.lock.active = false;   // never resume a news event across a session
  S.news.delta = 0; S.news._vel = 0; S.news.decayUntil = 0;
  if(!S.manual) S.manual = { enabled:false, frozen:false, impulse:null };
  S.manual.impulse = null;                         // never resume an impulse across a session
  if(S.price.vel == null) S.price.vel = 0;
  if(S.price.volCluster == null) S.price.volCluster = 1;
  if(S.price.ema == null) S.price.ema = S.price.mid;
  if(S.price.emaFast == null) S.price.emaFast = S.price.mid;
  if(S.regime){ if(S.regime.ageMs == null) S.regime.ageMs = 0; delete S.regime.startReal; delete S.regime.endReal; }
  if(S.day){ if(S.day.elapsedMs == null) S.day.elapsedMs = 0; delete S.day.startReal; delete S.day.endReal; }
  if(!S.regime) startRegime(null);
  if(!S.day) startNewDay(S.price.mid);
  if(S.market.ticksPerSecond == null || !(S.market.ticksPerSecond > 0)) S.market.ticksPerSecond = 2;
  if(!S.ui) S.ui = { ...d.ui };
  if(S.ui.marketOpen == null) S.ui.marketOpen = false;   // land on the "Рынки" watchlist
  // theme: a local override (last used on THIS device) wins, else the saved state, else light
  { let lt = null; try{ lt = localStorage.getItem("xc_theme"); }catch(e){}
    S.ui.theme = (lt === "dark" || lt === "light") ? lt : (S.ui.theme === "dark" ? "dark" : "light");
    applyTheme(S.ui.theme); }
  if(!S.wallet) S.wallet = { ...d.wallet, ledger: [] };
  if(S.wallet.balance == null) S.wallet.balance = d.wallet.balance;
  if(!Array.isArray(S.wallet.ledger)) S.wallet.ledger = [];
  if(!S.wallet.cardBrand) S.wallet.cardBrand = d.wallet.cardBrand;
  recalcAccount();
}

function finishBoot(){
  if(XC.booted) return;
  XC.booted = true;
  normalizeState();
  render();
  // start advancing only if the page is actually visible; ?boot=paused -> restore only (debug).
  // if it loads into a background tab, the loop starts on the first visibilitychange->visible.
  const bootPaused = /[?&]boot=paused/.test(location.search);
  if(!bootPaused && document.visibilityState !== "hidden") startLoop();
  syncBadge();

  // pause the WHOLE simulation while the tab is hidden -> nothing advances while away
  document.addEventListener("visibilitychange", ()=>{
    if(document.hidden){ if(_loopRunning){ stopLoop(); xcPushState(true); } }
    else { if(!_loopRunning && XC.booted && !bootPaused){ startLoop(); } }
  });
  window.addEventListener("pagehide", xcPushBeacon);
  window.addEventListener("beforeunload", xcPushBeacon);
}

/* start without a server (fallback if backend is unreachable) */
function startOffline(){
  load();
  finishBoot();
}

/* after a successful auth: pull the frozen server state (if any) and resume it */
async function bootAfterAuth(preferRemote){
  try{
    const me = await xcApi("GET", "/api/me");
    XC.email = me.email || null; XC.guest = !!me.isGuest;
    if(me.id) LS_KEY = "xc_state_" + me.id;   // per-user local cache -> no cross-account bleed
    localStorage.setItem("xc_guest", XC.guest ? "1" : "0");
    if(XC.email) localStorage.setItem("xc_email", XC.email);
  }catch(e){}
  try{
    const r = await xcApi("GET", "/api/state");
    if(r && r.state && (preferRemote || !localStorage.getItem(LS_KEY))){
      S = r.state;                      // frozen server state wins -> exact resume
      if(S.version >= 2) migrateState();
      XC.online = true; XC.remoteAt = r.updatedAt;
      saveNow();
    } else {
      load(true);                       // no server state -> per-user local cache, then legacy once, else fresh
      if(r && r.state && r.updatedAt > 0){ /* keep local; it will be pushed */ }
    }
  }catch(e){
    if(e.status === 401){ xcClearSession(); return screenAuth("Сессия истекла — войдите снова"); }
    XC.online = false;
    load(true);                         // network error -> offline cache
  }
  finishBoot();
  xcPushState(true);                    // make sure server has the current state
}
