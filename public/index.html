const ABOUT_TXT = {
  ru: "## Что это\n\nXAUCORE это учебный торговый терминал по золоту.\n\nЗдесь есть всё, что есть в настоящем терминале: график со свечами, торговая панель, объём в лотах, спред, маржа, отложенные ордера, стоп-лосс, тейк-профит, экономический календарь, история сделок. Нет только одного. Здесь нет денег. Ни ваших, ни чужих. Цена, которую вы видите, рождается внутри приложения. Счёт, на котором вы торгуете, существует только у вас на устройстве.\n\nЭто не витрина брокера. Отсюда некуда завести депозит и некуда вывести прибыль, потому что прибыль тут ненастоящая. Это тренажёр, и он остаётся тренажёром.\n\n## Зачем мы это сделали\n\nТорговле почти негде учиться спокойно.\n\nОбычный путь выглядит так. Человек читает пару статей, смотрит несколько видео, открывает реальный счёт и первое, чему учится, это терять деньги. Не потому что он глупый. Потому что он впервые в жизни видит, как работает плечо, почему сделка открылась сразу в минусе, откуда взялась цифра «свободная маржа», почему позицию закрыли без него и что происходит с золотом в половине четвёртого, когда выходит статистика по рынку труда США. Всё это можно было узнать заранее. Обычно узнают за свой счёт, и обычно дорого.\n\nДемо-счета у брокеров есть, но их делали не для обучения. Их делали, чтобы вы побыстрее перешли на реальный. Там нельзя перемотать время. Нельзя вызвать новость, когда вам удобно. Нельзя обнулить счёт и начать заново без неприятного разговора с самим собой. Нельзя спокойно всё разломать и посмотреть, что будет.\n\nЗдесь можно. Здесь ошибка стоит времени, а не денег.\n\n## Как работает рынок внутри\n\nЦена тут не случайная. Мы старались, чтобы золото вело себя правдоподобно, иначе тренажёр бесполезен.\n\nДень складывается из движений, а не из рывков. Большая часть дневного хода приходится на медленные волны, которые тянутся десятками минут, а отдельный тик остаётся маленьким. Настоящее золото ведёт себя так же: за двенадцать секунд оно почти никогда не пролетает доллары, зато за час может уйти далеко.\n\nУ каждого дня своя волатильность. Бывают тихие дни, когда всё стоит, бывают обычные, бывают активные, и бывают дни, когда рынок сходит с ума. Мы заложили эти режимы и переходы между ними, поэтому два дня подряд не похожи друг на друга.\n\nВнутри дня есть сессии. Утром рынок спокойнее, днём оживает, вечером бывает резким. Это не декорация, это реально влияет на размер движений.\n\nСпред живёт сам по себе. Он держится узким несколько тиков, потом расширяется на тик или два, потом возвращается. Как на настоящем рынке, где никто не обещал вам постоянную цену входа.\n\nНовости выходят по расписанию и двигают рынок по-настоящему. Данные по занятости, инфляция, индекс цен производителей, решение ФРС по ставке и пресс-конференция после него. В момент выхода спред расширяется, цена проскакивает, и стоп-лосс исполняется не там, где вы его поставили. Это самый дорогой урок в реальной торговле и бесплатный здесь.\n\n## Чему здесь можно научиться\n\n**Читать график.** Свечи от минуты до дня, масштаб, прокрутка, перекрестие с ценами. Звучит как мелочь, но пока не посидишь над графиком много часов подряд, он остаётся картинкой, а не источником информации.\n\n**Считать объём.** Лот это самое непонятное число для новичка. Ноль целых одна сотая лота и один лот отличаются не удобством, а тем, доживёт ли ваш счёт до вечера. Здесь это видно на своих цифрах, а не в чужом примере.\n\n**Понимать маржу.** Баланс, средства, свободная маржа, уровень маржи, стоп-аут. Большинство сливов это не ошибка в прогнозе. Это неправильный размер позиции. Когда цифры меняются у вас на глазах каждую секунду, связь становится очевидной.\n\n**Чувствовать спред.** Любая позиция открывается в минусе, и это нормально. Пока не увидишь это на сотне сделок, не поверишь, а увидев, начинаешь по-другому относиться к коротким входам.\n\n**Работать с ордерами.** Вход по рынку, отложенные ордера выше и ниже цены, изменение, отмена. Механика, которую в реальном терминале страшно трогать просто из любопытства, потому что каждая проверка стоит денег.\n\n**Ставить стоп-лосс и тейк-профит.** Не в теории, а руками, много раз. Пока это не превратилось в автоматический жест, торговать реальными деньгами рано.\n\n**Пережить новость.** Дождаться выхода, посмотреть, что стало со спредом, увидеть, как цена ушла за секунду, найти свой стоп исполненным хуже, чем вы рассчитывали. Один раз пережить это на тренажёре дешевле, чем один раз на реальном счёте.\n\n**Замечать время.** Когда золото ходит, а когда стоит. Это знание приходит само, если провести с рынком достаточно часов, и почти не передаётся словами.\n\n**Увидеть стоп-аут.** Момент, когда брокер закрывает вашу позицию сам, потому что денег больше нет. Все про него читали, мало кто видел вживую до того, как это случилось с ним. Здесь можно устроить его специально.\n\n**Разбирать себя.** История хранит каждую сделку. Через неделю она честнее любого дневника: видно, что вы делаете одно и то же, и видно, что именно.\n\n**Держать дисциплину.** Самое скучное и самое важное. Одинаковый объём, стоп на каждой сделке, правило не входить после трёх убытков подряд. Тренажёр нужен ровно для того, чтобы такие привычки появились до того, как появятся потери.\n\n## Чем это отличается от cTrader\n\nИнтерфейс мы повторили намеренно. Расположение вкладок, торговая панель внизу, окно нового ордера, названия полей. Это не попытка выдать себя за cTrader. Наоборот, смысл тренажёра в том, чтобы привычки переносились: если вы потом откроете настоящий cTrader, вам не придётся заново искать, где что лежит.\n\nОтличия начинаются глубже.\n\n**cTrader это платформа, мы это тренажёр.** cTrader подключается к брокеру и отправляет ваши сделки на реальный рынок. XAUCORE ни к чему не подключается. Цена генерируется здесь, сделки живут здесь, деньги отсутствуют как явление.\n\n**Один инструмент вместо сотен.** В cTrader валюты, индексы, акции, металлы, крипта. Здесь только XAUUSD, и это сделано специально. Научиться торговать значит научиться торговать что-то одно. Пока человек прыгает между тридцатью инструментами, он не знает ни одного.\n\n**Здесь есть власть над временем.** Рынок можно ускорить, остановить, отмотать к нужному моменту, вызвать новость тогда, когда вам удобно. Настоящий терминал вас ждать не будет. Тут за один вечер проживается то, на что в реальности ушла бы неделя.\n\n**Здесь можно всё сломать.** Слить счёт, поставить абсурдный объём, поймать стоп-аут, обнулить и начать заново. Ровно ноль последствий. В cTrader каждая такая проверка оплачивается из кармана.\n\n**Здесь никто не ведёт вас к брокеру.** Кнопки «Пополнить счёт» и «Снять средства» меняют только цифру внутри симулятора. Нет перехода на реальный счёт, нет партнёрских ссылок, нет момента, когда приложение начнёт намекать, что пора заносить деньги.\n\n**cTrader не обязан вас учить.** Это профессиональный инструмент, он исполняет приказы. XAUCORE сделан ровно для обучения, поэтому здесь всё подписано понятными словами и ничего не спрятано в меню третьего уровня.\n\nМы не связаны с cTrader и не являемся его частью. Это отдельное учебное приложение.\n\n## Что здесь ненастоящее\n\nГраницы тренажёра стоит знать заранее, иначе от него будет вред вместо пользы.\n\n**Цена синтетическая.** Она похожа на золото по характеру, но это не котировки настоящего рынка и никогда ими не станут. Строить прогноз по реальному золоту, глядя на этот график, нельзя.\n\n**Исполнение идеальное.** Здесь нет отказов брокера, нет реквот, нет обрыва связи в худший момент, нет банка, который не пропустил платёж.\n\n**Комиссий и свопов почти нет.** Настоящая торговля дороже, чем кажется на тренажёре.\n\n**И главное, здесь нет страха.** Демо учит механике, порядку и дисциплине, но не учит тому, что происходит с человеком, когда в минусе его собственные деньги. Это единственное, чему придётся учиться отдельно, и мы говорим об этом честно заранее.\n\n## Сколько это стоит\n\nПриложение бесплатное, и всё, что относится к обучению, бесплатно навсегда. Мы не берём денег за торговлю, не берём процент, не ведём вас к брокеру и не прячем полезное за подписку.\n\nДеньги здесь только за одно. За жидкое стекло.\n\nЭто не фильтр и не тема оформления. Это второй облик всего приложения, на который ушло больше времени, чем на сам терминал: преломление, капли, пружины, перетекание окон из кнопок, слияние капсул, настраиваемая прозрачность от дымки до кристалла, и всё это отдельно выверено для светлой и тёмной темы.\n\nПокупается один раз. Обучение от этого не меняется, меняется приложение.\n\n## Как пользоваться, чтобы был толк\n\nТренажёр без плана превращается в игру. Чтобы этого не случилось, есть смысл держаться простого порядка.\n\n**Первое.** Начните с объёма ноль целых одна сотая лота. Не потому что мало, а потому что так вы увидите настоящую цену одного доллара движения.\n\n**Второе.** Ставьте стоп-лосс на каждой сделке. Даже здесь. Особенно здесь, потому что привычка нарабатывается именно на тренажёре, а не потом.\n\n**Третье.** Торгуйте сериями по двадцать или тридцать сделок и только потом идите в историю. Одна сделка не говорит ни о чём, тридцать говорят почти всё.\n\n**Четвёртое.** Дождитесь новости и просто посмотрите на неё, не торгуя. Один раз. Потом посмотрите ещё раз, уже с позицией, и сравните ощущения.\n\n**Пятое.** Слейте счёт специально. Поставьте огромный объём и посмотрите, как именно умирает депозит, в каком порядке гаснут цифры. Это полезнее десяти прибыльных сделок.\n\n**Шестое.** Возвращайтесь. Один вечер не даёт ничего. Две недели по часу дают больше, чем месяц чтения.\n\n## Частые вопросы\n\n**Это реальные котировки золота?** Нет. Цена генерируется приложением. Она похожа на настоящую по характеру движения, но это не рынок.\n\n**Можно ли тут заработать?** Нет. Деньги на счёте нарисованные. Выводить нечего и некуда.\n\n**Нужно ли регистрироваться?** Аккаунт нужен, чтобы счёт и история жили не только на одном телефоне. Достаточно почты и пароля.\n\n**Почему только золото?** Потому что один инструмент, изученный как следует, полезнее тридцати, о которых вы знаете по названию.\n\n**Мои сделки кто-то видит?** Нет. Это ваш личный тренажёр.\n\n**Я слил счёт, что дальше?** Пополнить обратно и продолжить. Здесь это бесплатно и в этом смысл.\n\n! XAUCORE это учебное приложение. Котировки синтетические, счёт демонстрационный, реальные средства не участвуют. Мы не являемся брокером, не оказываем финансовых услуг, не принимаем деньги за торговлю и не даём инвестиционных рекомендаций. Всё, что происходит здесь, это тренировка.",
  en: "## What this is\n\nXAUCORE is a training terminal for trading gold.\n\nEverything a real terminal has is here: a candle chart, the trade bar, volume in lots, the spread, margin, pending orders, stop loss, take profit, an economic calendar, a history of every trade. One thing is missing. There is no money here. Not yours, not anyone's. The price you see is born inside the app. The account you trade on exists only on your device.\n\nThis is not a broker's shop window. There is nowhere to deposit from here and nowhere to withdraw to, because the profit is not real. It is a trainer, and it stays a trainer.\n\n## Why we made it\n\nThere is almost nowhere to learn trading calmly.\n\nThe usual path looks like this. Someone reads a couple of articles, watches a few videos, opens a live account, and the first thing they learn is how to lose money. Not because they are stupid. Because they are seeing for the first time how leverage works, why a trade opens in the red, where the number called free margin came from, why a position was closed without them, and what happens to gold at half past three when the US labour data comes out. All of that could have been learned beforehand. Usually it is learned at one's own expense, and usually it is expensive.\n\nBrokers do have demo accounts, but they were not built for learning. They were built so that you move to a live account sooner. You cannot fast forward time there. You cannot call a news release when it suits you. You cannot wipe the account and start again without an unpleasant talk with yourself. You cannot calmly break everything and see what happens.\n\nHere you can. Here a mistake costs time, not money.\n\n## How the market works inside\n\nThe price here is not random. We worked to make gold behave plausibly, otherwise the trainer is useless.\n\nA day is made of movement, not of jumps. Most of a day's range is carried by slow legs that run for tens of minutes, while a single tick stays small. Real gold behaves the same way: in twelve seconds it almost never covers dollars, yet in an hour it can travel a long way.\n\nEvery day has its own volatility. There are quiet days when nothing happens, ordinary days, active days, and days when the market loses its mind. Those regimes and the transitions between them are built in, so no two days in a row look alike.\n\nInside a day there are sessions. The market is calmer in the morning, wakes up during the day, and can turn sharp in the evening. That is not decoration, it genuinely changes the size of the moves.\n\nThe spread lives its own life. It holds tight for a few ticks, widens for a tick or two, then comes back. Like a real market, where nobody promised you a constant price of entry.\n\nNews comes out on schedule and moves the market for real. Employment data, inflation, producer prices, the Fed's rate decision and the press conference after it. At the moment of release the spread widens, the price slips, and a stop loss fills somewhere other than where you put it. That is the most expensive lesson in live trading and a free one here.\n\n## What you can learn here\n\n**Reading a chart.** Candles from one minute to one day, zoom, panning, a crosshair with prices. It sounds like a detail, but until you have sat over a chart for many hours it stays a picture rather than a source of information.\n\n**Counting volume.** The lot is the most confusing number for a beginner. One hundredth of a lot and one full lot differ not in convenience but in whether your account survives until the evening. Here you see it on your own figures, not in somebody else's example.\n\n**Understanding margin.** Balance, equity, free margin, margin level, stop out. Most blown accounts are not a wrong forecast. They are a wrong position size. When the numbers change in front of you every second, the connection becomes obvious.\n\n**Feeling the spread.** Every position opens in the red, and that is normal. You will not believe it until you have seen it across a hundred trades, and once you have, you start thinking differently about quick entries.\n\n**Working with orders.** Market entry, pending orders above and below price, modifying, cancelling. Mechanics that are frightening to touch out of curiosity in a live terminal, because every experiment costs money.\n\n**Placing stops and targets.** Not in theory but by hand, many times. Until it has become an automatic gesture, it is too early to trade real money.\n\n**Living through a release.** Wait for it, watch what happens to the spread, see the price cover a distance in one second, find your stop filled worse than you expected. Living through that once on a trainer is cheaper than once on a live account.\n\n**Noticing time.** When gold moves and when it stands still. That knowledge arrives on its own if you spend enough hours with the market, and words hardly pass it on.\n\n**Seeing a stop out.** The moment the broker closes your position for you because the money has run out. Everyone has read about it, few have watched it happen before it happened to them. Here you can arrange it on purpose.\n\n**Reading yourself.** The history keeps every trade. After a week it is more honest than any journal: you can see that you do the same thing over and over, and you can see exactly what it is.\n\n**Keeping discipline.** The dullest part and the most important one. The same size every time, a stop on every trade, a rule not to enter after three losses in a row. A trainer exists precisely so that such habits appear before the losses do.\n\n## How this differs from cTrader\n\nWe copied the interface on purpose. The placement of the tabs, the trade bar at the bottom, the new order window, the names of the fields. This is not an attempt to pass for cTrader. The opposite: the point of a trainer is that habits carry over, so when you later open the real cTrader you will not have to learn where everything lives all over again.\n\nThe differences start deeper.\n\n**cTrader is a platform, we are a trainer.** cTrader connects to a broker and sends your trades to the real market. XAUCORE connects to nothing. The price is generated here, the trades live here, money does not exist as a concept.\n\n**One instrument instead of hundreds.** cTrader has currencies, indices, shares, metals, crypto. Here there is only XAUUSD, and that is deliberate. Learning to trade means learning to trade one thing. While a person hops between thirty instruments, they know none of them.\n\n**Here you have power over time.** The market can be sped up, paused, wound back to the moment you need, and a release can be called when it suits you. A real terminal will not wait for you. Here one evening covers what would have taken a week.\n\n**Here you can break everything.** Blow the account, set an absurd size, take a stop out, reset and start again. Exactly zero consequences. In cTrader every such test is paid for out of pocket.\n\n**Nobody is walking you towards a broker.** The Deposit and Withdraw buttons only change a number inside the simulator. There is no step up to a live account, no affiliate links, no moment where the app starts hinting that it is time to bring money in.\n\n**cTrader is not obliged to teach you.** It is a professional instrument, it executes orders. XAUCORE was made for learning, so everything is labelled in plain words and nothing hides in a third level menu.\n\nWe are not affiliated with cTrader and are not part of it. This is a separate training app.\n\n## What is not real here\n\nIt is worth knowing the limits of the trainer in advance, otherwise it does harm instead of good.\n\n**The price is synthetic.** It resembles gold in character, but it is not the quotes of a real market and never will be. You cannot forecast real gold by looking at this chart.\n\n**Execution is perfect.** There are no broker rejections, no requotes, no connection dropping at the worst moment, no bank that failed to let a payment through.\n\n**There are almost no commissions and swaps.** Real trading costs more than a trainer suggests.\n\n**And above all, there is no fear here.** A demo teaches mechanics, order and discipline, but it does not teach what happens to a person when their own money is in the red. That is the one thing you will have to learn separately, and we say so honestly in advance.\n\n## What it costs\n\nThe app is free, and everything that belongs to learning is free forever. We take no money for trading, no percentage, we do not walk you towards a broker and we do not hide anything useful behind a subscription.\n\nMoney here buys one thing. Liquid glass.\n\nIt is not a filter and not a colour theme. It is a second face for the whole app, and it took longer than the terminal itself: refraction, droplets, springs, windows flowing out of the buttons that opened them, capsules merging into one, clarity you set yourself from haze to crystal, and all of it tuned separately for the light and the dark theme.\n\nBought once. The learning does not change, the app does.\n\n## How to use it so it works\n\nA trainer without a plan turns into a game. To keep that from happening there is a simple order worth holding to.\n\n**First.** Start at one hundredth of a lot. Not because it is small, but because that is how you see the true price of one dollar of movement.\n\n**Second.** Put a stop loss on every trade. Even here. Especially here, because the habit is built on the trainer and not afterwards.\n\n**Third.** Trade in runs of twenty or thirty and only then go into the history. One trade says nothing, thirty say almost everything.\n\n**Fourth.** Wait for a release and simply watch it without trading. Once. Then watch it again with a position on, and compare how it feels.\n\n**Fifth.** Blow the account on purpose. Set an enormous size and watch exactly how a deposit dies, in what order the numbers go out. That is worth more than ten winning trades.\n\n**Sixth.** Come back. One evening gives nothing. Two weeks of an hour a day give more than a month of reading.\n\n## Common questions\n\n**Are these real gold quotes?** No. The price is generated by the app. It resembles the real thing in the character of its movement, but it is not the market.\n\n**Can I earn money here?** No. The money on the account is drawn. There is nothing to withdraw and nowhere to withdraw it to.\n\n**Do I have to register?** An account is what lets your balance and history live on more than one phone. An email and a password are enough.\n\n**Why only gold?** Because one instrument learned properly is worth more than thirty you know by name.\n\n**Can anyone see my trades?** No. This is your own private trainer.\n\n**I blew the account, what now?** Top it back up and carry on. It is free here and that is the point.\n\n! XAUCORE is a training application. The quotes are synthetic, the account is a demo, no real funds are involved. We are not a broker, we provide no financial services, we take no money for trading and we give no investment advice. Everything that happens here is practice.",
  uk: "## Що це\n\nXAUCORE це навчальний торговий термінал по золоту.\n\nТут є все, що є в справжньому терміналі: графік зі свічками, торгова панель, обсяг у лотах, спред, маржа, відкладені ордери, стоп-лос, тейк-профіт, економічний календар, історія угод. Немає лише одного. Тут немає грошей. Ні ваших, ні чужих. Ціна, яку ви бачите, народжується всередині застосунку. Рахунок, на якому ви торгуєте, існує тільки у вас на пристрої.\n\nЦе не вітрина брокера. Звідси нікуди завести депозит і нікуди вивести прибуток, бо прибуток тут несправжній. Це тренажер, і він лишається тренажером.\n\n## Навіщо ми це зробили\n\nТоргівлі майже ніде вчитися спокійно.\n\nЗвичайний шлях виглядає так. Людина читає пару статей, дивиться кілька відео, відкриває реальний рахунок і перше, чого вчиться, це втрачати гроші. Не тому що дурна. Тому що вперше в житті бачить, як працює плече, чому угода відкрилася одразу в мінусі, звідки взялася цифра «вільна маржа», чому позицію закрили без неї і що відбувається із золотом о пів на четверту, коли виходить статистика по ринку праці США. Усе це можна було дізнатися заздалегідь. Зазвичай дізнаються власним коштом, і зазвичай дорого.\n\nДемо-рахунки у брокерів є, але їх робили не для навчання. Їх робили, щоб ви швидше перейшли на реальний. Там не можна перемотати час. Не можна викликати новину, коли вам зручно. Не можна обнулити рахунок і почати заново без неприємної розмови із самим собою. Не можна спокійно все зламати і подивитися, що буде.\n\nТут можна. Тут помилка коштує часу, а не грошей.\n\n## Як працює ринок усередині\n\nЦіна тут не випадкова. Ми старалися, щоб золото поводилося правдоподібно, інакше тренажер марний.\n\nДень складається з рухів, а не з ривків. Більша частина денного ходу припадає на повільні хвилі, що тягнуться десятками хвилин, а окремий тік лишається маленьким. Справжнє золото поводиться так само: за дванадцять секунд воно майже ніколи не пролітає долари, зате за годину може піти далеко.\n\nУ кожного дня своя волатильність. Бувають тихі дні, коли все стоїть, бувають звичайні, бувають активні, і бувають дні, коли ринок божеволіє. Ми заклали ці режими і переходи між ними, тому два дні поспіль не схожі один на одного.\n\nУсередині дня є сесії. Зранку ринок спокійніший, удень оживає, увечері буває різким. Це не декорація, це справді впливає на розмір рухів.\n\nСпред живе сам по собі. Він тримається вузьким кілька тіків, потім розширюється на тік чи два, потім повертається. Як на справжньому ринку, де ніхто не обіцяв вам сталу ціну входу.\n\nНовини виходять за розкладом і рухають ринок по-справжньому. Дані по зайнятості, інфляція, індекс цін виробників, рішення ФРС по ставці і пресконференція після нього. У момент виходу спред розширюється, ціна проскакує, а стоп-лос виконується не там, де ви його поставили. Це найдорожчий урок у реальній торгівлі і безкоштовний тут.\n\n## Чого тут можна навчитися\n\n**Читати графік.** Свічки від хвилини до дня, масштаб, прокрутка, перехрестя з цінами. Звучить як дрібниця, але поки не посидиш над графіком багато годин поспіль, він лишається картинкою, а не джерелом інформації.\n\n**Рахувати обсяг.** Лот це найнезрозуміліше число для новачка. Нуль цілих одна сота лота і один лот відрізняються не зручністю, а тим, чи доживе ваш рахунок до вечора. Тут це видно на своїх цифрах, а не в чужому прикладі.\n\n**Розуміти маржу.** Баланс, засоби, вільна маржа, рівень маржі, стоп-аут. Більшість зливів це не помилка в прогнозі. Це неправильний розмір позиції. Коли цифри змінюються у вас на очах щосекунди, зв'язок стає очевидним.\n\n**Відчувати спред.** Будь-яка позиція відкривається в мінусі, і це нормально. Поки не побачиш це на сотні угод, не повіриш, а побачивши, починаєш інакше ставитися до коротких входів.\n\n**Працювати з ордерами.** Вхід по ринку, відкладені ордери вище і нижче ціни, зміна, скасування. Механіка, яку в реальному терміналі страшно чіпати просто з цікавості, бо кожна перевірка коштує грошей.\n\n**Ставити стоп-лос і тейк-профіт.** Не в теорії, а руками, багато разів. Поки це не перетворилося на автоматичний жест, торгувати реальними грошима зарано.\n\n**Пережити новину.** Дочекатися виходу, подивитися, що сталося зі спредом, побачити, як ціна пішла за секунду, знайти свій стоп виконаним гірше, ніж ви розраховували. Один раз пережити це на тренажері дешевше, ніж один раз на реальному рахунку.\n\n**Помічати час.** Коли золото ходить, а коли стоїть. Це знання приходить саме, якщо провести з ринком достатньо годин, і майже не передається словами.\n\n**Побачити стоп-аут.** Момент, коли брокер закриває вашу позицію сам, бо грошей більше немає. Усі про нього читали, мало хто бачив наживо до того, як це сталося з ним. Тут можна влаштувати його спеціально.\n\n**Розбирати себе.** Історія зберігає кожну угоду. Через тиждень вона чесніша за будь-який щоденник: видно, що ви робите одне і те саме, і видно, що саме.\n\n**Тримати дисципліну.** Найнудніше і найважливіше. Однаковий обсяг, стоп на кожній угоді, правило не входити після трьох збитків поспіль. Тренажер потрібен рівно для того, щоб такі звички з'явилися до того, як з'являться втрати.\n\n## Чим це відрізняється від cTrader\n\nІнтерфейс ми повторили навмисно. Розташування вкладок, торгова панель унизу, вікно нового ордера, назви полів. Це не спроба видати себе за cTrader. Навпаки, сенс тренажера в тому, щоб звички переносилися: якщо ви потім відкриєте справжній cTrader, вам не доведеться заново шукати, де що лежить.\n\nВідмінності починаються глибше.\n\n**cTrader це платформа, ми це тренажер.** cTrader підключається до брокера і відправляє ваші угоди на реальний ринок. XAUCORE ні до чого не підключається. Ціна генерується тут, угоди живуть тут, гроші відсутні як явище.\n\n**Один інструмент замість сотень.** У cTrader валюти, індекси, акції, метали, крипта. Тут лише XAUUSD, і це зроблено спеціально. Навчитися торгувати означає навчитися торгувати щось одне. Поки людина стрибає між тридцятьма інструментами, вона не знає жодного.\n\n**Тут є влада над часом.** Ринок можна прискорити, зупинити, відмотати до потрібного моменту, викликати новину тоді, коли вам зручно. Справжній термінал вас чекати не буде. Тут за один вечір проживається те, на що в реальності пішов би тиждень.\n\n**Тут можна все зламати.** Злити рахунок, поставити абсурдний обсяг, спіймати стоп-аут, обнулити і почати заново. Рівно нуль наслідків. У cTrader кожна така перевірка оплачується з кишені.\n\n**Тут ніхто не веде вас до брокера.** Кнопки «Поповнити рахунок» і «Зняти кошти» змінюють лише цифру всередині симулятора. Немає переходу на реальний рахунок, немає партнерських посилань, немає моменту, коли застосунок почне натякати, що пора заносити гроші.\n\n**cTrader не зобов'язаний вас вчити.** Це професійний інструмент, він виконує накази. XAUCORE зроблений рівно для навчання, тому тут усе підписано зрозумілими словами і нічого не сховано в меню третього рівня.\n\nМи не пов'язані з cTrader і не є його частиною. Це окремий навчальний застосунок.\n\n## Що тут несправжнє\n\nМежі тренажера варто знати заздалегідь, інакше від нього буде шкода замість користі.\n\n**Ціна синтетична.** Вона схожа на золото за характером, але це не котирування справжнього ринку і ніколи ними не стануть. Будувати прогноз по реальному золоту, дивлячись на цей графік, не можна.\n\n**Виконання ідеальне.** Тут немає відмов брокера, немає реквот, немає обриву зв'язку в найгірший момент, немає банку, який не пропустив платіж.\n\n**Комісій і свопів майже немає.** Справжня торгівля дорожча, ніж здається на тренажері.\n\n**І головне, тут немає страху.** Демо вчить механіки, порядку і дисципліни, але не вчить того, що відбувається з людиною, коли в мінусі її власні гроші. Це єдине, чого доведеться вчитися окремо, і ми говоримо про це чесно заздалегідь.\n\n## Скільки це коштує\n\nЗастосунок безкоштовний, і все, що стосується навчання, безкоштовно назавжди. Ми не беремо грошей за торгівлю, не беремо відсоток, не ведемо вас до брокера і не ховаємо корисне за підпискою.\n\nГроші тут лише за одне. За рідке скло.\n\nЦе не фільтр і не тема оформлення. Це другий вигляд усього застосунку, на який пішло більше часу, ніж на сам термінал: заломлення, краплі, пружини, перетікання вікон із кнопок, злиття капсул, налаштовувана прозорість від серпанку до кристала, і все це окремо вивірено для світлої і темної теми.\n\nКупується один раз. Навчання від цього не змінюється, змінюється застосунок.\n\n## Як користуватися, щоб був толк\n\nТренажер без плану перетворюється на гру. Щоб цього не сталося, є сенс триматися простого порядку.\n\n**Перше.** Почніть з обсягу нуль цілих одна сота лота. Не тому що мало, а тому що так ви побачите справжню ціну одного долара руху.\n\n**Друге.** Ставте стоп-лос на кожній угоді. Навіть тут. Особливо тут, бо звичка напрацьовується саме на тренажері, а не потім.\n\n**Третє.** Торгуйте серіями по двадцять або тридцять угод і лише потім ідіть в історію. Одна угода не говорить ні про що, тридцять говорять майже все.\n\n**Четверте.** Дочекайтеся новини і просто подивіться на неї, не торгуючи. Один раз. Потім подивіться ще раз, уже з позицією, і порівняйте відчуття.\n\n**П'яте.** Злийте рахунок спеціально. Поставте величезний обсяг і подивіться, як саме помирає депозит, у якому порядку гаснуть цифри. Це корисніше за десять прибуткових угод.\n\n**Шосте.** Повертайтеся. Один вечір не дає нічого. Два тижні по годині дають більше, ніж місяць читання.\n\n## Часті питання\n\n**Це реальні котирування золота?** Ні. Ціна генерується застосунком. Вона схожа на справжню за характером руху, але це не ринок.\n\n**Чи можна тут заробити?** Ні. Гроші на рахунку намальовані. Виводити нічого і нікуди.\n\n**Чи потрібно реєструватися?** Акаунт потрібен, щоб рахунок і історія жили не лише на одному телефоні. Достатньо пошти і пароля.\n\n**Чому лише золото?** Бо один інструмент, вивчений як слід, корисніший за тридцять, про які ви знаєте за назвою.\n\n**Мої угоди хтось бачить?** Ні. Це ваш особистий тренажер.\n\n**Я злив рахунок, що далі?** Поповнити назад і продовжити. Тут це безкоштовно і в цьому сенс.\n\n! XAUCORE це навчальний застосунок. Котирування синтетичні, рахунок демонстраційний, реальні кошти не беруть участі. Ми не є брокером, не надаємо фінансових послуг, не приймаємо гроші за торгівлю і не даємо інвестиційних рекомендацій. Усе, що відбувається тут, це тренування.",
  fr: "## Ce que c'est\n\nXAUCORE est un terminal d'entraînement pour trader l'or.\n\nTout ce qu'un vrai terminal possède est ici : un graphique en chandeliers, la barre de trading, le volume en lots, le spread, la marge, les ordres en attente, le stop loss, le take profit, un calendrier économique, l'historique de chaque transaction. Une seule chose manque. Il n'y a pas d'argent ici. Ni le vôtre, ni celui de personne. Le prix que vous voyez naît à l'intérieur de l'application. Le compte sur lequel vous tradez n'existe que sur votre appareil.\n\nCe n'est pas la vitrine d'un courtier. Il n'y a nulle part où déposer depuis ici et nulle part où retirer, parce que le profit n'est pas réel. C'est un simulateur, et il reste un simulateur.\n\n## Pourquoi nous l'avons fait\n\nIl n'existe presque aucun endroit où apprendre le trading tranquillement.\n\nLe chemin habituel ressemble à ceci. Quelqu'un lit deux articles, regarde quelques vidéos, ouvre un compte réel, et la première chose qu'il apprend, c'est à perdre de l'argent. Non parce qu'il est bête. Parce qu'il découvre pour la première fois comment fonctionne le levier, pourquoi une position s'ouvre déjà en perte, d'où sort ce chiffre appelé marge libre, pourquoi sa position a été fermée sans lui, et ce qui arrive à l'or à quinze heures trente, quand sortent les chiffres de l'emploi américain. Tout cela pouvait s'apprendre avant. En général on l'apprend à ses frais, et en général cela coûte cher.\n\nLes courtiers proposent des comptes de démonstration, mais ils n'ont pas été faits pour apprendre. Ils ont été faits pour que vous passiez au compte réel plus vite. On ne peut pas y accélérer le temps. On ne peut pas déclencher une publication quand cela vous arrange. On ne peut pas remettre le compte à zéro et recommencer sans une conversation désagréable avec soi-même. On ne peut pas tout casser calmement pour voir ce qui se passe.\n\nIci on peut. Ici une erreur coûte du temps, pas de l'argent.\n\n## Comment le marché fonctionne à l'intérieur\n\nLe prix n'est pas aléatoire. Nous avons travaillé pour que l'or se comporte de façon crédible, sinon le simulateur ne sert à rien.\n\nUne journée est faite de mouvements, pas de sursauts. L'essentiel de l'amplitude du jour est porté par des vagues lentes qui durent des dizaines de minutes, tandis qu'un tick isolé reste petit. Le vrai or se comporte de la même manière : en douze secondes il ne parcourt presque jamais des dollars, mais en une heure il peut aller loin.\n\nChaque journée a sa propre volatilité. Il y a des journées calmes où rien ne bouge, des journées ordinaires, des journées actives, et des journées où le marché perd la tête. Ces régimes et les transitions entre eux sont intégrés, donc deux journées de suite ne se ressemblent jamais.\n\nÀ l'intérieur d'une journée il y a des sessions. Le marché est plus calme le matin, se réveille dans la journée, et peut devenir brutal le soir. Ce n'est pas un décor, cela change réellement la taille des mouvements.\n\nLe spread vit sa propre vie. Il reste serré quelques ticks, s'élargit sur un tick ou deux, puis revient. Comme sur un vrai marché, où personne ne vous a promis un prix d'entrée constant.\n\nLes publications sortent à l'heure prévue et déplacent le marché pour de bon. Emploi, inflation, prix à la production, décision de taux de la Fed et la conférence de presse qui suit. Au moment de la sortie le spread s'élargit, le prix saute, et un stop loss s'exécute ailleurs que là où vous l'aviez posé. C'est la leçon la plus chère du trading réel, et elle est gratuite ici.\n\n## Ce que vous pouvez apprendre ici\n\n**Lire un graphique.** Des chandeliers de la minute au jour, le zoom, le défilement, un réticule avec les prix. Cela paraît un détail, mais tant que vous n'avez pas passé des heures sur un graphique, il reste une image et non une source d'information.\n\n**Compter le volume.** Le lot est le chiffre le plus obscur pour un débutant. Un centième de lot et un lot entier ne diffèrent pas en confort mais en ceci : votre compte survivra-t-il jusqu'au soir. Ici vous le voyez sur vos propres chiffres, pas dans l'exemple de quelqu'un d'autre.\n\n**Comprendre la marge.** Solde, capital, marge libre, niveau de marge, stop out. La plupart des comptes brûlés ne viennent pas d'une prévision fausse. Ils viennent d'une taille de position fausse. Quand les chiffres changent sous vos yeux chaque seconde, le lien devient évident.\n\n**Sentir le spread.** Toute position s'ouvre en perte, et c'est normal. Vous ne le croirez pas avant de l'avoir vu sur cent transactions, et une fois vu, vous regardez autrement les entrées rapides.\n\n**Manier les ordres.** Entrée au marché, ordres en attente au-dessus et en dessous du prix, modification, annulation. Une mécanique qu'on n'ose pas toucher par curiosité sur un terminal réel, parce que chaque essai coûte de l'argent.\n\n**Poser stop et objectif.** Pas en théorie mais à la main, de nombreuses fois. Tant que ce n'est pas devenu un geste automatique, il est trop tôt pour trader de l'argent réel.\n\n**Traverser une publication.** L'attendre, regarder ce qu'il advient du spread, voir le prix parcourir une distance en une seconde, retrouver son stop exécuté plus mal que prévu. Vivre cela une fois sur un simulateur coûte moins cher qu'une fois sur un compte réel.\n\n**Remarquer le temps.** Quand l'or bouge et quand il dort. Ce savoir vient tout seul si l'on passe assez d'heures avec le marché, et les mots ne le transmettent presque pas.\n\n**Voir un stop out.** Le moment où le courtier ferme votre position à votre place parce qu'il n'y a plus d'argent. Tout le monde en a lu la définition, peu l'ont vu avant que cela leur arrive. Ici vous pouvez le provoquer exprès.\n\n**Vous relire.** L'historique garde chaque transaction. Au bout d'une semaine il est plus honnête que n'importe quel journal : on y voit qu'on refait toujours la même chose, et on voit laquelle.\n\n**Tenir la discipline.** La partie la plus ennuyeuse et la plus importante. La même taille à chaque fois, un stop sur chaque position, la règle de ne pas entrer après trois pertes de suite. Un simulateur existe précisément pour que ces habitudes apparaissent avant les pertes.\n\n## En quoi cela diffère de cTrader\n\nNous avons copié l'interface exprès. La place des onglets, la barre de trading en bas, la fenêtre de nouvel ordre, le nom des champs. Ce n'est pas une tentative de se faire passer pour cTrader. C'est l'inverse : l'intérêt d'un simulateur est que les habitudes se transposent, pour que le jour où vous ouvrirez le vrai cTrader, vous n'ayez pas à réapprendre où se trouve chaque chose.\n\nLes différences commencent plus bas.\n\n**cTrader est une plateforme, nous sommes un simulateur.** cTrader se connecte à un courtier et envoie vos ordres sur le marché réel. XAUCORE ne se connecte à rien. Le prix est généré ici, les positions vivent ici, l'argent n'existe pas comme notion.\n\n**Un instrument au lieu de centaines.** cTrader propose devises, indices, actions, métaux, crypto. Ici il n'y a que XAUUSD, et c'est délibéré. Apprendre à trader, c'est apprendre à trader une seule chose. Tant qu'on saute entre trente instruments, on n'en connaît aucun.\n\n**Ici vous commandez le temps.** Le marché peut être accéléré, mis en pause, rembobiné au moment voulu, et une publication peut être déclenchée quand cela vous arrange. Un vrai terminal ne vous attendra pas. Ici une soirée couvre ce qui aurait pris une semaine.\n\n**Ici vous pouvez tout casser.** Brûler le compte, mettre une taille absurde, prendre un stop out, remettre à zéro et recommencer. Exactement zéro conséquence. Sur cTrader chaque essai de ce genre se paie de sa poche.\n\n**Personne ne vous conduit vers un courtier.** Les boutons Déposer et Retirer ne changent qu'un chiffre à l'intérieur du simulateur. Pas de passage au compte réel, pas de liens d'affiliation, pas de moment où l'application se met à suggérer qu'il serait temps d'apporter de l'argent.\n\n**cTrader n'a pas à vous enseigner.** C'est un outil professionnel, il exécute des ordres. XAUCORE a été fait pour apprendre, donc tout y est nommé en mots clairs et rien ne se cache dans un menu de troisième niveau.\n\nNous ne sommes pas affiliés à cTrader et n'en faisons pas partie. C'est une application d'apprentissage distincte.\n\n## Ce qui n'est pas réel ici\n\nMieux vaut connaître d'avance les limites du simulateur, sinon il nuit au lieu d'aider.\n\n**Le prix est synthétique.** Il ressemble à l'or par son caractère, mais ce ne sont pas les cotations d'un marché réel et elles ne le seront jamais. On ne peut pas prévoir l'or réel en regardant ce graphique.\n\n**L'exécution est parfaite.** Pas de refus du courtier, pas de requotes, pas de connexion qui lâche au pire moment, pas de banque qui bloque un paiement.\n\n**Il n'y a presque ni commissions ni swaps.** Le trading réel coûte plus cher que ce que laisse croire un simulateur.\n\n**Et surtout, il n'y a pas de peur ici.** Une démo enseigne la mécanique, l'ordre et la discipline, mais elle n'enseigne pas ce qui arrive à quelqu'un dont le propre argent est en perte. C'est la seule chose qu'il faudra apprendre ailleurs, et nous le disons honnêtement d'avance.\n\n## Combien cela coûte\n\nL'application est gratuite, et tout ce qui relève de l'apprentissage l'est pour toujours. Nous ne prenons pas d'argent pour le trading, pas de pourcentage, nous ne vous conduisons pas vers un courtier et nous ne cachons rien d'utile derrière un abonnement.\n\nL'argent ici achète une seule chose. Le verre liquide.\n\nCe n'est pas un filtre ni un thème de couleurs. C'est un second visage pour toute l'application, et il a demandé plus de temps que le terminal lui-même : réfraction, gouttes, ressorts, fenêtres qui coulent hors du bouton qui les a ouvertes, capsules qui fusionnent en une seule, une clarté que vous réglez vous-même de la brume au cristal, le tout ajusté séparément pour le thème clair et le thème sombre.\n\nAcheté une fois. L'apprentissage ne change pas, l'application change.\n\n## Comment s'en servir pour que cela serve\n\nUn simulateur sans plan devient un jeu. Pour éviter cela, il vaut la peine de tenir un ordre simple.\n\n**Premièrement.** Commencez à un centième de lot. Non parce que c'est peu, mais parce que c'est ainsi que vous verrez le vrai prix d'un dollar de mouvement.\n\n**Deuxièmement.** Posez un stop loss sur chaque position. Même ici. Surtout ici, parce que l'habitude se construit sur le simulateur et pas après.\n\n**Troisièmement.** Tradez par séries de vingt ou trente, et allez seulement ensuite dans l'historique. Une transaction ne dit rien, trente disent presque tout.\n\n**Quatrièmement.** Attendez une publication et contentez-vous de la regarder sans trader. Une fois. Puis regardez-la de nouveau avec une position ouverte, et comparez la sensation.\n\n**Cinquièmement.** Brûlez le compte exprès. Mettez une taille énorme et observez exactement comment meurt un dépôt, dans quel ordre les chiffres s'éteignent. Cela vaut plus que dix transactions gagnantes.\n\n**Sixièmement.** Revenez. Une soirée ne donne rien. Deux semaines à une heure par jour donnent plus qu'un mois de lecture.\n\n## Questions fréquentes\n\n**Sont-ce de vraies cotations de l'or ?** Non. Le prix est généré par l'application. Il ressemble au vrai par son mouvement, mais ce n'est pas le marché.\n\n**Peut-on gagner de l'argent ici ?** Non. L'argent du compte est dessiné. Il n'y a rien à retirer et nulle part où le retirer.\n\n**Faut-il s'inscrire ?** Un compte permet à votre solde et à votre historique de vivre sur plus d'un téléphone. Une adresse e-mail et un mot de passe suffisent.\n\n**Pourquoi seulement l'or ?** Parce qu'un instrument appris correctement vaut mieux que trente dont vous ne connaissez que le nom.\n\n**Quelqu'un voit-il mes transactions ?** Non. C'est votre simulateur privé.\n\n**J'ai brûlé le compte, et maintenant ?** Rechargez-le et continuez. C'est gratuit ici, et c'est tout l'intérêt.\n\n! XAUCORE est une application d'apprentissage. Les cotations sont synthétiques, le compte est une démonstration, aucun fonds réel n'intervient. Nous ne sommes pas un courtier, nous ne fournissons aucun service financier, nous n'acceptons pas d'argent pour le trading et nous ne donnons aucun conseil en investissement. Tout ce qui se passe ici est un entraînement.",
  tr: "## Bu nedir\n\nXAUCORE, altın işlemleri için bir eğitim terminalidir.\n\nGerçek bir terminalde ne varsa burada da var: mum grafiği, işlem paneli, lot cinsinden hacim, spread, teminat, bekleyen emirler, zarar durdur, kâr al, ekonomik takvim, her işlemin geçmişi. Yalnızca bir şey eksik. Burada para yok. Ne sizin, ne bir başkasının. Gördüğünüz fiyat uygulamanın içinde doğar. İşlem yaptığınız hesap yalnızca sizin cihazınızda vardır.\n\nBurası bir aracı kurumun vitrini değil. Buradan para yatırılacak bir yer de, çekilecek bir yer de yok, çünkü buradaki kâr gerçek değil. Bu bir simülatör ve simülatör olarak kalıyor.\n\n## Bunu neden yaptık\n\nİşlem yapmayı sakin sakin öğrenebileceğiniz neredeyse hiçbir yer yok.\n\nAlışılmış yol şöyle. İnsan birkaç yazı okur, birkaç video izler, gerçek hesap açar ve ilk öğrendiği şey para kaybetmek olur. Aptal olduğu için değil. Kaldıracın nasıl çalıştığını, işlemin neden hemen zararda açıldığını, serbest teminat denen sayının nereden geldiğini, pozisyonunun kendisine sorulmadan neden kapatıldığını ve ABD istihdam verisi açıklandığında altına ne olduğunu hayatında ilk kez gördüğü için. Bunların hepsi önceden öğrenilebilirdi. Genelde kendi cebinden öğrenilir ve genelde pahalıya mal olur.\n\nAracı kurumların demo hesapları var, ama onlar öğrenmek için yapılmadı. Bir an önce gerçek hesaba geçesiniz diye yapıldı. Orada zamanı ileri saramazsınız. Veriyi canınız istediğinde açıklatamazsınız. Hesabı sıfırlayıp kendinizle tatsız bir konuşma yapmadan yeniden başlayamazsınız. Her şeyi sakin sakin kırıp ne olacağına bakamazsınız.\n\nBurada yapabilirsiniz. Burada hata paraya değil, zamana mal olur.\n\n## Piyasa içeride nasıl çalışıyor\n\nBuradaki fiyat rastgele değil. Altının inandırıcı davranması için uğraştık, yoksa simülatörün bir anlamı kalmaz.\n\nGün, sıçramalardan değil hareketlerden oluşur. Günlük menzilin büyük kısmını onlarca dakika süren yavaş dalgalar taşır, tek bir tik ise küçük kalır. Gerçek altın da böyledir: on iki saniyede neredeyse hiçbir zaman dolarlar kat etmez, ama bir saatte çok uzağa gidebilir.\n\nHer günün kendi oynaklığı vardır. Hiçbir şeyin kıpırdamadığı sakin günler olur, sıradan günler olur, hareketli günler olur, bir de piyasanın aklını kaçırdığı günler. Bu rejimleri ve aralarındaki geçişleri kurduk, bu yüzden arka arkaya iki gün birbirine benzemez.\n\nGünün içinde seanslar vardır. Piyasa sabah daha sakindir, gündüz canlanır, akşam sert olabilir. Bu bir süs değil, hareketlerin büyüklüğünü gerçekten değiştirir.\n\nSpread kendi hayatını yaşar. Birkaç tik dar kalır, bir iki tik genişler, sonra geri döner. Tıpkı size sabit bir giriş fiyatı vaat etmeyen gerçek piyasa gibi.\n\nVeriler takvimdeki saatte açıklanır ve piyasayı gerçekten hareket ettirir. İstihdam, enflasyon, üretici fiyatları, Fed'in faiz kararı ve ardından gelen basın toplantısı. Açıklama anında spread genişler, fiyat atlar ve zarar durdur emriniz koyduğunuz yerde değil başka bir yerde gerçekleşir. Bu, gerçek işlemlerin en pahalı dersidir ve burada bedavadır.\n\n## Burada neler öğrenebilirsiniz\n\n**Grafik okumayı.** Bir dakikadan bir güne mumlar, yakınlaştırma, kaydırma, fiyatlı artı imleci. Ayrıntı gibi görünür, ama bir grafiğin başında saatlerce oturmadan o bir bilgi kaynağı değil, sadece bir resimdir.\n\n**Hacmi hesaplamayı.** Lot, yeni başlayan için en anlaşılmaz sayıdır. Yüzde bir lot ile bir lot arasındaki fark rahatlık değil, hesabınızın akşama kadar yaşayıp yaşamayacağıdır. Burada bunu başkasının örneğinde değil kendi rakamlarınızda görürsünüz.\n\n**Teminatı anlamayı.** Bakiye, varlık, serbest teminat, teminat seviyesi, stop out. Yanan hesapların çoğu yanlış tahminden değildir. Yanlış pozisyon büyüklüğündendir. Sayılar gözünüzün önünde her saniye değişince bağlantı apaçık ortaya çıkar.\n\n**Spread'i hissetmeyi.** Her pozisyon zararda açılır ve bu normaldir. Yüz işlemde görmeden inanmazsınız, gördükten sonra ise kısa girişlere bakışınız değişir.\n\n**Emirlerle çalışmayı.** Piyasa girişi, fiyatın üstünde ve altında bekleyen emirler, değiştirme, iptal. Gerçek terminalde meraktan dokunmaya çekindiğiniz mekanik, çünkü her denemenin bir bedeli vardır.\n\n**Zarar durdur ve kâr al koymayı.** Teoride değil, elle ve defalarca. Bu otomatik bir harekete dönüşmeden gerçek parayla işlem yapmak erkendir.\n\n**Bir veriyi yaşamayı.** Beklemek, spread'e ne olduğuna bakmak, fiyatın bir saniyede yol aldığını görmek, stop emrinizin beklediğinizden kötü gerçekleştiğini bulmak. Bunu simülatörde bir kez yaşamak, gerçek hesapta bir kez yaşamaktan ucuzdur.\n\n**Zamanı fark etmeyi.** Altının ne zaman yürüdüğünü, ne zaman durduğunu. Bu bilgi piyasayla yeterince saat geçirirseniz kendiliğinden gelir ve sözle neredeyse hiç aktarılmaz.\n\n**Stop out görmeyi.** Para kalmadığı için aracı kurumun pozisyonunuzu sizin yerinize kapattığı an. Herkes okumuştur, başına gelmeden canlı gören azdır. Burada bunu bilerek yaşatabilirsiniz.\n\n**Kendinizi okumayı.** Geçmiş her işlemi saklar. Bir hafta sonra herhangi bir günlükten daha dürüsttür: hep aynı şeyi yaptığınızı ve tam olarak neyi yaptığınızı gösterir.\n\n**Disiplini korumayı.** En sıkıcı ve en önemli kısım. Her seferinde aynı büyüklük, her işlemde stop, üst üste üç zarardan sonra girmeme kuralı. Simülatör tam da bu alışkanlıklar kayıplardan önce oluşsun diye vardır.\n\n## cTrader'dan farkı ne\n\nArayüzü bilerek tekrarladık. Sekmelerin yeri, alttaki işlem paneli, yeni emir penceresi, alanların adları. Bu, kendimizi cTrader gibi göstermek değil. Tam tersi: simülatörün anlamı alışkanlıkların taşınmasıdır, böylece ileride gerçek cTrader'ı açtığınızda neyin nerede olduğunu baştan aramak zorunda kalmazsınız.\n\nFarklar daha derinde başlıyor.\n\n**cTrader bir platform, biz bir simülatörüz.** cTrader bir aracı kuruma bağlanır ve işlemlerinizi gerçek piyasaya gönderir. XAUCORE hiçbir şeye bağlanmaz. Fiyat burada üretilir, işlemler burada yaşar, para diye bir kavram yoktur.\n\n**Yüzlerce yerine tek enstrüman.** cTrader'da döviz, endeks, hisse, metal, kripto var. Burada yalnızca XAUUSD var ve bu bilinçli. İşlem yapmayı öğrenmek, tek bir şeyde işlem yapmayı öğrenmektir. İnsan otuz enstrüman arasında zıpladığı sürece hiçbirini bilmez.\n\n**Burada zaman sizin elinizde.** Piyasa hızlandırılabilir, durdurulabilir, istediğiniz ana geri sarılabilir, veri size uyan anda açıklatılabilir. Gerçek terminal sizi beklemez. Burada bir akşamda, gerçekte bir hafta sürecek şey yaşanır.\n\n**Burada her şeyi kırabilirsiniz.** Hesabı yakın, saçma bir büyüklük girin, stop out yiyin, sıfırlayıp yeniden başlayın. Tam olarak sıfır sonuç. cTrader'da bu denemelerin her biri cepten ödenir.\n\n**Kimse sizi aracı kuruma götürmüyor.** Para Yatır ve Para Çek düğmeleri yalnızca simülatörün içindeki bir sayıyı değiştirir. Gerçek hesaba geçiş yok, ortaklık bağlantısı yok, uygulamanın artık para getirme vaktinin geldiğini ima ettiği bir an yok.\n\n**cTrader size öğretmek zorunda değil.** O profesyonel bir araçtır, emir uygular. XAUCORE tam olarak öğrenmek için yapıldı, bu yüzden burada her şey anlaşılır kelimelerle yazılı ve hiçbir şey üçüncü seviye menüde saklı değil.\n\ncTrader ile bağlantımız yok ve onun bir parçası değiliz. Bu ayrı bir eğitim uygulamasıdır.\n\n## Burada gerçek olmayan ne var\n\nSimülatörün sınırlarını önceden bilmek gerekir, yoksa faydası yerine zararı olur.\n\n**Fiyat sentetiktir.** Karakter olarak altına benzer, ama gerçek piyasanın kotasyonları değildir ve hiçbir zaman olmayacaktır. Bu grafiğe bakarak gerçek altın için tahmin kurulamaz.\n\n**Gerçekleşme kusursuzdur.** Aracı kurum reddi yok, yeniden fiyatlama yok, en kötü anda kopan bağlantı yok, ödemeyi geçirmeyen banka yok.\n\n**Komisyon ve swap neredeyse yok.** Gerçek işlem, simülatörde göründüğünden pahalıdır.\n\n**Ve en önemlisi, burada korku yok.** Demo mekaniği, düzeni ve disiplini öğretir, ama kendi parası zararda olan bir insana ne olduğunu öğretmez. Ayrıca öğrenilmesi gereken tek şey budur ve bunu dürüstçe baştan söylüyoruz.\n\n## Ücreti ne\n\nUygulama ücretsiz ve öğrenmeye ait olan her şey sonsuza kadar ücretsiz. İşlem için para almıyoruz, yüzde almıyoruz, sizi aracı kuruma götürmüyoruz ve işe yarar hiçbir şeyi abonelik arkasına saklamıyoruz.\n\nBurada para yalnızca bir şeyi alır. Sıvı camı.\n\nBu bir filtre ya da renk teması değil. Bu, uygulamanın tamamının ikinci yüzü ve terminalin kendisinden daha uzun sürdü: kırılma, damlalar, yaylar, açan düğmeden akarak çıkan pencereler, tek bir damlada birleşen kapsüller, sisten kristale kadar kendinizin ayarladığı berraklık, hepsi açık ve koyu tema için ayrı ayrı ince ayarlanmış.\n\nBir kez satın alınır. Öğrenme değişmez, uygulama değişir.\n\n## Faydası olması için nasıl kullanmalı\n\nPlansız bir simülatör oyuna dönüşür. Bunun olmaması için sade bir düzene bağlı kalmakta fayda var.\n\n**Birincisi.** Yüzde bir lotla başlayın. Az olduğu için değil, bir dolarlık hareketin gerçek bedelini ancak böyle göreceğiniz için.\n\n**İkincisi.** Her işleme zarar durdur koyun. Burada bile. Özellikle burada, çünkü alışkanlık sonradan değil simülatörde oluşur.\n\n**Üçüncüsü.** Yirmi ya da otuzluk seriler halinde işlem yapın ve ancak ondan sonra geçmişe bakın. Tek işlem hiçbir şey anlatmaz, otuz işlem neredeyse her şeyi anlatır.\n\n**Dördüncüsü.** Bir veriyi bekleyin ve işlem yapmadan sadece izleyin. Bir kez. Sonra pozisyonla birlikte bir kez daha izleyin ve hissi karşılaştırın.\n\n**Beşincisi.** Hesabı bilerek yakın. Devasa bir büyüklük girin ve bir mevduatın tam olarak nasıl öldüğünü, sayıların hangi sırayla söndüğünü izleyin. Bu, on kârlı işlemden daha değerlidir.\n\n**Altıncısı.** Geri gelin. Bir akşam hiçbir şey vermez. Günde bir saatten iki hafta, bir ay okumaktan fazlasını verir.\n\n## Sık sorulan sorular\n\n**Bunlar gerçek altın kotasyonları mı?** Hayır. Fiyat uygulama tarafından üretilir. Hareketinin karakteri gerçeğe benzer, ama bu piyasa değildir.\n\n**Burada para kazanılır mı?** Hayır. Hesaptaki para çizilmiştir. Çekilecek bir şey de, çekilecek bir yer de yok.\n\n**Kayıt olmak şart mı?** Hesap, bakiyenizin ve geçmişinizin tek bir telefonda kalmaması içindir. Bir e-posta ve bir parola yeterli.\n\n**Neden yalnızca altın?** Çünkü doğru dürüst öğrenilmiş tek bir enstrüman, adını bildiğiniz otuz tanesinden değerlidir.\n\n**İşlemlerimi gören olur mu?** Hayır. Bu sizin kişisel simülatörünüz.\n\n**Hesabı yaktım, şimdi ne olacak?** Geri yükleyip devam edin. Burada bedava ve bütün mesele de bu.\n\n! XAUCORE bir eğitim uygulamasıdır. Kotasyonlar sentetiktir, hesap demodur, gerçek para söz konusu değildir. Aracı kurum değiliz, finansal hizmet sunmuyoruz, işlem karşılığı para almıyoruz ve yatırım tavsiyesi vermiyoruz. Burada olan her şey bir antrenmandır.",
};
function aboutMarkup(){
  const src = ABOUT_TXT[LANG] || ABOUT_TXT.en;
  const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const line = t => esc(t).replace(/\*\*([\s\S]+?)\*\*/g, "<b>$1</b>");
  const body = src.split("\n\n").map(b => b.trim()).filter(Boolean).map(b =>
      b.startsWith("## ") ? "<h3>" + esc(b.slice(3)) + "</h3>"
    : b.startsWith("! ")  ? '<p class="ab-note">' + line(b.slice(2)) + "</p>"
    :                       "<p>" + line(b) + "</p>").join("");
  return "<h2>" + L("О приложении") + '</h2><div class="about-doc">' + body
       + '<p class="ab-ver">XAUCORE · <span id="abBuild">…</span></p></div>';
}
// which build is actually running — the server knows, we do not bake it in and let it go stale
function aboutBuild(){
  const el = document.getElementById("abBuild"); if(!el) return;
  const drop = () => { if(el.parentElement) el.parentElement.remove(); };
  fetch("/api/health", { cache: "no-store" }).then(r => r.json())
    .then(j => { if(!el.isConnected) return; if(j && j.build) el.textContent = j.build; else drop(); })
    .catch(drop);
}
function aboutModal(){
  openSheet(aboutMarkup(), "about-sheet");
  aboutBuild();
}
/* «Пополнить счёт» / «Снять средства» — DEMO money straight into the trading account (the broker wallet is a
   separate thing and still «Скоро»). Withdrawal is capped by what is actually free, so an open position's margin
   can never be taken out from under it. */
function acctFundsModal(kind){
  const isDep = kind === "deposit";
  recalcAccount();
  const free = () => { recalcAccount(); return Math.max(0, Math.min(S.account.balance, S._acc.freeMargin)); };
  openSheet(`
    <h2>${isDep ? L("Пополнить счёт") : L("Снять средства")}</h2>
    <div class="hint" style="margin-bottom:10px">${L("DEMO • SYNTHETIC — меняется только внутренний баланс симулятора.")}</div>
    <div class="af-bal"><span>${L("Баланс")}</span><b id="afBal">${money(S.account.balance)}</b></div>
    ${isDep ? "" : `<div class="af-bal"><span>${L("Свободная маржа")}</span><b id="afFree">${money(free())}</b></div>`}
    <div class="field"><label>${L("Сумма (USD)")}</label><input id="af-amt" inputmode="decimal" placeholder="0.00" autocomplete="off"></div>
    <div class="af-quick">${[1000, 10000, 100000].map(v=>`<button type="button" data-afq="${v}">+${fmt(v,0)}</button>`).join("")}${isDep ? "" : `<button type="button" data-afq="all">${L("Всё")}</button>`}</div>
    <div class="loterr" id="af-err" style="min-height:16px"></div>
    <button class="btn green" id="af-go">${isDep ? L("Пополнить") : L("Вывести")}</button>
    <button class="btn ghost" data-close>${L("Отмена")}</button>`);
  const amt = document.getElementById("af-amt"), err = document.getElementById("af-err");
  const read = () => parseFloat((amt.value || "").replace(/[\s,]/g, ""));
  modalEl.querySelectorAll("[data-afq]").forEach(b => b.onclick = () => {
    amt.value = b.dataset.afq === "all" ? fmt(free(), 2) : fmt((read() || 0) + Number(b.dataset.afq), 2);
    err.textContent = ""; amt.focus();
  });
  modalEl._live = () => {                                         // the figures keep running while the sheet is open
    const b = document.getElementById("afBal"), f = document.getElementById("afFree");
    if(b) b.textContent = money(S.account.balance);
    if(f) f.textContent = money(free());
  };
  document.getElementById("af-go").onclick = () => {
    const v = read();
    if(!(v > 0)) return err.textContent = "⚠ " + L("Введите сумму");
    if(isDep && v > 1e7) return err.textContent = "⚠ " + L("Не больше {0} за раз", money(1e7));
    if(!isDep && v > free() + 1e-9) return err.textContent = "⚠ " + L("Доступно для снятия: {0}", money(free()));
    S.account.balance = Math.round((S.account.balance + (isDep ? v : -v)) * 100) / 100;
    recalcAccount(); save();
    closeModal();
    render();
    toast("g", isDep ? L("Счёт пополнен на {0}", money(v)) : L("Снято {0}", money(v)));
  };
  amt.addEventListener("keydown", e => { if(e.key === "Enter") document.getElementById("af-go").click(); });
  setTimeout(() => amt.focus(), 60);
}

/* cTrader's instrument header numbers: change since the trading day's open in % and in pips
   (0.01 for gold, so -60.68 reads -6068.0), the day's low / high, and the spread in pips */
function ovHeadData(){
  const D = S.day || {}, pip = Math.pow(10, -S.symbol.digits);
  const open = D.open || S.price.mid, chg = S.price.mid - open, pct = open ? chg / open * 100 : 0;
  return {
    pct: (pct > 0 ? "+" : "") + fmt(pct, 2) + "%",

/* «Настроение рынка» — cTrader's split of traders short (orange-red, left) / long (green, right).
   Synthetic: the resting size on each side of the depth book, smoothed over ~40 s so it drifts
   like the real figure instead of flickering with every refresh of the book. */
let _sent = null;
function ovSentiment(){
  if(!_book) domStep();
  let b = 0, a = 0;
  for(const l of _book.b) b += l.sz;
  for(const l of _book.a) a += l.sz;
  const target = clamp(b / ((a + b) || 1) * 100, 15, 85), now = Date.now();
  if(!_sent) _sent = { v: target, t: now };
  else{ _sent.v += (target - _sent.v) * (1 - Math.exp(-Math.min(5000, now - _sent.t) / 40000)); _sent.t = now; }
  return Math.round(_sent.v);                                          // long, %
}
function ovSentBody(){
  const pb = ovSentiment(), ps = 100 - pb;
  return `<div class="sent-bar"><span class="s" id="sentS" style="flex-grow:${ps}"></span><span class="b" id="sentB" style="flex-grow:${pb}"></span></div>
      <div class="sent-l"><span class="s" id="sentSp">${ps}%</span><span class="b" id="sentBp">${pb}%</span></div>`;
}
function ovSentUpdate(){
  const s = document.getElementById("sentS");
  if(!s) return;
  const pb = ovSentiment(), ps = 100 - pb;
  if(s.style.flexGrow !== String(ps)){ s.style.flexGrow = ps; document.getElementById("sentB").style.flexGrow = pb; }
  setTxt("sentSp", ps + "%"); setTxt("sentBp", pb + "%");
}
/* «Глубина рынка» — the 5 best levels of the same synthetic book as the DOM screen:
   bid size · bid | ask · ask size, with a tick under each price as wide as its size
   (1 px a lot — the short ticks of cTrader's card); «Показать еще» opens the DOM */
function ovDepthRows(){
  domStep();
  const B = _book, tick = sz => Math.max(1, Math.min(60, sz)).toFixed(1);
  let bp = B.bid, ap = B.ask, html = "";
  for(let i = 0; i < 5; i++){
    if(i){ bp = roundTo(bp - B.b[i].g, 2); ap = roundTo(ap + B.a[i].g, 2); }
    html += `<div class="dp-row"><div class="dp-h b"><span>${fmt(B.b[i].sz, 2)}</span><span class="dp-p">${chartPx(bp)}<i style="width:${tick(B.b[i].sz)}px"></i></span></div><div class="dp-h a"><span class="dp-p">${chartPx(ap)}<i style="width:${tick(B.a[i].sz)}px"></i></span><span>${fmt(B.a[i].sz, 2)}</span></div></div>`;
  }
  return html;
}
/* «Экономический календарь» — the next event of the synthetic calendar (the latest one once

function ovCalEvent(){                                                 // the next one still to come, else the latest in the past
  const next = S.events.filter(e => !e.released && e.time >= S.simClock - 60000).sort((a, b)=> a.time - b.time)[0];
  return next || [...S.events].filter(e => e.time <= S.simClock).sort((a, b)=> b.time - a.time)[0] || null;
}
function evWhen(t){
  const d = new Date(t), now = new Date(S.simClock);
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const n = Math.round((day(d) - day(now)) / 86400000);
  const w = n === 0 ? L("Сегодня") : n === 1 ? L("Завтра") : n === -1 ? L("Вчера") : pad2(d.getDate()) + "." + pad2(d.getMonth() + 1);
  return `${w} ${L("в")} ${fmtHM(t)} ${L("(игровое время)")}`;
}
function evVal(e, v){
  if(v == null || (e.unit === "" && !v)) return "-";
  return (e.unit === "K" ? fmt(v, 0) : String(roundTo(v, 2))) + e.unit;
}
function ovCalBody(){
  const e = ovCalEvent();
  if(!e) return `<div class="cal-when"><span>${L("Нет событий")}</span></div>`;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const desc = (EV_DESC.find(([re]) => re.test(e.name)) || [0, "A synthetic event created in the simulator (DEMO).", "Синтетическое событие, созданное в симуляторе (DEMO).", "Синтетична подія, створена в симуляторі (DEMO).", "Un événement synthétique créé dans le simulateur (DEMO).", "Simülatörde oluşturulmuş sentetik bir etkinlik (DEMO)."])[LANGS.indexOf(LANG) + 1];
  const cell = (v, k) => `<div class="cal-c"><div class="cal-v">${v}</div><div class="cal-k">${k}</div></div>`;
  return `<div class="cal-when"><span>${evWhen(e.time)}</span><span class="cal-cur">${FLAG_US}USD</span></div>
      <div class="cal-name">${esc(e.name)}</div>
      <div class="cal-grid">${cell(`<span class="cal-imp ${e.impact >= 3 ? "hi" : e.impact === 2 ? "md" : "lo"}"></span>`, L("Волатильность"))}${cell(evVal(e, e.actual), L("Фактическое"))}${cell(evVal(e, e.forecast), L("Прогноз"))}${cell(evVal(e, e.previous), L("Предыдущее"))}</div>
      <div class="cal-desc">${desc}</div>`;
}

function fmtClock(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  return String(Math.floor(s/60)).padStart(2,"0") + ":" + String(s%60).padStart(2,"0");
}

function upcomingEventsMarkup(n){
  const up = S.events.filter(e=>!e.released).sort((a,b)=>a.time-b.time).slice(0,n);
  const rec = S.events.filter(e=>e.released).sort((a,b)=>b.time-a.time).slice(0,2);
  const rows = [...up, ...rec];
  if(!rows.length) return `<div class="hint">${L("Нет событий")}</div>`;
  return rows.map(e=>{
    const mins = Math.round((e.time - S.simClock)/60000);
    const when = e.released ? `<small>${L("вышло")}</small>` : `<small>${L("через ~")}${mins} ${L("мин")}</small>`;
    return `<div class="evt">

/* cTrader's orders table (Markets → XAUUSD → ОРДЕРА and the Ордеры tab): captions
   «Инструмент · Направление · Размер · Расстояние» (cut with … in their narrow columns, as in
   cTrader), then a row per order — ✓, symbol, the order-type glyph in the side's colour,
   «0.01 Лоты», the distance to the trigger in pips (1 $ = 100 pips → «32 446.0»), ✕ cancels.
   A tap on the row opens Modify (SL/TP and the price live there now). */
// an order type in words, as cTrader's button says it: «КУПИТЬ ЛИМИТНЫЙ», «ПРОДАТЬ СТОП-ЛИМИТ»
function ordTypeName(t){
  return L({ buy_limit: "КУПИТЬ ЛИМИТНЫЙ", sell_limit: "ПРОДАТЬ ЛИМИТНЫЙ", buy_stop: "КУПИТЬ СТОП", sell_stop: "ПРОДАТЬ СТОП",
             buy_stop_limit: "КУПИТЬ СТОП-ЛИМИТ", sell_stop_limit: "ПРОДАТЬ СТОП-ЛИМИТ" }[t] || String(t).replace(/_/g, " ").toUpperCase());
}
function lotsTxt(v){ return String(roundTo(v, 2)) + " " + L("Лоты"); }        // 0.01 Лоты, 1 Лоты
function orderDist(o){ return (o.type.includes("buy") ? S.price.ask : S.price.bid) - o.price; }
function pipsTxt(d){                                                    // a price distance in pips: 324.46 → «32 446.0»
  const [i, f] = (Math.abs(d) / Math.pow(10, -S.symbol.digits)).toFixed(1).split(".");
  return i.replace(/\B(?=(\d{3})+$)/g, " ") + "." + f;
}
/* the order-type glyph: a bar and an arrow, as on the chart pills — limit = the arrow leaves
   the bar (sell limit: bar on top, arrow down), stop = the arrow runs into it (buy stop: up to
   a top bar); drawn for a top bar and flipped for a bottom one */
function orderGlyph(type){
  const buy = type.startsWith("buy"), limit = type.endsWith("limit") && !type.includes("stop");   // a stop-limit is set off like a stop
  const body = limit ? `<path d="M5 4.6h2v9.6H5z"/><path d="M1.4 13.6h9.2L6 20.6z"/>`
                     : `<path d="M6 4.6l4.6 7H1.4z"/><path d="M5 11h2v9.6H5z"/>`;
  const flip = (buy ? !limit : limit) ? "" : ` transform="matrix(1 0 0 -1 0 21)"`;
  return `<svg class="og ${buy ? "buy" : "sell"}" viewBox="0 0 12 21" width="12" height="21" aria-hidden="true"><g${flip}><rect x="0.3" width="11.4" height="2.3"/>${body}</g></svg>`;
}

function walletLog(type, amount, note){
  S.wallet.ledger = S.wallet.ledger || [];
  S.wallet.ledger.unshift({ type, amount: roundTo(amount, 2), ts: Date.now(), note: note || "" });
  if(S.wallet.ledger.length > 60) S.wallet.ledger.length = 60;
}
function walletSync(){
  save();
  if(typeof xcPushState === "function") xcPushState(true);
  render();                          // screenWallet re-reads S.wallet.balance — no duplicated state
}
function walletDeposit(amount){
  const a = roundTo(Number(amount), 2);
  if(!isFinite(a) || a <= 0) return { ok:false, msg:L("Введите сумму больше 0") };
  S.wallet.balance = roundTo(S.wallet.balance + a, 2);
  walletLog("deposit", a);
  walletSync();
  toast("g", L("Кошелёк пополнен на {0}", walletFmt(a)));
  return { ok:true };
}
function walletWithdraw(amount){
  const a = roundTo(Number(amount), 2);
  if(!isFinite(a) || a <= 0) return { ok:false, msg:L("Введите сумму больше 0") };
  if(a > S.wallet.balance + 1e-6) return { ok:false, msg:L("Недостаточно средств. Доступно: {0}", walletFmt(S.wallet.balance)) };
  S.wallet.balance = roundTo(S.wallet.balance - a, 2);

/* ---------- DOM ----------
   Synthetic depth that behaves like a live book: each level keeps its size between
   refreshes and churns (adds, partial cancels, now and then a large resting order);
   when the price moves, the levels it went through are consumed and fresh ones
   queue up on the other side. Every change flashes, ~4 refreshes a second. */
function screenDOM(){
  const rows = domRows();                          // steps the book first; the imbalance reads it
  return appbar(L("Стакан заявок (DOM)"),{back:true}) + `<div class="wrap">
    <div class="card" style="padding:8px">
      <div id="domImb">${domImbMarkup()}</div>
      <div class="dom-grid" id="domGrid">${rows}</div>
      <div class="grid2" style="margin-top:10px">
        <button class="btn red" data-act="domsell"><span class="tcap">${L("ПРОДАТЬ")} ${fmt(S.ui.lot,2)}</span><span class="tx">✕</span></button>
        <button class="btn green" data-act="dombuy"><span class="tcap">${L("КУПИТЬ")} ${fmt(S.ui.lot,2)}</span><span class="tx">✕</span></button>
      </div>
    </div>
  </div>`;
}
const DOM_LEVELS = 10;
let _book = null;
function domLot(x){ return x >= 10 ? fmt(x, 0) : fmt(x, x >= 1 ? 1 : 2); }
function domGap(){ const r = Math.random(); return roundTo(r < 0.35 ? rnd(0.02, 0.05) : r < 0.80 ? rnd(0.05, 0.12) : rnd(0.12, 0.25), 2); }
function domLevel(i){
  const wall = Math.random() < 0.03 ? rnd(3, 8) : 1;                 // the odd large resting order
  return { g: domGap(), sz: roundTo((0.4 + Math.random()*2.6) * (1 + i*0.55) * wall, 2), f: 0, born: false };
}
/* how many levels a move of `dist` went through: the touch, plus every level that
   sat closer than `dist` behind it */
function domPassed(side, dist){
  if(dist < 0.005) return 0;
  let n = 1, off = 0;
  while(n < DOM_LEVELS && off + side[n].g < dist){ off += side[n].g; n++; }
  return n;
}
function domStep(){
  const bid = S.price.bid, ask = S.price.ask;
  if(!_book){
    _book = { bid, ask, a: [], b: [] };
    for(let i=0;i<DOM_LEVELS;i++){ _book.a.push(domLevel(i)); _book.b.push(domLevel(i)); }
  }
  const B = _book;
  const mv = ((bid + ask) - (B.bid + B.ask)) / 2;                    // mid move, $
  const eat  = (side, n) => { for(let k=0;k<n;k++){ side.shift(); side.push(domLevel(DOM_LEVELS-1)); } };
  const grow = (side, n) => { for(let k=0;k<n;k++){ side.pop(); const l = domLevel(0); l.f = 2; l.born = true; side.unshift(l); } };
  if(mv > 0){ const n = domPassed(B.a, mv); eat(B.a, n); grow(B.b, n); }        // up: asks taken, bids step up behind
  else if(mv < 0){ const n = domPassed(B.b, -mv); eat(B.b, n); grow(B.a, n); }
  B.bid = bid; B.ask = ask;
  for(const side of [B.a, B.b]){
    side.forEach((l, i)=>{
      if(l.born){ l.born = false; return; }        // a fresh level keeps its flash for this refresh
      l.f = 0;
      const r = Math.random();
      if(r < 0.33){
        const nz = roundTo(Math.max(0.01, l.sz * rnd(0.72, 1.32) + rnd(-0.4, 0.7)), 2);
        l.f = nz > l.sz ? 1 : nz < l.sz ? -1 : 0;
        l.sz = nz;
      }else if(r < 0.38){
        l.sz = domLevel(i).sz; l.f = 2;
      }
      if(Math.random() < 0.04) l.g = domGap();
    });
  }
}
function domRows(){
  domStep();
  const B = _book, fl = f => f === 1 ? " up" : f === -1 ? " dn" : f === 2 ? " nw" : "";
  const aPx = [], bPx = [];
  let acc = B.ask; for(let i=0;i<DOM_LEVELS;i++){ if(i) acc = roundTo(acc + B.a[i].g, 2); aPx.push(acc); }
  acc = B.bid;     for(let i=0;i<DOM_LEVELS;i++){ if(i) acc = roundTo(acc - B.b[i].g, 2); bPx.push(acc); }
  const maxSz = Math.max(...B.a.map(l=>l.sz), ...B.b.map(l=>l.sz), 0.01);
  let html = "";
  for(let i=DOM_LEVELS-1;i>=0;i--){
    const l = B.a[i];
    html += `<div></div><div class="dom-px mono">${pxfmt(aPx[i])}</div><div class="dom-ask mono${fl(l.f)}"><span class="dom-bar a" style="width:${(l.sz/maxSz*100).toFixed(1)}%"></span>${domLot(l.sz)}</div>`;
  }
  html += `<div class="dom-bid mono" style="color:var(--ink2)">${L("спред")}</div><div class="dom-px mono" style="color:var(--orange-ink)">${pxfmt(S.price.spread)}</div><div class="dom-ask mono" style="color:var(--ink2)"></div>`;
  for(let i=0;i<DOM_LEVELS;i++){
    const l = B.b[i];
    html += `<div class="dom-bid mono${fl(l.f)}"><span class="dom-bar b" style="width:${(l.sz/maxSz*100).toFixed(1)}%"></span>${domLot(l.sz)}</div><div class="dom-px mono">${pxfmt(bPx[i])}</div><div></div>`;
  }
  return html;
}
/* which side is heavier right now: total resting size on each side of the book */
function domImbMarkup(){
  if(!_book) return "";
  let b = 0, a = 0;
  for(const l of _book.b) b += l.sz;
  for(const l of _book.a) a += l.sz;
  const pb = Math.round(b / ((a + b) || 1) * 100);
  return `<div class="dom-imb-l"><span class="pos">${L("Покупатели")} ${pb}% · ${domLot(b)} ${L("лот")}</span><span class="neg">${domLot(a)} ${L("лот ·")} ${100-pb}${L("% Продавцы")}</span></div>
    <div class="dom-imb"><span class="b" style="width:${pb}%"></span><span class="a" style="width:${100-pb}%"></span></div>`;
}

/* ---------- DEBUG CONSOLE — simulated day statistics ---------- */
function dayStats(days){
  if(!days.length) return null;
  const R = days.map(d=>d.range).sort((a,b)=>a-b);
  const n = R.length, mean = R.reduce((a,b)=>a+b,0)/n;
  const sd = Math.sqrt(R.reduce((a,b)=>a+(b-mean)*(b-mean),0)/n);
  const med = n%2 ? R[(n-1)/2] : (R[n/2-1]+R[n/2])/2;
  return { n, mean, med, min:R[0], max:R[n-1], sd };
}

function pmPath(s0, s1, t0, t1, h0, joined, gap, brk, bulge){
  const h = h0 + (bulge || 0), oy = -(bulge || 0) / 2;                     // a bulge grows it about its middle

    let y = parseFloat(pill.style.getPropertyValue("--pmy")) || 0, v = 0, t0 = 0;
    const step = now => {                                                  // whatever is left of the pull springs out of it
      if(!pill.isConnected) return;
      const dt = t0 ? Math.min(Math.max((now - t0) / 1000, 0), 1 / 30) : MO.dt0; t0 = now;
      v = MO.sp(v, y, 0, MO.P.pop, dt); y += v * dt;
      if(Math.abs(y) < .15 && Math.abs(v) < 4){ pill.style.removeProperty("--pmy"); pill.style.removeProperty("will-change"); return; }
      pill.style.setProperty("--pmy", y.toFixed(2) + "px"); moAdd(step);
    };
    moAdd(step);
    if(tf && tf !== S.ui.chartTF) setChartTF(tf);
    else pill.textContent = L(MINI_TF_LABEL[S.ui.chartTF] || S.ui.chartTF);
    return;
  }
  if(!d.on) return;
  _pmSkip = performance.now();                                             // the pill's click after a drag is not a tap
  const was = !!S.ui.chMerge;
  const merge = was ? !(PM.x > -PM_D * .6 || d.vel > 260) : (PM.x < -PM_D * .4 || d.vel < -260);
  S.ui.chMerge = merge; save();
  PM.v = clamp(d.vel, -600, 600) * .35;                                  // a flick carries on a little
  pmKick();
};
document.addEventListener("pointerup", pmUp, { capture: true, passive: true });
document.addEventListener("pointercancel", pmUp, { capture: true, passive: true });
document.addEventListener("click", e => {
  if(performance.now() - _pmSkip < 450 && e.target.closest && e.target.closest(".chpills")){ e.stopImmediatePropagation(); e.preventDefault(); }
}, true);
function setChartTF(tf){

}

async function refreshLockCard(){
  const card = document.getElementById("lockCard");
  if(!card) return;
  let info;
  try{ info = await xcApi("GET", "/api/lock"); }
  catch(e){ return; }                              // leave the card hidden on error

  if(!info.configured){ card.remove(); return; }   // feature not set up on the server — stays hidden
  card.style.display = "";

  const stateRow = (locked)=>`<div class="row" style="margin-bottom:8px">
      <span class="k">${L("Для обычных посетителей")}</span>
      <span class="v" style="color:${locked?'var(--red-ink)':'var(--green-ink)'}">${locked?L("ЗАКРЫТ"):L("ОТКРЫТ")}</span></div>`;

  if(info.isOwner){
    card.innerHTML = `<h3>${L("🔒 САЙТ ЗАКРЫТ")}</h3>
      ${stateRow(info.locked)}
      <div class="pill-toggle" id="lockPills">
        <button data-lock="1" class="${info.locked?'on':''}">${L("ON · закрыт")}</button>

      </div>
      <button class="btn ghost" id="ownerLogout" style="margin-top:10px">${L("Выйти из режима владельца")}</button>`;
    card.querySelectorAll("[data-lock]").forEach(b=> b.onclick = async ()=>{
      const want = b.dataset.lock === "1";
      if(want === !!info.locked) return;
      b.disabled = true;
      try{
        await xcApi("POST", "/api/lock", { locked: want });
        toast("", want ? L("🔒 Сайт закрыт для посетителей") : L("🔓 Сайт снова открыт"));
      }catch(e){ toast("o", L(e.message || "Не удалось изменить")); }
      refreshLockCard();
    });
    card.querySelector("#ownerLogout").onclick = async ()=>{
      try{ await xcApi("DELETE", "/api/owner"); }catch(e){}
      toast("", L("Режим владельца выключен на этом устройстве"));
      refreshLockCard();
    };
    return;
  }

  // not the owner — show status + an inline owner sign-in
  card.innerHTML = `<h3>${L("🔒 Доступ к сайту")}</h3>
    <div class="row"><span class="k">${L("Статус")}</span><span class="v">${info.locked?L("закрыт для посетителей"):L("открыт")}</span></div>
    <div class="field" style="margin:10px 0 0">
      <label>${L("Ключ владельца")}</label>
      <input id="ownerKey" type="password" autocomplete="off" placeholder="••••••••">
      <div class="hint" id="ownerMsg" style="min-height:14px"></div>
    </div>
    <button class="btn ghost" id="ownerLogin">${L("Войти как владелец")}</button>`;
  const doLogin = async ()=>{
    const inp = card.querySelector("#ownerKey"), msg = card.querySelector("#ownerMsg"), btn = card.querySelector("#ownerLogin");
    if(!inp.value){ inp.focus(); return; }
    btn.disabled = true; msg.textContent = "";
    try{
      await xcApi("POST", "/api/owner", { key: inp.value });
      toast("", L("Вы вошли как владелец"));
      refreshLockCard();
    }catch(e){ msg.style.color = "var(--red-ink)"; msg.textContent = L("Неверный ключ"); btn.disabled = false; }
  };
  card.querySelector("#ownerLogin").onclick = doLogin;
  card.querySelector("#ownerKey").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
}
