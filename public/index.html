  if(london) vol = Math.max(vol, 1.25);     // increased activity
  if(ny)     vol = Math.max(vol, 1.40);     // high activity
  if(london && ny) vol = 1.68;              // overlap
  if(late)   vol = Math.max(0.7, vol*0.75); // usually calmer — but not absolute
  if(!names.length) names = ["Off-hours"];
  vol *= _sessJitter;                        // random variation — sessions aren't absolute
  return { names, vol: clamp(vol, 0.4, 2.6) };
}
function isWeekend(){
  const d = simDate().getUTCDay();
  const h = simDate().getUTCHours();
  // Fri 21:00 -> Sun 21:00 closed (approx FX weekend)
  if(d===6) return true;
  if(d===0 && h<21) return true;
  if(d===5 && h>=21) return true;
  return false;
}
function marketClosed(){ return !S.market.forceOpen && isWeekend(); }

/* ---------------- seed candle history from synthetic ticks ---------------- */
function seedMarket(){
  const digits = S.symbol.digits;
  S.price.bid = S.market.initialBid;
  S.price.ask = S.market.initialAsk;
  S.price.mid = (S.market.initialBid + S.market.initialAsk)/2;
  S.price.prevMid = S.price.mid;
  S.price.ema = S.price.mid;
  S.price.emaFast = S.price.mid;
  S.price.spread = roundTo(S.market.initialAsk - S.market.initialBid, digits);
  S.price.vel = 0;
  S.price.volCluster = 1;
  S.news = { active:false, type:null, scenario:null, startReal:0, endReal:0,
             startPrice:0, high:0, low:0, progress:0, ticks:0, decayUntil:0, result:null,
             delta:0, _vel:0 };
  S.lock = { active:false, until:0 };
  S.manual = { enabled:false, frozen:false, impulse:null,
               stepSize:0.20, moveSize:5, impDir:1, impUsd:60, impSec:15 };
  S.dayLog = [];
  S.daySeq = 0;
  S.regime = null;

  const now = Date.now();
  const startMid = S.price.mid;

  S.candles = {};
  const counts = { M1:720, M5:520, M15:420, M30:380, H1:360, H4:300, D1:200 };
  for(const tf of TF_ORDER){
    S.candles[tf] = genBars(counts[tf], TF[tf], startMid, now).slice(-TF_CAP[tf]);
  }
  S.simClock = now;
  S.lastSimDay = simDateStr(now);
  buildDefaultEvents();
  startRegime(null);
  startNewDay(startMid);
}
/* generate `count` synthetic OHLC bars of `sec` seconds each, ending at `endMid` at time
   `endMs` — the chart history a new account (or a reset) starts with. A free random walk
   with short swing legs, the same character as the live engine, then translated as a
   whole so its last close lands exactly on endMid. The old version pulled every sub-step
   toward an anchor at the start price, so a young account's M30/H1 history was a flat
   band of long wicks: "gold just stands in one place". Bars still chain (open = last close). */
function genBars(count, sec, endMid, endMs){
  const digits = S.symbol.digits;
  const perBar = 20 * Math.sqrt(sec/86400) * pxVolScale(endMid);   // ≈ live engine: M30 ~$8, H1 ~$12, D1 ~$75 at $4 500
  const tEnd = Math.floor(endMs/1000/sec) * sec;
  const t0 = tEnd - count*sec;
  const steps = Math.max(4, Math.min(96, Math.round(sec/30)));     // enough sub-steps that a D1 bar's range isn't clipped
  const raw = [];
  let m = 0, swing = 0;
  for(let i=0;i<count;i++){
    const t = t0 + i*sec;
    const hh = new Date(t*1000).getUTCHours();
    let sv = 0.75;
    if(hh>=7 && hh<16) sv = 1.2;
    if(hh>=12 && hh<21) sv = 1.35;
    if(hh>=12 && hh<16) sv = 1.7;
    if(sec >= 86400) sv = 1.45;                        // a daily bar spans every session, not just its 00:00 UTC start
    const o = m; let hi = o, lo = o;
    const sd = perBar * sv / Math.sqrt(steps);
    for(let k=0;k<steps;k++){
      swing = swing * 0.92 + gauss() * sd * 0.08;     // a slow leg: bars trend a little, then turn
      m += gauss() * sd * 0.8 + swing;
      if(Math.random() < 0.01) m += gauss() * sd * 2;
      if(m > hi) hi = m;
      if(m < lo) lo = m;
    }
    raw.push({ t, o, h:hi, l:lo, c:m, v:Math.round(rnd(30,300)*Math.sqrt(sec/60)) });
  }
  const shift = endMid - m;                            // the path ends exactly on "now"
  const bars = raw.map(b => ({ t:b.t, o:roundTo(b.o+shift,digits), h:roundTo(b.h+shift,digits),
                               l:roundTo(b.l+shift,digits), c:roundTo(b.c+shift,digits), v:b.v }));
  bars[bars.length-1].c = endMid;
  return bars;
}
function aggregateFrom(m1, sec){
  const out = [];
  for(const b of m1){
    const bt = Math.floor(b.t / sec) * sec;
    const last = out[out.length-1];
    if(!last || last.t !== bt){
      out.push({ t:bt, o:b.o, h:b.h, l:b.l, c:b.c, v:b.v });
    }else{
      last.h = Math.max(last.h, b.h);
      last.l = Math.min(last.l, b.l);
      last.c = b.c;
      last.v += b.v;
    }
  }
  return out;
}

/* ---------------- economic calendar (synthetic) ----------------
   ONE event a day, at 15:30 game time, always in this order (user 2026-09-20): NFP → CPI → PPI → FOMC →
   FED Press Conference, then round again. Days the market is closed are skipped, and the day's event goes off
   by itself when its time comes (checkEvents) — with its own news candle. */
/* One news day after another, in this order. FOMC keeps its own hour — the rate decision at 21:00 and ITS press
   conference half an hour later, the same day (user 2026-09-20); everything else comes out at 15:30. */
const NEWS_CYCLE = [
  [{ name:"NFP (Non-Farm Payrolls)", unit:"K", prev:180,  fc:190,  at:[15, 30] }],
  [{ name:"CPI y/y",                 unit:"%", prev:3.0,  fc:2.9,  at:[15, 30] }],
  [{ name:"PPI m/m",                 unit:"%", prev:0.2,  fc:0.3,  at:[15, 30] }],
  [{ name:"FOMC Rate Decision",      unit:"%", prev:4.50, fc:4.50, at:[21, 0] },
   { name:"FED Press Conference",    unit:"",  prev:0,    fc:0,    at:[21, 30] }]
];
const NEWS_SLOTS = {};                                             // name → its hour and minute
for(const day of NEWS_CYCLE) for(const e of day) NEWS_SLOTS[e.name] = e.at;
function marketClosedAt(t){
  if(S.market.forceOpen) return false;
  const d = new Date(t), wd = d.getUTCDay(), h = d.getUTCHours();
  return wd === 6 || (wd === 0 && h < 21) || (wd === 5 && h >= 21);
}
const atOn = (t, at) => { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate(), at[0], at[1], 0, 0).getTime(); };
const dayStart = t => { const d = new Date(t); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); };
// the first day from minDay on that trades at every hour this day's events need (the press conference too)
function newsDayAfter(minDay, day){
  let t = atOn(minDay, day[0].at);
  if(t <= S.simClock) t += 86400000;                               // never in the past
  for(let i = 0; i < 9; i++){
    if(!day.some(e => marketClosedAt(atOn(t, e.at)))) break;        // the whole day has to trade, the press conference too
    t += 86400000;
  }
  return t;
}
// keep the next few events queued — one day after another, in the cycle's order
function scheduleNews(keep){
  keep = keep || 6;
  // an older state (or an older build) may still hold events at other hours or with other names: if a single one of
  // them is off its slot the whole queue is rebuilt from the cycle, so it never ends up mixed (two CPIs in a row)
  const onSlot = e => { const at = NEWS_SLOTS[e.name], d = new Date(e.time); return !!at && d.getHours() === at[0] && d.getMinutes() === at[1]; };
  if(S.events.some(e => !e.released && !e.manual && !onSlot(e))) S.events = S.events.filter(e => e.released || e.manual);
  // each news day takes a calendar day of its own — the next one starts the day after the last one queued
  let minDay = dayStart(S.simClock), n = 0;
  for(const e of S.events){
    if(e.manual || e.released) continue;
    n++;
    const nd = dayStart(e.time) + 86400000;
    if(nd > minDay) minDay = nd;
  }
  while(n < keep){
    const i = ((S.newsIdx || 0) % NEWS_CYCLE.length + NEWS_CYCLE.length) % NEWS_CYCLE.length, day = NEWS_CYCLE[i];
    S.newsIdx = i + 1;
    const t0 = newsDayAfter(minDay, day);
    for(const d of day){
      S.events.push({ id: S.seq.evt++, name: d.name, unit: d.unit, previous: d.prev, forecast: d.fc,
                      actual: null, impact: 3, time: atOn(t0, d.at), released: false, manual: false });
      n++;
    }
    minDay = dayStart(t0) + 86400000;
  }
  if(S.events.length > 30) S.events.splice(0, S.events.length - 30);
}
function buildDefaultEvents(){
  S.events = [];
  S.newsIdx = 0;
  scheduleNews(6);
}
function nameToNewsType(name){
  if(/NFP|Payroll/i.test(name)) return "NFP";
  if(/CPI/i.test(name)) return "CPI";
  if(/PPI|Producer/i.test(name)) return "PPI";
  if(/FOMC|Rate Decision/i.test(name)) return "FOMC";
  if(/FED|Speech|Press/i.test(name)) return "FED_SPEECH";
  if(/GDP/i.test(name)) return "CPI";
  return "PPI";
}
/* calendar tap -> launch the matching macro news scenario */
function releaseEvent(ev){
  ev.released = true;
  startNews(nameToNewsType(ev.name), ev);
}

/* =========================================================================
   MARKET ENGINE — autonomous regime-switching tick engine (NO STATIC ANCHOR)

   * `S.price.mid` (== currentMarketPrice) is the SINGLE SOURCE OF TRUTH.
     Where the price goes, it stays — every next tick builds from the actual
     current price. No initialPrice / basePrice / reset / mean-reversion-to-start.
     The only hard limit is price > 0.01.
   * MARKET REGIME ENGINE: a regime (STRONG_BULL / BULL / RANGE / DISTRIBUTION /
     BEAR / STRONG_BEAR / ACCUMULATION / RECOVERY) lasts several game-days to weeks
     and switches via a Markov transition matrix.  RANGE-like regimes keep price
     circulating around a DYNAMIC EMA equilibrium (which itself follows price, so a
     flat can form at ANY level — 2100, 5800, anywhere).  Trend regimes have pure
     directional drift + momentum + noise and no pull.
   * 1 simulated trading day = market.dayDurationMin real minutes (default 50).
     Each day draws its own volatility band (target intraday Range) — LOW / NORMAL
     / ACTIVE / EXTREME — with volatility CLUSTERING across days.
   * NEWS + MANUAL IMPULSE are added ON TOP of the auto price and persist afterward.
   ========================================================================= */
const RT_MS = 60;                    // real-time engine frame
let _tickAcc = 0;
let _simDebtMs = 0;                   // unconsumed sim-time carried to the next tick
let _tickBuf = [];                    // in-memory synthetic tick log
function currentVolFactor(){
  const sess = sessionInfo();
  return sess.vol * (S.price.volCluster||1) * (S.news.active ? volCurveAt(S.news.scenario, S.news.progress) : 1);
}
function weightedKey(obj){
  const keys = Object.keys(obj);
  const total = keys.reduce((s,k)=>s+(obj[k]||0), 0) || 1;
  let r = Math.random()*total, acc = 0;
  for(const k of keys){ acc += (obj[k]||0); if(r <= acc) return k; }
  return keys[keys.length-1];
}

/* ---- MARKET REGIME (multi-day, Markov transitions) ---- */
function regimeCfg(){ return MARKET_REGIMES[(S.regime && S.regime.name) || "RANGE"]; }
function nextRegimeName(cur){
  const row = MARKET_TRANSITIONS[cur];
  if(!row) return weightedKey({ RANGE:.30, BULL:.28, ACCUMULATION:.12, RECOVERY:.10, BEAR:.14, DISTRIBUTION:.06 });
  return weightedKey(row);
}
/* real-time within one game-day (ms). Time is ACCUMULATED, never derived from
   an absolute Date.now() endpoint — so the whole simulation stays frozen while
   the user is away and resumes exactly where it stopped. */
function dayDurationMs(){ return Math.max(S.market.dayDurationMin || 45, 1) * 60000; }
function regimeDurationMs(){ return (S.regime ? S.regime.durDays : 8) * dayDurationMs(); }

function startRegime(forcedName){
  const cur = S.regime ? S.regime.name : null;
  const name = forcedName || nextRegimeName(cur);
  const cfg = MARKET_REGIMES[name];
  const durDays = rnd(cfg.durDays[0], cfg.durDays[1]);
  const dayR = S.day ? S.day.targetRange : 35;
  S.regime = {
    name, ageMs: 0, durDays,
    channelHalf: dayR * rnd(1.4, 3.8)             // multi-day range channel half-width
  };
  // breakout kick when leaving a range-ish regime for a directional one
  if(cur && /RANGE|ACCUMULATION|DISTRIBUTION/.test(cur) && !/RANGE|ACCUMULATION|DISTRIBUTION/.test(name)){
    S.price.vel += dayR * rnd(0.15, 0.55) * (cfg.drift >= 0 ? 1 : -1);
  }
  S._needRender = true;
}
function advanceRegime(){
  if(S.regime && (S.regime.ageMs || 0) >= regimeDurationMs()){
    const prev = S.regime.name;
    startRegime(null);
    toast("o", L("MARKET REGIME → {0}  (было {1})", MARKET_REGIMES[S.regime.name].label, MARKET_REGIMES[prev].label));
  }
}

/* ---- daily volatility band (target intraday Range) with volatility clustering ---- */
function pickDayVol(){
  const pr = S.market.dayVolProbs || dayVolProbDefaults();
  const bias = clamp((S.price.volCluster || 1) - 1, -0.45, 1.6);   // recent activity biases the band
  const adj = {
    LOW:     Math.max(0.02, (pr.LOW||0)    * (1 - bias*0.55)),
    NORMAL:  (pr.NORMAL||0),
    ACTIVE:  (pr.ACTIVE||0) * (1 + bias*0.45),
    EXTREME: (pr.EXTREME||0)* (1 + bias*1.30)
  };
  const band = weightedKey(adj);
  const [lo,hi] = DAYVOL_RANGE[band];
  let range = rnd(lo, hi);
  if(band === "EXTREME") range += expRand()*16;               // no hard upper cap
  return { band, targetRange: range };
}
function startNewDay(open){
  const { band, targetRange } = pickDayVol();
  S.daySeq = (S.daySeq || 0) + 1;
  S.day = {
    index: S.daySeq, elapsedMs: 0,
    band, targetRange,
    open, high: open, low: open, close: open,
    regimeAtOpen: S.regime ? S.regime.name : "RANGE"
  };
}
/* ---- the market clock follows REAL time ----
   A trading day opens at the real current moment. The market clock then runs
   faster than the wall clock (a whole day in dayDurationMin real minutes), so by
   the end of the day it is ahead of it; the next day re-anchors to "now" by moving
   the recorded history back in WHOLE days — candles, trades and events keep their
   spacing and time of day (every timeframe stays aligned), only the date shifts. */
const DAY_MS = 86400000;
function shiftSimTime(ms){
  if(!ms) return;
  const sec = ms / 1000;
  const day = s => s ? simDateStr(Date.parse(s + "T00:00:00Z") + ms) : s;
  S.simClock += ms;
  S.lastSimDay = day(S.lastSimDay);
  for(const tf in S.candles) for(const b of (S.candles[tf] || [])) b.t += sec;
  for(const p of (S.positions || [])){ p.openTime += ms; p.lastSwapDay = day(p.lastSwapDay); }
  for(const o of (S.pendings || [])) if(o.createTime) o.createTime += ms;
  for(const h of (S.history || [])){ if(h.openTime) h.openTime += ms; if(h.closeTime) h.closeTime += ms; }
  for(const e of (S.events || [])) if(e.time) e.time += ms;
  for(const t of _tickBuf) t.t += ms;
  _lastShockMin = Math.floor(S.simClock / 60000);
}
/* openNow = a new trading day starts: the clock lands exactly on real time.
   Otherwise (boot) only a whole-day offset is removed, so the running day keeps
   its time of day and an old or idle account simply comes to today's date. */
function anchorClockToReal(openNow){
  const now = Date.now(), off = now - S.simClock;          // + : the market clock is behind
  const days = off >= 0 ? Math.floor(off / DAY_MS)
             : -(openNow ? Math.ceil(-off / DAY_MS) : Math.floor(-off / DAY_MS));
  if(days) shiftSimTime(days * DAY_MS);
  if(openNow && S.simClock < now) S.simClock = now;
  return days;
}
function rolloverDay(){
  const D = S.day;
  D.close = S.price.mid;
  const stat = {
    index: D.index, open: D.open, high: D.high, low: D.low, close: D.close,
    range: D.high - D.low, change: D.close - D.open,
    changePct: (D.close - D.open) / (D.open || 1) * 100,
    band: D.band, regime: S.regime ? MARKET_REGIMES[S.regime.name].label : "-",
    endedAt: Date.now()
  };
  S.dayLog.unshift(stat);
  if(S.dayLog.length > 250) S.dayLog.pop();
  // synthetic inter-session gap: $0 .. $2.5 either way — NEVER a reset to a base price
  const gap = rnd(0, 2.5) * (Math.random() < 0.5 ? 1 : -1);
  const newOpen = Math.max(0.01, roundTo(D.close + gap, S.symbol.digits));
  S.price.mid = newOpen; S.price.prevMid = newOpen;
  anchorClockToReal(true);                           // the new day opens at the real current time
  S.lastSimDay = simDateStr(S.simClock - DAY_MS);    // …and counts as exactly one swap day
  startNewDay(newOpen);
  checkRollover();
  if(typeof xcPushState === "function") xcPushState(true);   // history moved: mirrors re-pull it
  S._needRender = true;
  toast("o", "DAY " + stat.index + " · O " + pxfmt(stat.open) + "  C " + pxfmt(stat.close) +
    "  Range $" + fmt(stat.range, 2) + " · " + signMoney(stat.change) + " · " + stat.regime);
}

/* ---- activity level -> tick frequency ---- */
function marketActivity(){
  return sessionInfo().vol * (S.price.volCluster || 1) * regimeCfg().vol
       * (S.day ? clamp(S.day.targetRange / 42, 0.6, 3.2) : 1);
}

function daySpeedNow(){ return 1440 / Math.max(S.market.dayDurationMin || 45, 1); }   // sim-minutes per real-minute
function normalTps(){ return clamp(S.market.ticksPerSecond || 2, 0.1, 20); }

/* accumulate ACTIVE wall-time (capped) into the day/regime clocks. A big delta —
   tab throttled, backgrounded, or reopened after minutes/hours/days — counts as a
   single frame, so nothing advances while the user is away. */
let _lastFrameReal = Date.now();
function newsFreezesTime(){
  return S.news.active && S.news.scenario && S.news.scenario.oneCandle;
}
function accumulateActiveTime(){
  const now = Date.now();
  let d = now - _lastFrameReal;
  _lastFrameReal = now;
  if(!(d > 0)) return;
  if(d > 400) d = RT_MS;                                   // gap -> one frame, never a leap
  if(S.manual.enabled && S.manual.frozen) return;          // God Mode PAUSE also stops the day clock
  if(newsFreezesTime()) return;                            // NFP: the world holds for the 20s impulse
  d *= simSpeed();                                         // accelerator (applied AFTER the gap cap)
  if(S.day)    S.day.elapsedMs   = (S.day.elapsedMs   || 0) + d;
  if(S.regime) S.regime.ageMs    = (S.regime.ageMs    || 0) + d;
}

/* ---- RT frame (60ms): day/regime lifecycle + the FAST driver for news & manual impulse.
        Ordinary market ticks come from normalTickTimer (see restartNormalTicks). ---- */
function engineFrame(){
  const nowR = Date.now();
  const newsOn = S.news.active;
  const impulseOn = !!S.manual.impulse;
  const closed = marketClosed();

  accumulateActiveTime();
  if(S.day && (S.day.elapsedMs || 0) >= dayDurationMs()) rolloverDay();
  advanceRegime();

  if(newsOn || impulseOn){
    // Manual Market Control keeps its five-ticks-per-M1 candles here too: ticks come
    // at the normal TPS and each one moves the clock by exactly 12 game-seconds.
    const manualCandles = S.manual.enabled;
    // NFP-style "one candle" release: sim-time HOLDS, only the news impulse drives price
    const oneShot = !manualCandles && newsOn && S.news.scenario && S.news.scenario.oneCandle;
    const hz = manualCandles ? normalTps()
             : newsOn ? rnd(S.newsEngine.tickHzNewsMin, S.newsEngine.tickHzNewsMax) : rnd(18, 34);
    _tickAcc += hz * RT_MS / 1000;
    let nTicks = clamp(Math.floor(_tickAcc), 0, 60);
    _tickAcc -= Math.floor(_tickAcc);
    if(!oneShot && !manualCandles) _simDebtMs += RT_MS * daySpeedNow() * simSpeed();
    if(nTicks > 0){
      const simPerTick = (oneShot || manualCandles) ? 0 : _simDebtMs / nTicks;
      _simDebtMs = 0;
      for(let i=0;i<nTicks;i++){
        if(manualCandles){
          manualClockStep();
          if(!S.manual.frozen) priceStep((MANUAL_TICK_MS/1000) * (closed ? 0.2 : 1));   // PAUSE: only the impulse moves
        }else if(!oneShot){
          S.simClock += simPerTick;
          priceStep((simPerTick/1000) * (closed ? 0.2 : 1));   // the day keeps moving under the news
        }
        if(impulseOn) applyManualImpulse();
        if(newsOn)    stepNews();
        applyPriceDerived();
        pushTick();
        updateCandles();
        processPendings();
        processPositionSLTP();
      }
    }
  }else{
    _tickAcc = 0; _simDebtMs = 0;      // no news catch-up spike when it resumes
  }

  finishFrame(nowR, newsOn);
}
function finishFrame(nowR, newsOn){
  if(S.news.active && nowR >= S.news.endReal) endNews();
  if(S.lock.active && nowR >= S.lock.until){ S.lock.active = false; S._needRender = true; }
  // the quote breathes between price ticks (quoteFlicker) — not while news / an impulse / manual
  // control / a closed market own the price and the spread
  if(!newsOn && !S.news.active && !S.manual.enabled && !S.manual.impulse && !(S.news.decayUntil && nowR < S.news.decayUntil)
     && !marketClosed() && Math.random() < RT_MS / 1000 * QUOTE_FLICKER_HZ) quoteFlicker();
  if(Math.random() < 0.02) checkEvents();
  recalcAccount();
  checkStopOut();
  save();
}

/* ---- ordinary-market tick generator — its own timer at exactly 1000 / ticksPerSecond ms ---- */
let normalTickTimer = null;
function restartNormalTicks(){
  if(normalTickTimer){ clearInterval(normalTickTimer); normalTickTimer = null; }
  if(!_loopRunning || XC.follower) return;         // don't run ticks while paused / hidden / mirroring
  const ms = Math.max(50, Math.round(1000 / normalTps()));
  normalTickTimer = setInterval(normalTickFire, ms);
}
function normalTickFire(){
  try{
    if(S.news.active || S.manual.impulse) return;                 // news / impulse drive price via engineFrame
    if(S.manual.enabled && S.manual.frozen) return;               // God Mode PAUSE
    if(marketClosed()){ recalcAccount(); return; }
    if(S.manual.enabled){
      // Manual Market Control: one tick = exactly 12 game-seconds -> five ticks per M1 candle
      manualClockStep();
      priceStep(MANUAL_TICK_MS / 1000);
      applyPriceDerived();
      pushTick();
      updateCandles();
    }else{
      const tps = normalTps();
      const gameMs = (1000 / tps) * daySpeedNow() * simSpeed();     // game-time advanced per real tick (× accelerator)
      // keep each price sub-step small (~<=14 game-sec) so candles stay smooth at any TPS / accelerator
      let sub = clamp(Math.round(gameMs / 14000), 1, 40);
      if(sub < 2 && marketActivity() > 2.6 && Math.random() < 0.18) sub = 2;   // occasional micro-burst
      const stepMs = gameMs / sub;
      for(let i=0;i<sub;i++){
        S.simClock += stepMs;
        priceStep(stepMs / 1000);
        applyPriceDerived();
        pushTick();
        updateCandles();
      }
    }
    processPendings();
    processPositionSLTP();
    recalcAccount();
    checkStopOut();
    save();
  }catch(e){ console.error(e); }
}

/* compat wrapper used by tests — advances the market ~a few game-minutes */
function marketTick(){
  for(let i=0;i<40;i++){ priceStep(4); applyPriceDerived(); pushTick(); }
  S.simClock += 160000;
  updateCandles(); processPendings(); processPositionSLTP();
  recalcAccount(); checkStopOut(); save();
}

/* ---- the price step (dt in GAME seconds).  No anchor. ----
   A day's realised High-Low lands around its volatility band, scaled with the price
   level (pxVolScale). The move of one step is built from:
     diffusion with fat tails ................. ordinary order flow
     a slow swing drift (Ornstein-Uhlenbeck) ... intraday legs: impulse, pullback
     regime drift + pull to the EMA ............ multi-day structure
     bursts that give part of the move back .... liquidity sweeps / stop runs
     hesitation at round $5 levels ............. resting liquidity
     a wiggle that is taken back next tick ..... bid/ask bounce (negative lag-1)
   The old AR(1) velocity made every tick continue the last one (lag-1 +0.49) and
   blew day ranges up to ~4x their band; real tick data does the opposite.      */
const VOL_NORM = 0.9;            // calibration: realised day range ~ band x price scale
const SWING_SHARE = 0.78;        // share of the diffusion variance carried by swing legs. Gold's day is made of
                                 // LEGS, not of violent prints: most of the variance now rides the slow swing, so
                                 // the range of a day is unchanged while a single tick is a fraction of what it was
                                 // (user 2026-09-21: «настоящее золото никогда не может такой тик … дать»)
const RANGE_VOL_FLOOR = 0.9;     // a consolidation is quieter, not dead (ACCUMULATION was 0.74)
function fatTail(){ return (Math.random() < 0.12 ? gauss() * 2.2 : gauss()) / 1.2086; }   // unit variance
function priceStep(dt){
  const P = S.price, M = S.market, RG = regimeCfg();
  dt = Math.max(dt, 0.002);

  const ps = pxVolScale(P.mid);
  const dayRange = (S.day ? S.day.targetRange : 35) * ps;
  const dayStdev = dayRange / 3.2;                 // close-to-close stdev ~ Range / 3.2
  const sf = sessionInfo().vol;

  // volatility clustering with LONG memory — high-vol periods persist for days (modest ±)
  const persist = clamp(M.volClusterPersist || 0.992, 0.90, 0.9995);
  P.volCluster = clamp(persist*(P.volCluster || 1) + (1-persist)*(0.72 + Math.abs(gauss())*0.7), 0.5, 2.4);

  const regVol = RG.rangePull > 0 ? Math.max(RG.vol, RANGE_VOL_FLOOR) : RG.vol;
  const volMul = regVol * sf * P.volCluster * (M.intradayNoise || 1) / VOL_NORM;
  const perSec = dayStdev / Math.sqrt(86400) * volMul;            // $ per sqrt(game-second)
  const sigma = perSec * Math.sqrt(dt * (1 - SWING_SHARE));
  let move = fatTail() * sigma;

  // swing legs — regimes with more momentum hold a leg longer (~50-95 game-min)
  const tau = 2400 + 4800 * clamp(RG.mom, 0, 0.9);
  const keep = Math.exp(-dt / tau);
  P.swing = (P.swing || 0) * keep + Math.sqrt(1 - keep*keep) * perSec * Math.sqrt(SWING_SHARE / (2*tau)) * gauss();
  move += P.swing * dt;

  // short-lived impulse left by a breakout, news follow-through or a manual impulse
  P.vel = (P.vel || 0) * 0.55;
  move += P.vel;

  // regime directional drift ($ per game-day). Scale with daily stdev but CAP it so an
  // extreme-vol day does not create runaway trend drift.
  const driftPerDay = RG.drift * clamp(dayStdev, 4, 13 * ps) * (M.regimeDriftScale || 1)
                    + MACRO_DRIFT * ps * (M.macroBull || 1);
  move += driftPerDay * (dt / 86400);

  // a burst in progress: a few fast ticks one way, then part of it is given back
  const B = P.burst;
  if(B){
    if(B.push > 0){
      const part = B.step * rnd(0.55, 1.45);
      move += part; B.moved += part;
      if(--B.push === 0) B.back = -B.moved * B.retrace / Math.max(B.pull, 1);
    }else if(B.pull > 0){
      move += B.back * rnd(0.4, 1.6); B.pull--;
    }
    if(B.push <= 0 && B.pull <= 0) P.burst = null;
  }

  // resting liquidity at round $5 levels: an approach is often absorbed for a moment
  const lvl = Math.round(P.mid / 5) * 5, toLvl = lvl - P.mid;
  if(toLvl !== 0 && Math.abs(toLvl) < 0.6 * ps && Math.sign(move) === Math.sign(toLvl) && Math.random() < 0.3) move *= 0.35;

  // bid/ask bounce: a wiggle that is taken back on the next tick
  const jit = gauss() * sigma * 0.45;
  move += jit - (P.jit || 0);
  P.jit = jit;

  // ONE TICK IS ONE TICK. Real gold does not print three dollars in twelve seconds while the market is quiet
  // (user 2026-09-21): whatever wants to move the price now is measured against THIS tick's own standard
  // deviation, and what will not fit is carried into the next ticks instead of being teleported in one. A sweep,
  // a breakout or a release therefore prints as a run of ordinary ticks — faster, but still ticks. News and a
  // manual impulse own the price and are allowed their gap.
  const calmTick = !S.news.active && !S.manual.impulse;
  const tickSd = dayStdev * Math.sqrt(dt / 86400);                 // what ONE tick of this day is worth
  const cap = Math.max(tickSd * (calmTick ? 3.6 : 13), 0.015 * ps);
  const want = move + (P.carry || 0), over = Math.abs(want) - cap;
  if(over > 0){                                                    // a knee, not a wall: past it a tick still grows, slower and slower
    move = Math.sign(want) * cap * (1 + 0.45 * (1 - Math.exp(-over / cap)));
    P.carry = (want - move) * 0.82;
  }else{ move = want; P.carry = 0; }

  P.mid += move;

  // CONSOLIDATION — range-like regimes: inside a zone around the slow equilibrium the price
  // moves freely; only past the zone's edge (support / resistance) is it leaned back, and
  // the wide channel wall stops a range from wandering off. The old constant pull toward
  // a 1.5 h EMA made a range day net almost nothing (M30 variance ratio ~0.5): dead.
  if(RG.rangePull > 0){
    const dev = P.mid - P.ema;
    const zone = dayRange * 0.6;
    const edge = Math.abs(dev) > zone ? 1 - Math.exp(-RG.rangePull * 2 * (Math.abs(dev)/zone - 1) * dt / 90) : 0;
    const half = ((S.regime && S.regime.channelHalf) || dayRange * 2 / ps) * ps;
    const wall = Math.abs(dev) > half ? clamp((Math.abs(dev)/half - 1) * 0.6, 0, 0.4) : 0;
    P.mid += (P.ema - P.mid) * (edge + wall);
    // real breakout out of a consolidation (≈ one every couple of game-days)
    if(Math.random() < 0.00002 * dt){
      const dir = dev >= 0 ? 1 : -1;
      startRegime(dir > 0 ? (Math.random()<0.5?"BULL":"STRONG_BULL") : (Math.random()<0.5?"BEAR":"STRONG_BEAR"));
      P.vel += dir * dayStdev * rnd(0.3, 0.8);
    }
  }

  // the EMAs FOLLOW the price — this is what keeps the flat centre non-static
  P.ema     += (P.mid - P.ema)     * (1 - Math.exp(-dt / 21600));  // ~6 game-hours: the consolidation's centre
  P.emaFast += (P.mid - P.emaFast) * (1 - Math.exp(-dt / 900));    // ~15 game-min

  microShock(dt);

  if(P.mid < 0.01) P.mid = 0.01;
  trackDayExtremes();
  P.lastVol = Math.max(1, Math.round(Math.abs(move)/Math.max(sigma,1e-9) * rnd(2,8) + rnd(1,5)));
}
function normalMicroStep(dt){ priceStep(dt); }   // back-compat alias

/* ordinary market burst ($2-5 common, $5-10, rarely $10-20 at $2 600, scaled with
   price) — a sweep over a few ticks that gives part of the move back, instead of
   one tick teleporting the price. Never $50+. */
let _lastShockMin = -1;
function microShock(dt){
  if(S.news.active || S.manual.impulse || S.price.burst) return;
  const simMin = Math.floor(S.simClock/60000);
  if(simMin === _lastShockMin) return;
  _lastShockMin = simMin;
  if(Math.random() > 0.008) return;                // ~ a dozen per game-day
  const r = Math.random();
  const mag = (r < 0.70 ? rnd(2,5) : r < 0.93 ? rnd(5,10) : rnd(10,20)) * pxVolScale(S.price.mid) * 0.75;
  const dir = Math.random() < 0.5 ? 1 : -1;
  const n = Math.max(4, Math.round(rnd(3, 6) + mag / 2.2));        // the bigger the sweep the more ticks it prints on
  S.price.burst = { push: n, step: dir * mag / n, moved: 0, retrace: rnd(0.2, 0.6), pull: Math.round(rnd(5, 14)), back: 0 };
  S.price.volCluster = Math.min(5, (S.price.volCluster || 1) + 0.7);
  S.price.lastVol = Math.round(mag*9);
}
function trackDayExtremes(){
  const D = S.day; if(!D) return;
  if(S.price.mid > D.high) D.high = S.price.mid;
  if(S.price.mid < D.low)  D.low  = S.price.mid;
}

/* ---- MANUAL MARKET CONTROL (God Mode) ----
   While it is on:
     * every tick moves the market clock by exactly 12 game-seconds, so an M1 candle
       is built from exactly five ticks (:00 :12 :24 :36 :48) — auto ticks, manual
       taps and impulse ticks alike. The first manual tick opens a fresh minute.
     * the spread (autoSpread, 0.16-0.24) is not widened even by a news release. */
const MANUAL_TICK_MS = 12000;
function manualClockStep(){
  const c = S.simClock;
  S.simClock = (c % MANUAL_TICK_MS === 0) ? c + MANUAL_TICK_MS : (Math.floor(c / 60000) + 1) * 60000;
}
/* ---- spread: generated tick by tick in 0.16-0.24, in every mode — not a setting ----
   It sits at 16-17 for one to three ticks, pops to 18-24 for a tick or two, then
   settles back. Only a news release widens it (and the short decay after one). */
const SPREAD_MIN = 0.16, SPREAD_MAX = 0.24;
const _spr = { pts: 16, hold: 0 };
function autoSpread(){
  const Q = _spr;
  if(Q.hold > 0){ Q.hold--; return Q.pts / 100; }
  if(Math.random() < (Q.pts <= 17 ? 0.40 : 0.70)){
    Q.pts = Math.random() < 0.6 ? 16 : 17;
    Q.hold = weightedIdx([0.30, 0.45, 0.25]);                             // 1-3 ticks
  }else{
    Q.pts = 18 + weightedIdx([0.30, 0.20, 0.17, 0.14, 0.10, 0.06, 0.03]);  // 18…24
    Q.hold = Math.random() < 0.8 ? 0 : 1;                                 // 1-2 ticks
  }
  return Q.pts / 100;
}
function manualSyncAll(){
  if(S.manual.enabled) manualClockStep();          // a manual tick is one of the candle's five
  applyPriceDerived(); pushTick(); updateCandles(); trackDayExtremes();
  processPendings(); processPositionSLTP(); recalcAccount(); checkStopOut();
  save();
}
function manualSetPrice(v){
  if(!isFinite(v) || v <= 0.01){ toast("r", L("Некорректная цена")); return; }
  S.price.mid = v; S.price.prevMid = v; S.price.vel = 0;
  S.price.ema = v; S.price.emaFast = v;
  manualSyncAll(); toast("", L("Цена установлена: {0}", pxfmt(v)));
}
function manualNudge(d){
  S.price.mid = Math.max(0.01, S.price.mid + d);
  S.price.vel += d * 0.2;
  S.price.lastVol = Math.max(2, Math.round(Math.abs(d) * 14 + rnd(2, 8)));
  manualSyncAll();
}
function manualTick(dir){
  const st = Math.max(0.01, Math.abs(S.manual.stepSize || 0.2));
  manualNudge((dir >= 0 ? 1 : -1) * st);
}
function manualMove(dir){
  const mv = Math.max(0.01, Math.abs(S.manual.moveSize || 1));
  manualNudge((dir >= 0 ? 1 : -1) * mv);
  toast("", (dir >= 0 ? "▲ +$" : "▼ -$") + fmt(mv, 2) + "  →  " + pxfmt(S.price.mid));
}
function manualPause(on){
  if(!S.manual.enabled) return;
  S.manual.frozen = !!on;
  if(on) S.manual.impulse = null;                 // a running impulse would fight a pause
  toast("o", on ? L("⏸ Авто Price Engine остановлен") : L("▶ Авто Price Engine возобновлён"));
  S._needRender = true;
}
function startManualImpulse(dir, usd, sec){
  if(S.news.active){ toast("o", L("Идёт новость — дождитесь окончания")); return; }
  if(!isFinite(usd) || usd <= 0 || !isFinite(sec) || sec <= 0){ toast("r", L("Проверьте параметры импульса")); return; }
  const now = Date.now();
  S.manual.impulse = { startReal: now, endReal: now + sec*1000, dir: dir >= 0 ? 1 : -1, usd, sec, delta: 0 };
  S._needRender = true;
  toast("o", L("Импульс {0}", (dir >= 0 ? "UP" : "DOWN") + " $" + fmt(usd,2) + " / " + sec + "s"));
}
function applyManualImpulse(){
  const im = S.manual.impulse, P = S.price;
  if(!im) return;                                   // impulse finished earlier in this frame
  const p = clamp((Date.now() - im.startReal) / Math.max(im.endReal - im.startReal, 1), 0, 1);
  const ease = p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2;    // easeInOutQuad
  const newDelta = im.dir * im.usd * ease + gauss() * im.usd * 0.014;
  const applied = newDelta - im.delta;
  im.delta = newDelta;
  P.mid = Math.max(0.01, P.mid + applied);
  P.vel = 0.4*P.vel + applied*0.5;
  P.lastVol = Math.max(3, Math.round(Math.abs(applied)*28 + rnd(6,22)));
  trackDayExtremes();
  if(p >= 1){
    S.manual.impulse = null;
    S._needRender = true;
    toast("g", L("Импульс завершён ({0})", (im.dir>0?"+":"-") + "$" + fmt(im.usd,2)));
  }
}

/* ---- news micro-step: news impulse added ON TOP of the market; persists after ---- */
function stepNews(){
  const N = S.news, sc = N.scenario, P = S.price;
  if(!N.active || !sc) return;
  const p = clamp((Date.now() - N.startReal) / (sc.duration*1000), 0, 1);
  N.progress = p;
  const targetDelta = pathOffsetAt(sc, p);
  const nsig = sc.noiseBase * volCurveAt(sc, p);
  N._vel = 0.45*(N._vel || 0) + gauss()*nsig;
  let nd = N.delta + (targetDelta - N.delta) * clamp(sc.pullStrength, 0.02, 0.6) + N._vel;
  if(Math.random() < 0.06) nd += gauss()*nsig*2.6;
  const applied = nd - N.delta;
  N.delta = nd;
  P.mid = Math.max(0.01, P.mid + applied);
  N.high = Math.max(N.high, P.mid);
  N.low  = Math.min(N.low,  P.mid);
  N.ticks++;
  trackDayExtremes();
  P.lastVol = Math.max(3, Math.round(Math.abs(applied)/Math.max(nsig,1e-9) * rnd(20,60) + rnd(10,40)));
}
function newsMicroStep(){ stepNews(); }   // back-compat alias

/* ---- derive bid/ask/spread from mid ---- */
function applyPriceDerived(){
  const P = S.price, d = S.symbol.digits;
  const mv = Math.abs(P.mid - (P.prevMid||P.mid));
  let spread = autoSpread();                                     // 0.16-0.24, generated tick by tick
  if(!S.manual.enabled){                                         // manual mode: never widened
    if(S.news.active){
      const cfg = S.newsEngine.perEvent[S.news.type];
      const p = S.news.progress || 0;
      const shape = clamp(Math.exp(-2.4*p) + 0.55*Math.exp(-26*Math.pow(p-0.5,2)) + 0.35, 0.1, 1.3);
      spread = spread * (1 + (cfg.spreadMul - 1) * shape) + mv * 3.2;   // news impulse spikes
    }else if(S.news.decayUntil && Date.now() < S.news.decayUntil){
      const k = (S.news.decayUntil - Date.now()) / 4000;
      spread *= (1 + 3.0*k);                                     // gradual return after the news
    }
  }
  P.prevMid = P.mid;
  P.mid = roundTo(P.mid, d);
  P.spread = roundTo(spread, d);
  P.bid = roundTo(P.mid - P.spread/2, d);
  P.ask = roundTo(P.bid + P.spread, d);                        // Ask − Bid is exactly the quoted spread
  P.volume += P.lastVol || 1;
}

/* Between price ticks cTrader's quote still breathes: the spread changes on its own, so the Bid and
   the Ask step AGAINST each other — which is why its ПРОДАТЬ and КУПИТЬ are not always one colour
   (a cTrader video). Our ticks move the price ~0.77 $ at 2 a second and the spread only moved with
   them (±0.04), so the two sides always went the same way. Two or three times a second, between ticks, only
   the spread is redrawn around the unchanged mid: candles, the chart's lines and P&L all read the same
   S.price the trade buttons show; pending orders and SL / TP see the new quote. */
let _uiRaf = 0, _uiReq = 0, _uiLast = 0, _uiOn = false;
function uiKick(){
  if(_uiRaf || !_uiOn) return;
  _uiReq = performance.now();
  _uiRaf = requestAnimationFrame(uiFrame);
}
const QUOTE_FLICKER_HZ = 2.6;                                     // sides differ ~⅕ of the time, like the cTrader video
function quoteFlicker(){
  const P = S.price, d = S.symbol.digits, s = roundTo(autoSpread(), d);
  if(s === P.spread) return;
  P.spread = s;
  P.bid = roundTo(P.mid - s/2, d);
  P.ask = roundTo(P.bid + s, d);                                // Ask − Bid is exactly the quoted spread
  processPendings(); processPositionSLTP();
  uiKick();
}
function pushTick(){
  uiKick();                                                     // the screen shows the tick on the display's next frame
  _tickBuf.push({ t:S.simClock, bid:S.price.bid, ask:S.price.ask, mid:S.price.mid,
                  spread:S.price.spread, volume:S.price.lastVol||0, vol:+currentVolFactor().toFixed(2) });
  if(_tickBuf.length > 400) _tickBuf.splice(0, _tickBuf.length - 400);
}

/* =========================================================================
   MACRO NEWS ENGINE — scenario generator
   ========================================================================= */
function expRand(){ return -Math.log(1 - Math.random()); }
function weightedIdx(weights){
  const total = weights.reduce((s,w)=>s+w,0) || 1;
  let r = Math.random()*total, acc = 0;
  for(let i=0;i<weights.length;i++){ acc += weights[i]; if(r <= acc) return i; }
  return weights.length - 1;
}
function weightedMove(cfg){
  const dist = cfg.dist;
  const dMin = dist[0][0], dMax = dist[dist.length-1][1];
  const remap = x => cfg.minMove + (x - dMin)/(dMax - dMin || 1) * (cfg.maxMove - cfg.minMove);
  let r = Math.random(), acc = 0, pick = dist[dist.length-1], isTop = true;
  for(let i=0;i<dist.length;i++){ acc += dist[i][2]; if(r <= acc){ pick = dist[i]; isTop = (i === dist.length-1); break; } }
  let v = remap(rnd(pick[0], pick[1]));
  if(isTop && cfg.allowExtreme && Math.random() < 0.4){
    v += expRand() * (cfg.maxMove - cfg.minMove) * 0.38;         // heavy tail — no hard cap
  }
  if(!cfg.allowExtreme) v = Math.min(v, cfg.maxMove);
  return Math.max(v, cfg.minMove * 0.5);
}
function describePattern(sc){
  const d = sc.mainDir > 0 ? "UP" : "DOWN", o = sc.mainDir > 0 ? "DOWN" : "UP";
  if(sc.fakeout && sc.reversal) return "FAKEOUT "+o+" → "+d+" → "+o;
  if(sc.fakeout)  return "FAKEOUT "+o+" → "+d;
  if(sc.reversal) return "BREAKOUT "+d+" → REVERSAL "+o;
  if(sc.twoWay)   return d+" → "+o+" (two-way)";
  return d;
}
/* ---- NFP — ONE strong 20s impulse, mostly one-directional, random strength tier.
        Renders as a SINGLE news candle (sim-time holds for the 20 real seconds).
        Direction is a coin-flip BUY-side / SELL-side; the move does NOT snap back. ---- */
const NFP_TIERS = [
  { name:"слабый",           lo:6,   hi:14,  w:0.30 },
  { name:"средний",          lo:15,  hi:30,  w:0.34 },
  { name:"сильный",          lo:32,  hi:52,  w:0.22 },
  { name:"очень сильный",    lo:56,  hi:88,  w:0.11 },
  { name:"экстремальный",    lo:100, hi:185, w:0.03 }
];
function generateNFPScenario(){
  const cfg = S.newsEngine.perEvent.NFP;
  const dur = clamp(cfg.duration || 20, 3, 120);
  const tier = NFP_TIERS[weightedIdx(NFP_TIERS.map(t=>t.w))];
  let move = rnd(tier.lo, tier.hi);
  move = Math.max(move, (cfg.minMove || 5) * 0.6);
  if(!cfg.allowExtreme) move = Math.min(move, cfg.maxMove || 110);
  const upBias = cfg.upProb / ((cfg.upProb + cfg.downProb) || 1);
  const dir = Math.random() < upBias ? 1 : -1;                 // BUY-side (+) / SELL-side (-)
  const twoWay = Math.random() < 0.05;                          // ~5% sharp reversal / two-way
  const m = dir * move;
  let cp;
  if(!twoWay){
    // ~95%: one clean directional impulse (minor wobble only), then it holds
    cp = [[0,0],
          [0.14, m*rnd(0.30,0.48)],
          [0.42, m*rnd(0.78,0.97)],
          [0.72, m*rnd(0.94,1.08)],
          [1.00, m*rnd(0.90,1.10)]];
  }else{
    // ~5%: violent spike one way, then reverses hard THROUGH the start to the other side
    const spike  = -dir * move * rnd(0.45, 0.80);
    const settle =  dir * move * rnd(0.85, 1.20);
    cp = [[0,0],
          [0.16, spike],
          [0.30, spike*0.55],
          [0.55, settle*0.35],
          [0.80, settle*0.92],
          [1.00, settle]];
  }
  const R = Math.abs(move) * (twoWay ? 1.75 : 1.12);
  const sc = {
    type:"NFP", duration: dur, oneCandle:true, tier: tier.name,
    R, cp, mainDir: dir, twoWay, fakeout:false, reversal:twoWay, impulses:1,
    noiseBase: clamp(move / dur / 42, 0.02, 1.1),
    pullStrength: 0.16,
    volA: 2.6 + move/40, volB: 1.0 + move/120
  };
  sc.pattern = twoWay
    ? (dir>0 ? "SPIKE вниз → разворот в BUY-side" : "SPIKE вверх → разворот в SELL-side")
    : (dir>0 ? "BUY-side · однонаправленный ("+tier.name+")" : "SELL-side · однонаправленный ("+tier.name+")");
  return sc;
}
function generateScenario(type){
  if(type === "NFP") return generateNFPScenario();
  const cfg = S.newsEngine.perEvent[type];
  const R = weightedMove(cfg);                        // planned total range ($)
  const upBias = cfg.upProb / (cfg.upProb + cfg.downProb || 1);
  const mainDir = Math.random() < upBias ? 1 : -1;
  const twoWay   = Math.random() < cfg.twoWayProb;
  const fakeout  = Math.random() < cfg.fakeoutProb;
  const reversal = Math.random() < cfg.reversalProb;

  // Split the total travel R between the main direction and the counter direction.
  // Always keep a real counter-move so Total Range != |final - start|.
  let mainShare;
  if(twoWay)        mainShare = rnd(0.50, 0.68);
  else if(reversal) mainShare = rnd(0.55, 0.72);
  else              mainShare = rnd(0.70, 0.86);
  const mainBudget = R * mainShare, counterBudget = R * (1 - mainShare);
  const hiOff = mainDir > 0 ?  mainBudget : counterBudget;
  const loOff = mainDir > 0 ? -counterBudget : -mainBudget;
  const mainExt = mainDir > 0 ? hiOff : loOff;
  const oppExt  = mainDir > 0 ? loOff : hiOff;

  // phase control points (progress, offset-from-start $) — 5 phases per spec
  const spikeDir = fakeout ? -mainDir : mainDir;
  const o1 = spikeDir * (fakeout ? Math.abs(oppExt) : Math.abs(mainExt)) * rnd(0.35, 0.80); // 0-2s initial spike
  const o2 = mainExt * rnd(0.90, 1.05);                                                     // 2-8s main impulse
  let   o3 = (twoWay || reversal) ? oppExt * rnd(0.80, 1.05)                                 // 8-14s continuation / reversal
                                  : mainExt * rnd(0.85, 1.00);
  let   o4 = (reversal ? oppExt : mainExt) * rnd(0.45, 0.90);                                // 14-18s secondary impulse
  let   o5 = reversal ? oppExt * rnd(0.25, 0.80)                                             // 18-20s final movement
          : twoWay    ? mainExt * rnd(0.15, 0.55) * (Math.random()<0.5 ? 1 : -0.4)
          :             mainExt * rnd(0.40, 0.85);
  const lim = 1.2;
  const cp = [[0,0],[0.10,o1],[0.40,o2],[0.70,o3],[0.90,o4],[1.0,o5]]
             .map(c => [c[0], clamp(c[1], loOff*lim, hiOff*lim)]);

  const impulses = 2 + Math.floor(Math.random()*5);
  const sc = {
    type, duration: cfg.duration, R, cp, mainDir, twoWay, fakeout, reversal, impulses,
    oneCandle: type !== "FOMC",                        // one news candle for all of them; only FOMC runs over several
    hiOff, loOff,
    noiseBase: clamp(R / cfg.duration / 26, 0.03, 3.0),
    pullStrength: 0.18,
    volA: 2.0 + R/55, volB: 0.9 + R/110
  };
  sc.pattern = describePattern(sc);
  return sc;
}
function pathOffsetAt(sc, p){
  const cp = sc.cp;
  for(let i=1;i<cp.length;i++){
    if(p <= cp[i][0]){
      const [pa,oa] = cp[i-1], [pb,ob] = cp[i];
      let t = (p - pa) / (pb - pa || 1);
      t = t*t*(3 - 2*t);                                   // smoothstep
      return oa + (ob - oa) * t;
    }
  }
  return cp[cp.length-1][1];
}
function volCurveAt(sc, p){
  if(!sc) return 1;
  p = clamp(p||0, 0, 1);
  return 1 + sc.volA*Math.exp(-3.6*p) + sc.volB*Math.exp(-42*Math.pow(p-0.72,2));
}

/* ---- trading lock ---- */
function tradingLocked(){ return S.lock.active && Date.now() < S.lock.until; }
function lockSecondsLeft(){ return Math.max(0, (S.lock.until - Date.now())/1000); }
function guardLock(){
  if(tradingLocked()){
    return true;                                  // silent: the buttons already show a cross
  }
  return false;
}

/* ---- launch / finish a news event ---- */
function startNews(type, ev){
  if(!NEWS_TYPES.includes(type)) return;
  if(S.news.active){ toast("o", L("Новость уже идёт — дождитесь завершения")); return; }
  const cfg = S.newsEngine.perEvent[type];
  const sc = generateScenario(type);
  const now = Date.now();
  S.news = {
    active:true, type, scenario:sc,
    startReal: now, endReal: now + sc.duration*1000,
    startPrice: S.price.mid, high: S.price.mid, low: S.price.mid,
    progress:0, ticks:0, decayUntil:0, result:null, delta:0, _vel:0
  };
  S.lock = { active:true, until: now + sc.duration*1000 };
  S._needRender = true;
  if(ev) ev.released = true;
  closeModal();
  save();
}
function endNews(){
  const N = S.news, sc = N.scenario;
  N.active = false;
  S.lock = { active:false, until:0 };          // trading unlocks exactly when the event ends
  N.decayUntil = Date.now() + 4500;
  // seal a "one candle" release: nudge sim-time past the current M1 so the next
  // tick opens a FRESH candle instead of extending the (now huge) news candle.
  if(sc && sc.oneCandle && !S.manual.enabled) S.simClock += (TF.M1 + 1) * 1000;   // manual mode ticks 5 per M1 anyway
  // the news move is already baked into price.mid tick by tick — it simply persists,
  // and the EMA equilibrium re-forms around the new level.
  const start = N.startPrice, final = S.price.mid;
  const res = {
    type: N.type, label: NEWS_LABEL[N.type],
    start, final, high: N.high, low: N.low,
    totalRange: N.high - N.low,
    upExc: N.high - start, downExc: N.low - start,
    finalMove: final - start,
    duration: sc.duration, ticks: N.ticks,
    pattern: sc.pattern, plannedR: sc.R, tier: sc.tier || null, oneCandle: !!sc.oneCandle,
    fakeout: sc.fakeout, reversal: sc.reversal, twoWay: sc.twoWay, impulses: sc.impulses,
    endedAt: Date.now()
  };
  N.result = res;
  N.delta = 0; N._vel = 0;
  S.newsLog.unshift(res);
  if(S.newsLog.length > 40) S.newsLog.pop();
  S.price.vel += (res.finalMove) * 0.04;        // a little follow-through momentum
  // strong macro data can instantly break the current regime (spec 6.3)
  if(Math.abs(res.finalMove) > sc.R*0.35 && Math.random() < (S.newsEngine.newsBreaksRegimeProb || 0.4)){
    const up = res.finalMove >= 0;
    startRegime(up ? (Math.random()<0.5?"STRONG_BULL":"BULL") : (Math.random()<0.5?"STRONG_BEAR":"BEAR"));
  }
  S._needRender = true;
  // no popup: the result stays in S.newsLog («Последнее» in Settings opens the sheet)
  save();
}

/* offline Monte-Carlo of a scenario (no timers) — used by the self-test */
function simulateNewsOffline(type){
  const sc = generateScenario(type);
  const steps = sc.duration * 30;
  let mid = 4457.13, start = mid, hi = mid, lo = mid, vel = 0;
  for(let i=0;i<steps;i++){
    const p = i/steps;
    const target = start + pathOffsetAt(sc, p);
    const nsig = sc.noiseBase * volCurveAt(sc, p);
    vel = 0.45*vel + gauss()*nsig;
    mid += (target - mid)*sc.pullStrength + vel;
    if(Math.random() < 0.06) mid += gauss()*nsig*2.6;
    hi = Math.max(hi, mid); lo = Math.min(lo, mid);
  }
  return { type, start, final: mid, high: hi, low: lo,
    totalRange: hi - lo, upExc: hi - start, downExc: lo - start, finalMove: mid - start,
    pattern: sc.pattern, plannedR: sc.R, mainDir: sc.mainDir,
    fakeout: sc.fakeout, reversal: sc.reversal, twoWay: sc.twoWay };
}

/* =========================================================================
   DAY / REGIME ENGINE — offline simulation + statistics (self-test)
   Runs the real price math (no timers) over many game-days with regime switching.
   ========================================================================= */
function simDaysOffline(nDays){
  nDays = nDays || 100;
  // Runs the LIVE engine (priceStep, regimes, day bands) at the real tick size on
  // the current state, then puts the state back exactly as it was — so the debug
  // statistics can never drift away from what the market actually does.
  const snap = JSON.stringify(S), shockMin = _lastShockMin;
  try{
    const realTick = 1000 / normalTps();
    const gameMs = realTick * daySpeedNow();
    const ticksPerDay = Math.max(1, Math.round(dayDurationMs() / realTick));
    const START = S.price.mid;
    let minP = START, maxP = START, peak = START, maxDD = 0;
    const days = [], regimeCounts = {};
    for(let d=0; d<nDays; d++){
      const regName = S.regime.name, band = S.day.band, dOpen = S.price.mid;
      regimeCounts[regName] = (regimeCounts[regName] || 0) + 1;
      let hi = dOpen, lo = dOpen;
      for(let s=0; s<ticksPerDay; s++){
        S.simClock += gameMs;
        priceStep(gameMs / 1000);
        const price = S.price.mid;
        if(price > hi) hi = price;
        if(price < lo) lo = price;
        if(price > peak) peak = price;
        maxDD = Math.max(maxDD, (peak - price) / peak);
        S.day.elapsedMs += realTick; S.regime.ageMs += realTick;
      }
      minP = Math.min(minP, lo); maxP = Math.max(maxP, hi);
      days.push({ range: hi-lo, band, regime: regName, open: dOpen, close: S.price.mid, change: S.price.mid-dOpen });
      S.price.mid = Math.max(0.01, S.price.mid + rnd(0,2.5)*(Math.random()<0.5?1:-1));   // inter-session gap
      if(S.regime.ageMs >= regimeDurationMs()) startRegime(null);
      startNewDay(S.price.mid);
    }
    return { days, priceStart: START, priceEnd: S.price.mid, minPrice: minP, maxPrice: maxP,
             maxDrawdownPct: maxDD*100, regimeCounts };
  }finally{
    S = JSON.parse(snap);
    _lastShockMin = shockMin;
  }
}
function runDayTests(n){
  n = n || 100;
  const sim = simDaysOffline(n);
  const R = sim.days.map(d => d.range).sort((a,b)=>a-b);
  const mean = R.reduce((a,b)=>a+b,0)/n;
  const sd = Math.sqrt(R.reduce((a,b)=>a+(b-mean)*(b-mean),0)/n);
  const q = p => R[clamp(Math.floor(p*(n-1)),0,n-1)];
  const band = (lo,hi) => +(R.filter(x=>x>=lo && x<hi).length/n*100).toFixed(0);
  const byBand = {};
  for(const d of sim.days){ (byBand[d.band] = byBand[d.band] || []).push(d.range); }
  const bandMeans = {};
  for(const k in byBand) bandMeans[k] = { n: byBand[k].length, meanRange: +(byBand[k].reduce((a,b)=>a+b,0)/byBand[k].length).toFixed(1) };
  return {
    n, meanRange:+mean.toFixed(1), medianRange:+q(.5).toFixed(1),
    minRange:+R[0].toFixed(1), maxRange:+R[n-1].toFixed(1), stdev:+sd.toFixed(1),
    bands: { "<15":band(0,15), "15-25":band(15,25), "25-45":band(25,45),
             "45-75":band(45,75), "75-150":band(75,150), "150+":+(R.filter(x=>x>=150).length/n*100).toFixed(0) },
    bandMeans, regimeCounts: sim.regimeCounts,
    priceStart:+sim.priceStart.toFixed(0), priceEnd:+sim.priceEnd.toFixed(0),
    priceMin:+sim.minPrice.toFixed(0), priceMax:+sim.maxPrice.toFixed(0),
    netMovePct:+((sim.priceEnd-sim.priceStart)/sim.priceStart*100).toFixed(1),
    maxDrawdownPct:+sim.maxDrawdownPct.toFixed(1)
  };
}
function simulateDayOffline(){ return simDaysOffline(1).days[0]; }   // back-compat

/* ---------------- candles ---------------- */
function updateCandles(){
  const tsec = Math.floor(S.simClock/1000);
  const price = S.price.mid;
  const vol = S.price.lastVol;
  for(const tf of TF_ORDER){
    const arr = S.candles[tf] || (S.candles[tf] = []);
    const bt = Math.floor(tsec / TF[tf]) * TF[tf];
    const last = arr[arr.length-1];
    if(!last || last.t < bt){
      // a new bar OPENS exactly at the previous bar's close — no intraday gaps.
      // Only a day boundary is allowed to gap (rolloverDay adds the $0-2.5 jump).
      const sameDay = last && Math.floor(last.t/86400) === Math.floor(bt/86400);
      const o = sameDay ? last.c : price;
      arr.push({ t:bt, o, h:Math.max(o,price), l:Math.min(o,price), c:price, v:vol });
      if(arr.length > TF_CAP[tf]) arr.splice(0, arr.length - TF_CAP[tf]);
    }else{
      last.h = Math.max(last.h, price);
      last.l = Math.min(last.l, price);
      last.c = price;
      last.v += vol;
    }
  }
}

/* ---------------- commission ---------------- */
function commissionFor(volume, price){
  const t = S.trading.commissionType;
  const c = S.trading.commission;
  const cs = S.symbol.contractSize;
  const px = price || S.price.mid;
  if(t === "usd_per_lot")     return volume * c;
  if(t === "quote_per_lot")   return volume * c;              // quote currency = USD for XAUUSD
  if(t === "usd_per_million"){ const notional = volume * cs * px; return notional/1e6 * c; }
  if(t === "percent"){         const notional = volume * cs * px; return notional * c/100; }
  return volume * c;
}

/* ---------------- P/L ---------------- */
function grossPL(pos, bid, ask){
  const b = bid==null?S.price.bid:bid, a = ask==null?S.price.ask:ask;
  const cs = S.symbol.contractSize;
  if(pos.side === "buy")  return (b - pos.entry) * pos.volume * cs;
  else                    return (pos.entry - a) * pos.volume * cs;
}
function closePriceFor(pos){ return pos.side === "buy" ? S.price.bid : S.price.ask; }
function posMetrics(pos){
  const gross = grossPL(pos);
  const closeComm = commissionFor(pos.volume, closePriceFor(pos));
  const comm = pos.openCommission + closeComm;
  const swap = pos.swap;
  const net = gross + swap - comm;
  return { gross, openComm: pos.openCommission, closeComm, comm, swap, net };
}

/* ---------------- account / margin ---------------- */
function usedMargin(){
  const cs = S.symbol.contractSize, lev = S.symbol.leverage;
  let m = 0;
  for(const p of S.positions){
    m += (p.volume * cs * S.price.mid) / lev;
  }
  return m;
}
function recalcAccount(){
  let floating = 0, swaps = 0;
  for(const p of S.positions){ floating += grossPL(p); swaps += p.swap; }
  S._acc = {
    balance: S.account.balance,
    floating,
    swaps,
    equity: S.account.balance + floating + swaps,
    margin: usedMargin()
  };
  S._acc.freeMargin = S._acc.equity - S._acc.margin;
  S._acc.marginLevel = S._acc.margin > 0 ? (S._acc.equity / S._acc.margin * 100) : Infinity;
}

/* ---------------- slippage ----------------
   depends on volatility, spread, speed and (during news) the event's slip curve */
function slippage(){
  if(!S.trading.slippageOn) return 0;
  let mx = S.market.normalSlippage;                       // normal: 0 .. normalSlippage
  if(S.news.active){
    const cfg = S.newsEngine.perEvent[S.news.type];
    const p = S.news.progress || 0;
    const shape = clamp(Math.exp(-2*p) + 0.35, 0.2, 1.35);
    const spreadFactor = clamp(S.price.spread / SPREAD_MAX, 1, 8);
    mx = S.market.normalSlippage * cfg.slipMul * shape * (0.5 + spreadFactor/4);
  }else if(currentVolFactor() > 1.9){
    mx *= 2.5;                                            // high normal volatility
  }
  const v = Math.abs(gauss())*mx*0.7 + Math.random()*mx*0.4;
  return roundTo(Math.min(v, mx*2.5), S.symbol.digits);
}

/* ---------------- open / close ---------------- */
function validateLot(v){
  const {minLot,maxLot,lotStep} = S.symbol;
  if(!isFinite(v) || v <= 0) return L("Объём должен быть больше 0");
  if(v < minLot) return L("Минимальный объём {0}", fmt(minLot,2));
  if(v > maxLot) return L("Максимальный объём {0}", fmt(maxLot,2));
  const steps = v / lotStep;
  if(Math.abs(steps - Math.round(steps)) > 1e-6) return L("Объём должен быть кратен {0}", fmt(lotStep,2));
  return null;
}
/* Trading works from EVERY device signed into the account. Only one device
   advances the market (otherwise the two would price differently), so a device
   that is currently mirroring sends its order to the account instead of filling
   it locally — exactly like routing an order to a broker. The device driving the
   market picks it up on its next heartbeat, fills it through this same engine,
   and the result comes back to every device in the next frame. */
function guardMirror(kind, payload){
  if(!XC.follower) return false;
  xcApi("POST", "/api/state", { op:"order", sid: XC.sid, order: Object.assign({ kind }, payload) })
    .then(()=> toast("", L("Ордер отправлен — исполняется")))
    .catch(()=> toast("r", L("Не удалось отправить ордер — нет связи")));
  return true;
}
/* Driver side: run the orders other devices placed, through the real engine. */
function execRemoteOps(ops){
  if(!ops || !ops.length) return;
  for(const o of ops){
    try{
      if(o.kind === "open")               openPosition(o.side, o.volume, { sl:o.sl, tp:o.tp, slPips:o.slPips, tpPips:o.tpPips, tp1:o.tp1, range:o.range, ref:o.ref });
      else if(o.kind === "close")         closePosition(o.id, o.reason || "manual");
      else if(o.kind === "modify")        modifyPosition(o.id, o.sl, o.tp);
      else if(o.kind === "pending")       addPending(o.order);
      else if(o.kind === "cancelPending") cancelPending(o.id);
    }catch(e){ console.error("[remote order]", e); }
  }
  xcPushState(true);          // let the other devices see the result immediately
}
function openPosition(side, volume, opts){
  opts = opts || {};
  if(guardMirror("open", { side, volume, sl:opts.sl, tp:opts.tp, slPips:opts.slPips, tpPips:opts.tpPips, tp1:opts.tp1, range:opts.range, ref:opts.ref })) return null;
  if(guardLock()) return null;
  if(marketClosed()){ toast("r", L("Рынок закрыт — исполнение недоступно")); return null; }
  const err = validateLot(volume);
  if(err){ toast("r", err); return null; }
  recalcAccount();
  let px = side === "buy" ? S.price.ask : S.price.bid;
  const slip = slippage();
  if(slip>0) px = roundTo(px + (side==="buy" ? slip : -slip), S.symbol.digits);
  const pip = Math.pow(10, -S.symbol.digits), dir = side === "buy" ? 1 : -1;
  // the market range (the ticket's «Макс. проскальзывание»): a fill further than that from the price the order was
  // sent at is refused, as cTrader does
  if(opts.range != null && isFinite(opts.ref) && (px - opts.ref) * dir > opts.range * pip + 1e-9){
    toast("r", L("Ордер отклонён: цена ушла на {0} п. — больше допустимых {1} п.", Math.round((px - opts.ref) * dir / pip), opts.range));
    return null;
  }

  // margin check
  const reqM = (volume * S.symbol.contractSize * S.price.mid) / S.symbol.leverage;
  if(reqM > S._acc.freeMargin + 1e-6){
    toast("r", L("Недостаточно свободной маржи (нужно {0})", money(reqM)));
    return null;
  }
  // SL / TP given in points are set from the fill (cTrader: relative to the opening price)
  if(opts.slPips != null) opts.sl = roundTo(px - dir * opts.slPips * pip, S.symbol.digits);
  if(opts.tpPips != null) opts.tp = roundTo(px + dir * opts.tpPips * pip, S.symbol.digits);
  // take profit 1 closes a part of the volume; the position's TP (2) closes the rest
  let tp1 = null;
  if(opts.tp1){
    const t1 = opts.tp1, p1 = t1.pips != null ? roundTo(px + dir * t1.pips * pip, S.symbol.digits) : t1.price, v1 = roundTo(t1.volume, 2);
    if(!(isFinite(p1) && (p1 - px) * dir > 0)){ toast("r", L("Тейк-профит 1 должен быть за ценой входа")); return null; }
    if(validateLot(v1) || v1 > volume - S.symbol.minLot + 1e-9){ toast("r", L("Неверный объём тейк-профита 1")); return null; }
    tp1 = { price: p1, volume: v1 };
  }
  // validate SL/TP sides
  if(opts.sl != null){
    if(side==="buy"  && opts.sl >= px){ toast("r", L("SL для BUY должен быть ниже цены входа")); return null; }
    if(side==="sell" && opts.sl <= px){ toast("r", L("SL для SELL должен быть выше цены входа")); return null; }
  }
  if(opts.tp != null){
    if(side==="buy"  && opts.tp <= px){ toast("r", L("TP для BUY должен быть выше цены входа")); return null; }
    if(side==="sell" && opts.tp >= px){ toast("r", L("TP для SELL должен быть ниже цены входа")); return null; }
  }
  const openComm = commissionFor(volume, px);
  const pos = {
    id: S.seq.pos++, symbol: S.symbol.name, side, volume: roundTo(volume,2),
    entry: px, openTime: S.simClock, sl: opts.sl||null, tp: opts.tp||null, tp1,
    openCommission: openComm, swap: 0, slippage: slip,
    lastSwapDay: simDateStr()
  };
  S.account.balance -= openComm;   // commission charged on OPEN
  S.positions.push(pos);
  recalcAccount();
  if(!opts.quiet)                  // the quick-trade pill is the confirmation there
    toast("g", (side==="buy"?"BUY":"SELL")+" "+fmt(volume,2)+L(" по ")+pxfmt(px)+"  •  comm "+money(openComm)+(slip>0?"  •  slip "+pxfmt(slip):""));
  save();
  return pos;
}
function closePosition(id, reason){
  if(guardMirror("close", { id, reason })) return;
  const i = S.positions.findIndex(p=>p.id===id);
  if(i<0) return;
  const pos = S.positions[i];
  const m = posMetrics(pos);
  const exit = closePriceFor(pos);
  S.account.balance += m.gross + m.swap - m.closeComm;   // openComm already taken at open
  S.positions.splice(i,1);
  S.history.unshift({
    id: pos.id, symbol: pos.symbol, side: pos.side, volume: pos.volume,
    entry: pos.entry, exit,
    openTime: pos.openTime, closeTime: S.simClock,
    gross: m.gross, commission: m.comm, swap: m.swap, net: m.gross + m.swap - m.comm,
    reason: reason || "manual", slippage: pos.slippage
  });
  if(S.history.length > 500) S.history.pop();
  recalcAccount();
  const cls = m.gross + m.swap - m.comm >= 0 ? "g":"r";
  toast(cls, L("Закрыта #{0}", pos.id)+"  "+signMoney(m.gross+m.swap-m.comm)+(reason?"  ("+L(reason)+")":""));
  save();
}
/* a part of a position closes (take profit 1): its share of the gross, the swap and the opening commission goes to the
   balance with the closing commission, a history row for it, the rest runs on */
function closePartial(id, vol, reason){
  if(XC.follower) return;                                          // the device driving the market does it
  const pos = S.positions.find(p => p.id === id);
  if(!pos) return;
  vol = roundTo(Math.min(vol, pos.volume), 2);
  if(vol >= pos.volume - 1e-9){ closePosition(id, reason); return; }
  const k = vol / pos.volume, exit = closePriceFor(pos);
  const gross = grossPL(pos) * k, swap = pos.swap * k, openC = pos.openCommission * k, closeC = commissionFor(vol, exit);
  S.account.balance += gross + swap - closeC;                      // its opening commission was taken at open
  pos.volume = roundTo(pos.volume - vol, 2); pos.swap -= swap; pos.openCommission -= openC;
  S.history.unshift({
    id: pos.id, symbol: pos.symbol, side: pos.side, volume: vol, entry: pos.entry, exit,
    openTime: pos.openTime, closeTime: S.simClock,
    gross, commission: openC + closeC, swap, net: gross + swap - openC - closeC,
    reason: reason || "manual", slippage: pos.slippage
  });
  if(S.history.length > 500) S.history.pop();
  recalcAccount();
  const net = gross + swap - openC - closeC;
  toast(net >= 0 ? "g" : "r", L("Частично закрыта #{0}: {1} лот", pos.id, fmt(vol, 2)) + "  " + signMoney(net) + (reason ? "  (" + L(reason) + ")" : ""));
  save();
}
function modifyPosition(id, sl, tp){
  if(guardMirror("modify", { id, sl, tp })) return;
  if(guardLock()) return;
  const p = S.positions.find(x=>x.id===id);
  if(!p) return;
  // Reject an SL/TP that already sits on the wrong side of the market — that would
  // trigger on the very next tick. Editing a position must NEVER auto-close it.
  const bid = S.price.bid, ask = S.price.ask;
  if(sl != null && isFinite(sl)){
    if(p.side === "buy"  && sl >= bid){ toast("r", L("SL для BUY должен быть ниже текущей цены {0} — позиция не изменена", pxfmt(bid))); return; }
    if(p.side === "sell" && sl <= ask){ toast("r", L("SL для SELL должен быть выше текущей цены {0} — позиция не изменена", pxfmt(ask))); return; }
  }
  if(tp != null && isFinite(tp)){
    if(p.side === "buy"  && tp <= bid){ toast("r", L("TP для BUY должен быть выше текущей цены {0} — позиция не изменена", pxfmt(bid))); return; }
    if(p.side === "sell" && tp >= ask){ toast("r", L("TP для SELL должен быть ниже текущей цены {0} — позиция не изменена", pxfmt(ask))); return; }
  }
  p.sl = (sl != null && isFinite(sl)) ? sl : null;
  p.tp = (tp != null && isFinite(tp)) ? tp : null;
  toast("g", L("Позиция #{0} изменена — SL {1} · TP {2}", id, (p.sl?pxfmt(p.sl):"—"), (p.tp?pxfmt(p.tp):"—")));
  save();
}

/* ---------------- SL / TP ---------------- */
function processPositionSLTP(){
  for(const p of [...S.positions]){
    const bid = S.price.bid, ask = S.price.ask;
    // take profit 1 closes its part first; the rest runs on to TP (2) / SL
    if(p.tp1 && !XC.follower && (p.side === "buy" ? bid >= p.tp1.price : ask <= p.tp1.price)){
      const v = p.tp1.volume; p.tp1 = null; closePartial(p.id, v, "TP1");
      if(!S.positions.includes(p)) continue;
    }
    if(p.side === "buy"){
      if(p.sl != null && bid <= p.sl){ closePosition(p.id, "SL"); continue; }
      if(p.tp != null && bid >= p.tp){ closePosition(p.id, "TP"); continue; }
    }else{
      if(p.sl != null && ask >= p.sl){ closePosition(p.id, "SL"); continue; }
      if(p.tp != null && ask <= p.tp){ closePosition(p.id, "TP"); continue; }
    }
  }
}

/* ---------------- pending orders ---------------- */
function addPending(o){
  if(guardMirror("pending", { order:o })) return null;
  if(guardLock()) return null;
  const err = validateLot(o.volume);
  if(err){ toast("r", err); return null; }
  const ord = {
    id: S.seq.ord++, symbol: S.symbol.name, type: o.type, volume: roundTo(o.volume,2),
    price: o.price, sl: o.sl||null, tp: o.tp||null, createTime: S.simClock
  };
  if(o.type.includes("stop")) ord.trig = o.trig || "trade";                     // which price sets it off (cTrader's trigger)
  if(o.type.endsWith("stop_limit")) ord.lim = Math.max(0, Math.round(o.lim || 0));   // the limit range, points
  if(o.tp1 && o.tp1.price && o.tp1.volume) ord.tp1 = { price: o.tp1.price, volume: roundTo(o.tp1.volume, 2) };
  S.pendings.push(ord);
  toast("", ordTypeName(o.type)+" "+fmt(o.volume,2)+L(" по ")+pxfmt(o.price));
  save();
  return ord;
}
function cancelPending(id){
  if(guardMirror("cancelPending", { id })) return;
  if(guardLock()) return;
  const i = S.pendings.findIndex(o=>o.id===id);
  if(i>=0){ S.pendings.splice(i,1); toast("", L("Ордер отменён")); save(); }
}
/* A limit fills at its price. A stop is set off by its trigger side — the trade side (a buy stop watches the buy
   price) or the opposite one; «double» wants two ticks in a row past the price — and fills at the market with
   slippage. A stop-limit set off becomes a limit at its price ± its range: it fills at the market only inside it,
   else it waits there (armed). */
function processPendings(){
  const bid = S.price.bid, ask = S.price.ask, pip = Math.pow(10, -S.symbol.digits);
  for(const o of [...S.pendings]){
    const side = o.type.startsWith("buy") ? "buy" : "sell", buy = side === "buy", dir = buy ? 1 : -1;
    const isStop = o.type.includes("stop"), stopLimit = o.type.endsWith("stop_limit");
    let px = null;
    if(!isStop){
      if(buy ? ask <= o.price : bid >= o.price) px = o.price;
    }else{
      if(!o.armed){
        const tr = o.trig || "trade", opp = tr === "opp" || tr === "dopp";
        const q = buy ? (opp ? bid : ask) : (opp ? ask : bid), past = buy ? q >= o.price : q <= o.price;
        if(tr === "dtrade" || tr === "dopp"){ o.hits = past ? (o.hits || 0) + 1 : 0; if(o.hits < 2) continue; }
        else if(!past) continue;
        if(stopLimit) o.armed = true;
        else { const sl = slippage(); px = roundTo((buy ? ask : bid) + dir * sl, S.symbol.digits); }
      }
      if(stopLimit){
        const lim = o.price + dir * (o.lim || 0) * pip, m = buy ? ask : bid;
        if(buy ? m <= lim + 1e-9 : m >= lim - 1e-9) px = m;
        else continue;
      }
    }
    if(px == null) continue;
    const i = S.pendings.findIndex(x=>x.id===o.id);
    if(i>=0) S.pendings.splice(i,1);
    const openComm = commissionFor(o.volume, px);
    if((o.volume*S.symbol.contractSize*S.price.mid)/S.symbol.leverage > (S._acc?S._acc.freeMargin:1e9)+1e-6){
      toast("r", L("Ордер #{0} не исполнен — недостаточно маржи", o.id)); save(); continue;
    }
    S.account.balance -= openComm;
    S.positions.push({
      id: S.seq.pos++, symbol: S.symbol.name, side, volume: o.volume, entry: px,
      openTime: S.simClock, sl: o.sl, tp: o.tp, tp1: o.tp1 || null, openCommission: openComm, swap: 0,
      slippage: isStop?roundTo(Math.abs(px-o.price),S.symbol.digits):0, lastSwapDay: simDateStr()
    });
    toast("g", L("Исполнен {0} #{1} по {2}", ordTypeName(o.type), o.id, pxfmt(px)));
    save();
  }
}

/* ---------------- rollover / swap ---------------- */
function checkRollover(){
  const day = simDateStr();
  if(S.lastSimDay == null){ S.lastSimDay = day; return; }
  if(day === S.lastSimDay) return;
  // crossed midnight (possibly several days if timeMultiplier huge)
  const prev = new Date(S.lastSimDay+"T00:00:00Z");
  const cur = new Date(day+"T00:00:00Z");
  let daysCrossed = Math.round((cur - prev)/86400000);
  S.lastSimDay = day;
  if(daysCrossed < 1) return;

  const wd = simDate().getUTCDay();
  let mult = 1;
  if(wd === S.trading.tripleSwapDay) mult = 3;
  mult += (daysCrossed - 1); // accumulate any skipped days simply

  let anySwap = false;
  for(const p of S.positions){
    const rate = p.side === "buy" ? S.trading.swapLong : S.trading.swapShort;
    const amt = rate * p.volume * mult;   // USD per lot per day
    p.swap += amt;
    p.lastSwapDay = day;
    anySwap = true;
  }
  if(anySwap){
    toast("o", L("🌙 Rollover — swap начислен")+(mult>=3?" (x"+mult+")":""));
  }
  recalcAccount();
  save();
}

/* ---------------- stop out / margin call ---------------- */
let marginCallShown = false;
function checkStopOut(){
  recalcAccount();
  const ml = S._acc.marginLevel;
  if(!isFinite(ml)){ marginCallShown = false; return; }
  if(ml < S.trading.marginCallLevel && ml >= S.trading.stopOutLevel){
    if(!marginCallShown){ toast("o", "⚠ MARGIN CALL — Margin Level "+fmt(ml,1)+"%"); marginCallShown = true; }
  }else if(ml >= S.trading.marginCallLevel){
    marginCallShown = false;
  }
  let guard = 0;
  while(S._acc.marginLevel < S.trading.stopOutLevel && S.positions.length && guard++ < 50){
    // close most losing position first
    let worst = null, worstPL = Infinity;
    for(const p of S.positions){
      const pl = grossPL(p) + p.swap;
      if(pl < worstPL){ worstPL = pl; worst = p; }
    }
    toast("r", L("🛑 STOP OUT — закрыта позиция #{0}", worst.id)+" (Margin Level "+fmt(S._acc.marginLevel,1)+"%)");
    closePosition(worst.id, "Stop Out");
    recalcAccount();
  }
}

/* ---------------- events schedule check ---------------- */
/* Economic calendar is informational only — macro news is user-triggered
   via the Macro News Engine buttons (NFP / CPI / PPI / FOMC / FED SPEECH).
   It runs on the GAME clock (S.simClock): an event whose game time has come is marked out
   (with a synthetic actual next to its forecast — no market move), and once at most one is
   still ahead the next batch is scheduled from the current game time. Events used to stay
   «pending» forever once their time passed, so no new ones came and the calendar showed
   stale dates with negative countdowns. */
function synthActual(e){                                                // a print near the forecast: K ±8 %, % ±0.2, a rate decision as expected
  const f = Number(e.forecast) || 0;
  if(/Rate/i.test(e.name)) return f;
  return e.unit === "K" ? Math.round(f * (1 + (Math.random() - 0.5) * 0.16)) : roundTo(f + Math.round((Math.random() - 0.5) * 4) / 10, 2);
}
function checkEvents(){
  for(const e of S.events){
    if(e.released || e.time > S.simClock) continue;
    if(e.actual == null && e.unit) e.actual = synthActual(e);
    // the day's event releases itself at its time — the scenario runs and prints its news candle
    if(!e.manual && !S.news.active && !marketClosed()) releaseEvent(e);
    else e.released = true;                                       // a hand-made one still waits for «Выпустить»
  }
  scheduleNews(6);
}
function addManualEvent(o){
  S.events.push({
    id: S.seq.evt++, name: o.name, unit: o.unit||"",
    previous: o.previous, forecast: o.forecast,
    actual: (o.actual===""||o.actual==null)?null:Number(o.actual),
    impact: o.impact||2, time: S.simClock + (o.delaySec||30)*1000,
    released:false, manual:true
  });
  toast("o", L("Создано событие: {0} (через {1}с)", o.name, (o.delaySec||30)));
  save();
}

   UI
