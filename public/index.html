  }
  // time scale — cTrader's: a bold date at the left, then a time on every bar whose time is a round
  // multiple (1 / 2 / 5 / 10 / 15 / 30 min, 1 / 2 / 4 / 6 / 12 h, days…) at least 60 px apart (~70 px
  // on a phone, cTrader's spacing), each with a vertical gridline; the labels glide with their candles
  const tfSec = TF[tf] || 60, daily = tfSec >= 86400;
  const MON = MON_L[LANG], DAYS = DAYS_L[LANG];
  const stepSec = [60,120,300,600,900,1800,3600,7200,14400,21600,43200,86400,172800,604800,1209600,2592000,7776000].find(s => s >= 60 / unit * tfSec) || 31536000;
  const every = Math.max(1, Math.round(stepSec / tfSec));
  const d0 = new Date(vis[clamp(Math.ceil(vis.length - offF - barsW / unit), 0, vis.length - 1)].t * 1000);   // the leftmost bar on screen
  const dateLbl = daily ? `${MON[d0.getUTCMonth()]} ${d0.getUTCFullYear()}` : `${DAYS[d0.getDay()]} ${d0.getDate()} ${MON[d0.getMonth()]}`;
  const yTime = H - padB / 2;
  ctx.font = "600 " + AXF; ctx.textAlign = "left";
  ctx.fillText(dateLbl, 2, yTime);
  const dateEnd = 2 + ctx.measureText(dateLbl).width + 24;
  ctx.font = AXF; ctx.textAlign = "center";
  for(let i = 0; i < vis.length; i++){
    if(Math.round(vis[i].t / tfSec) % every) continue;
    const xx = crispX(xOf(i) + bw/2);
    if(xx < 0 || xx > barsW) continue;
    ctx.moveTo(xx, padT); ctx.lineTo(xx, H - padB);
    if(xx - 22 < dateEnd || xx + 22 > plotW) continue;
    const d = new Date(vis[i].t * 1000);
    ctx.fillText(daily ? `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`                 // D1 bars are UTC days
               : stepSec >= 86400 ? `${d.getDate()} ${MON[d.getMonth()]}`
               : pad2(d.getHours()) + ":" + pad2(d.getMinutes()), xx, yTime);        // intraday: device time
  }
  ctx.strokeStyle = TC.grid; ctx.lineWidth = hair; ctx.stroke(); ctx.lineWidth = 1;
  // the countdown to the live bar's close on the game clock, bold at the foot of the scale (cTrader's «00:41»)
  const leftS = Math.max(0, Math.round(((data[data.length - 1].t + tfSec) * 1000 - S.simClock) / 1000));
  const cH = Math.floor(leftS / 3600), cM = Math.floor(leftS % 3600 / 60), cS = leftS % 60;
  ctx.font = "700 " + AXF; ctx.textAlign = "right";
  ctx.fillText(leftS >= 86400 ? `${Math.floor(leftS / 86400)}${L("д")} ${pad2(cH % 24)}:${pad2(cM)}` : cH ? `${pad2(cH)}:${pad2(cM)}:${pad2(cS)}` : `${pad2(cM)}:${pad2(cS)}`, W - 12, yCount + 0.5);
  ctx.textBaseline = "alphabetic";

  // candles — clipped at barsW, so a bar sliding in or out is cut at the gap before the axis.
  // Wick and body are pixel-aligned rects filled together: one fill per colour a frame (it was
  // a stroke plus a fillStyle change per bar — ~130 of them zoomed out).
  const bodyW = Math.max(px1, snapPx(bw));
  const wickOff = snapPx((bodyW - hairX) / 2);
  const yAskCap = y(S.price.ask);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, barsW, H); ctx.clip();
  for(const upPass of [true, false]){
    ctx.beginPath();
    for(let i=0;i<vis.length;i++){
      const b = vis[i];
      if((b.c >= b.o) !== upPass) continue;
      const x0 = xOf(i);
      if(x0 >= barsW || x0 + bodyW <= 0) continue;            // off the plot
      const yh = snapPy(y(b.h)), yl = snapPy(y(b.l));
      ctx.rect(x0 + wickOff, yh, hairX, Math.max(py1, yl - yh));
      let yo = y(b.o), yc = y(b.c);
      // live DOWN bar: stop the FILLED body at the Ask line so the Ask isn't buried
      // in the block — the wick above already shows the true open, and the OHLC is
      // untouched so the bar still chains to its neighbours (no gap).
      if(i === liveIdx && !upPass) yc = Math.min(yc, yAskCap);
      const top = snapPy(Math.min(yo, yc)), bot = snapPy(Math.max(yo, yc));
      ctx.rect(x0, top, bodyW, Math.max(hair, bot - top));
    }
    ctx.fillStyle = upPass ? TC.up : TC.down; ctx.fill();
  }
  ctx.restore();

  // bid / ask price lines — cTrader style: GREEN Ask on top, RED Bid below.
  // Ask > Bid and higher price = higher on screen, so green always ends up above red,
  // at every price level and on every timeframe.
  const CL_ASK = TC.up, CL_BID = TC.down;
  // SOLID, like cTrader — dashed / dash-dot lines belong to positions, orders and ТП / СЛ
  // …and it runs dead straight into its tag: the few px past plotW are hidden by the tag's fill
  const priceLine = (yy, col)=>{               // yy is already on the pixel grid (crispY)
    ctx.strokeStyle = col; ctx.setLineDash([]); ctx.lineWidth = hair;
    ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(plotW + 6, yy); ctx.stroke();
    ctx.lineWidth = 1;
  };
  priceLine(yAsk, CL_ASK);
  priceLine(yBid, CL_BID);
  // right-scale Bid/Ask tags: centred on their lines, drawn at the very end (on top)
  const priceTag = (yTag, col, label)=> axisTag(ctx, plotW + 2, yTag, padR - 4, 18, label, col, TC.bg);

  /* ---- OPEN POSITIONS + PENDING ORDERS ----------------------------------
     Bound directly to S.positions / S.pendings — no separate viz state.
     cTrader (2026-09-14 screenshots): every level runs from a pill on the left to an
     outlined price tag on the axis, all in the position's / order's colour.
     position = FILLED «0.01 Лоты ↑» pill, DASH-DOT line, a dot on the bar it opened in
     ТП / СЛ  = OUTLINED «ТП» / «СЛ» pill, DASHED line, joined to the position's pill by
                a thin vertical line (a buy's СЛ is green too, not red)
     pending  = OUTLINED pill + arrow-and-bar icon (limit / stop), DASH-DOT line
     green = buy · orange-red = sell                                        */
  const sym = S.symbol.name;
  const marks = [];   // {y: pill (de-collided), ly: line, price, col, text, icon, filled, dash, dotX, grp}
  // A level outside the visible range gets NO marker. spreadYs() clamps labels
  // into the canvas, so without this an entry far above the highs was pinned to
  // the top edge and read like a price that is actually on screen.
  const inView = p => p >= lo && p <= hi;

  for(const p of S.positions){
    if(p.symbol !== sym) continue;
    const col = p.side === "buy" ? TC.up : TC.down, grp = [];
    if(inView(p.entry)){
      // the bar holding openTime: the last visible bar that started at or before it and
      // whose successor (in the full series) starts after it — none if it is off screen
      let dotX = null;
      for(let i = vis.length - 1; i >= 0; i--){
        if(vis[i].t * 1000 > p.openTime) continue;
        const next = data[startIdx + i + 1];
        if(!next || next.t * 1000 > p.openTime) dotX = xOf(i) + bw/2;
        break;
      }
      grp.push({ y: y(p.entry), ly: y(p.entry), price: p.entry, key: "p" + p.id, col, text: `${fmt(p.volume,2)} ${L("Лоты")}`,
                 icon: p.side === "buy" ? "up" : "down", filled: true, dash: "dashdot", dotX });
    }
    if(p.tp && inView(p.tp)) grp.push({ y: y(p.tp), ly: y(p.tp), price: p.tp, key: "t" + p.id, col, text: L(p.tp1 ? "ТП2" : "ТП"), icon: "", filled: false, dash: "dash", dotX: null });
    if(p.tp1 && inView(p.tp1.price)) grp.push({ y: y(p.tp1.price), ly: y(p.tp1.price), price: p.tp1.price, key: "u" + p.id, col, text: L("ТП1"), icon: "", filled: false, dash: "dash", dotX: null });
    if(p.sl && inView(p.sl)) grp.push({ y: y(p.sl), ly: y(p.sl), price: p.sl, key: "s" + p.id, col, text: L("СЛ"), icon: "", filled: false, dash: "dash", dotX: null });
    for(const m of grp){ m.grp = grp; marks.push(m); }
  }
  for(const o of S.pendings){
    if(o.symbol !== sym || !inView(o.price)) continue;
    const buy = o.type.includes("buy");
    marks.push({ y: y(o.price), ly: y(o.price), price: o.price, key: "o" + o.id, col: buy ? TC.up : TC.down,
                 text: `${fmt(o.volume,2)} ${L("Лоты")}`, icon: (buy ? "buy-" : "sell-") + (o.type.includes("stop") ? "stop" : "limit"),
                 filled: false, dash: "dashdot", dotX: null, grp: null });
  }
  // Pills sit ON their lines — the line runs through the middle of the pill. Only a position's own
  // ТП / lots / СЛ pills are spread apart vertically (their connector keeps them tied); pills of
  // different positions / orders stay in ONE even column however close their lines are — pushing
  // them apart vertically left the lower ones' lines above their middle, and setting same-price ones
  // side by side made them shuffle and ride over each other while the chart was dragged (user: «они
  // не должны так крутиться, один на одного должны быть»): positions at the same price lie one on
  // top of the other.
  // cTrader's size (a 1440 px screenshot of 8 positions): pills and price tags 18 px tall, pill text 13 px —
  // the same as the price scale (they were 16 px with ~12 px text)
  const pillH = 18, pillFs = 13;
  for(const m of marks){ m.ly = crispY(m.ly); m.y = m.ly; }      // lines and tags on the pixel grid
  const units = [];                                              // a position's pill column, or a lone pill
  for(const m of marks){ const g = m.grp || [m]; if(!units.includes(g)) units.push(g); }
  // the bounds cover every line in view (padT … H − padB): a tighter one pinned a pill above its line
  for(const g of units) if(g.length > 1) spreadYs(g, pillH + 2, padT, H - padB);
  for(const m of marks) m.y = snapPy(m.y);
  // A pill level with the on-chart buttons (measured in chartZones) gets out of their way: past ⛶ at
  // the top, past the + / − column, and in the bottom row it sits between the timeframe pill and
  // «›|» (or the price scale), which NARROWS to let it by at full size. Where it sits follows its line exactly — on
  // the same frame and both ways, so it keeps pace with the finger and never rides over a button
  // however fast the swipe — along a smoothstep ramp as the line nears a strip: 110 px for the bottom
  // row's ~170 px slide (≤ 2.4 px sideways per px of drag; a 40 px ramp threw a pill 35–45 px in one
  // frame of a slow drag in the user's video), 60 px for the short slides by ⛶ and + / −. Its size
  // is always what fits where it is. «›|» fading in or out narrows / widens the row's gap with τ 90 ms.
  // A position's ТП / lots / СЛ column moves sideways as one.
  const Z = chart._zones || {};
  const ease3 = k => k * k * (3 - 2 * k);
  const zk = (yy, t, b, ramp) => t == null ? 0 : ease3(clamp(1 - Math.max(0, t - pillH/2 - yy, yy - b - pillH/2) / ramp, 0, 1));
  const pNow = performance.now(), pAnim = chart._pillAnim || (chart._pillAnim = new Map());
  const pGen = chart._pillGen = (chart._pillGen || 0) + 1;         // this draw's number: «seen» = in the previous draw
  let pSettling = false;
  for(const m of marks) m.w = chartPillWidth(ctx, pillFs, m.text, m.icon);
  /* THE BOTTOM ROW SLIDES OUT OF THE WAY, the pill never makes itself small (user: «м1 и xauusd должны
     влево плавно и пружинчасто съезжать, именно так, как работает островок в айфоне»; «эта кнопка должна
     быть на месте, но чуть-чуть в самом размере меньше стать»). «XAUUSD ›» and «м1» travel left together
     by exactly what the pill beside them needs, and «›|» keeps its spot but narrows a little toward its
     right edge to give up a few more px. Both ride a spring (ω ≈ 17 rad/s, damping .7 — settles in ~⅓ s
     and overshoots a hair, the Dynamic Island's motion) and both, with the pill's own x, are read from the
     same frame, so a fast swipe never catches the pill on a button. */
  /* Room for the pill is taken in this order, so the smallest, quietest move happens first: the row
     TRAVELS LEFT (up to SLIDE_MAX, which stops «XAUUSD ›» exactly at the screen edge — nothing is cut),
     «›|» STEPS a few px RIGHT at its own size (SHIFT_MAX, into the empty left margin of the price scale),
     and «XAUUSD ›» NARROWS a little — its padding closes, the text is never squeezed (user: «сама кнопка
     должна быть своего размера, она не должна уменьшаться, только чуть-чуть вправо, а xauusd должен
     чуть-чуть сужаться»). */
  const SLIDE_MAX = Math.max(0, (Z.rowX0 == null ? 16 : Z.rowX0)), SHIFT_MAX = 6, NARROW_MAX = 18, NARROW_SHARE = 0.6;
  const rowL0 = Z.rowL || 181;
  const lastOn = !!(lastBtn && lastBtn.classList.contains("on") && Z.lastX0 != null);
  let slideT = 0, shiftT = 0, narrowT = 0;
  for(const g of units){
    const kRow = Math.max(...g.map(k => zk(k.y, Z.rowT, Z.rowB, 110)));
    if(kRow <= 0) continue;
    const wNeed = Math.max(...g.map(m => m.w));
    const need = Math.max(0, rowL0 + wNeed + 8 - (lastOn ? Z.lastX0 : plotW));
    // «›|» takes its small step first; the rest the row gives up mostly by NARROWING, so «XAUUSD ›»
    // travels noticeably less than «м1» (which moves by slide + narrow together — its travel is unchanged)
    const sh = lastOn ? Math.min(need, SHIFT_MAX) : 0;
    const rem = need - sh;
    let nr = Math.min(rem * NARROW_SHARE, NARROW_MAX);
    const sl = Math.min(rem - nr, SLIDE_MAX);
    nr = Math.min(rem - sl, NARROW_MAX);                          // whatever the slide cannot take
    slideT = Math.max(slideT, sl * kRow);
    shiftT = Math.max(shiftT, sh * kRow);
    narrowT = Math.max(narrowT, nr * kRow);
  }
  const spring = (st, target, lo, hi, eps) => {
    const dt = Math.min(Math.max((pNow - st.t) / 1000, 0), EASE_DT / 1000);
    st.t = pNow;
    st.vel = MO.sp(st.vel, st.v, target, MO.P.fluid, dt);
    st.v = clamp(st.v + st.vel * dt, lo, hi);
    if(Math.abs(st.v - target) < eps && Math.abs(st.vel) < eps * 8){ st.v = target; st.vel = 0; } else pSettling = true;
    return st.v;
  };
  const SL = chart._rowSlide || (chart._rowSlide = { v: 0, vel: 0, t: pNow });
  const SH = chart._lastShift || (chart._lastShift = { v: 0, vel: 0, t: pNow });
  const NR = chart._symNarrow || (chart._symNarrow = { v: 0, vel: 0, t: pNow });
  const slide = spring(SL, slideT, -3, SLIDE_MAX + 4, 0.15);
  const shift = spring(SH, shiftT, -1, SHIFT_MAX + 2, 0.15);
  const narrow = spring(NR, narrowT, -1, NARROW_MAX + 2, 0.15);
  const rowEl = c.parentElement && c.parentElement.querySelector(".chpills");
  if(rowEl){
    const tr = slide < 0.2 ? "" : "translateX(" + (-slide).toFixed(1) + "px)";
    if(rowEl._slide !== tr){ rowEl._slide = tr; rowEl.style.transform = tr; }
  }
  const lastWrap = lastBtn && lastBtn.parentElement;
  if(lastWrap){
    const tr = shift < 0.2 ? "" : "translateX(" + shift.toFixed(1) + "px)";
    if(lastWrap._shift !== tr){ lastWrap._shift = tr; lastWrap.style.transform = tr; }
  }
  // «XAUUSD ›» gives up padding (16 left / 12 right / 10 between text and chevron = 38 px of air)
  const symEl = rowEl && rowEl.querySelector(".chpill.sym");
  let narrowPx = 0;
  if(symEl){
    const q = clamp(1 - narrow / 38, 0.42, 1);
    narrowPx = 38 * (1 - q);
    const key = q.toFixed(3);
    if(symEl._nr !== key){
      symEl._nr = key;
      symEl.style.paddingLeft = (16 * q).toFixed(1) + "px";
      symEl.style.paddingRight = (12 * q).toFixed(1) + "px";
      symEl.style.gap = (10 * q).toFixed(1) + "px";
      if(Z.symW) lgGlass(symEl, Z.symW - 38 * (1 - q), Z.symH || 31);
      if(rowEl.classList.contains("goo")) pmDraw(rowEl);
    }
  }
  // each drop's own speed: «XAUUSD» rides the slide, «м1» the slide plus «XAUUSD» narrowing, «›|» its step
  if(rowEl){
    jellyFeed(symEl, -SL.vel);
    jellyFeed(rowEl.querySelector('[data-act="charttf"]'), -(SL.vel + NR.vel));
  }
  if(lastOn) jellyFeed(lastBtn, SH.vel);
  const rowL = rowL0 - slide - narrowPx + Math.min(0, PM.x || 0);         // the row's right edge as it is right now (merged: «м1» tucked in)
  const rowR = (lastOn ? Z.lastX0 + shift : plotW) - 8;                   // where a pill has to stop
  // a pill that still would not fit (a narrow phone) gives way only then, and only as much as it must
  const fitRow = (m, x) => 1 - (1 - clamp((rowR - x) / m.w, 0.55, 1)) * zk(m.y, Z.rowT, Z.rowB, 110);
  for(const g of units){
    const kOf = (t, b, ramp) => Math.max(...g.map(k => zk(k.y, t, b, ramp)));
    const base = Math.max(8, 8 + ((Z.fsR || 70) - 8) * kOf(0, Z.fsB, 60), 8 + ((Z.zoomR || 64) - 8) * kOf(Z.zoomT, Z.zoomB, 60), 8 + (rowL - 8) * kOf(Z.rowT, Z.rowB, 110));
    for(const m of g){ m.px = base; m.s = fitRow(m, base); }
  }
  // Levels also FADE (pill, line, dot, tag together): over 14 px at the plot's top and foot — dragged
  // past an edge they used to pop in and out — and in over ~0.2 s when first seen (a new position,
  // or back after a while off screen). «First seen» = not in the previous draw: it was «not drawn for 400 ms»,
  // and once live redraws came only on a change (~½ s apart) every level faded out and in again on each
  // tick — the pills, their lines and tags blinked (user video 2026-09-17).
  const FADE = 14;
  for(const m of marks){
    let al = 0;
    const a = pAnim.get(m.key);
    if(a && (a.g === pGen - 1 || pNow - a.t < 400)){                 // (or off screen only a moment, mid-drag)
      const al0 = a.al == null ? 1 : a.al;
      al = al0 + (1 - al0) * (1 - Math.exp(-Math.min(pNow - a.t, EASE_DT) / 70));
    }
    if(al > 0.99) al = 1; else pSettling = true;
    pAnim.set(m.key, { al, t: pNow, g: pGen });
    m.a = al * clamp((m.ly - padT) / FADE, 0, 1) * clamp((H - padB - m.ly) / FADE, 0, 1);
  }
  if(pAnim.size > 120) pAnim.clear();
  if(pSettling) chartDraw();                                      // keep gliding / fading until they settle
  const pillX = m => m.px;
  // each line starts under the middle of its pill (from its left end it peeked past the round cap;
  // a ТП / СЛ column pill spread off its line starts it at its right end, so it doesn't run along its
  // edge) and its tail past plotW hides under the tag: position / order = dash-dot, ТП / СЛ = plain
  // dashes. Fully shown levels go out as one stroke per style, fading ones one by one.
  const DASH = { dashdot: [6, 3.5, 1.6, 3.5], dash: [4, 3] };
  const lineFrom = m => pillX(m) + m.w * m.s * (Math.abs(m.y - m.ly) < 3 ? 0.5 : 1);
  ctx.lineWidth = hair;                                           // whole device pixels, like the grid
  for(const kind of ["dashdot", "dash"]) for(const col of [TC.up, TC.down]){
    ctx.strokeStyle = col; ctx.setLineDash(DASH[kind]);           // the dash restarts per line
    let any = false;
    ctx.beginPath();
    for(const m of marks) if(m.dash === kind && m.col === col && m.a >= 0.999){ ctx.moveTo(lineFrom(m), m.ly); ctx.lineTo(plotW + 6, m.ly); any = true; }
    if(any) ctx.stroke();
    for(const m of marks) if(m.dash === kind && m.col === col && m.a > 0.001 && m.a < 0.999){
      ctx.globalAlpha = m.a; ctx.beginPath(); ctx.moveTo(lineFrom(m), m.ly); ctx.lineTo(plotW + 6, m.ly); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  ctx.setLineDash([]); ctx.lineWidth = 1;
  // a thin solid vertical line joins a position's ТП, lots and СЛ pills through the centre
  // of their left caps — the pills' fill hides it inside them
  for(const m of marks){
    const g = m.grp;
    if(!g || g[0] !== m || g.length < 2) continue;
    const cx = crispX(pillX(m) + pillH * m.s / 2), ys = g.map(k => k.y);
    ctx.globalAlpha = Math.min(...g.map(k => k.a));
    ctx.strokeStyle = m.col; ctx.lineWidth = hairX;
    ctx.beginPath(); ctx.moveTo(cx, Math.min(...ys)); ctx.lineTo(cx, Math.max(...ys)); ctx.stroke();
  }
  ctx.globalAlpha = 1; ctx.lineWidth = 1;
  for(const m of marks) if(m.dotX != null && m.dotX <= barsW && m.a > 0.001){
    ctx.globalAlpha = m.a; ctx.fillStyle = m.col; ctx.beginPath(); ctx.arc(m.dotX, m.ly, 2.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  for(const m of marks){
    if(m.a <= 0.001) continue;
    const x = snapPx(pillX(m)), po = { filled: m.filled, bg: TC.bg };
    ctx.globalAlpha = m.a;
    if(m.s < 0.999){                                              // squeezed into the bottom row: scaled about its left end
      ctx.save(); ctx.translate(x, m.y); ctx.scale(m.s, m.s);
      chartPill(ctx, 0, 0, pillH, pillFs, m.text, m.icon, m.col, po);
      ctx.restore();
    }else chartPill(ctx, x, m.y, pillH, pillFs, m.text, m.icon, m.col, po);
  }
  ctx.globalAlpha = 1;
  // right-axis tags, centred on their own line like cTrader (overlapping rather than
  // nudged apart); the live Bid/Ask tags go on last so they stay on top
  for(const m of marks) if(m.a > 0.001){ ctx.globalAlpha = m.a; axisTag(ctx, plotW + 2, m.ly, padR - 4, 18, chartPx(m.price), m.col, TC.bg); }
  ctx.globalAlpha = 1;
  priceTag(tAsk, CL_ASK, chartPx(S.price.ask));
  priceTag(tBid, CL_BID, chartPx(S.price.bid));

  // crosshair: dashed lines, the price in a tag on the scale and the bar's time on the time axis;
  // the OHLC readout (DOM, written only on a change) shows only while it is up — cTrader's chart
  // has none otherwise
  const info = infoEl;
  const setInfo = txt => {
    if(!info) return;
    if(txt == null){ if(!info.hidden) info.hidden = true; return; }
    if(info.hidden) info.hidden = false;
    if(info.textContent !== txt) info.textContent = txt;
  };
  if(chart.cross && chart.cross.x < plotW){
    const cx = chart.cross.x, cy = chart.cross.y;
    ctx.strokeStyle = TC.cross; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(cx,0); ctx.lineTo(cx,H-padB); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,cy); ctx.lineTo(plotW,cy); ctx.stroke();
    ctx.setLineDash([]);
    // which bar the cursor is OVER: floor into the unit-wide slot. Math.round()
    // here picked the neighbouring candle across half of every bar's width.
    const idx = clamp(Math.floor((cx - (barsW - (vis.length - offF)*unit))/unit), 0, vis.length-1);
    const b = vis[idx];
    const price = lo + (hi-lo)*(1 - (cy-padT)/(H-padT-padB));
    ctx.font = AXF; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = TC.tag; ctx.fillRect(plotW, cy-9, padR, 18);
    ctx.fillStyle = "#fff"; ctx.fillText(chartPx(price), plotW + padR/2, cy + 0.5);
    if(b){
      const rb = data[startIdx + idx] || b;         // raw OHLC for the text readout
      const d = new Date(rb.t*1000);
      const tl = daily ? `${d.getUTCDate()} ${MON[d.getUTCMonth()]}` : pad2(d.getHours()) + ":" + pad2(d.getMinutes());
      ctx.fillStyle = TC.tag; ctx.fillRect(cx - 26, H - padB, 52, padB);
      ctx.fillStyle = "#fff"; ctx.fillText(tl, cx, yTime);
      setInfo(`${pad2(d.getMonth()+1)}/${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}  ${L("О")} ${chartPx(rb.o)}  ${L("Н")} ${chartPx(rb.h)}  ${L("Л")} ${chartPx(rb.l)}  ${L("З")} ${chartPx(rb.c)}`);
    }
    ctx.textBaseline = "alphabetic";
  }else setInfo(null);
}

/* mini chart on overview */
/* Markets overview chart — cTrader's overview: a price scale with gridlines, a date / time axis,
   the last N bars of the chosen timeframe (S.ui.miniTF / miniBars — the tf button or a period
   preset) with free space right of the newest bar, position / order lines, Bid/Ask lines and
   tags. Everything sits on the device-pixel grid like the main chart. */
function drawMini(){
  if(!S) return;
  const c = document.getElementById("miniCanvas");
  if(!c) return;
  if(!c._w) fitCanvas(c);
  const ctx = c.getContext("2d");
  const TC = themeColors();
  const W = c._w, H = c._h, padR = 64, padT = 10, padB = 30;
  const pxr = c.width / W || 1, pyr = c.height / H || 1;
  const hx = Math.max(1, Math.round(pxr)), hy = Math.max(1, Math.round(pyr));
  const hairX = hx / pxr, hairY = hy / pyr;
  const snapX = v => Math.round(v * pxr) / pxr, snapY = v => Math.round(v * pyr) / pyr;
  const crispX = v => (hx % 2 ? Math.floor(v * pxr) + 0.5 : Math.round(v * pxr)) / pxr;
  const crispY = v => (hy % 2 ? Math.floor(v * pyr) + 0.5 : Math.round(v * pyr)) / pyr;
  ctx.clearRect(0, 0, W, H); ctx.fillStyle = TC.card; ctx.fillRect(0, 0, W, H);   // the card's own colour, like cTrader's overview (not the black main-chart ground)
  const tf = S.ui.miniTF || "M1", want = S.ui.miniBars || 50, tfSec = TF[tf] || 60;
  const data = bidCandles((S.candles[tf] || []).slice(-want));
  if(!data.length) return;
  const plotW = W - padR, plotH = H - padT - padB;
  const barsW = plotW * 0.86;                                         // free space right of the newest bar
  const unit = barsW / Math.max(want, data.length);
  const xOf = i => barsW - (data.length - i) * unit;
  let hi = S.price.ask, lo = S.price.bid;
  for(const b of data){ if(b.h > hi) hi = b.h; if(b.l < lo) lo = b.l; }
  const pad = (hi - lo) * 0.06 || 0.5; hi += pad; lo -= pad;
  const y = p => padT + (hi - p) / (hi - lo) * plotH;
  const yAsk = crispY(y(S.price.ask)), yBid = crispY(y(S.price.bid));

  // gridlines (one stroke) + price labels on the right + the date / time axis
  const step = niceStep(hi - lo, clamp(Math.round(plotH / 42), 3, 8));
  ctx.beginPath();
  ctx.font = "12.5px system-ui,'Open Sans',sans-serif"; ctx.textAlign = "left"; ctx.fillStyle = TC.ink;
  for(let p = Math.ceil(lo / step) * step; p <= hi; p += step){
    const yy = crispY(y(p));
    ctx.moveTo(0, yy); ctx.lineTo(plotW, yy);
    if(Math.abs(yy - yBid) > 11 && Math.abs(yy - yAsk) > 11) ctx.fillText(chartPx(p), plotW + 6, yy + 4);
  }
  const DAYS = DAYS_L[LANG], MON = MON_L[LANG];
  const intraday = tfSec < 14400, d0 = new Date(data[0].t * 1000);
  const dateLbl = intraday ? `${DAYS[d0.getDay()]} ${d0.getDate()} ${MON[d0.getMonth()]}` : `${MON[d0.getUTCMonth()]} ${d0.getUTCFullYear()}`;
  ctx.font = "bold 13px system-ui,'Open Sans',sans-serif";
  const dateW = ctx.measureText(dateLbl).width;
  ctx.fillText(dateLbl, 4, H - 9);
  ctx.font = "12.5px system-ui,'Open Sans',sans-serif"; ctx.textAlign = "center";
  const every = Math.max(1, Math.ceil(72 / unit));                    // a time label ~every 72 px, pinned to bar time (50 × M1 → 14 min, as in cTrader)
  for(let i = 0; i < data.length; i++){
    if(Math.round(data[i].t / tfSec) % every) continue;
    const xx = crispX(xOf(i) + unit / 2);
    ctx.moveTo(xx, padT); ctx.lineTo(xx, H - padB);
    if(xx - 22 < dateW + 12 || xx + 22 > plotW) continue;
    const d = new Date(data[i].t * 1000);
    ctx.fillText(intraday ? pad2(d.getHours()) + ":" + pad2(d.getMinutes()) : `${d.getUTCDate()} ${MON[d.getUTCMonth()]}`, xx, H - 9);
  }
  ctx.strokeStyle = TC.grid; ctx.lineWidth = hairY; ctx.stroke(); ctx.lineWidth = 1;

  // candles: pixel-aligned wick + body rects, one fill per colour
  const bodyW = Math.max(1 / pxr, snapX(unit * 0.62)), wickOff = snapX((bodyW - hairX) / 2);
  const yAskCap = y(S.price.ask), last = data.length - 1;
  for(const upPass of [true, false]){
    ctx.beginPath();
    for(let i = 0; i < data.length; i++){
      const b = data[i];
      if((b.c >= b.o) !== upPass) continue;
      const xb = snapX(xOf(i) + (unit - bodyW) / 2);
      const yh = snapY(y(b.h)), yl = snapY(y(b.l));
      ctx.rect(xb + wickOff, yh, hairX, Math.max(1 / pyr, yl - yh));
      let yo = y(b.o), yc = y(b.c);
      if(i === last && !upPass) yc = Math.min(yc, yAskCap);           // live down bar: body stops at the Ask
      const top = snapY(Math.min(yo, yc)), bot = snapY(Math.max(yo, yc));
      ctx.rect(xb, top, bodyW, Math.max(hairY, bot - top));
    }
    ctx.fillStyle = upPass ? TC.up : TC.down; ctx.fill();
  }

  // no position / order lines here: cTrader's overview chart has none (user 2026-09-18: a lone dash-dot line
  // «такого в cTrade нету») — they live on the Charts tab with their labels
  ctx.lineWidth = hairY;
  // GREEN Ask on top, RED Bid below, solid into the middle of their tags (centred, overlapping)
  ctx.strokeStyle = TC.up; ctx.beginPath(); ctx.moveTo(0, yAsk); ctx.lineTo(plotW + 6, yAsk); ctx.stroke();
  ctx.strokeStyle = TC.down; ctx.beginPath(); ctx.moveTo(0, yBid); ctx.lineTo(plotW + 6, yBid); ctx.stroke();
  ctx.lineWidth = 1;
  axisTag(ctx, plotW + 2, yAsk, padR - 4, 18, chartPx(S.price.ask), TC.up, TC.card);
  axisTag(ctx, plotW + 2, yBid, padR - 4, 18, chartPx(S.price.bid), TC.down, TC.card);
}

/* =========================================================================
   Loop
   ========================================================================= */
let rtTimer = null, uiTimer = null, _lastCounts = "", _loopRunning = false, _bootPaused = false;
/* The screen is brought up to date inside requestAnimationFrame — its DOM writes and the chart's redraw
   land right before the display paints — and at once for a price tick (uiKick from pushTick /
   quoteFlicker) instead of on the next 120 ms beat: a tick used to wait 0–120 ms for it, so ticks
   2 a second apart reached the screen 380–620 ms apart. The 120 ms beat still runs for everything
   else (clocks, P&L of a mirror); it skips a beat a tick has just drawn. */
function uiFrame(){
  _uiRaf = 0; _uiLast = performance.now();
  try{
    if(S._needRender && !modalEl){ S._needRender = false; render(); return; }
    const key = S.positions.length+"/"+S.pendings.length+"/"+S.history.length+"/"+(tradingLocked()?1:0);
    if(key !== _lastCounts && !modalEl){
      _lastCounts = key;
      if(["positions","orders","history"].includes(S.ui.tab) ||
         (S.ui.tab==="markets" && S.ui.marketOpen && ["positions","orders"].includes(S.ui.subtab))){
        render(); return;
      }
    }
    _lastCounts = key;
    updateLive();
  }catch(e){ console.error(e); }
}
function restartLoop(){
  if(rtTimer){ clearInterval(rtTimer); rtTimer = null; }
  if(normalTickTimer && XC.follower){ clearInterval(normalTickTimer); normalTickTimer = null; }
  // A mirror renders but never advances the market — only the lease holder does.
  if(!_loopRunning || XC.follower) return;         // paused / tab hidden / mirroring -> stay stopped
  rtTimer = setInterval(()=>{ try{ engineFrame(); }catch(e){ console.error(e); } }, RT_MS);
  restartNormalTicks();
}
/* fully STOP the simulation — used while the tab is hidden so nothing advances */
function stopLoop(){
  _loopRunning = false;
  if(rtTimer){ clearInterval(rtTimer); rtTimer = null; }
  if(normalTickTimer){ clearInterval(normalTickTimer); normalTickTimer = null; }
  saveNow();
}
function startLoop(){
  _loopRunning = true;
  _lastFrameReal = Date.now();     // discard any gap since the last active frame
  _lastShockMin = Math.floor((S.simClock||Date.now())/60000);
  restartLoop();
  if(uiTimer) clearInterval(uiTimer);
  _uiOn = true;
  uiTimer = setInterval(()=>{
    const now = performance.now();
    if(_uiRaf){                                                   // no frame came (a hidden / throttled page): run it here
      if(now - _uiReq < 100) return;
      cancelAnimationFrame(_uiRaf); uiFrame(); return;
    }
    if(now - _uiLast < 70) return;                                // a tick has just brought the screen up to date
    uiKick();
  }, 120);
}

/* The sim SHOULD be advancing right now (booted, not debug-paused, tab visible). */
function loopShouldRun(){
  return XC.booted && !_bootPaused &&
    document.visibilityState !== "hidden" && !document.hidden;
}
/* Resume after the tab comes back. Mobile in-app WebViews (Telegram, etc.) often
   DON'T fire visibilitychange->visible — and some suspend the interval timers
   without ever firing visibilitychange->hidden, so _loopRunning can still say
   "true" while nothing actually ticks. Detect that via a stale engine frame and
   force a clean restart. startLoop() resets _lastFrameReal, so no time leaps. */
function resumeLoop(){
  if(!loopShouldRun()) return;
  const stale = _loopRunning && (Date.now() - _lastFrameReal > 3000);
  if(!_loopRunning || stale){
    startLoop();
    // the account may have been driven elsewhere while this tab slept
    if(typeof xcResync === "function") xcResync();
  }
}

/* a phone fires resize over and over while its toolbar slides in or out: once per frame is enough */
let _resizeRaf = 0;
window.addEventListener("resize", ()=>{
  _fitGen++;
  if(!S || _resizeRaf) return;                 // resize can fire before the state is loaded
  _resizeRaf = requestAnimationFrame(()=>{
    _resizeRaf = 0;
    const ids = ["chartCanvas","miniCanvas"];
    ids.forEach(id=>{ const c = document.getElementById(id); if(c){ if(id === "chartCanvas") chartTabHeight(c); c._w = 0; fitCanvas(c); if(id === "chartCanvas") chartZones(c); } });
    if(S.ui.tab === "chart" || (S.ui.tab === "markets" && S.ui.marketOpen)) drawChart();
    drawMini();
  });
});

/* ---------------- news self-test (20×4 offline simulations) ---------------- */
function runNewsTests(n){
  n = n || 20;
  const out = {};
  for(const ty of NEWS_TYPES){
    const runs = [];
    for(let i=0;i<n;i++) runs.push(simulateNewsOffline(ty));
    const R = runs.map(r=>r.totalRange);
    const fm = runs.map(r=>r.finalMove);
    const up = runs.filter(r=>r.finalMove>0).length;
    out[ty] = {
      n, meanRange:+avg(R).toFixed(1), minRange:+Math.min(...R).toFixed(1), maxRange:+Math.max(...R).toFixed(1),
      medRange:+median(R).toFixed(1),
      pctOver35:+(R.filter(x=>x>=35).length/n*100).toFixed(0),
      pctOver75:+(R.filter(x=>x>=75).length/n*100).toFixed(0),
      pctOver100:+(R.filter(x=>x>=100).length/n*100).toFixed(0),
      up, down:n-up,
      fakeouts:runs.filter(r=>r.fakeout).length, reversals:runs.filter(r=>r.reversal).length,
      twoWay:runs.filter(r=>r.twoWay).length,
      meanFinalAbs:+avg(fm.map(Math.abs)).toFixed(1)
    };
  }
  return out;
}
function avg(a){ return a.reduce((x,y)=>x+y,0)/(a.length||1); }
function median(a){ const s=[...a].sort((x,y)=>x-y); const m=s.length>>1; return s.length%2?s[m]:(s[m-1]+s[m])/2; }

/* =========================================================================
   CLOUD SYNC + ACCOUNTS
   The simulation BELONGS TO THE ACCOUNT. The full simulator state (S) is the
   save: stored locally for speed and mirrored to the server, so signing in on
   any device resumes the same market, balance and positions.

   The price engine runs in the browser, so two devices on one account would
   advance two different markets and overwrite each other. A short server-side
   LEASE makes exactly one of them the driver — but this is INVISIBLE to the
   user: every device shows the same live terminal and can trade from it.

     driver   — holds the lease, runs the engine, publishes a mirror frame ~1/s,
                and executes the orders other devices queued
     follower — engine OFF, renders the driver's frames (prices tick, candles
                grow, positions appear), and ROUTES its own orders to the account
                instead of filling them locally; promotes itself the moment the
                driver releases the lease or goes away

   So "where you trade" does not matter — the account is the single source of
   truth, and no two devices can ever price the same gold differently.
   ========================================================================= */
const XC = {
  token: localStorage.getItem("xc_token") || null,
  email: localStorage.getItem("xc_email") || null,
  // The lease identifies a DEVICE, not a page load: it lives in localStorage so a
  // refresh reclaims its own lease instead of locking itself out for the TTL.
  sid: (function(){
    let v = null;
    try{ v = localStorage.getItem("xc_sid"); }catch(e){}
    if(!v){ v = Math.random().toString(36).slice(2) + Date.now().toString(36);
            try{ localStorage.setItem("xc_sid", v); }catch(e){} }
    return v;
  })(),
  lease: { holder:null, exp:0, mine:false, free:true },
  follower: false, rev: 0, _pollT: null,
  online: false, remoteAt: 0, _pushT: null, _pushMax: 0, _dirty: false, _inflight: false, booted: false
};
async function xcApi(method, path, body){
  const h = { "Content-Type": "application/json" };
  if(XC.token) h["Authorization"] = "Bearer " + XC.token;
  const r = await fetch(path, { method, headers: h, body: body == null ? undefined : typeof body === "string" ? body : JSON.stringify(body) });   // a string is already JSON (statePutBody)
  let data = null; try{ data = await r.json(); }catch(e){}
  if(!r.ok){ const err = new Error((data && data.error) || ("HTTP " + r.status)); err.status = r.status; err.data = data; throw err; }
  return data;
}
function xcSetSession(res){
  XC.token = res.token; XC.email = res.email || null;
  localStorage.setItem("xc_token", XC.token);
  if(XC.email) localStorage.setItem("xc_email", XC.email); else localStorage.removeItem("xc_email");
}
function xcClearSession(){
  XC.token = null; XC.email = null; XC.online = false;
  XC.follower = false; XC.lease = { holder:null, exp:0, mine:false, free:true };
  if(XC._pollT){ clearInterval(XC._pollT); XC._pollT = null; }
  LS_KEY = "xc_state_local";   // stop writing to the previous account's local cache
  localStorage.removeItem("xc_token"); localStorage.removeItem("xc_email"); localStorage.removeItem("xc_guest");
}

/* ---- lease: who is allowed to advance this account's market ---- */
async function xcClaimLease(force){
  const r = await xcApi("POST", "/api/state", { op:"claim", sid: XC.sid, force: !!force });
  XC.lease = r.lease; XC.follower = false;
  return true;
}
/* ---- the mirror frame ----
   A few KB the driver publishes ~1/s: everything that changes moment to moment,
   plus the last candles of each timeframe so a mirror's chart keeps drawing.
   The heavy blob (full candle history, settings, logs) still goes through the
   normal state push every few seconds. */
function xcLiveFrame(){
  const tail = {};
  for(const tf in S.candles){ const a = S.candles[tf]; if(a && a.length) tail[tf] = a.slice(-3); }
  return {
    simClock: S.simClock,
    price: S.price,
    day: S.day, regime: S.regime,
    account: S.account,
    positions: S.positions,
    pendings: S.pendings,
    histTop: S.history.slice(0, 15), histLen: S.history.length,
    walletBalance: S.wallet ? S.wallet.balance : null,
    lock: S.lock,
    news: { active: S.news.active, type: S.news.type, progress: S.news.progress },
    candles: tail
  };
}
/* Apply a frame onto this device's S. Only live fields are touched — the local
   chart history, settings and UI state stay as they are. */
function xcApplyLive(L){
  if(!L || !S) return;
  if(L.price) S.price = L.price;
  if(L.simClock) S.simClock = L.simClock;
  if(L.day) S.day = L.day;
  if(L.regime) S.regime = L.regime;
  if(L.account) S.account = L.account;
  if(L.positions) S.positions = L.positions;
  if(L.pendings) S.pendings = L.pendings;
  if(L.lock) S.lock = L.lock;
  if(L.walletBalance != null && S.wallet) S.wallet.balance = L.walletBalance;
  if(L.news){ S.news.active = L.news.active; S.news.type = L.news.type; S.news.progress = L.news.progress; }
  // closed trades that happened on the driver
  if(Array.isArray(L.histTop) && L.histLen !== S.history.length){
    const known = new Set(S.history.slice(0, 60).map(h => h.id));
    const fresh = L.histTop.filter(h => !known.has(h.id));
    if(fresh.length) S.history = fresh.concat(S.history);
  }
  // merge the candle tips: update the forming bar, append new ones
  for(const tf in (L.candles || {})){
    const cur = S.candles[tf] || (S.candles[tf] = []);
    for(const b of L.candles[tf]){
      const last = cur[cur.length - 1];
      if(last && last.t === b.t) cur[cur.length - 1] = b;
      else if(!last || b.t > last.t) cur.push(b);
      else { const i = cur.lastIndexOf(cur.find(x => x.t === b.t)); if(i >= 0) cur[i] = b; }
    }
    if(cur.length > TF_CAP[tf]) cur.splice(0, cur.length - TF_CAP[tf]);
  }
  recalcAccount();
}

/* Turn this tab into a live MIRROR: the engine stops (only the driver may move
   the market) but the terminal keeps rendering, fed by the driver's frames —
   prices tick, candles grow, positions appear and close on their own. */
function xcBecomeFollower(lease){
  XC.lease = lease || { holder:"other", exp:0, mine:false, free:false };
  if(XC.follower) return;
  XC.follower = true;
  restartLoop();                                  // drops the engine timers, keeps the UI loop
  if(!XC._pollT) XC._pollT = setInterval(xcPollLive, 1200);
  xcPollLive();
  render();
}
/* Mirror heartbeat: pull the driver's frame, apply it, and promote this device
   the moment the driver stops holding the lease. */
async function xcPollLive(){
  if(!XC.token || !XC.follower) return;
  try{
    const m = await xcApi("GET", "/api/state?live=1&sid=" + encodeURIComponent(XC.sid));
    XC.online = true;
    if(m.lease && (m.lease.free || m.lease.mine)) return xcTakeOver(false);   // driver left -> take the wheel
    if(m.live) xcApplyLive(m.live);
    // the driver pushed a full state (new day, settings, long history) -> resync
    if((m.rev || 0) > XC.rev){
      XC.rev = m.rev;
      const r = await xcApi("GET", "/api/state?sid=" + encodeURIComponent(XC.sid));
      if(r && r.state){ const ui = S && S.ui; S = r.state; migrateState(); if(ui) S.ui = ui; normalizeState(); }
    }
    if(!modalEl) render();
  }catch(e){ XC.online = false; }
}
/* Driver side: publish the frame ~1/s so mirrors stay in step. */
function xcStartLivePublish(){
  if(XC._liveT) return;
  XC._liveT = setInterval(()=>{
    if(!XC.token || XC.follower || !S || !_loopRunning) return;
    if(XC._liveBusy) return;
    XC._liveBusy = true;
    xcApi("POST", "/api/state", { op:"live", sid: XC.sid, live: xcLiveFrame() })
      .then(r=>{ XC._liveBusy = false; XC.online = true;
                 if(r && r.ops && r.ops.length) execRemoteOps(r.ops); })
      .catch(e=>{ XC._liveBusy = false;
        if(e.status === 409) xcBecomeFollower(e.data && e.data.lease); });
  }, 1200);
}
/* Become the driver: claim (optionally stealing), pull the authoritative state,
   then run. This is the ONLY way a session starts advancing the market. */
async function xcTakeOver(force){
  try{
    await xcClaimLease(force);
    const r = await xcApi("GET", "/api/state?sid=" + encodeURIComponent(XC.sid));
    if(r && r.state){ S = r.state; migrateState(); XC.rev = r.rev || 0; XC.remoteAt = r.updatedAt; saveNow(); }
    else if(!S) load(true);              // nothing on the server yet -> local cache / fresh
    XC.follower = false;
    if(XC._pollT){ clearInterval(XC._pollT); XC._pollT = null; }
    normalizeState();
    anchorClockToReal(false);            // an idle account's calendar comes to today
    render();
    startLoop();
    xcStartLivePublish();
    xcPushState(true);
  }catch(e){
    if(e.status === 409){ xcBecomeFollower(e.data && e.data.lease); return; }
    toast("r", L("Не удалось подключиться: {0}", L(e.message || "ошибка")));
  }
}

function xcPushState(force){
  if(!XC.token || XC.follower) return;          // a follower must never write the account's market
  XC._dirty = true;
  const go = ()=>{
    clearTimeout(XC._pushT); clearTimeout(XC._pushMax); XC._pushT = null; XC._pushMax = 0;
    if(!XC._dirty || XC._inflight) return;
    XC._inflight = true; XC._dirty = false;
    xcApi("PUT", "/api/state", statePutBody())
      .then(res=>{ XC._inflight = false; XC.online = true; XC.remoteAt = res.updatedAt;
                   XC.rev = res.rev; XC.lease = res.lease; syncBadge(); })
      .catch(e=>{
        XC._inflight = false; XC.online = false;
        // another device took the terminal over -> stand down instead of fighting it
        if(e.status === 409){ XC._dirty = false; xcBecomeFollower(e.data && e.data.lease); return; }
        XC._dirty = true; syncBadge();
      });
  };
  if(force){ go(); return; }
  clearTimeout(XC._pushT);
  XC._pushT = setTimeout(go, 3500);
  // the 3.5 s debounce gets starved during continuous play; a flush every 8 s also
  // renews the lease well inside its 20 s TTL
  if(!XC._pushMax) XC._pushMax = setTimeout(go, 8000);
}
/* Reliable save on the way out. visibilitychange->hidden already fired an async
   force-push; this is the belt-and-suspenders path for real page teardown.
   The state (mostly chart candles) is well over sendBeacon's 64 KB limit, so a
   synchronous same-origin XHR is used during unload (permitted for unload handlers). */
function xcPushBeacon(){
  saveNow();
  if(!XC.token || XC.follower) return;   // always flush the latest state on the way out
  const t = Date.now();
  if(t - (XC._beaconAt || 0) < 1500) return;   // pagehide + beforeunload both fire -> send once
  XC._beaconAt = t;
  const body = statePutBody();
  try{
    if(body.length < 60000 && navigator.sendBeacon){
      const blob = new Blob([body], { type: "application/json" });
      if(navigator.sendBeacon("/api/state?token=" + encodeURIComponent(XC.token), blob)){ XC._dirty = false; return; }
    }
    const xhr = new XMLHttpRequest();
    xhr.open("PUT", "/api/state", false);   // sync: must complete before the page is gone
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.setRequestHeader("Authorization", "Bearer " + XC.token);
    xhr.send(body);
    XC._dirty = false;
  }catch(e){
    try{
      fetch("/api/state", { method:"PUT", keepalive:true,
        headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + XC.token }, body }).catch(()=>{});
    }catch(e2){}
  }
}
function syncBadge(){
  const el = document.getElementById("xcSync");
  if(!el) return;
  el.textContent = XC.follower ? L("◐ другое устройство") : (XC.online ? L("● облако") : L("○ нет связи"));
  el.style.color = XC.follower ? "var(--orange-ink)" : (XC.online ? "var(--green-ink)" : "var(--ink3)");
}

/* Before the account exists there is no liquid glass: the sign-in screen is plain, whatever this device has saved
   (user: «перед входом уберите везде жидкое стекло … там по дефолту нельзя»). The saved choice is untouched —
   normalizeState() puts it back the moment the account is in. */
function authPlain(){ document.documentElement.dataset.glass = "off"; }
/* ---------- auth screen ----------
   Account required — guest mode was removed. A new visitor lands on
   "Регистрация" because they must create an account before they can sign in. */
let _authMode = localStorage.getItem("xc_email") ? "login" : "register";
function screenAuth(msg, kind){
  if(_authMode === "reset") return screenReset(msg, kind);
  const t = _authMode, reg = t === "register";
  const bad = kind === "err";
  authPlain();
  app().innerHTML = `
    <div class="wrap" style="max-width:420px;margin:0 auto;padding-top:26px">
      <div class="card" style="text-align:center;padding:26px 16px">
        <div style="font-size:clamp(24px,8vw,30px);font-weight:700;letter-spacing:.09em;white-space:nowrap">XAUCORE</div>
      </div>
      <div class="card">
        <div class="seg" style="margin-bottom:14px">
          <button data-am="register" class="${reg?'on':''}">${L("Регистрация")}</button>
          <button data-am="login" class="${!reg?'on':''}">${L("Вход")}</button>
        </div>
        ${msg?`<div class="hint" style="color:${bad?'var(--red-ink)':'var(--green-ink)'};font-weight:600;margin-bottom:8px">${msg}</div>`:""}
        <div class="field"><label>Email</label><input id="au-email" type="email" inputmode="email" autocomplete="email" value="${XC.email||''}"></div>
        <div class="field"><label>${L("Пароль")}${reg?" "+L("(минимум 6 символов)"):''}</label><input id="au-pass" type="password" autocomplete="${reg?'new-password':'current-password'}"></div>
        ${reg?`<div class="field"><label>${L("Повторите пароль")}</label><input id="au-pass2" type="password" autocomplete="new-password"></div>`:""}
        <button class="btn green" id="au-go">${reg?L("Создать аккаунт"):L("Войти")}</button>
        ${reg ? "" : `<button type="button" class="btn ghost" id="au-forgot" style="margin-top:10px">${L("Забыли пароль?")}</button>`}
        <div class="hint" style="margin-top:10px;text-align:center">
          ${reg ? L("Аккаунт хранит вашу симуляцию: цену, баланс, позиции и историю. Войдя с любого устройства, вы продолжите с того же места.")
                : L("Ещё нет аккаунта? Откройте «Регистрация» — это займёт полминуты.")}
        </div>
      </div>
    </div>`;
  app().querySelectorAll("[data-am]").forEach(b=> b.onclick = ()=>{ _authMode = b.dataset.am; screenAuth(); });
  const val = id => (document.getElementById(id) ? (document.getElementById(id).value||"") : "");
  const go = async ()=>{
    const email = val("au-email").trim(), pass = val("au-pass");
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return screenAuth(L("Введите корректный email"), "err");
    if(reg){
      if(pass.length < 6) return screenAuth(L("Пароль минимум 6 символов"), "err");
      if(pass !== val("au-pass2")) return screenAuth(L("Пароли не совпадают"), "err");
    }else if(!pass) return screenAuth(L("Введите пароль"), "err");
    const btn = document.getElementById("au-go"); btn.disabled = true; btn.textContent = "…";
    try{
      const res = await xcApi("POST", reg ? "/api/auth/register" : "/api/auth/login", { email, password: pass });
      if(reg) try{ localStorage.setItem("xc_glass", "off"); }catch(e){}   // a new account starts plain; the mode is theirs to turn on
      xcSetSession(res);
      await bootAfterAuth(true);
    }catch(e){
      if(reg && e.status === 409){ _authMode = "login"; return screenAuth(L("Этот email уже зарегистрирован — войдите"), "err"); }
      screenAuth(L(e.message || "Ошибка"), "err");
    }
  };
  document.getElementById("au-go").onclick = go;
  { const f = document.getElementById("au-forgot");
    if(f) f.onclick = ()=>{ _rs = { step: "ask", email: (val("au-email") || XC.email || "").trim() }; _authMode = "reset"; screenAuth(); }; }
  ["au-pass","au-pass2","au-email"].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener("keydown", e=>{ if(e.key === "Enter") go(); });
  });
  glassDrops(app());                   // with glass on, the choice in both switches is a drop (render() isn't used here)
}

/* ---------- forgotten password: a code by mail, then a new password ----------
   The code lives 15 minutes, five wrong tries burn it, and setting the password signs every other device out. */
let _rs = { step: "ask", email: "" };
function screenReset(msg, kind){
  const code = _rs.step === "code", bad = kind === "err";
  authPlain();
  app().innerHTML = `
    <div class="wrap" style="max-width:420px;margin:0 auto;padding-top:26px">
      <div class="card" style="text-align:center;padding:26px 16px">
        <div style="font-size:clamp(24px,8vw,30px);font-weight:700;letter-spacing:.09em;white-space:nowrap">XAUCORE</div>
        <div style="margin-top:6px;font-size:15px;color:var(--ink2)">${L("Восстановление пароля")}</div>
      </div>
      <div class="card">
        ${msg?`<div class="hint" style="color:${bad?'var(--red-ink)':'var(--green-ink)'};font-weight:600;margin-bottom:8px">${msg}</div>`:""}
        ${code ? `
          <div class="hint" style="margin-bottom:10px">${L("Введите код из письма")} — <b>${_rs.email}</b></div>
          <div class="field"><label>${L("Код из письма")}</label><input id="rs-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" class="mono" style="letter-spacing:.3em"></div>
          <div class="field"><label>${L("Новый пароль")} ${L("(минимум 6 символов)")}</label><input id="rs-pass" type="password" autocomplete="new-password"></div>
          <div class="field"><label>${L("Повторите пароль")}</label><input id="rs-pass2" type="password" autocomplete="new-password"></div>
          <button class="btn green" id="rs-go">${L("Сохранить пароль")}</button>
          <button class="btn ghost" id="rs-again" style="margin-top:8px">${L("Отправить код ещё раз")}</button>
        ` : `
          <div class="hint" style="margin-bottom:10px">${L("Мы пришлём код на вашу почту — он действует 15 минут.")}</div>
          <div class="field"><label>Email</label><input id="rs-email" type="email" inputmode="email" autocomplete="email" value="${_rs.email||''}"></div>
          <button class="btn green" id="rs-send">${L("Прислать код")}</button>
        `}
        <button class="btn ghost" id="rs-back" style="margin-top:8px">${L("Вернуться ко входу")}</button>
      </div>
    </div>`;
  const val = id => (document.getElementById(id) ? (document.getElementById(id).value||"") : "");
  const busy = (id, on) => { const b = document.getElementById(id); if(b){ b.disabled = on; if(on) b.textContent = "…"; } };
  const send = async ()=>{
    const email = (code ? _rs.email : val("rs-email")).trim().toLowerCase();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return screenReset(L("Введите корректный email"), "err");
    busy(code ? "rs-again" : "rs-send", true);
    try{
      await xcApi("POST", "/api/auth/forgot", { email, lang: LANG });
      _rs = { step: "code", email };
      screenReset(L("Код отправлен — проверьте почту"), "ok");
    }catch(e){ _rs.email = email; screenReset(L(e.message || "Ошибка"), "err"); }
  };
  const save = async ()=>{
    const c = val("rs-code").replace(/\D/g, ""), p = val("rs-pass");
    if(c.length !== 6) return screenReset(L("Введите код из письма"), "err");
    if(p.length < 6) return screenReset(L("Пароль минимум 6 символов"), "err");
    if(p !== val("rs-pass2")) return screenReset(L("Пароли не совпадают"), "err");
    busy("rs-go", true);
    try{
      const res = await xcApi("POST", "/api/auth/reset", { email: _rs.email, code: c, password: p });
      xcSetSession(res);
      _authMode = "login"; _rs = { step: "ask", email: "" };
      toast("g", L("Пароль обновлён — вы вошли"));
      await bootAfterAuth(true);
    }catch(e){ screenReset(L(e.message || "Ошибка"), "err"); }
  };
  const back = document.getElementById("rs-back");
  if(back) back.onclick = ()=>{ _authMode = "login"; _rs = { step: "ask", email: _rs.email }; screenAuth(); };
  const b1 = document.getElementById("rs-send"); if(b1) b1.onclick = send;
  const b2 = document.getElementById("rs-again"); if(b2) b2.onclick = send;
  const b3 = document.getElementById("rs-go"); if(b3) b3.onclick = save;
  ["rs-email","rs-code","rs-pass","rs-pass2"].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener("keydown", e=>{ if(e.key === "Enter") (code ? save() : send()); });
  });
}

/* ---------- state fixups applied whenever S is (re)loaded ---------- */
function normalizeState(){
  const d = DEFAULTS();
  if(!S.candles || !S.candles.M1 || !S.candles.M1.length) seedMarket();
  if(!S.news) S.news = d.news;
  if(!S.lock) S.lock = { active:false, until:0 };
  if(!S.newsLog) S.newsLog = [];
  if(!S.dayLog) S.dayLog = [];
  if(!S.newsEngine) S.newsEngine = { tickHzNewsMin:20, tickHzNewsMax:50, perEvent: newsEngineDefaults() };
  S.news.active = false; S.lock.active = false;   // never resume a news event across a session
  S.news.delta = 0; S.news._vel = 0; S.news.decayUntil = 0;
  if(!S.manual) S.manual = { enabled:false, frozen:false, impulse:null };
  S.manual.impulse = null;                         // never resume an impulse across a session
  if(S.price.vel == null) S.price.vel = 0;
  if(S.price.volCluster == null) S.price.volCluster = 1;
  if(S.price.ema == null) S.price.ema = S.price.mid;
  if(S.price.emaFast == null) S.price.emaFast = S.price.mid;
  if(S.regime){ if(S.regime.ageMs == null) S.regime.ageMs = 0; delete S.regime.startReal; delete S.regime.endReal; }
  if(S.day){ if(S.day.elapsedMs == null) S.day.elapsedMs = 0; delete S.day.startReal; delete S.day.endReal; }
  if(!S.regime) startRegime(null);
  if(!S.day) startNewDay(S.price.mid);
  if(S.market.ticksPerSecond == null || !(S.market.ticksPerSecond > 0)) S.market.ticksPerSecond = 2;
  if(!S.ui) S.ui = { ...d.ui };
  if(S.ui.marketOpen == null) S.ui.marketOpen = false;   // land on the "Рынки" watchlist
  // theme: a local override (last used on THIS device) wins, else the saved state, else light
  { let lt = null; try{ lt = localStorage.getItem("xc_theme"); }catch(e){}
    S.ui.theme = (lt === "dark" || lt === "light") ? lt : (S.ui.theme === "dark" ? "dark" : "light");
    applyTheme(S.ui.theme); }
  // liquid glass: the same — this device's last choice, else the saved state, else on
  { let lg = null; try{ lg = localStorage.getItem("xc_glass"); }catch(e){}
    S.ui.glass = lg === "off" ? false : lg === "on" ? true : S.ui.glass !== false;
    applyGlass(S.ui.glass); }
  if(!S.wallet) S.wallet = { ...d.wallet, ledger: [] };
  if(S.wallet.balance == null) S.wallet.balance = d.wallet.balance;
  if(!Array.isArray(S.wallet.ledger)) S.wallet.ledger = [];
  if(!S.wallet.cardBrand) S.wallet.cardBrand = d.wallet.cardBrand;
  lockLotLimits();
  recalcAccount();
}

function finishBoot(){
  if(XC.booted) return;
  XC.booted = true;
  normalizeState();
  if(anchorClockToReal(false)) saveNow();   // an old or idle account's calendar comes to today
  render();
  // start advancing only if the page is actually visible; ?boot=paused -> restore only (debug).
  // if it loads into a background tab, the loop starts on the first resume signal.
  _bootPaused = /[?&]boot=paused/.test(location.search);
  if(!_bootPaused && document.visibilityState !== "hidden") startLoop();
  syncBadge();

  wireLifecycle();
}

/* one-time — finishBoot() re-runs after logout/login, addEventListener dedups the
   handlers but setInterval would stack, so guard the whole block. */
let _lifecycleWired = false;
function wireLifecycle(){
  if(_lifecycleWired) return;
  _lifecycleWired = true;
  // pause the WHOLE simulation while the tab is hidden -> nothing advances while away
  document.addEventListener("visibilitychange", ()=>{
    if(document.hidden){
      if(_loopRunning){
        stopLoop(); xcPushState(true);
        // let another device pick the market up in ~1s instead of after the TTL
        if(XC.token && !XC.follower) xcApi("POST","/api/state",{op:"release",sid:XC.sid}).catch(()=>{});
      }
    }
    else resumeLoop();
  });
  // Belt-and-suspenders resume: Telegram / other in-app WebViews are unreliable
  // about visibilitychange, and can suspend the interval timers outright. Catch
  // every "we're back" signal, plus a slow watchdog that self-heals a dead loop.
  window.addEventListener("pageshow", resumeLoop);          // bfcache restore
  window.addEventListener("focus", resumeLoop);
  document.addEventListener("resume", resumeLoop);          // Page Lifecycle (Chromium)
  window.addEventListener("touchstart", resumeLoop, { passive:true });
  setInterval(resumeLoop, 2000);
  window.addEventListener("pagehide", xcPushBeacon);
  window.addEventListener("beforeunload", xcPushBeacon);
}

/* start without a server (only reachable for an already-signed-in session whose
   network is down — the local cache keeps the account playable offline) */
function startOffline(){
  load();
  finishBoot();
}

/* After a successful auth: identify the account, take the driving lease, then
   pull ITS state. The server copy always wins — that is what makes two devices
   on one account show the same market instead of two drifting ones. */
async function bootAfterAuth(){
  try{
    const me = await xcApi("GET", "/api/me");
    XC.email = me.email || null;
    if(me.id) LS_KEY = "xc_state_" + me.id;   // per-user local cache -> no cross-account bleed
    if(XC.email) localStorage.setItem("xc_email", XC.email);
  }catch(e){
    if(e.status === 401){ xcClearSession(); return screenAuth(L("Сессия истекла — войдите снова"), "err"); }
  }

  try{ await xcClaimLease(false); }
  catch(e){
    if(e.status === 409){
      // Another device drives this account: pull its full state once (chart
      // history, settings), then follow it live frame by frame.
      try{
        const r = await xcApi("GET", "/api/state?sid=" + encodeURIComponent(XC.sid));
        if(r && r.state){ S = r.state; migrateState(); XC.rev = r.rev || 0; }
      }catch(e2){}
      if(!S) load(true);
      normalizeState();
      XC.booted = true;
      wireLifecycle();
      startLoop();                       // UI loop only — restartLoop() withholds the engine
      xcBecomeFollower(e.data && e.data.lease);
      return;
    }
    // any other failure (offline) -> carry on with the local cache
  }

  try{
    const r = await xcApi("GET", "/api/state?sid=" + encodeURIComponent(XC.sid));
    if(r && r.state){
      S = r.state;                      // the account's own state wins -> exact resume
      if(S.version >= 2) migrateState();
      XC.online = true; XC.remoteAt = r.updatedAt; XC.rev = r.rev || 0;
      saveNow();
    } else {
      // nothing on the server for this account
      // nothing on the server for this account: its own cache on this device, else a
      // FRESH market at a random start price. Other accounts' caches and the old
      // single-player save are never adopted — a new registration used to inherit
      // their gold price instead of getting its own.
      load();
    }
  }catch(e){
    if(e.status === 401){ xcClearSession(); return screenAuth(L("Сессия истекла — войдите снова"), "err"); }
    XC.online = false;
    load(true);                         // network error -> offline cache
  }
  finishBoot();
  xcStartLivePublish();                 // mirrors on other devices follow these frames
  xcPushState(true);                    // make sure the server has the current state
}

/* Coming back to a tab that has been idle: the account may have been driven from
   another device meanwhile, so re-take the lease and re-pull before resuming. */
async function xcResync(){
  if(!XC.token || !XC.booted || XC.follower) return;
  if(Date.now() - (XC._syncAt || 0) < 4000) return;
  XC._syncAt = Date.now();
  try{
    const m = await xcApi("GET", "/api/state?meta=1&sid=" + encodeURIComponent(XC.sid));
    XC.online = true;
    if(m.lease && !m.lease.free && !m.lease.mine){ xcBecomeFollower(m.lease); return; }
    if((m.rev || 0) > XC.rev){          // someone else advanced it -> adopt their state
      const r = await xcApi("GET", "/api/state?sid=" + encodeURIComponent(XC.sid));
      if(r && r.state){ S = r.state; migrateState(); normalizeState(); XC.rev = r.rev || 0; saveNow(); render(); }
    }
    await xcClaimLease(false).catch(()=>{});
  }catch(e){ XC.online = false; }
}
