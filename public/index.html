const app = () => document.getElementById("app");
/* Touch ripple, cTrader's (its Android tab bar, a screen recording): touching a tab or a row lights
   its cell grey and a circle spreads from the finger; it fades once the finger lifts. Drawn in a
   layer OUTSIDE #app, laid over the element, so it plays on when the tap re-renders the screen (a
   tab switch) — and nothing inside the page moves. (Animated screen transitions were tried instead
   and rejected: a sliding wrap dragged the fixed «Новый ордер» up the screen for a moment.) */
/* A swipe that merely starts on a row is a scroll, not a press (user: «работает, даже если просто
   листаю, а нужно, когда заходить прям буду»), so — like Android — the ripple waits: it lights up
   after a 110 ms hold on the spot, or on the tap itself (click) for a quicker touch; a finger that
   moves 8 px, or a pointercancel (the page took the gesture to scroll), puts it out / never starts it. */
const RIPPLE_WAVE = ".wl-row, .lrow[data-posdetail], .otbl-row[data-modord], .menu-item, .tfsheet button";   // the rows that press like cTrader's
const RIPPLE_SEL = RIPPLE_WAVE + ", .ne-card > summary";   // + the tab bar and subtabs with liquid glass off (on, their drops are the feedback)
const RIPPLE_SEL_FLAT = RIPPLE_SEL + ", .bottomnav button, .subtabs button";
let _rip = null;                                                 // the press being watched
function rippleShow(el, cx, cy){
  const r = el.getBoundingClientRect(), rad = getComputedStyle(el).borderRadius;
  // pinned to the page, so it scrolls with its row (fixed to the screen it stayed put while the list
  // moved away under it); on the fixed / sticky bars it stays on the screen with them
  const onScreen = !!el.closest(".bottomnav, .subtabs, .modal, .appbar, .wl-topbar");
  const b = onScreen ? null : document.body.getBoundingClientRect();   // body is position:relative (and centred on a wide screen)
  const ox = onScreen ? 0 : -b.left, oy = onScreen ? 0 : -b.top;
  const box = document.createElement("div");
  box.className = "ripple";
  box.style.cssText = `position:${onScreen ? "fixed" : "absolute"};left:${r.left + ox}px;top:${r.top + oy}px;width:${r.width}px;height:${r.height}px;border-radius:${rad && rad !== "0px" ? rad : "6px"}`;
  if(el.matches(RIPPLE_WAVE)){                                    // the light spreading from the finger
    const x = clamp(cx - r.left, 0, r.width), y = clamp(cy - r.top, 0, r.height);
    const rr = Math.hypot(Math.max(x, r.width - x), Math.max(y, r.height - y)) * 1.08;
    const w = document.createElement("i"); w.className = "rw";
    w.style.cssText = `left:${x}px;top:${y}px;width:${2 * rr}px;height:${2 * rr}px`;
    box.classList.add("wave"); box.appendChild(w);
  }
  document.body.appendChild(box);
  requestAnimationFrame(() => box.classList.add("on"));
  return { box, t0: performance.now() };
}
function rippleFade(R, now){
  if(!R) return;
  setTimeout(() => { R.box.classList.add("out"); setTimeout(() => R.box.remove(), 300); }, now ? 0 : Math.max(0, 200 - (performance.now() - R.t0)));   // a quick tap still shows it
}
function rippleDrop(P){ clearTimeout(P.timer); clearTimeout(P.upT); if(P.shown) rippleFade(P.shown, true); if(_rip === P) _rip = null; }
document.addEventListener("pointerdown", e => {
  if(e.button > 0) return;
  const el = e.target.closest && e.target.closest(RIPPLE_SEL + (glassOn("nav") ? "" : ", .bottomnav button") + (glassOn("drops") ? "" : ", .subtabs button"));
  if(_rip) rippleDrop(_rip);
  if(!el || el.disabled || el.getAttribute("aria-disabled") === "true") return;
  const inner = e.target.closest("button, a, input, select, textarea");
  if(inner && inner !== el && el.contains(inner)) return;
  const P = _rip = { el, id: e.pointerId, x: e.clientX, y: e.clientY, shown: null };
  P.timer = setTimeout(() => { if(_rip === P && !P.shown) P.shown = rippleShow(el, P.x, P.y); }, 110);
}, { capture: true, passive: true });
document.addEventListener("pointermove", e => {
  const P = _rip;
  if(P && e.pointerId === P.id && Math.hypot(e.clientX - P.x, e.clientY - P.y) > 8) rippleDrop(P);
}, { capture: true, passive: true });
document.addEventListener("pointercancel", e => { if(_rip && e.pointerId === _rip.id) rippleDrop(_rip); }, { capture: true, passive: true });
document.addEventListener("pointerup", e => {
  const P = _rip;
  if(!P || e.pointerId !== P.id) return;
  clearTimeout(P.timer);
  P.upT = setTimeout(() => rippleDrop(P), 350);                   // no tap followed (the element went away…)
}, { capture: true, passive: true });
let _ripReplay = null;                                           // a tap held back for its ripple, being let through
document.addEventListener("click", e => {                         // capture: before the tap re-renders the screen
  const P = _rip;
  if(_ripReplay && _ripReplay.contains(e.target)){ _ripReplay = null; return; }
  if(!P || !P.el.contains(e.target)) return;
  clearTimeout(P.timer); clearTimeout(P.upT);
  _rip = null;
  const el = P.el, stays = !!el.closest(".ne-card");
  // A tap that opens another screen — a row, a bottom tab, a XAUUSD subtab (every render replaces
  // them) — must leave no ripple on the screen it opens (user: «видно, когда уже перешли во вкладку»,
  // then «не везде удалили … нужно везде»): it goes before that screen paints. A quick tap had then
  // shown nothing at all («когда быстро нажать, оно не успевает отобразиться») — so a quick tap is
  // held back 140 ms while its ripple lights, then let through. Only sections that open in place
  // (settings) keep their element, and their ripple fades where it is.
  // …and a tap that opens a sheet over the screen («Создать Synthetic News», «Последний News Result»,
  // confirmations) counts as a new screen too: the ripple was left fading on top of the sheet
  const m0 = modalEl;
  const leftScreen = () => !el.isConnected || (!!modalEl && modalEl !== m0) || !!el.closest(".modal.closing");
  if(!P.shown){
    P.shown = rippleShow(el, P.x, P.y);
    if(!stays){
      e.preventDefault(); e.stopImmediatePropagation();
      const R = P.shown;
      setTimeout(() => {
        const m1 = modalEl;
        _ripReplay = el; el.click(); _ripReplay = null;
        if(!el.isConnected || (!!modalEl && modalEl !== m1) || el.closest(".modal.closing")) R.box.remove(); else rippleFade(R);
      }, el.matches(RIPPLE_WAVE) ? 190 : 140);
      return;
    }
  }
  rippleFade(P.shown);
  const R = P.shown;
  setTimeout(() => { if(!stays && leftScreen()) R.box.remove(); }, 0);
}, true);
let modalEl = null, OT = null, _otMenu = null, _lotList = null;                 // the open sheet; the order ticket («Разместить ордер») and its menu
/* iOS 26 switches (glassOn("switches")): pressed, the knob swells into a clear lens that a drag moves along the
   track; let go past the middle it switches (one click, ours), a tap switches as ever; then it wobbles still */
let _sw = null, _swSkip = 0;
const lgOffHas = f => (" " + (document.documentElement.dataset.lgoff || "") + " ").includes(" " + f + " ");
// the glass's own switch is liquid with the glass off too (the CSS: .switch[data-glass-toggle])
const swMaster = sw => sw.matches("[data-glass-toggle]") && !lgOffHas("switches");
const swLiquid = sw => glassOn("switches") || swMaster(sw);
function swLens(sw, on){                                          // the lens bends the track at its rim (Chromium)
  const k = sw.querySelector(".knob"); if(!k) return;
  if(on) lgGlass(k, 60, 40, 7, .3, swMaster(sw) && !lgOffHas("refract"));   // a mild bend: past the track the lens shows what is around it, as in the video
  else { k._lg = null; k.style.backdropFilter = ""; }
}
// what a switch changes is applied once it has played (lens → slide → frost → knob): applied at once, the render
// or the glass going off replaced / flattened it on the spot. `fn` reads the switch's state when it runs, so a
// quick second tap that turns it back changes nothing.
function swAfter(sw, fn){ if(sw._busy) sw._after = fn; else fn(); }
function swSettled(sw){ sw._busy = false; const f = sw._after; sw._after = null; if(f) f(); }
document.addEventListener("pointerdown", e => {
  const sw = e.button > 0 ? null : e.target.closest && e.target.closest(".switch");
  if(!sw || !swLiquid(sw)) return;
  clearTimeout(sw._swT); clearTimeout(sw._swF); sw._busy = true;
  _sw = { sw, id: e.pointerId, x0: e.clientX, on: sw.classList.contains("on"), kx: 0, moved: false, t0: performance.now() };
  sw.style.setProperty("--kx", "0px"); sw.classList.remove("frost", "slid"); sw.classList.add("press");
  swLens(sw, true);
}, { capture: true, passive: true });
document.addEventListener("pointermove", e => {
  const P = _sw; if(!P || e.pointerId !== P.id) return;
  const dx = e.clientX - P.x0; if(Math.abs(dx) > 5) P.moved = true;
  P.kx = clamp(dx, P.on ? -16 : 0, P.on ? 0 : 16);
  P.sw.style.setProperty("--kx", P.kx.toFixed(1) + "px");
}, { capture: true, passive: true });
// let go: the switch changes (the tap's click, or ours after a drag) while it is still a lens — it slides over and
// the track recolours under it; then it frosts and shrinks back into the white knob
const swEnd = (e, go) => {
  const P = _sw; if(!P || e.pointerId !== P.id) return;

  sw._swT = setTimeout(() => {                                     // the lens has grown (.2 s) and slid (.2 s) — ~.3 s in all, as in the video
    sw.classList.remove("press", "slid"); sw.classList.add("frost"); swLens(sw, false);
    sw._swF = setTimeout(() => { sw.classList.remove("frost"); sw._swF = setTimeout(() => swSettled(sw), 100); }, 110);
  }, Math.max(170, 280 - held));
};
document.addEventListener("pointerup", e => swEnd(e, true), { capture: true, passive: true });
document.addEventListener("pointercancel", e => swEnd(e, false), { capture: true, passive: true });
document.addEventListener("click", e => {
  if(e.isTrusted && performance.now() - _swSkip < 400 && e.target.closest && e.target.closest(".switch")){ e.stopImmediatePropagation(); e.preventDefault(); }
}, true);
// the button that opens a sheet morphs into it (glassOn("morph")): noted on its tap, used by openSheet
const MORPH_SEL = '[data-act="newticket"], [data-act="lotpick"], [data-act="appmenu"]';
let _morphFrom = null, _morphT = 0;
document.addEventListener("click", e => {

}, true);
// a glass ghost from rect a (radius ra) onto an element: `to()` is asked EVERY frame, so a target that moves, grows
// or is re-rendered on the way (the «м1» pill turning «м30», a button replaced by render()) is followed and the ghost
// lands exactly on it, in its shape (user: «плашка исчезает не там где надо, а криво между ними»). With `hide`, the
// element it lands on stays hidden until it has landed — no twin. Ease: a soft spring, no overshoot (it never grows
// past its target — that hung a second rim above the card; user: «как будто не успевает за основной плашкой»).
// near() fires at 90 %: the target shows then and the ghost melts into it.
// `key` names the surface («tf», «sheet»): it has ONE ghost. A new morph there stops the one in flight and starts from
// where that one is — a quick second tap turns the ghost round instead of leaving the big one to finish growing
// beside a small one (user: «когда быстро тапнуть на таймфрейм, окно большое почему-то не успевает закрыться»).

const lgStop = key => _lgRun[key] ? _lgRun[key].stop() : null;
/* THE DROP (iOS 26 / 27 — user 2026-09-20: «нужно открытие именно эффектом капли»): a window or a menu does not just
   grow out of its button, it FLOWS out of it. The growing blob and the button's droplet hang on a neck that stretches
   and thins as they pull apart; about halfway the neck snaps and the droplet is drawn in after it; the blob, stretched
   along its way while it moves, settles into the window's shape without ever running past it. Blob + droplet + neck are
   drawn as ONE clip-path on the glass ghost, so its body, its rim and what shows through all take the liquid shape. */
const LG_NECK = .5;                                                // the neck is gone by here
const _P = (x, y) => x.toFixed(2) + "," + y.toFixed(2);
function lgRR(x, y, w, h, r){                                      // a rounded rect, as a path
  r = Math.max(0, Math.min(r, Math.min(w, h) / 2));
  const x2 = x + w, y2 = y + h, A = (ax, ay) => "A" + r.toFixed(2) + "," + r.toFixed(2) + " 0 0 1 " + _P(ax, ay);
  return "M" + _P(x + r, y) + "L" + _P(x2 - r, y) + A(x2, y + r) + "L" + _P(x2, y2 - r) + A(x2 - r, y2)

function closeTFPop(now, outside){

  else P.catcher.remove();

function toast(kind, msg){
  const w = document.getElementById("toasts");
  const t = document.createElement("div");
  t.className = "toast " + (kind||"");
  t.textContent = msg;
  w.appendChild(t);
  if(glassOn("toasts")) requestAnimationFrame(() => lgGlass(t, t.offsetWidth, t.offsetHeight, 0, 6));
  setTimeout(()=>{ t.style.transition="opacity var(--mo-exit), transform var(--mo-std)"; t.style.opacity="0"; if(glassOn("toasts")) t.style.transform="translateY(-8px) scale(.9)"; setTimeout(()=>t.remove(),300); }, 3200);

/* something that cannot be pressed still answers the finger — a short shake on the spot, the same spring as every
   other deformation, so a dead row reads as «no» instead of just doing nothing (user 2026-09-21) */
function moNudge(el){
  if(!el || el._nudge) return;
  el._nudge = 1;
  let x = 0, v = MO.soft ? 150 : 250, t0 = 0;
  const step = now => {
    if(!el.isConnected){ el._nudge = 0; return; }
    const dt = t0 ? Math.min(Math.max((now - t0) / 1000, 0), 1 / 30) : MO.dt0; t0 = now;
    v = MO.sp(v, x, 0, MO.P.jelly, dt); x += v * dt;
    if(Math.abs(x) < .12 && Math.abs(v) < 6){ el.style.removeProperty("transform"); el._nudge = 0; return; }
    el.style.transform = "translate3d(" + x.toFixed(2) + "px,0,0)";
    moAdd(step);
  };
  moAdd(step);
}

/* A SCREEN ARRIVES FROM SOMEWHERE. Tapping a tab to the right brings the next screen in from the right and the
   other way round: the interface has a left and a right, and the move says which way you went. The bar and the
   tab strip hold still, as they do on iOS — only what changed actually travels. */
const NAV_ORDER = ["markets", "chart", "positions", "orders", "more"];
let _navDir = 0;
function navEnter(dir){
  const el = app().querySelector(":scope > .wrap, :scope > .chartbox");
  if(!el) return;
  // A TRANSFORM ON AN ANCESTOR BECOMES THE CONTAINING BLOCK OF EVERY position:fixed INSIDE IT. «Новый ордер» lives
  // in the route (and is fixed), so translating the whole column tore it off the bottom of the screen and parked it
  // in the middle of the list for the length of the animation (user video 2026-09-21). Opacity does no such thing,
  // so the column fades as one and only what is NOT fixed actually travels.
  const kids = el.classList.contains("chartbox") ? [el]
    : [...el.children].filter(c => getComputedStyle(c).position !== "fixed");
  if(!kids.length) return;
  let x = dir * (MO.soft ? 12 : 26), v = 0, o = 0, t0 = 0;
  for(const k of kids) k.style.willChange = "transform";
  const put = () => { const t = "translate3d(" + x.toFixed(2) + "px,0,0)"; for(const k of kids) k.style.transform = t; };
  el.style.opacity = "0";
  put();
  const step = now => {
    if(!el.isConnected) return;
    const dt = t0 ? Math.min(Math.max((now - t0) / 1000, 0), 1 / 30) : MO.dt0; t0 = now;
    v = MO.sp(v, x, 0, MO.P.large, dt); x += v * dt;
    o = Math.min(1, o + dt / (MO.soft ? .1 : .17));
    if(Math.abs(x) < .15 && Math.abs(v) < 2 && o >= 1){
      el.style.removeProperty("opacity");
      for(const k of kids){ k.style.removeProperty("transform"); k.style.removeProperty("will-change"); }
      return;
    }
    put();
    el.style.opacity = (o * o * (3 - 2 * o)).toFixed(3);
    moAdd(step);
  };
  moAdd(step);
}

/* an iOS 26 slider (video 3): pressed, the white knob grows into a clear lens that bends the track under it
   (lgGlass, always — it is the glass's own control), jumps to the finger and follows it, squashed along its
   way by its speed (a spring, so it wobbles still when it stops); let go, it frosts back into the white pill.
   Arrows / Home / End work too. onInput(v) while it moves, onDone(v) when it is let go. */
function lgsBind(el, v0, onInput, onDone){
  if(!el) return;
  const knob = el.querySelector(".lgs-knob"), fill = el.querySelector(".lgs-fill");
  let R = el.getBoundingClientRect();                                // read once (and at each press) — never on a move
  // the knob sits where the finger is, to the fraction of a pixel (it used to step by whole percents, ~2.7 px); the
  // value itself is whole percents
  const set = v => {
    const vf = clamp(v, 0, 100), cx = 17 + vf / 100 * Math.max(0, R.width - 34);
    knob.style.setProperty("--kxp", cx.toFixed(2) + "px");
    fill.style.setProperty("--fr", Math.max(0, R.width - cx).toFixed(2) + "px");
    const r = Math.round(vf); if(r !== el._v){ el._v = r; el.setAttribute("aria-valuenow", r); }
    return r;
  };
  set(v0);
  const vAt = x => (x - R.left - 17) / Math.max(1, R.width - 34) * 100;
  const J = { j: 0, jv: 0, vel: 0, t: 0, raf: 0, lx: 0, lt: 0 };
  const jelly = now => {
    J.raf = 0;
    if(P && P.x != null && P.x !== P.done){ P.done = P.x; const was = el._v, v = set(vAt(P.x)); if(v !== was) onInput(v); }   // one write a frame
    const dt = J.t ? Math.min(Math.max((now - J.t) / 1000, 0), 1 / 30) : MO.dt0; J.t = now;
    const target = P ? Math.min(Math.abs(J.vel) * .00035, .2) : 0;
    J.vel *= Math.exp(-dt / .06);                                   // no move → its speed dies away
    J.jv = MO.sp(J.jv, J.j, target, MO.P.jelly, dt); J.j += J.jv * dt;
    if(Math.abs(J.vel) > 30) J.dir = J.vel > 0 ? 1 : -1;
    knob.style.setProperty("--ksx", (1 + J.j).toFixed(4)); knob.style.setProperty("--ksy", (1 - J.j * .55).toFixed(4));
    knob.style.setProperty("--kk", ((J.dir || 1) * J.j * 38).toFixed(2) + "deg");   // it leans with its speed, its top a step behind (video 3)
    if(P || Math.abs(J.j) > .001 || Math.abs(J.jv) > .01) J.raf = requestAnimationFrame(jelly);
    else { J.t = 0; for(const p of ["--ksx", "--ksy", "--kk"]) knob.style.removeProperty(p); }
  };
  const kick = () => { if(!J.raf) J.raf = requestAnimationFrame(jelly); };
  let P = null;
  el.onpointerdown = e => {
    if(e.button > 0) return;
    P = { id: e.pointerId, x: e.clientX, done: null };
    R = el.getBoundingClientRect();
    try{ el.setPointerCapture(e.pointerId); }catch(_){}
    clearTimeout(el._t1); clearTimeout(el._t2);
    el.classList.remove("frost", "rel"); el.classList.add("press");
    lgGlass(knob, 56, 36, 26, .3, true, true, undefined, 7);           // its own bend, only in a 7 px band at its rim (the track bends up / down along its ends, its middle stays true — the reference), the same at any clarity
    J.lx = e.clientX; J.lt = performance.now(); J.vel = 0;
    P.done = P.x; onInput(set(vAt(e.clientX))); kick();
  };
  el.onpointermove = e => {
    if(!P || e.pointerId !== P.id) return;
    const now = performance.now(), dt = Math.max(now - J.lt, 1);
    J.vel = J.vel * .5 + (e.clientX - J.lx) / dt * 1000 * .5; J.lx = e.clientX; J.lt = now;
    P.x = e.clientX; kick();                                        // the frame loop moves it
  };
  const end = e => {
    if(!P || e.pointerId !== P.id) return;
    if(P.x !== P.done) set(vAt(P.x));                                // where the finger left it
    P = null; kick();
    // it shrinks back still a clear lens and turns white only at the very end (video 3)
    el.classList.remove("press"); el.classList.add("rel");
    el._t1 = setTimeout(() => el.classList.add("frost"), 150);
    el._t2 = setTimeout(() => { el.classList.remove("rel", "frost"); knob._lg = null; knob.style.backdropFilter = ""; }, 270);
    onDone(el._v);
  };
  el.onpointerup = end; el.onpointercancel = end;
  el.onkeydown = e => {
    const d = { ArrowLeft: -5, ArrowDown: -5, ArrowRight: 5, ArrowUp: 5, PageDown: -10, PageUp: 10 }[e.key];
    let v = null;
    if(d) v = el._v + d; else if(e.key === "Home") v = 0; else if(e.key === "End") v = 100;
    if(v == null) return;
    e.preventDefault(); onDone(set(v));
  };
}
/* the switch to / from liquid glass re-draws every surface at once — a view transition cross-fades the whole screen
   instead of snapping it (user 2026-09-20: «должно плавно все переходить между ячейками, а не рывком») */
function smoothSwap(fn){
  const d = document;
  if(!d.startViewTransition || matchMedia("(prefers-reduced-motion: reduce)").matches){ fn(); return; }
  try{
    const vt = d.startViewTransition(fn);
    for(const p of ["finished", "ready", "updateCallbackDone"]) if(vt && vt[p] && vt[p].catch) vt[p].catch(() => {});
  }catch(e){ fn(); }
}
function applyGlass(on){
  document.documentElement.dataset.glass = on ? "on" : "off";
  try{ localStorage.setItem("xc_glass", on ? "on" : "off"); }catch(e){}
}
/* the clarity, walked from one value to another on the shared frame */
function moClarity(from, to, ms, done){
  const t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now - t0) / ms), e = t * t * (3 - 2 * t);
    applyClarity(from + (to - from) * e);
    if(t < 1) moAdd(step); else if(done) done();
  };
  moAdd(step);
}
function setGlass(on){
  if(!S.ui) S.ui = {};
  const want = !!on;
  S.ui.glass = want;
  const saved = glassClarity();
  const swap = () => smoothSwap(() => { applyGlass(want); render(); otReform(); });
  // GLASS IS A MATERIAL, so it arrives and leaves like one instead of being cross-faded with a different picture:
  // switched off it thins away to nothing first and the flat page takes the place it left; switched on the flat
  // page becomes the glass one while the glass is still invisible, and the material then condenses into it.
  if(!want) moClarity(saved, 100, 190, () => { swap(); applyClarity(saved); });
  else { applyClarity(100); swap(); setTimeout(() => moClarity(100, saved, 360), 50); }
  save();
  toast("", S.ui.glass ? L("💧 Жидкое стекло включено") : L("Жидкое стекло выключено"));
}

const TH_MOON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 15.1A8.7 8.7 0 0 1 8.9 3.4a8.7 8.7 0 1 0 11.7 11.7Z" fill="currentColor"/></svg>';

/* THE DRAWER COMES IN FROM ITS EDGE (user 2026-09-21: «полностью измените анимацию логотипа, нужно другая, которая
   вообще не касается его»). Every version that grew the panel out of the mark had to do something TO the mark —
   lift a twin of it, hide the real one, melt its edge — and every one of those left something to go wrong. It is a
   panel: it lives off the left edge and it slides on, on the same spring a screen uses. The mark is not touched,
   not copied and not animated; it is simply covered, and only once the panel is actually over it. */
function amEnter(m){
  const sh = m.querySelector(".am-sheet"); if(!sh) return;
  const W = Math.max(1, sh.offsetWidth || 320);
  let x = -W, v = 0, t0 = 0, hid = false;
  sh.style.willChange = "transform";
  const put = () => {
    sh.style.transform = "translate3d(" + x.toFixed(1) + "px,0,0)";
    m.style.setProperty("--shd", (1 - Math.min(1, -x / W)).toFixed(3));
    if(!hid && x > -W * .82){ hid = true; document.body.classList.add("amenu-open"); }   // covered: now the mark may go
  };
  put();
  m.classList.add("shd");
  const step = now => {
    if(!sh.isConnected) return;
    const dt = t0 ? Math.min(Math.max((now - t0) / 1000, 0), 1 / 30) : MO.dt0; t0 = now;
    v = MO.sp(v, x, 0, MO.P.large, dt); x += v * dt;
    if(x > -.4 && Math.abs(v) < 8){
      x = 0; put();
      sh.style.removeProperty("transform"); sh.style.removeProperty("will-change");
      m.classList.remove("shd"); m.style.removeProperty("--shd");
      return;
    }
    put(); moAdd(step);
  };
  moAdd(step);
}
