*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* an app is not a document: holding a finger on a title used to raise the system's blue selection block over it

input,textarea,[contenteditable="true"]{-webkit-user-select:text;user-select:text}
/* ===================== THE MOTION SYSTEM =====================================================================
   One vocabulary for everything that moves. Five characters, matching the spring presets in MO (below): what is
   done here in CSS and what is integrated per frame in JS agree, so a thing does not change personality when it
   crosses from one to the other.
     1 micro  — a press, a toggle, an icon: it answers at once and barely overshoots
     2 std    — a panel, a card, a popup, a change of state
     3 fluid  — glass: morphing, resizing, moving. Softer, more mass
     4 large  — a screen, a full modal, navigation: little bounce, long inertia
     5 exit   — anything leaving: it goes without ceremony
   --mo is the one dial. Reduce Motion turns it down, it never turns it off. */
:root{
  --mo:1;
  --mo-e1:cubic-bezier(.24,.88,.32,1.06); --mo-e2:cubic-bezier(.22,.84,.26,1.02);
  --mo-e3:cubic-bezier(.26,.9,.22,1);     --mo-e4:cubic-bezier(.2,.8,.16,1);
  --mo-e5:cubic-bezier(.4,0,.72,.32);
  --mo-t1:calc(130ms * var(--mo,1)); --mo-t2:calc(240ms * var(--mo,1)); --mo-t3:calc(360ms * var(--mo,1));
  --mo-t4:calc(480ms * var(--mo,1)); --mo-t5:calc(170ms * var(--mo,1));
  --mo-micro:var(--mo-t1) var(--mo-e1); --mo-std:var(--mo-t2) var(--mo-e2); --mo-fluid:var(--mo-t3) var(--mo-e3);
  --mo-large:var(--mo-t4) var(--mo-e4); --mo-exit:var(--mo-t5) var(--mo-e5);
}
/* no drawn ring anywhere: a tap on a glass button cancels the browser's own focus handling, so Chrome decided the
   focus was «visible» and drew its blue outline round whatever had just opened a pane (user 2026-09-21: «удали
   обводку, которая везде появляется, она не нужна нигде») */
:focus{outline:none}
:focus-visible{outline:none}
/* The whole page is ONE normal document scroll on <html> — no nested scroll containers.
   overflow-x:clip prevents horizontal overflow WITHOUT turning overflow-y into a
   scroll container (which `hidden` would do). */
html{overflow-x:clip;overscroll-behavior-y:none}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:var(--font);

body{max-width:520px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);width:100%;overflow-x:clip}

input,select{font-family:inherit;font-size:inherit;color:inherit;min-width:0}
img,canvas,svg,video{max-width:100%}
.mono{font-variant-numeric:tabular-nums lining-nums;font-feature-settings:"tnum" 1,"lnum" 1,"ss01" 1,"cv01" 1;letter-spacing:-.012em;font-synthesis-weight:none}

body.route-chart{background:var(--chart-bg)}

body.chart-full #app{padding-bottom:0}

/* A long screen (Settings, the calendar, Overview, a list of positions) is styled and laid out only as far
   as the screen shows: a card further down is skipped until scrolling brings it near (`auto` then keeps its
   real height). Opening such a tab cost 5–7 ms of style + layout on a desktop (several times that on a phone), now ~1.5,
   and Overview's depth card refreshing below the fold costs nothing. Not the cards holding a chart: they are
   always on screen, and readouts over the chart are placed against a box outside the card.
   A screen re-rendered while scrolled down (a position closing in the list) is laid out in full for a frame
   (#app.cv-off, from render()): new cards skipped at an estimated height would move what is on screen. */
#app .card:not(.minichart,.chartcard),#app .lrow,#app .ne-card{content-visibility:auto;contain-intrinsic-size:auto 160px}
#app.cv-off .card,#app.cv-off .lrow,#app.cv-off .ne-card{content-visibility:visible}

/* Markets → XAUUSD trade panel, cTrader's layout: SELL and BUY are solid L-shaped
   blocks (caption on top, the price running underneath towards the middle) and the
   «Количество (Лоты)» dropdown sits between the two captions — tapping it opens the

   price block is filleted with a small radial-gradient square. */

  font-weight:700;font-size:clamp(10.5px,3.35vw,15px);letter-spacing:0;white-space:nowrap}
.ctp-cap.sell{grid-column:1;background:var(--red);border-radius:10px 8px 0 0}
.ctp-cap.buy{grid-column:4;background:var(--green);border-radius:8px 10px 0 0}
.ctp-cap::after{content:"";position:absolute;bottom:0;width:8px;height:8px;pointer-events:none}
.ctp-cap.sell::after{right:-8px;background:radial-gradient(circle at 100% 0,transparent 7.5px,var(--red) 8px)}
.ctp-cap.buy::after{left:-8px;background:radial-gradient(circle at 0 0,transparent 7.5px,var(--green) 8px)}
.ctp-px{grid-row:2;display:flex;align-items:center;min-height:58px;padding:0 12px;overflow:hidden}
.ctp-px.sell{grid-column:1 / span 2;background:var(--red);border-radius:0 8px 10px 10px}
.ctp-px.buy{grid-column:3 / span 2;background:var(--green);border-radius:8px 0 10px 10px}
.ctp-px .v{display:block;width:100%;font-weight:700;font-size:clamp(20px,7.4vw,30px);line-height:1.1;white-space:nowrap;overflow:hidden;letter-spacing:-.01em}
.ctp-px.sell .v{text-align:right}
.ctp-px.buy .v{text-align:left}
.ctp-cap:active,.ctp-px:active{filter:brightness(.94)}
.ctp-lot{grid-column:2 / span 2;grid-row:1;align-self:start;position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;
  height:46px;margin:0 0 8px;padding:0 12px;border:1px solid var(--ink3);border-radius:8px;background:var(--card);color:var(--ink);min-width:0}
.ctp-lot-cap{position:absolute;top:-8px;left:9px;padding:0 5px;background:var(--card);font-size:11px;line-height:15px;color:var(--ink2);white-space:nowrap;max-width:calc(100% - 18px);overflow:hidden}
.ctp-lot-val{font-size:18px;font-weight:500}
.ctp-caret{flex:0 0 auto;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:7px solid var(--ink2)}
/* the number is typed straight in (phone keyboard); only the ▼ opens the wheel */
.ctp-lot input.ctp-lot-val{flex:1;min-width:0;height:100%;padding:0;border:0;outline:none;background:transparent;color:var(--ink);font-size:18px;font-weight:500}
.ctp-caret-btn{flex:none;align-self:stretch;display:flex;align-items:center;justify-content:center;width:42px;margin-right:-12px;padding:0;border:0;background:none;border-radius:0 8px 8px 0}
.ctp-caret-btn:active{background:var(--press)}
body.trade-locked .ctp-lot input{pointer-events:none;opacity:.5}
.ctp-cap{flex-direction:column;gap:5px}
/* ▲/▼ under ПРОДАТЬ / КУПИТЬ — flips with every quote change, like cTrader */
.ctp-dir{display:block;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:7px solid currentColor}
.ctp-dir.dn{border-bottom:0;border-top:7px solid currentColor}
/* a trade tap, cTrader-style: the tapped side greys out for a moment while the order
   fills, and a pill drops in at the top — «Исполнение…», then «ордер исполнен ✓» */
.ctp-cap,.ctp-px,.cht{transition:background-color var(--mo-micro),color var(--mo-micro)}
.ctp-cap.exec,.ctp-px.exec,.cht.exec{background:var(--exec-bg);color:rgba(255,255,255,.5)}
.ctp-cap.sell.exec::after{background:radial-gradient(circle at 100% 0,transparent 7.5px,var(--exec-bg) 8px)}
.ctp-cap.buy.exec::after{background:radial-gradient(circle at 0 0,transparent 7.5px,var(--exec-bg) 8px)}

  display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:18px;background:#2a2a2e;color:#fff;
  font-size:14.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.28);
  transform:translate(-50%,-160%);opacity:0;pointer-events:none;transition:transform var(--mo-std),opacity var(--mo-std)}

/* «Новый ордер» over the Markets screens — cTrader's big pill: dark on the light theme, light on the dark one */
.bignew{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-top) + 8px);width:min(492px,calc(100% - 32px));
  background:var(--invert);color:var(--invert-ink);font-size:18px;line-height:21px;font-weight:700;padding:17px;border-radius:18px;text-align:center;z-index:35;box-shadow:0 8px 24px rgba(0,0,0,.25)}

.bignew:active{filter:brightness(.9)}

/* bottom nav — liquid glass OFF: cTrader's — outline icons and large grey labels, the current tab in blue, on the
   page ground with a hairline on top (and the touch ripple) */
.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;background:var(--bg);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.bottomnav button{padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink2);font-size:14px;font-weight:400;white-space:nowrap}
.bottomnav button.on{color:var(--nav-on)}
.bottomnav .ic svg{width:26px;height:26px}
.nav-bub,.nav-lens{display:none}
/* liquid glass ON (the default; «Ещё» → «Жидкое стекло») — iOS 26's floating tab bar (user 2026-09-18, an Apple
   Music recording): a frosted capsule the page scrolls under; the current tab sits on a soft drop (.nav-bub).
   Pressed, the drop lifts into a clear lens over the icons — swelling them and tinting the one beneath it
   (Chromium also bends them at its rim) — follows the finger along the bar, stretching with its speed like
   liquid, and on release springs onto the nearest tab, which opens. Motion lives in navBubFrame(). */
:root[data-glass="on"]{--nav-top:calc(70px + env(safe-area-inset-bottom))}
:root[data-glass="on"]:not([data-lgoff~="nav"]) .bottomnav{bottom:calc(8px + env(safe-area-inset-bottom));width:calc(100% - 20px);max-width:500px;height:62px;padding:0;border-top:0;border-radius:31px;
  isolation:isolate;touch-action:none;user-select:none;-webkit-user-select:none;
  background:var(--nav-glass);-webkit-backdrop-filter:blur(calc(18px * var(--lgb,1))) saturate(1.8);backdrop-filter:blur(calc(18px * var(--lgb,1))) saturate(1.8);
  box-shadow:0 0 0 .5px var(--lg-line),var(--lg-lift2),var(--lg-body)}
:root[data-glass="on"]:not([data-lgoff~="nav"]) .bottomnav::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;z-index:3;
  background:linear-gradient(135deg,var(--lg-rim) 0%,transparent 30%,transparent 70%,var(--lg-rim2) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
:root[data-glass="on"]:not([data-lgoff~="nav"]) .bottomnav button{position:relative;z-index:1;padding:0;justify-content:center;gap:2px;font-size:11.5px;font-weight:500;letter-spacing:0;transform-origin:50% 55%;transition:color var(--mo-std)}
:root[data-glass="on"]:not([data-lgoff~="nav"]) .bottomnav button.near{color:var(--nav-on)}
:root[data-glass="on"]:not([data-lgoff~="nav"]) .bottomnav.dragging button.on:not(.near){color:var(--ink2)}
:root[data-glass="on"]:not([data-lgoff~="nav"]) .bottomnav .ic svg{width:24px;height:24px}
/* the resting drop and the lens share one place and shape (--u, --sx, --sy on the bar) and CROSS-FADE by
   --lf, the lift: pressed, the lens rises out of the drop; released, it melts back into it (user: it turned
   grey in one jump — «нужно более плавнее, как с того видео») */
:root[data-glass="on"]:not([data-lgoff~="nav"]) .nav-bub,:root[data-glass="on"]:not([data-lgoff~="nav"]) .nav-lens{display:block;position:absolute;top:4px;bottom:4px;left:3px;width:calc(20% - 6px);border-radius:27px;pointer-events:none;
  transform:translateX(calc(var(--u,0) * (100% + 6px))) scale(var(--sx,1),var(--sy,1));will-change:transform,opacity}
:root[data-glass="on"]:not([data-lgoff~="nav"]) .nav-bub{z-index:0;opacity:calc(1 - var(--lf,0));background:linear-gradient(180deg,var(--nb-sheen),transparent 62%),var(--nav-bub);
  box-shadow:inset 0 1px 1px var(--nb-sheen)}
/* the lens is CLEAR, like the video's (WhatsApp, iOS 26): no tint, no sheen — the rim, a hairline, a soft shadow */
:root[data-glass="on"]:not([data-lgoff~="nav"]) .nav-lens{z-index:2;opacity:var(--lf,0);background:rgba(255,255,255,.025);
  -webkit-backdrop-filter:blur(.5px) saturate(1.5) brightness(1.04);backdrop-filter:blur(.5px) saturate(1.5) brightness(1.04);
  box-shadow:0 0 0 .5px var(--lg-line),var(--lg-lift1),var(--lg-body)}
:root[data-glass="on"]:not([data-lgoff~="nav"]) .nav-lens.idle{visibility:hidden}
:root[data-glass="on"]:not([data-lgoff~="nav"]) .nav-lens::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;pointer-events:none;
  background:linear-gradient(var(--lit-a,151deg),var(--lg-rim) 0%,transparent 28%,var(--lg-rimd) 50%,transparent 72%,var(--lg-rim2) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
@media (prefers-reduced-transparency:reduce){
  :root[data-glass="on"]:not([data-lgoff~="nav"]) .bottomnav{background:var(--card);-webkit-backdrop-filter:none;backdrop-filter:none}
  :root[data-glass="on"]:not([data-lgoff~="nav"]) .nav-lens{background:var(--nav-bub);-webkit-backdrop-filter:none;backdrop-filter:none}
}

#chartCanvas,#miniCanvas,#domCanvas{width:100%;display:block;max-width:100%}
/* The chart owns both axes: a horizontal drag pans time, a vertical one pans
   price (cTrader). touch-action must be none or the browser claims the vertical
   swipe for page scrolling before the handler can. The page still scrolls
   everywhere outside the canvas. */
#chartCanvas{touch-action:none}
#miniCanvas{touch-action:auto}
/* Markets overview chart, cTrader's: axes + grid on the canvas, ⛶ and the tf button over it, periods under it */
.card.minichart{padding:0;overflow:hidden;border:1px solid var(--line);box-shadow:none}   /* a real border: the canvas covers an inset-shadow edge */
:root[data-theme="dark"] .card.minichart{box-shadow:none}
.mini-box{position:relative}
.mini-tools{position:absolute;left:12px;top:12px;display:flex;gap:8px}
.mini-tools button{min-width:34px;height:34px;padding:0 9px;border-radius:7px;border:1px solid var(--edge);background:var(--card);color:var(--ink2);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center}
.mini-tools button:active{background:var(--press)}
.mini-ranges{display:flex;padding:4px 8px 10px}
.mini-ranges button{flex:1;background:none;border:0;padding:8px 0;font-size:15px;color:var(--ink2);white-space:nowrap}
.mini-ranges button.on{color:var(--blue-ink);font-weight:600}
.chartbox{position:relative;background:var(--chart-bg);max-width:100%;overflow:hidden}
/* cTrader's on-chart controls (2026-09-15 screenshot): a round ⛶ top-left, «XAUUSD ›» and the
   timeframe pill bottom-left, and our round + / − zoom column above those pills */
.chfs{position:absolute;left:16px;top:9px;z-index:5;width:46px;height:46px;padding:0;border-radius:50%;color:var(--ink);display:flex;align-items:center;justify-content:center}
.chzoom{position:absolute;left:16px;bottom:calc(77px + var(--under,0px));z-index:5;display:flex;flex-direction:column;gap:8px}
.chzoom button{position:relative;width:40px;height:40px;padding:0;border-radius:50%;color:var(--ink);display:flex;align-items:center;justify-content:center}
.chpills{position:absolute;left:16px;bottom:calc(34px + var(--under,0px));z-index:5;display:flex;gap:9px;will-change:transform}
.chpill[data-act="charttf"]{transform:translateY(var(--pmy,0px))}
.chpill{position:relative;display:flex;align-items:center;gap:10px;height:31px;padding:0 14px;will-change:padding;border-radius:16px;color:var(--ink);font-size:14px;font-weight:400;line-height:1;white-space:nowrap}
.chpill.sym{padding:0 12px 0 16px}
/* «м1» and «XAUUSD ›» as ONE drop (user video 4: a capsule flows into a circle and parts from it with a neck that
   thins and snaps): while they move or are merged the pills lose their own glass and one shape (.chp-goo,
   clip-path: the union of the two capsules and the neck between them, pmDraw) carries it; its rim and shadow
   are the same path in SVG */
.chp-goo,.chp-rim,.chp-shade{display:none}
:root[data-glass="on"]:not([data-lgoff~="chart"]) .chpills.goo .chp-goo{display:block;position:absolute;left:-10px;top:-10px;width:calc(100% + 100px);height:calc(100% + 20px);pointer-events:none;z-index:-1;
  clip-path:var(--gp,inset(50%));
  background:radial-gradient(52% 40% at var(--lit-x,30%) var(--lit-y,26%),var(--lg-spot) 0%,transparent 74%),
    linear-gradient(180deg,transparent 10px,var(--lg-sheen) 10px,transparent 28px),
    linear-gradient(180deg,transparent 10px,var(--lg-spec) 11.4px,transparent 13.2px),
    linear-gradient(0deg,transparent 10px,var(--lg-glow) 11.8px,transparent 14.4px),
    linear-gradient(180deg,rgba(16,24,40,calc(.09 * var(--lgdk,1))) 10px,transparent 24px),
    linear-gradient(0deg,var(--lg-foot) 10px,transparent 26px),
    linear-gradient(var(--lg-tint),var(--lg-tint));
  -webkit-backdrop-filter:blur(calc(1px * var(--lgb,1))) saturate(1.35) brightness(1.03);backdrop-filter:blur(calc(1px * var(--lgb,1))) saturate(1.35) brightness(1.03)}
:root[data-glass="on"]:not([data-lgoff~="chart"]) .chpills.goo .chp-rim,:root[data-glass="on"]:not([data-lgoff~="chart"]) .chpills.goo .chp-shade{display:block;position:absolute;left:-10px;top:-10px;width:calc(100% + 100px);height:calc(100% + 20px);overflow:visible;pointer-events:none}
:root[data-glass="on"]:not([data-lgoff~="chart"]) .chpills.goo .chp-rim{z-index:1}
:root[data-glass="on"]:not([data-lgoff~="chart"]) .chpills.goo .chp-shade{z-index:-2}
/* the shadow is blurred and offset INSIDE the svg and the drop's own shape is masked out of it: glass this clear
   shows whatever is under it, and a filled copy of itself under the capsule was the colour change (user video 4) */
.chp-shade .sh{fill:var(--lg-shadow)}
.chp-shade .am{fill:var(--lg-shadow);opacity:.75}   /* the far, wide one: the pair a real object casts */
.chp-shade .c2{fill:#000}
.chp-rim .h{fill:none;stroke:var(--lg-line);stroke-width:1}
.chp-rim .r{fill:none;stroke:url(#chpRimG);stroke-width:3}
.chp-rim .s1{stop-color:var(--lg-rim)}.chp-rim .s0{stop-color:var(--lg-rim);stop-opacity:0}.chp-rim .s2{stop-color:var(--lg-rim2)}
:root[data-glass="on"]:not([data-lgoff~="chart"]) .chpills.goo .chpill{background:none;box-shadow:none;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
:root[data-glass="on"]:not([data-lgoff~="chart"]) .chpills.goo .chpill::before,:root[data-glass="on"]:not([data-lgoff~="chart"]) .chpills.goo .chpill::after{display:none}
:root[data-glass="on"]:not([data-lgoff~="chart"]) .chartbox:not(.sub) .chpill{touch-action:none}
.chpill svg{display:block}
.chartinfo{position:absolute;left:16px;top:62px;max-width:calc(100% - 90px);z-index:4;font-size:10px;font-weight:600;color:var(--ink2);background:var(--chart-glass);border-radius:8px;padding:4px 7px;pointer-events:none;line-height:1.35;white-space:normal}
.chartinfo[hidden]{display:none}
/* «›|» back to the newest bar: bottom-right of the plot, beside the price axis (right is set in drawChart).
   The wrapper holds its place and the step-aside drawChart gives it when a level pill needs that spot; the
   button itself keeps its fade / scale, so the two never fight over one transform. */
.chlast-wrap{position:absolute;right:66px;bottom:calc(34px + var(--under,0px));z-index:5;will-change:transform}
.chlast{position:relative;width:44px;height:31px;padding:0;border-radius:16px;color:var(--ink);display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.85);pointer-events:none;transition:opacity var(--mo-std),transform var(--mo-std)}
.chlast.on{opacity:1;transform:none;pointer-events:auto}
/* liquid glass off: cTrader's opaque buttons, pressed in a little */
.chfs,.chzoom button,.chpill,.chlast{background:var(--chart-btn);border:1px solid var(--chart-btn-edge)}
.chfs:active,.chzoom button:active,.chlast.on:active{transform:scale(.93) translateY(.5px);transition:transform var(--mo-micro)}
.chpill:active{filter:brightness(.92)}
:root[data-glass="on"]:not([data-lgoff~="chart"]) .chlast.on{transform:translate(var(--pdx,0px),var(--pdy,0px)) scale(calc(var(--psx,1) * var(--jsx,1)),calc(var(--psy,1) * var(--jsy,1))) skewX(var(--jk,0deg))}
:root[data-glass="on"]:not([data-lgoff~="chart"]) .chlast.pressing,:root[data-glass="on"]:not([data-lgoff~="chart"]) .chlast.jelly{transition:opacity var(--mo-std)}          /* the press / jelly springs drive its transform */
/* LIQUID GLASS, iOS-style (user 2026-09-18: in cTrader the chart shows through these buttons — «можно ли
   сделать больше жидкое стекло, что бы выглядело как в айфоне»): a thin tint over a lightly blurred,
   saturated view of the candles, a specular rim brightest at the top-left and bottom-right (::after, a 1 px
   gradient ring), a sheen on the upper half (::before), a soft shadow and a hairline so it reads on a
   white chart. On Chromium (Android) lgGlass() adds the lens: the view bends at the rim (an SVG

:root[data-glass="on"]:not([data-lgoff~="chart"]) .chpills .chpill.sym{transform:translateX(var(--pms,0px)) translate(var(--pdx,0px),var(--pdy,0px)) scale(calc(var(--psx,1) * var(--jsx,1)),calc(var(--psy,1) * var(--jsy,1))) skewX(var(--jk,0deg))}
:root[data-glass="on"]:not([data-lgoff~="chart"]) .chpills .chpill[data-act="charttf"]{transform:translateX(var(--pmx,0px)) translateY(var(--pmy,0px)) translate(var(--pdx,0px),var(--pdy,0px)) scale(calc(var(--psx,1) * var(--jsx,1)),calc(var(--psy,1) * var(--jsy,1))) skewX(var(--jk,0deg))}
:root[data-glass="on"]:not([data-lgoff~="chart"]) .chfs,:root[data-glass="on"]:not([data-lgoff~="chart"]) .chzoom button,:root[data-glass="on"]:not([data-lgoff~="chart"]) .chpill,:root[data-glass="on"]:not([data-lgoff~="chart"]) .chlast{isolation:isolate;border:0;
  background:radial-gradient(48px circle at var(--lx,50%) var(--ly,30%),rgba(255,255,255,var(--la,0)),transparent 72%),linear-gradient(var(--lg-tint),var(--lg-tint));
  -webkit-backdrop-filter:blur(1px) saturate(1.35) brightness(1.03);backdrop-filter:blur(1px) saturate(1.35) brightness(1.03);
  box-shadow:0 0 0 .5px var(--lg-line),var(--lg-lift1),var(--lg-body);text-shadow:var(--lg-text-shadow)}

/* forms / modal */
.modal{position:fixed;inset:0;background:var(--scrim);z-index:80;display:flex;align-items:flex-end;justify-content:center}
/* dragged away, the scrim goes with it — the room behind comes back as the sheet leaves, not after it */
.modal.shd{background:color-mix(in srgb,var(--scrim),transparent calc((1 - var(--shd,1)) * 100%))}
.modal.shd .sheet{animation:none!important}
.sheet{position:relative;background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;padding:16px 14px 26px}
/* a sheet slides up over a scrim that fades in, and slides back down as it closes — like cTrader's
   Android sheets and our lot wheel (it used to pop in and vanish in one frame). One that replaces an open
   sheet (the ticket redrawn, a confirmation) appears in place. transform / opacity only: the compositor
   moves it, nothing is laid out again. */
.modal{animation:mdIn var(--mo-t2) var(--mo-e2)}
.modal .sheet{animation:lwIn var(--mo-t3) var(--mo-e3)}
@keyframes mdIn{from{background-color:transparent}}
.modal.swap,.modal.swap .sheet,.modal.closing,.modal.closing .sheet{animation:none}
.modal.closing{pointer-events:none;background-color:transparent;transition:background-color var(--mo-std)}
.modal.closing .sheet{transform:translateY(100%);transition:transform var(--mo-std)}
.sheet h2{margin:2px 0 14px;font-size:17px;padding-right:40px}
/* ✕ belongs to the sheet (it sat at the screen's top-right — .sheet was not positioned — and hung there
   while the sheet slid away, user video 2026-09-18) */
.sheet .close{position:absolute;right:12px;top:12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
.field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--edge);border-radius:11px;background:var(--field-bg);color:var(--ink)}
.field .hint{font-size:11.5px;color:var(--ink3);margin-top:4px}
.seg{display:flex;gap:4px;background:var(--line);border-radius:11px;padding:3px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:600;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--raise);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.16),0 0 0 .5px rgba(16,24,40,.08)}
/* dark: the selected segment was #2c2c2c on a #2e2e2e track — no telling which one is on */
:root[data-theme="dark"] .seg{background:#141414;box-shadow:inset 0 0 0 1px var(--line)}
:root[data-theme="dark"] .seg button.on{background:#3a3a3c;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.6)}
/* «Тема оформления»: the theme in use is a blue segment with a ✓, unmistakable in either theme */
.seg.theme button{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 8px;font-size:14px;transition:background-color var(--mo-std),color var(--mo-std)}
.seg.theme button.on,:root[data-theme="dark"] .seg.theme button.on{background:var(--blue);color:#fff;box-shadow:0 2px 8px rgba(47,123,246,.35)}
.seg.theme .ck{display:none;font-weight:700}
.seg.theme button.on .ck{display:inline}
/* «Тема оформления» with the mode on (user video 5): the two segments become ONE switch — a capsule with the name
   of the theme in it and a ball of glass that slides to the side that is on, the sun or the moon sunk into it.
   Its travel is a rAF spring (--thk 0 → 1): a phone set to «reduce motion» kills every CSS transition we have. */
:root{--th-tr:rgba(118,122,134,.20);--th-hole:rgba(118,122,134,.42);--th-ink:var(--ink2)}
:root[data-theme="dark"]{--th-tr:rgba(8,8,10,.66);--th-hole:rgba(0,0,0,.82);--th-ink:#c9c9cf}
.thsw{--thk:0;position:relative;display:block;width:186px;height:58px;margin:10px 0 2px;padding:0;border:0;background:none}
.thsw.dark{--thk:1}
.thsw-tr{position:absolute;left:0;right:0;top:9px;height:40px;border-radius:20px;background:var(--th-tr)}
.thsw-lb{position:absolute;left:0;right:0;top:9px;height:40px;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:600;color:var(--th-ink);transform:translateX(calc(31px - 62px * var(--thk)))}
.thsw-kb{position:absolute;left:0;top:0;width:58px;height:58px;border-radius:50%;isolation:isolate;
  transform:translateX(calc(128px * var(--thk)));
  background:radial-gradient(44px circle at 36% 26%,rgba(255,255,255,.55),transparent 68%),linear-gradient(var(--lg-tint),var(--lg-tint));
  -webkit-backdrop-filter:blur(2px) saturate(1.4) brightness(1.04);backdrop-filter:blur(2px) saturate(1.4) brightness(1.04);
  box-shadow:0 8px 20px var(--lg-shadow),inset 0 1.5px 1px var(--lg-spec),inset 0 -2px 4px var(--lg-glow)}
.thsw-ic{position:absolute;inset:12px;border-radius:17px;display:flex;align-items:center;justify-content:center;background:var(--th-hole);color:#fff}
.thsw-ic svg{display:block;width:22px;height:22px;filter:drop-shadow(0 0 4px rgba(255,255,255,.75))}
.thsw:active .thsw-kb{filter:brightness(1.04)}
.lang-row{width:100%;background:none;border:0;padding:4px 0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.lang-row .v{display:flex;align-items:center;gap:8px;font-weight:600}
.lang-row .chev{color:var(--ink3);font-size:20px;line-height:1}
.btn{display:block;width:100%;padding:14px;border-radius:13px;font-weight:600;text-align:center;margin-top:6px;overflow-wrap:normal}   /* a button never splits a word (the cards' overflow-wrap:anywhere broke «Синхронизирова / ть») */
.btn.green{background:var(--green);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.dark{background:var(--invert);color:var(--invert-ink)}
/* dark: the primary button is light, like «Новый ордер» — the near-black --invert vanished on the black
   ground and read weaker than «Отмена» beside it */
:root[data-theme="dark"] .btn.dark{background:#efefef;color:#1a1a1a}
:root[data-theme="dark"] .news-btns button.wide{box-shadow:inset 0 0 0 1px var(--edge)}
/* Charts tab trade bar, cTrader's (2026-09-15 screenshot): SELL | Лоты | BUY in one 48 px bar
   with 10 px corners, white text at 72 % (14 px caption, 17 px price), grip dots at both ends,
   and the 72 × 40 lots tab notched into its top edge between the halves (tap it to pick the volume) */
.chtrade-wrap{padding:8px 8px 7px}
body.route-chart .chtrade-wrap{background:var(--chart-bg)}
.chtrade{position:relative;display:grid;grid-template-columns:1fr 1fr;height:48px;border-radius:10px;overflow:hidden}
.cht{position:relative;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;color:rgba(255,255,255,.95);font-weight:400;padding:0 24px}
.cht.sell{background:var(--red);align-items:flex-start;padding-right:42px}
.cht.buy{background:var(--green);align-items:flex-end;padding-left:42px}
.cht-grip{position:absolute;top:50%;margin-top:-6px;fill:currentColor}
.cht.sell .cht-grip{left:9.5px}
.cht.buy .cht-grip{right:9.5px}
.cht-lbl{font-size:14px;line-height:15px;white-space:nowrap}
.cht-px{display:block;max-width:100%;font-size:17px;line-height:18px;white-space:nowrap;overflow:hidden}
.cht-lot{position:absolute;top:0;left:50%;transform:translateX(-50%);width:72px;height:40px;padding:3px 9px 0 8.5px;
  display:flex;flex-direction:column;align-items:flex-start;background:var(--card);color:var(--ink);border-radius:0 0 9px 9px}
body.route-chart .cht-lot{background:var(--chart-bg)}
.cht-lot .cht-lbl{color:var(--ink2);font-size:13.5px;display:flex;align-items:center;justify-content:space-between;width:100%}
.cht-lot .cht-val{margin-top:2.5px;font-size:17px;line-height:18px;font-weight:400}
.cht:active{filter:brightness(.95)}
.cht-lot:active{background:var(--press)}
/* the timeframe sheet behind the «м1» pill */
.tfsheet{display:flex;flex-direction:column}
.tfsheet button{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);background:none;color:var(--ink);font-size:16px;text-align:left}
.tfsheet button b{font-weight:600;color:var(--ink2)}
.tfsheet button.on,.tfsheet button.on b{color:var(--blue-ink)}
/* lot picker sheet */
.lotsheet{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;margin-top:4px}
.ls-step{height:52px;border-radius:12px;background:var(--line);font-size:22px;font-weight:600;color:var(--ink);display:flex;align-items:center;justify-content:center}   /* drawn − / + : a font puts them 3 px low */
.ls-step:active{background:var(--press)}
.ls-val{width:100%;min-width:0;height:52px;text-align:center;font-size:22px;font-weight:600;border:1px solid var(--edge);border-radius:12px;background:var(--field-bg);color:var(--ink)}
.btn.ghost{background:var(--line);color:var(--ink)}
.btn:active{filter:brightness(.95)}
.btn:disabled{opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl-tbl .row{padding:5px 0;border-bottom:1px dashed var(--line)}
.pl-tbl .row:last-child{border-bottom:none}
.menu-item{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.menu-item:active{background:var(--press)}
/* a menu entry that isn't open yet (the broker wallet): shows «Скоро», goes nowhere */
.menu-item.soon{cursor:default}
.menu-item.soon:active{background:var(--card);transform:none}
.soon-pill{font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--orange-ink);background:var(--orange-bg);
  border-radius:999px;padding:3px 10px;white-space:nowrap}
.toast-wrap{position:fixed;left:50%;transform:translateX(-50%);top:64px;z-index:100;width:min(492px,calc(100% - 20px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--invert);color:var(--invert-ink);border-radius:12px;padding:10px 13px;font-size:12.5px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:tin var(--mo-t3) var(--mo-e3)}
.toast.g{background:#0b7a45}.toast.r{background:#c02a22}.toast.o{background:#c96a08}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.dom-grid{display:grid;grid-template-columns:1fr 88px 1fr;font-size:12px;font-variant-numeric:tabular-nums}
.dom-grid>div{padding:5px 8px;border-bottom:1px solid var(--line)}
.dom-bid{text-align:right;color:var(--green-ink);position:relative}
.dom-ask{text-align:left;color:var(--red-ink);position:relative}
.dom-px{text-align:center;font-weight:600}
.dom-bar{position:absolute;top:0;bottom:0;opacity:.14}
.dom-bar.b{right:0;background:var(--green)}
.dom-bar.a{left:0;background:var(--red)}
/* live book: a size that just changed flashes for a moment */
.dom-bid.up,.dom-ask.up{animation:domUp var(--mo-t4) var(--mo-e4)}
.dom-bid.dn,.dom-ask.dn{animation:domDn var(--mo-t4) var(--mo-e4)}
.dom-bid.nw,.dom-ask.nw{animation:domNw var(--mo-t4) var(--mo-e4)}
@keyframes domUp{from{background:rgba(10,168,95,.26)}to{background:transparent}}
@keyframes domDn{from{background:rgba(229,52,43,.22)}to{background:transparent}}
@keyframes domNw{from{background:rgba(47,123,246,.18)}to{background:transparent}}
.dom-imb-l{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:600;margin:0 2px 4px;font-variant-numeric:tabular-nums}
.dom-imb{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:0 2px 8px;background:var(--line)}
.dom-imb .b{background:var(--green)}.dom-imb .a{background:var(--red)}
.evt{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
/* Overview cards under the chart, cTrader's (sizes measured off its screenshots):
   «Настроение рынка», «Глубина рынка», «Экономический календарь» */
.card.ovc{padding:12px 16px 9px}
.ovc-title{font-size:20px;line-height:26px;font-weight:700;color:var(--ink)}
.ovc-more{display:block;margin:4px 0 0 auto;padding:8px 0;border:0;background:none;color:var(--blue-ink);font-size:16.5px;line-height:20px;font-weight:700}
.sent-bar{display:flex;gap:2px;height:8px;margin-top:13px}
.sent-bar span{flex:50 1 0;border-radius:2px;transition:flex-grow var(--mo-large)}
.sent-bar .s{background:var(--red)}
.sent-bar .b{background:var(--green)}
.sent-l{display:flex;justify-content:space-between;margin-top:2px;padding-bottom:1px;font-size:14.5px;line-height:17px;font-variant-numeric:tabular-nums}
.sent-l .s{color:var(--red-ink)}
.sent-l .b{color:var(--green-ink)}
.dp{margin-top:29px}
.dp-row{display:grid;grid-template-columns:1fr 1fr;column-gap:9px;height:48px;font-size:16px;line-height:22px;font-variant-numeric:tabular-nums}
.dp-h{display:flex;justify-content:space-between;align-items:flex-start;min-width:0}
.dp-p{position:relative}
.dp-p i{position:absolute;top:24px;height:7px}
.dp-h.b .dp-p i{right:0;background:var(--red)}
.dp-h.a .dp-p i{left:0;background:var(--green)}
.cal-when{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:5px;font-size:14px;line-height:18px}
.cal-cur{display:flex;align-items:center;gap:8px;color:var(--ink2)}
.cal-cur svg{display:block}
.cal-name{margin-top:8px;font-size:17px;line-height:22px;font-weight:700}
.cal-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:8px}
.cal-c{min-width:0;padding:0 3px;text-align:center}
.cal-c+.cal-c{border-left:1px solid var(--wl-div)}
.cal-v{display:flex;align-items:center;justify-content:center;height:16px;font-size:14px;white-space:nowrap}
.cal-k{margin-top:2px;font-size:13px;line-height:16px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-imp{display:block;width:48px;max-width:100%;height:6px;border-radius:3px;background:var(--red)}
.cal-imp.md{background:var(--orange)}
.cal-imp.lo{background:#d4b106}
.cal-desc{margin-top:16px;font-size:13px;line-height:14.3px;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden}
.evt:last-child{border-bottom:none}
.evt .nm{font-weight:600}
.evt .impact{font-size:10px;font-weight:600;padding:1px 5px;border-radius:5px;background:var(--orange-bg);color:var(--orange-ink)}
.evt small{color:var(--ink3)}
hr.d{border:none;border-top:1px solid var(--line);margin:12px 0}
.pill-toggle{display:flex;gap:6px}
.pill-toggle button{flex:1 1 0;min-width:0;padding:9px 4px;border-radius:9px;background:var(--line);font-weight:600;font-size:12px;color:var(--ink2);white-space:nowrap}
.pill-toggle button.on{background:var(--blue);color:#fff}

/* macro news engine */
.news-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 8px}
.news-btns button{background:var(--orange-bg);color:var(--orange-ink);border:1px solid #f3c98f;border-radius:11px;padding:12px 4px;font-weight:600;font-size:12.5px;letter-spacing:.02em}
.news-btns button:active{filter:brightness(.94)}
.news-btns button:disabled{opacity:.35}
.news-btns button.wide{grid-column:span 3;background:var(--invert);color:var(--invert-ink);border-color:var(--invert)}
/* news lock (the 20 s release): no banner, no messages — every trade button just
   shows a cross in place of its caption until the market unlocks by itself */
.tx{display:none}
body.trade-locked .tcap{display:none}
body.trade-locked .tx{display:inline}
.ctp-cap .tx{font-size:18px;line-height:1}
body.trade-locked [data-act="quicksell"],body.trade-locked [data-act="quickbuy"],
body.trade-locked [data-act="domsell"],body.trade-locked [data-act="dombuy"],
body.trade-locked [data-act="newticket"],body.trade-locked [data-act="lotpick"],body.trade-locked [data-act="lotwheel"]{opacity:.5;pointer-events:none}
/* Markets «Количество» wheel — cTrader's (iOS) picker: a flat sheet under a hairline, the
   «Edit · Done» bar a shade off the drum; the drum itself is a canvas (openLotWheel) */
.lotwheel{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;z-index:150;background:var(--lw-bg);border-top:1px solid var(--lw-edge);padding-bottom:env(safe-area-inset-bottom);animation:lwIn var(--mo-t2) var(--mo-e2)}
.lotwheel.out{transition:transform var(--mo-std);transform:translateY(100%)}
@keyframes lwIn{from{transform:translateY(100%)}to{transform:none}}
/* touch ripple (RIPPLE_SEL): a grey cell with a circle spreading from the finger, fading on release */
/* only the pressed cell lights up — no circle spreading from the finger (user 2026-09-18: «касания убери
   именно в том месте где касаемся пальцем, они не нужны»); the cell takes the strength the circle added */
.ripple{position:fixed;z-index:200;overflow:hidden;pointer-events:none;background:transparent;transition:background-color var(--mo-micro),opacity var(--mo-fluid)}
.ripple.on{background:var(--ripple)}
.ripple.out{opacity:0}
/* the list rows (the XAUUSD row, positions, orders, «Ещё», sheet lists) press like cTrader's (user 2026-09-19,
   video: «в cTrade есть касания когда заходим в золото»): a soft light spreads from the finger over the row in
   ~0.2 s — brightest where the finger is — and the row lights up with it; then it opens */
.ripple.wave{transition:background-color var(--mo-std),opacity var(--mo-fluid)}
.ripple .rw{position:absolute;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%) scale(.04);opacity:.9;
  background:radial-gradient(circle closest-side,var(--ripple-w1) 0%,var(--ripple-w2) 62%,transparent 100%);
  transition:transform var(--mo-std),opacity var(--mo-std)}
.ripple.on .rw{transform:translate(-50%,-50%) scale(1);opacity:1}
.lw-bar{display:flex;justify-content:space-between;align-items:center;height:44px;padding:0 8px;background:var(--lw-bar)}
.lw-bar button{background:none;border:0;padding:10px 12px;font-size:17px;color:var(--ink)}
.lw-bar .lw-done{font-weight:600}
.lw-edit{padding:10px 16px 0;display:flex;align-items:center;gap:10px}
.lw-edit[hidden]{display:none}
.lw-edit input{flex:1;min-width:0;height:40px;border:1px solid var(--edge);border-radius:10px;background:var(--field-bg);color:var(--ink);font-size:18px;text-align:center}
.lw-err{font-size:12px;color:var(--red-ink)}
.lw-body{position:relative;height:216px}
.lw-body canvas{display:block;touch-action:none;user-select:none;-webkit-user-select:none}
/* the panel's lots field while the wheel is open: «0.01 Лоты», following the wheel (no caret —
   the value comes from the wheel, or from typing after «Edit») */
.ctp-lot.editing{border-color:var(--ink2)}
.news-res .row{padding:6px 0;border-bottom:1px dashed var(--line)}
.news-res .row:last-child{border-bottom:none}
.ne-card{border:1px solid var(--edge);border-radius:12px;padding:10px;margin-bottom:8px}
.ne-card summary{font-weight:600;font-size:13px;cursor:pointer;list-style:none}
.ne-card summary::-webkit-details-marker{display:none}
.ne-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.ne-grid .field{margin-bottom:4px}
.ne-grid .field label{font-size:10px}
.ne-grid .field input,.ne-grid .field select{padding:8px 9px;font-size:13px}
.lastnews{background:var(--field-bg);border-radius:10px;padding:9px 11px;font-size:12px;margin-top:4px}
.lastnews b{font-weight:600}

/* ticks-per-second control */
.tps-val{font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;color:var(--blue-ink)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:2px 0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:7px;border-radius:999px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;margin-top:-8.5px;border-radius:50%;background:var(--blue);border:3px solid var(--card);box-shadow:0 1px 5px rgba(0,0,0,.25)}
input[type=range]::-moz-range-track{height:7px;border-radius:999px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--blue);border:3px solid var(--card)}
.tps-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tps-presets button{flex:1 1 auto;min-width:54px;background:var(--line);border-radius:9px;padding:10px 4px;font-weight:600;font-size:12.5px;color:var(--ink2)}
.tps-presets button.on{background:var(--blue);color:#fff}
.tps-presets button:active{filter:brightness(.95)}

/* manual market control (god mode) */
.godpanel{background:#1b1f24;color:#fff;border-radius:16px;padding:13px 13px 14px;margin-bottom:12px;box-shadow:0 6px 20px rgba(0,0,0,.28)}
.godpanel .gp-hd{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.06em;color:#ffb85c}
.godpanel .gp-hd .dot{width:8px;height:8px;border-radius:50%;background:#ffb85c;box-shadow:0 0 8px #ffb85c}
.godpanel .gp-px{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.godpanel .gp-sub{font-size:11px;color:#9aa4af;font-weight:600;margin-bottom:4px}
.godpanel .gp-state{margin-top:7px;font-size:10.5px;font-weight:600;letter-spacing:.03em;text-align:center;padding:6px 8px;border-radius:8px}
.godpanel .gp-state.on{background:#14351f;color:#5fe0a0}
.godpanel .gp-state.off{background:#3a2417;color:#ffb85c}
.godpanel .gp-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.godpanel button{flex:1 1 auto;min-width:0;background:#2b3138;color:#fff;border-radius:9px;padding:9px 6px;font-weight:600;font-size:12px;border:1px solid #3a424b}
.godpanel button:active{background:#353d46}
.godpanel button.on{background:#f5820d;border-color:#f5820d}
.godpanel button.up{color:#5fe0a0}.godpanel button.dn{color:#ff8a80}
.godpanel input{background:#12151a;border:1px solid #3a424b;color:#fff;border-radius:9px;padding:9px 8px;width:100%;min-width:0}
.godpanel .gp-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.godpanel .gp-grid>div{min-width:0}
.godpanel .gp-lbl{font-size:10px;color:#9aa4af;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.godpanel .gp-half{flex:1}

/* markets watchlist ("Рынки" list -> tap XAUUSD -> existing terminal screen) */
.wl-topbar{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:0;   /* same ground as the list below, no edge — like cTrader */
  display:flex;align-items:center;gap:10px;padding:14px 14px}
.wl-logo{flex:0 0 auto;width:42px;height:42px;display:block;padding:0;border:0;border-radius:50%;background:none}   /* the site's icon, round (user «логотип такой должен быть»); it opens the app drawer */
.wl-logo:active{opacity:.75}                                     /* never scale it: the drop is born on the rect measured at the press, and a scaled rect lands the glass a hair off the mark */
.wl-logo svg{width:100%;height:100%;display:block}
.wl-search{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:9px;background:var(--line);
  color:var(--ink2);border-radius:999px;padding:11px 16px;font-size:15px;font-weight:400;text-align:left}
.wl-search-ic{flex:none;opacity:.75}
.wl-search:active{filter:brightness(.97)}
/* the watchlist, cTrader's: a name row, then instrument rows edge to edge with a divider (no card) */
.wl-head{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 14px;border-bottom:1px solid var(--wl-div);margin:0 -14px;padding-left:16px;padding-right:16px}
.wl-name{font-weight:400;font-size:18px}
.wl-tools{display:flex;align-items:center;gap:22px}
.wl-caret{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:8px solid var(--ink3);margin-right:14px}
.wl-tools .ic{display:flex;align-items:center;justify-content:center;color:var(--ink2);cursor:pointer}
.wl-row{display:flex;gap:12px;align-items:stretch;padding:16px 16px 14px;margin:0 -14px;width:calc(100% + 28px);border-bottom:1px solid var(--wl-div);background:none;cursor:pointer;text-align:left}

.wl-left{flex:0 0 41%;min-width:0;display:flex;flex-direction:column;gap:1px}
.wl-right{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
.wl-sym{font-weight:500;font-size:22px;line-height:1.15;display:flex;align-items:center;white-space:nowrap}
.wl-sym .ck{color:var(--green-ink);margin-right:12px;font-size:19px}
.wl-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 4px;
  margin-left:8px;border:1.5px solid var(--ink3);border-radius:6px;font-size:12px;font-weight:600;
  font-variant-numeric:tabular-nums;color:var(--ink2);vertical-align:2px;line-height:1}
.wl-chg{font-size:14px;white-space:nowrap}
.wl-spark{display:block;width:100%;height:30px;margin-top:5px;overflow:hidden}
.wl-spark svg{display:block;width:100%;height:100%}
.wl-stats{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--ink2);white-space:nowrap}
.wl-quote{display:flex;gap:8px}
/* «+ Добавить инструменты» — cTrader's centred blue button; «Новый ордер» — its floating action button */
.wl-addbtn{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px auto 0;width:64%;min-width:230px;height:36px;border:0;border-radius:4px;background:#1f4e9c;color:#fff;font-size:15px;font-weight:500}
.wl-addbtn span{font-size:20px;line-height:1}
:root[data-theme="dark"] .wl-addbtn{background:#2a6bd0}
.fabnew{--fab-bg:#d3e3fd;position:fixed;right:max(14px, calc(50% - 246px));bottom:calc(var(--nav-top) + 22px);z-index:35;display:flex;align-items:center;gap:14px;padding:13px 22px 13px 18px;border:0;border-radius:16px;background:var(--fab-bg);color:#0b1d38;font-size:16px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
:root[data-theme="dark"] .fabnew{--fab-bg:#0d47a1;color:#dbe7fb}
.fabnew:active{filter:brightness(.92)}
body.trade-locked .fabnew{opacity:.5;pointer-events:none}
/* cTrader tints each box — caption, price and border — by ITS OWN price's last tick: ПРОДАТЬ by
   the Bid, КУПИТЬ by the Ask, green after an uptick, red after a downtick (.dn on the box). A
   spread change moves the two apart, so they can differ (a cTrader video: green ПРОДАТЬ, red КУПИТЬ) */
.wl-q{flex:1 1 0;min-width:0;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;border:1px solid currentColor;border-radius:4px;padding:2px 2px 3px;color:var(--green-ink)}
.wl-q b{font-size:12.5px;font-weight:500;letter-spacing:.02em;line-height:1.25;color:inherit}
.wl-q span{font-size:17px;font-weight:500;line-height:1.2;font-variant-numeric:tabular-nums}
.wl-q.dn{color:var(--red-ink)}
/* same pill as the search field beside it — cTrader gives them equal weight;
   ours used to sit noticeably smaller */
.ab-bal{flex:0 0 auto;background:var(--line);color:var(--ink);font-weight:600;font-size:15px;
  padding:11px 14px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ===== BROKER WALLET (dark, premium) — its own full-screen dark surface ===== */
body.route-wallet{max-width:none;background:#0c0a08}
body.route-wallet #app{padding-bottom:0}
body.route-wallet .bottomnav,body.route-wallet .appbar{display:none}
html:has(body.route-wallet){background:#0c0a08}

/* The wallet is its OWN scroll container (position:fixed + overflow-y:auto), not
   the document. Mobile browsers only retract the URL bar on *document* scroll,
   so here the visual viewport — and anything sized to it — never changes while
   you scroll. That's what finally stops the background photo from drifting;
   `position:fixed`/`100vh`/`inset:0` on the document all fail because the URL
   bar keeps resizing them. */
.wallet-page{
  --wg:#e3b877; --wg2:#a9884f; --wtxt:#f3ece0; --wmut:#9a917e;
  --wpanel:rgba(19,15,12,.82); --wline:#3d352a;
  position:fixed;inset:0;isolation:isolate;color:var(--wtxt);background:#0b0908;
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
/* photo: pinned with position:sticky inside that container (sticky has far
   better in-app-webview support than fixed). height:0 + absolutely-placed
   pseudos = zero layout space, content scrolls straight over it. */
.wallet-bg{position:sticky;top:0;height:0;z-index:0;pointer-events:none}
.wallet-bg::before,.wallet-bg::after{content:"";position:absolute;top:0;left:0;
  width:100%;height:100vh;height:100lvh;pointer-events:none}
.wallet-bg::before{background:#0b0908 center 30%/cover no-repeat;background-image:url(/wallet-bg.svg)}
.wallet-bg.has-photo::before{background-image:url(/wallet-bg.jpg)}
.wallet-bg::after{
  background:linear-gradient(180deg,
    rgba(9,7,5,.06) 0%,rgba(9,7,5,.14) 30%,rgba(9,7,5,.4) 52%,
    rgba(8,6,4,.74) 72%,rgba(6,5,4,.94) 100%)}
.wallet-bg.has-photo::after{
  background:
    linear-gradient(180deg,rgba(6,5,4,.34) 0%,rgba(6,5,4,.24) 18%,rgba(6,5,4,.38) 42%,rgba(5,4,3,.62) 66%,rgba(4,3,2,.9) 100%),
    radial-gradient(150% 50% at 50% 0%,rgba(0,0,0,0),rgba(0,0,0,.24) 100%)}
.wallet-inner,.wfoot{position:relative;z-index:1}
.wallet-inner{max-width:1000px;margin:0 auto;padding:14px clamp(14px,4vw,44px) 0}
.wp-back{display:inline-flex;align-items:center;gap:7px;color:var(--wg);font-weight:600;font-size:12px;
  letter-spacing:.08em;padding:8px 2px;background:none}
.wp-back:active{opacity:.65}
.wp-h1{font-size:clamp(30px,7.4vw,46px);font-weight:700;line-height:1.04;margin:8px 0 8px;color:#fff;letter-spacing:-.017em}
.wp-sub{color:var(--wmut);font-size:clamp(13px,3.3vw,15px);max-width:430px;line-height:1.45;margin-bottom:18px}

.wpanel{background:var(--wpanel);border:1px solid var(--wline);border-radius:22px;
  display:grid;grid-template-columns:minmax(0,358px) minmax(0,1fr);gap:clamp(18px,3vw,40px);
  padding:clamp(16px,2.6vw,24px);align-items:center;box-shadow:0 30px 70px rgba(0,0,0,.5)}
.wcard{position:relative;width:100%;aspect-ratio:1.586/1;border-radius:16px;overflow:hidden;isolation:isolate;
  padding:clamp(15px,4vw,22px);display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(130deg,#ecd3aa 0%,#dcb984 26%,#c99c62 52%,#b0854e 76%,#906b3c 100%);
  box-shadow:0 20px 44px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.36),inset 0 -1px 0 rgba(0,0,0,.22)}
.wcard::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(130% 92% at 8% 2%,rgba(255,255,255,.34),transparent 44%),
             radial-gradient(94% 82% at 98% 106%,rgba(58,36,12,.34),transparent 52%)}
.wc-wm{position:absolute;z-index:0;left:-8%;top:32%;font-family:Georgia,'Times New Roman',serif;font-weight:600;
  font-size:clamp(66px,23vw,132px);line-height:.78;color:rgba(74,49,20,.17);white-space:nowrap;
  pointer-events:none;user-select:none;letter-spacing:-.045em}
.wc-row1,.wc-owner{position:relative;z-index:2}
.wc-row1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.wc-brand{font-family:Georgia,'Times New Roman',serif;font-weight:600;font-size:clamp(18px,5.1vw,25px);
  color:#fffaf0;letter-spacing:.02em;text-shadow:0 1px 2px rgba(78,48,14,.3)}
.wc-tag{text-align:right;min-width:0}
.wc-tag-l{font-size:clamp(9px,2.5vw,11px);color:rgba(46,29,9,.6);font-weight:600}
.wc-tag-n{font-weight:600;font-size:clamp(12px,3.4vw,15px);color:#fffaf0;letter-spacing:.03em;margin-top:2px;
  text-shadow:0 1px 2px rgba(78,48,14,.3);word-break:break-all}
.wc-owner{font-size:clamp(12px,3.5vw,15px);font-weight:600;letter-spacing:.05em;color:#1c1509}

.wpanel-info{min-width:0}
.wpi-title{color:var(--wtxt);font-size:clamp(15px,3.8vw,19px);font-weight:600;margin-bottom:10px}
.wpi-bal{font-size:clamp(25px,7.6vw,44px);font-weight:700;color:var(--wg);line-height:1.04;white-space:nowrap;overflow:hidden;letter-spacing:-.015em}
.wpi-bal .u{font-size:.46em;font-weight:600;color:var(--wg2);margin-left:.3em;letter-spacing:.04em}
.wpi-div{border-top:1px solid var(--wline);margin:clamp(14px,3vw,22px) 0 12px}
.wpi-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.wpi-row-k{color:var(--wmut);font-size:13px}
.wpi-row-v{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--wtxt);overflow-wrap:anywhere}
.wpi-copy{background:none;color:var(--wg2);font-size:15px;padding:2px;line-height:1}
.wpi-copy:active{color:var(--wg)}

.wallet-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 0}
.wbtn{display:flex;align-items:center;justify-content:center;gap:9px;padding:16px 12px;border-radius:999px;
  font-weight:600;font-size:13px;letter-spacing:.03em;white-space:nowrap;min-width:0;
  border:1px solid var(--wg2);color:var(--wg);background:rgba(227,184,119,.04);
  transition:background var(--mo-micro),transform var(--mo-micro)}
.wbtn .wbtn-ic{font-size:15px}
.wbtn:hover{background:rgba(227,184,119,.1)}
.wbtn:active{transform:translateY(1px)}
.wbtn.wbtn-primary{border:none;color:#1c1408;background:linear-gradient(180deg,#eecb8a,#d6a961);box-shadow:0 8px 22px rgba(214,169,97,.26)}
.wbtn.wbtn-primary:hover{background:linear-gradient(180deg,#f2d199,#dcb06a)}

.wsec{background:var(--wpanel);border:1px solid var(--wline);border-radius:18px;padding:clamp(15px,2.4vw,22px);margin-top:16px}
.wsec-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.wsec-hd h3{margin:0;font-size:14px;font-weight:600;color:var(--wtxt);text-transform:none;letter-spacing:0}
.wsec-all{color:var(--wg2);font-size:11px;font-weight:600;letter-spacing:.06em;background:none}
.wstats{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,3vw,30px)}
.wstat{display:flex;flex-direction:column;gap:8px;min-width:0}
.wstat-ic{width:40px;height:40px;border-radius:12px;background:rgba(227,184,119,.1);border:1px solid var(--wline);
  display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--wg)}
.wstat-k{color:var(--wmut);font-size:12.5px}
.wstat-v{font-weight:600;font-size:clamp(15px,3.6vw,19px);color:var(--wtxt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wstat-v .u{font-size:.62em;color:var(--wg2);margin-left:.25em}
.wledger-empty{text-align:center;padding:20px 8px;color:var(--wmut)}
.wledger-empty .ic{font-size:22px;color:var(--wg2);display:block;margin-bottom:8px}
.wl-item{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--wline)}
.wl-item:last-child{border-bottom:none}
.wl-item .k{color:var(--wtxt);font-size:13px}
.wl-item .k small{color:var(--wmut);display:block;font-size:11px;margin-top:2px}
.wl-item .amt{font-weight:600;font-size:14px;white-space:nowrap}
.wl-item .amt.pos{color:#5cc98b}.wl-item .amt.neg{color:#e08b6a}

.wfoot{margin-top:26px;padding:24px clamp(14px,4vw,44px) 30px;border-top:1px solid var(--wline);
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.22))}
.wfoot-inner{max-width:1000px;margin:0 auto}
.wfeat{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(16px,3vw,32px)}
.wfeat > div{min-width:0}
.wfeat-ic{font-size:17px;color:var(--wg);margin-bottom:7px}
.wfeat-t{font-weight:600;font-size:13px;color:var(--wtxt);margin-bottom:4px}
.wfeat-d{color:var(--wmut);font-size:11.5px;line-height:1.45}
.wfoot-cr{text-align:center;color:#6b6353;font-size:11.5px;margin-top:22px;line-height:1.9}
.wfoot-cr a{color:#8a8171}

/* dark wallet modal (sits on document.body — literal colours, no page vars) */
.sheet.sheet-dark{background:#1a1713;color:#f3ece0}
.sheet.sheet-dark h2{color:#fff}
.sheet.sheet-dark .field label{color:#9a917e}
.sheet.sheet-dark .field input{background:#110e0a;border-color:#332c22;color:#f3ece0}
.sheet.sheet-dark .hint{color:#8a8171}
.sheet.sheet-dark .loterr{color:#e08b6a}
.wm-balance{background:#211d18;border:1px solid #332c22;border-radius:11px;padding:10px 12px;font-size:13px;color:#b6ac98;margin-bottom:12px}
.wm-balance b{color:#e3b877;font-weight:600}
.wm-quick{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 10px}
.wm-quick button{flex:1 1 auto;min-width:66px;background:#26221c;border-radius:9px;padding:9px 4px;font-weight:600;font-size:12px;color:#c9bfa8}
.wm-quick button:active{filter:brightness(1.15)}
.sheet.sheet-dark .btn.ghost{background:#26221c;color:#c9bfa8}
.sheet.sheet-dark .btn.green,.sheet.sheet-dark .btn.dark{background:linear-gradient(180deg,#eecb8a,#d6a961);color:#1c1408}

@media (max-width:680px){
  .wpanel{grid-template-columns:1fr;gap:16px}
  .wcard{max-width:360px;margin:0 auto}
}
@media (max-width:640px){
  .wfeat{grid-template-columns:1fr 1fr;gap:18px}
}

  .wallet-actions{grid-template-columns:1fr}
  .wstats{grid-template-columns:1fr;gap:14px}
}

/* generic overflow guards */
.card,.lrow,.menu-item,.evt{max-width:100%;overflow-wrap:anywhere}
.dom-grid{overflow-x:auto}
.grid2{gap:8px}
.grid2>*{min-width:0}
.grid2.grid-sync{grid-template-columns:minmax(0,1fr) auto}
.grid-sync .narrow{padding-left:20px;padding-right:20px;white-space:nowrap}
.grid-sync .fit{padding-left:10px;padding-right:10px}
.sheet{overflow-wrap:anywhere}
.appbar .ttl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* a title too long for the bar drifts left and back instead of being cut off (runTitles) */
.appbar .ttl .ttl-run{display:inline-block;text-box:trim-both cap alphabetic;will-change:transform}
.appbar .ttl .ttl-run>span{margin-left:6px}
.appbar .ttl.run{padding:0 12px 0 6px;margin-left:-6px;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 6px,#000 calc(100% - 12px),transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0,#000 6px,#000 calc(100% - 12px),transparent 100%)}
.appbar .ttl.run .ttl-run{animation:ttlRun var(--run-dur,6s) ease-in-out infinite}
@keyframes ttlRun{0%,20%{transform:translateX(0)}50%,70%{transform:translateX(var(--run-x,0))}100%{transform:translateX(0)}}
.badge-demo{flex:0 0 auto}
/* «Ещё» footer: the author's credit */
.creator{text-align:center;margin:16px 0 6px;font-size:13px;color:var(--ink2)}
.creator b{color:var(--ink);font-weight:600}

/* --- iOS-style tactile feedback: a quick, subtle squish + dim on press --- */
.btn,.tbtn,.menu-item,.wl-row,.seg button,.tfbar button,.miniquick button,
.pill-toggle button,.tps-presets button,.news-btns button,.iconbtn,.lotctl button,
.chartzoom button,.bignew{
  transition:transform var(--mo-micro),filter var(--mo-micro),background-color var(--mo-micro),color var(--mo-micro);
}
/* A PRESS IS NOT A SCALE. Pressed, a surface goes down as well as in, and it answers on the way down far faster
   than it comes back — that asymmetry is most of what separates a physical control from a web button. The
   numbers are small on purpose: the eye reads the SPEED, not the distance. */
.btn:active,.tbtn:active,.seg button:active,

/* S as JSON for localStorage and the server. The candle history is ~95 % of it (~220 KB, ~3000 bars)
   and only the newest bar of each timeframe changes, yet JSON.stringify(S) redid every bar on every
   save, once a second (and for every server push) — a periodic stall under a dragged chart or a spinning
   wheel on a slow phone. Each bar's JSON is kept (per object) with the values it was made from and
   reused while they still match, so a save re-serialises a handful of bars: ~2.5× faster, measured. */
const _barJSON = new WeakMap();
function barJSON(b){
  if(!b || typeof b !== "object") return b === undefined ? "null" : JSON.stringify(b);
  const k = _barJSON.get(b);
  if(k && k.t === b.t && k.o === b.o && k.h === b.h && k.l === b.l && k.c === b.c && k.v === b.v) return k.s;
  const s = JSON.stringify(b);
  _barJSON.set(b, { t:b.t, o:b.o, h:b.h, l:b.l, c:b.c, v:b.v, s });
  return s;
}
function stateJSON(){
  const C = S.candles;
  if(!C || typeof C !== "object" || Array.isArray(C)) return JSON.stringify(S);
  const rest = {}, parts = [];
  for(const k of Object.keys(S)) if(k !== "candles") rest[k] = S[k];
  for(const tf of Object.keys(C)){
    const a = C[tf];
    if(!Array.isArray(a)){ const s = JSON.stringify(a); if(s !== undefined) parts.push(JSON.stringify(tf) + ":" + s); continue; }
    const bars = new Array(a.length);
    for(let i = 0; i < a.length; i++) bars[i] = barJSON(a[i]);
    parts.push(JSON.stringify(tf) + ":[" + bars.join(",") + "]");
  }
  const head = JSON.stringify(rest);
  return (head === "{}" ? "{" : head.slice(0, -1) + ",") + '"candles":{' + parts.join(",") + "}}";
}

function gauss(){
  if(gSpare !== null){ const s = gSpare; gSpare = null; return s; }
  let u,v,s;
  do{ u = Math.random()*2-1; v = Math.random()*2-1; s = u*u+v*v; }while(s>=1||s===0);
  const m = Math.sqrt(-2*Math.log(s)/s);
  gSpare = v*m; return u*m;
}
