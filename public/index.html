/* ---- the tab bar's drop (see .bottomnav in the CSS) ---- */
const NAV_TABS = ["markets", "chart", "positions", "orders", "more"];
function navIndexOf(t){ return ["markets","calendar","dom"].includes(t) ? 0 : t === "chart" ? 1 : t === "positions" ? 2 : t === "orders" ? 3 : 4; }
function navTo(tab){ if(tab === "markets") S.ui.marketOpen = false; nav(tab); }   // «Рынки» → the watchlist
// u: the drop's place in tabs (0…4, fractional in motion); lift 0…1: resting drop → lens under the finger
const NB = { u: null, vel: 0, target: 0, lift: 0, t: 0, raf: 0, drag: null };
let _navByDrop = 0;
function navBubKick(){ if(!NB.raf){ NB.t = 0; NB.raf = requestAnimationFrame(navBubFrame); } }
function navBubFrame(now){
  NB.raf = 0;
  const bar = document.querySelector(".bottomnav"), lens = bar && bar.querySelector(".nav-lens");
  if(!lens){ NB.u = NB.target; NB.vel = 0; NB.lift = 0; return; }
  const dt = NB.t ? Math.min(Math.max((now - NB.t) / 1000, 0), 1 / 30) : MO.dt0;
  NB.t = now;
  const target = NB.drag ? NB.drag.u : NB.target;
  // one to one with the user's video (WhatsApp, iOS 26): under the finger a SOFT spring — the lens lags a step
  // behind and sways when the finger stops; let go, it overshoots a hair onto the tab
  NB.vel = MO.sp(NB.vel, NB.u, target, NB.drag ? MO.P.follow : MO.P.std, dt);
  NB.u = clamp(NB.u + NB.vel * dt, -0.3, 4.3);
  // the lens rises quickly and melts back slowly (τ 60 / 200 ms), cross-fading with the resting drop
  const lt = NB.drag ? 1 : 0;
  NB.lift += (lt - NB.lift) * (1 - Math.exp(-dt / (lt ? .06 : .2)));
  // lifted it is a big lens, ~1.3 tabs wide and taller than the bar; stretched along its way by its speed (to
  // ~1.55×); run past an end, squashed flat against it
  const stretch = Math.min(Math.abs(NB.vel) * .1, .42);             // tabs / s → up to ~1.6 tabs, as in the video
  const over = Math.max(0, -NB.u, NB.u - 4);
  const sx = 1 + .32 * NB.lift + stretch - over * 1.4, sy = 1 + .3 * NB.lift - stretch * .3 + over * .35;
  bar.style.setProperty("--u", NB.u.toFixed(4));
  bar.style.setProperty("--sx", sx.toFixed(3));
  bar.style.setProperty("--sy", sy.toFixed(3));
  bar.style.setProperty("--lf", NB.lift.toFixed(3));
  const idle = NB.lift < .01;
  if(lens._idle !== idle){
    lens._idle = idle; lens.classList.toggle("idle", idle);
    if(!idle && !lens._lg) lgGlass(lens, lens.offsetWidth, lens.offsetHeight, 22, .5);
  }
  // the icons under the lens swell and take the accent colour (a CSS colour transition, no jump)
  const lifted = NB.lift > .3;
  bar.querySelectorAll("button[data-nav]").forEach((b, i) => {
    const k = Math.max(0, 1 - Math.abs(NB.u - i)), sc = 1 + .25 * k * NB.lift;    // magnified under the lens
    const tr = sc > 1.002 ? "scale(" + sc.toFixed(3) + ")" : "";
    if(b.style.transform !== tr) b.style.transform = tr;
    const near = lifted && k > .5;
    if(b.classList.contains("near") !== near) b.classList.toggle("near", near);
  });
  if(!NB.drag && Math.abs(NB.u - target) < .002 && Math.abs(NB.vel) < .02 && NB.lift < .01){
    NB.u = target; NB.vel = 0; NB.lift = 0; NB.t = 0;
    bar.style.setProperty("--u", String(target)); bar.style.setProperty("--sx", "1"); bar.style.setProperty("--sy", "1"); bar.style.setProperty("--lf", "0");
    if(!lens._idle){ lens._idle = true; lens.classList.add("idle"); }
    return;
  }
  NB.raf = requestAnimationFrame(navBubFrame);
}

function openNavCard(){
  const bar = document.querySelector(".bottomnav");
  if(_navCard || !bar || !glassOn("nav")) return;
  closeTFPop(true);
  const catcher = document.createElement("div"); catcher.className = "nav-card-catch";
  const card = document.createElement("div"); card.className = "nav-card"; card.setAttribute("role", "dialog"); card.setAttribute("aria-label", L("Счёт"));
  card.innerHTML = `<button type="button" class="grab" aria-label="${L("Закрыть")}"></button><div class="nc-body">${navCardBody()}</div>`;
  document.body.append(catcher, card);
  const H = card.offsetHeight, h0 = bar.offsetHeight;
  document.body.classList.add("navcard-open");
  const C = _navCard = { card, catcher, H, h0, h: h0, v: 0, open: true, raf: 0, t: setInterval(() => { const b = card.querySelector(".nc-body"); if(b) b.innerHTML = navCardBody(); }, 500) };
  card.classList.add("shown");
  if(glassOn("morph")){ card.style.height = h0 + "px"; card.style.opacity = "0"; bar.style.opacity = "1"; navCardRun(C); }
  catcher.addEventListener("pointerdown", e => { e.preventDefault(); closeNavCard(true); });
  card.querySelector(".grab").onclick = () => closeNavCard();
  // a swipe down from its middle closes it (like the pull-up: only in the middle)
  card.onpointerdown = e => { const r = card.getBoundingClientRect(); C.id = e.pointerId; C.y0 = Math.abs(e.clientX - (r.left + r.width / 2)) < r.width * .2 ? e.clientY : null; };
  card.onpointermove = e => { if(C.id === e.pointerId && C.y0 != null && e.clientY - C.y0 > 36){ C.y0 = null; closeNavCard(); } };
  card.onpointerup = card.onpointercancel = () => { C.y0 = null; };
}

    const flf = st.drag ? 1 : Math.min(1, (Math.abs(st.vl) + Math.abs(st.vr)) / 700);
    st.lf += (flf - st.lf) * (1 - Math.exp(-dt / (flf > st.lf ? .05 : .16)));
    // the jelly: squashed by its speed, an underdamped spring (K 260, ζ .3) — it wobbles a couple of times after it stops
    const jt = Math.min((Math.abs(st.vl) + Math.abs(st.vr)) / 3200, .14);
    st.jv = MO.sp(st.jv, st.j, jt, MO.P.jelly, dt); st.j += st.jv * dt;
    const done = !st.drag && Math.abs(st.l - st.tl) < .2 && Math.abs(st.r - st.tr) < .2 && Math.abs(st.vl) < 3 && Math.abs(st.vr) < 3 && st.lf < .01 && Math.abs(st.j) < .003 && Math.abs(st.jv) < .05;
    if(done){ st.l = st.tl; st.r = st.tr; st.lf = 0; st.j = st.jv = 0; }
    _dropMem[st.key] = { l: st.l, r: st.r, lf: st.lf, j: st.j, jv: st.jv };
    dropApply(bub, st);
    if(done) _drops.delete(bub);
  }
  if(_drops.size) _dropRaf = requestAnimationFrame(dropFrame);
}

    if(sld) sld.oninput = ()=> apply(sld.value);
    if(numI){ numI.oninput = ()=> apply(numI.value); numI.onchange = ()=> apply(numI.value); }
    root.querySelectorAll("[data-tps]").forEach(b=> b.onclick = ()=>{ apply(b.dataset.tps); toast("", L("Частота тиков: {0} т/с", fmt(S.market.ticksPerSecond,1))); });

      box.innerHTML = `<h3 style="margin-top:0">${L("Симуляции новостей · по 20 каждой · СИНТЕТИКА")}</h3>
        ${NEWS_TYPES.map(row).join("")}
        `;
    }, 30);
  });
  act("rundaytests", ()=>{
    const box = document.getElementById("dtest");
    box.style.display = "block"; box.innerHTML = L("Выполняется…");
    setTimeout(()=>{
      const r = runDayTests(300);
      const b = r.bands;
      box.innerHTML = `<h3 style="margin-top:0">${L("300 торговых дней · цепочка режимов · СИНТЕТИКА")}</h3>
        <div class="row"><span class="k">${L("Средний дневной диапазон")}</span><span class="v mono">$${r.meanRange}</span></div>
        <div class="row"><span class="k">${L("Медианный дневной диапазон")}</span><span class="v mono">$${r.medianRange}</span></div>
        <div class="row"><span class="k">${L("Мин / Макс")}</span><span class="v mono">$${r.minRange} / $${r.maxRange}</span></div>

        <hr class="d">

/* ---------- lot wheel (Markets → «Количество») ----------
   cTrader's picker, opened from the field's ▼: an iOS drum under an «Edit · Done» bar. Its rows
   are cTrader's volume ladder, not every lot step — 0.01…0.09, 0.1…0.9, 1…5, 10, 50, 100…500 —
   cut at our maximum, which is always the last row; a volume off the ladder (typed, or already
   in the field) gets a row of its own. The drum is a canvas drawn every display frame like the
   chart (a native snap scroller ran at 60 fps on the phone and flung too short): it follows the
   finger 1:1, a swipe spins on the way cTrader's iPhone picker does and lands exactly on a row;
   the value is mirrored into the field as rows pass and committed when the drum comes to rest.
   The look is measured off cTrader's recording: 33 px rows on an 88 px cylinder in a 216 px
   drum, 21 px digits without trailing zeros; rows foreshorten and fade toward the edges, and
   only the part of a row inside the grey band is full ink — outside it the digits are grey. */

  if(guardLock()) return;
  if(document.getElementById("lotWheel")) return;

  const min = S.symbol.minLot, max = S.symbol.maxLot, opened = o ? o.value : S.ui.lot;
  const ROW = 33, VH = 216, MID = VH / 2, RAD = 88, BH = 34, FS = 21;   // row arc, drum height, centre, cylinder radius, band height, digits (px)
  let vals = [], labels = [], n = 0, maxPos = 0, shown = -1;

    const set = new Set([min, max]);
    for(const v of LOT_WHEEL) if(v > min && v < max) set.add(v);
    for(const v of extra) if(Number.isFinite(v) && !validateLot(v)) set.add(roundTo(v, 2));
    vals = [...set].sort((a, b)=> a - b);
    labels = vals.map(v => String(roundTo(v, 2)));                     // 0.1, 1, 10 — like cTrader

  const valAt = i => vals[clamp(Math.round(i), 0, n - 1)];

  const el = document.createElement("div");
  el.className = "lotwheel"; el.id = "lotWheel";
  el.innerHTML = `<div class="lw-bar"><button type="button" data-lw="edit">${L("Изменить")}</button><button type="button" class="lw-done" data-lw="done">${L("Готово")}</button></div>
    <div class="lw-edit" hidden><input id="lwInput" class="mono" inputmode="decimal" autocomplete="off" enterkeyhint="done"><span class="lw-err" id="lwErr"></span></div>
    <div class="lw-body"><canvas id="lwCanvas"></canvas><div class="lw-lens"></div></div>`;
  document.body.appendChild(el);
  const cv = el.querySelector("#lwCanvas"), inp = el.querySelector("#lwInput"), err = el.querySelector("#lwErr");
  const box = el.querySelector(".lw-edit"), doneBtn = el.querySelector('[data-lw="done"]');
  const field = v => {
    if(o){ o.show(v); return; }
    setTxt("ovLot", fmt(v, 2));
    const f = document.querySelector(".ctp-lot");
    if(f && !f.classList.contains("editing")) f.classList.add("editing");
  };
  const commit = v => {
    if(validateLot(v)) return false;

  const css = getComputedStyle(document.documentElement);
  const INK = css.getPropertyValue("--ink").trim() || "#111", BANDC = css.getPropertyValue("--lw-band").trim() || "#f1f1f3";
  const FONT = FS + "px system-ui,-apple-system,'Segoe UI',Roboto,sans-serif";
  const LENS_MAG = glassOn("lots") ? 1.14 : 1;   // one font a frame — rows scale by transform
  const BX = 10, BY = MID - BH / 2, BW = W - 20;                       // the selection band
  ctx.font = FONT;

  const band = ()=>{ if(ctx.roundRect) ctx.roundRect(BX, BY, BW, BH, 8); else ctx.rect(BX, BY, BW, BH); };

      // place (×1.14 in the middle, ×1 a row away), the SAME for its grey part and its inked part, so a row

/* ---------- market confirm ---------- */
/* Market order at the panel's lot, no sheet — with cTrader's execution feedback: the
   tapped side greys out and a pill drops in («Исполнение: …»), the order fills a beat
   later, then the pill turns into «ордер исполнен ✓» (tap it for Позиции). Mirror
   routing, the news lock, lot bounds and margin are all enforced inside openPosition().
   (This used to open with a bare guardMirror() — no kind, no payload — so a tap on a
   mirroring device queued an empty order the driving device silently dropped.) */
const EXEC_MS = 180;
function quickTrade(side){
  if(guardLock()) return;
  const v = S.ui.lot;
  const err = validateLot(v);
  if(err){ toast("r", err); return; }
  execMark(side, true);
  execPill("run", v);
  setTimeout(()=>{
    const mirroring = XC.follower;
    const p = openPosition(side, v, { quiet: true });
    execMark(side, false);
    if(p){ execPill("ok", v); render(); }
    else if(mirroring) execPill("sent", v);        // queued for the device driving the market
    else execPill("hide");                         // openPosition already said why (margin, closed…)
  }, EXEC_MS);
}
function execMark(side, on){
  const s = side === "buy" ? "buy" : "sell";

}

  const CHECK = `<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.8 8.6l3.4 3.3L13.2 4.6" fill="none" stroke="#1faa5b" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

/* everything the ticket shows, from OT and the market: the errors (cTrader's wording), the notes, the margin */
function otCalc(){

    const nm = L(t === "limit" ? "лимитного ордера" : t === "stop" ? "стоп ордера" : "стоп-лимит ордера"), cp = chartPx(cur);
    if(!(ent > 0)) E.ent = L("Укажите цену входа");

      E.ent = t === "limit"
        ? L(buy ? "Цена входа {0} на покупку должна быть ниже текущей цены покупки ({1})" : "Цена входа {0} на продажу должна быть выше текущей цены продажи ({1})", nm, cp)
        : L(buy ? "Цена входа {0} на покупку должна быть выше текущей цены покупки ({1})" : "Цена входа {0} на продажу должна быть ниже текущей цены продажи ({1})", nm, cp);
    if(t === "stoplimit" && !(OT.lim >= 0)) E.lim = L("Укажите число пунктов");

  const lv = (o, s) => {
    if(o.mode === "pips") o.price = ok && o.pips >= 1 ? roundTo(ent + dir * s * o.pips * pip, d) : null;
    else o.pips = ok && o.price > 0 ? Math.round((o.price - ent) * dir * s / pip) : null;

    else if(validateLot(v1) || v1 > vol - sym.minLot + 1e-9) E.tp1v = L("Объём тейк-профита 1: от {0} до {1} лота", fmt(sym.minLot, 2), fmt(vol - sym.minLot, 2));
  }
  const tpBad = o => o.pips >= 1 ? null : L(buy ? "Тейк-профит должен быть выше цены входа ({0})" : "Тейк-профит должен быть ниже цены входа ({0})", ok ? chartPx(ent) : "—");
  if(tp1){ const e = tpBad(OT.tp1); if(e) E.tp1 = e; }
  if(tp2 && !E.tp2){ const e = tpBad(OT.tp2); if(e) E.tp2 = e; else if(both && !E.tp1 && OT.tp2.pips <= OT.tp1.pips) E.tp2 = L("Тейк-профит 2 должен быть дальше тейк-профита 1"); }

      E.sl = L(buy ? "Стоп-лосс должен быть ниже текущей цены продажи ({0})" : "Стоп-лосс должен быть выше текущей цены покупки ({0})", chartPx(buy ? bid : ask));

  if(tp2) N.tp2 = (both && !ve ? L("Закроет {0}", lotsTxt(vt2)) + "   " : "") + note(OT.tp2.pips, vt2, true);

/* writes what changed (every live update, every keystroke); a field under the user's typing is never overwritten */

    ni("ot_" + k + "x", v => { const o = OT[k]; o.mode = "price"; o.price = numIn(v); });
  }
  M.querySelectorAll("#otBody input").forEach(e => e.addEventListener("keydown", ev => { if(ev.key === "Enter") e.blur(); }));
  M.querySelectorAll("#otBody .ot-st").forEach(b => otHold(b, n => otStep(b.dataset.step, +b.dataset.d * n)));

// − / +: a tap steps once; held, it repeats, and after a couple of seconds by ten
function otHold(btn, fn){
  let t1 = 0, t2 = 0, n = 0;
  const stop = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = 0; };
  btn.addEventListener("pointerdown", e => {
    if(e.button > 0) return;
    e.preventDefault();                                            // the field keeps its keyboard
    stop(); n = 0; fn(1);
    t1 = setTimeout(() => { t2 = setInterval(() => { n++; fn(n > 24 ? 10 : 1); }, 70); }, 380);
  });
  for(const ev of ["pointerup", "pointercancel", "pointerleave"]) btn.addEventListener(ev, stop);
  btn.addEventListener("click", e => { if(e.detail === 0) fn(1); });  // the keyboard's Enter / Space
}
function otStep(k, d){
  const put = (id, v) => { const e = document.getElementById(id); if(e) e.value = String(v); };
  if(k === "ent"){ OT.entry = roundTo((OT.entry > 0 ? OT.entry : otDefEntry()) + d * pipSz(), S.symbol.digits); OT.entryUser = true; put("otEnt", pxIn(OT.entry)); }
  else if(k === "lim"){ OT.lim = Math.max(0, Math.round((OT.lim >= 0 ? OT.lim : 0) + d)); put("otLim", OT.lim); }
  else if(k === "range"){ OT.range = Math.max(0, Math.round((OT.range >= 0 ? OT.range : 0) + d)); put("otRange", OT.range); }
  else if(k === "tp1v"){ const s = S.symbol; OT.tp1.vol = clamp(roundTo((OT.tp1.vol > 0 ? OT.tp1.vol : s.minLot) + d * s.lotStep, 2), s.minLot, s.maxLot); put("ot_tp1v", fmt(OT.tp1.vol, 2)); }
  else { const lk = k.slice(0, -1), o = OT[lk]; if(!o) return; o.mode = "pips"; o.pips = Math.max(1, Math.round((o.pips >= 1 ? o.pips : 0) + d)); put("ot_" + lk + "p", o.pips); }
  otSync();
}

/* «Разместить ордер»: a market order goes through the execution pill like the quick trade; a pending one is placed */
function otPlace(){
  if(!OT || OT.busy) return;
  const R = otCalc();
  if(!R.ok || R.closed || guardLock()) return;
  const t = OT.type, side = OT.side, buy = side === "buy", vol = roundTo(R.vol, 2), d = S.symbol.digits;
  const tp1 = OT.tp1.on, tp2 = OT.tpSeen && OT.tp2.on, both = tp1 && tp2;
  const main = both || !tp1 ? (tp2 ? OT.tp2 : null) : OT.tp1;       // the position's own TP: the last level
  const lvl = o => o.mode === "pips" ? { pips: o.pips } : { price: roundTo(o.price, d) };
  OT.busy = true;
  if(S.ui.lot !== vol){ S.ui.lot = vol; save(); }
  if(t === "market"){
    const opts = { quiet: true, ref: buy ? S.price.ask : S.price.bid };
    if(OT.rangeOn) opts.range = OT.range;
    if(OT.sl.on){ const l = lvl(OT.sl); if(l.pips != null) opts.slPips = l.pips; else opts.sl = l.price; }
    if(main){ const l = lvl(main); if(l.pips != null) opts.tpPips = l.pips; else opts.tp = l.price; }
    if(both) opts.tp1 = Object.assign(lvl(OT.tp1), { volume: R.v1 });
    closeModal();
    execPill("run", vol);
    setTimeout(() => {
      const mirroring = XC.follower, p = openPosition(side, vol, opts);
      if(p){ execPill("ok", vol); render(); }
      else if(mirroring) execPill("sent", vol);
      else execPill("hide");                                       // openPosition said why (margin, the range…)
    }, EXEC_MS);
    return;
  }
  const o = { type: side + "_" + OT_PEND[t], volume: vol, price: roundTo(R.ent, d), sl: OT.sl.on ? OT.sl.price : null, tp: main ? main.price : null };
  if(t !== "limit") o.trig = OT.trig;
  if(t === "stoplimit") o.lim = OT.lim;
  if(both) o.tp1 = { price: OT.tp1.price, volume: R.v1 };
  const mirroring = XC.follower, r = addPending(o);
  if(r || mirroring){ closeModal(); render(); } else OT.busy = false;
}

/* ---------- generic sheet ---------- */
/* ===================== A SHEET YOU CAN THROW AWAY =============================================================
   Until now a window could only be closed by a button: the animation was a canned duration with a beginning and
   an end, and the finger had nothing to do with it. Now the gesture OWNS the progress — the sheet goes exactly
   where the finger takes it, and what happens on release is decided by the speed it was let go at, not by a
   threshold in pixels alone. Grab it again mid-flight and it carries on from where it is, with its velocity:
   every one of these is a spring being retargeted, never an animation being restarted.
   A bottom sheet is dragged by its head (the top 64 px), so it can never fight the scrolling inside it; the
   drawer is dragged anywhere, because it only scrolls the other way. */
const SHD = { m: null, sh: null, h: false, o: 0, v: 0, size: 1, drag: null, raf: 0, t: 0 };
function shdPut(){
  const S2 = SHD; if(!S2.sh) return;
  const o = S2.o;
  S2.sh.style.transform = S2.h ? "translate3d(" + (-o).toFixed(1) + "px,0,0)" : "translate3d(0," + o.toFixed(1) + "px,0)";
  S2.m.style.setProperty("--shd", (1 - Math.min(1, Math.abs(o) / S2.size)).toFixed(3));
}
function shdFrame(now){
  const S2 = SHD; S2.raf = 0;
  if(!S2.sh || !S2.sh.isConnected){ S2.sh = null; return; }
  const dt = S2.t ? Math.min(Math.max((now - S2.t) / 1000, 0), 1 / 30) : MO.dt0; S2.t = now;
  if(S2.go){                                                       // thrown out: keep going, then it is gone
    S2.v += 2600 * dt; S2.o += S2.v * dt;
    shdPut();
    if(S2.o >= S2.size + 20){ const m = S2.m; shdClear(); if(modalEl === m) closeModal(true); else m.remove(); return; }
    S2.raf = 1; moAdd(shdFrame); return;
  }
  S2.v = MO.sp(S2.v, S2.o, 0, MO.P.drag, dt); S2.o += S2.v * dt;
  shdPut();
  if(Math.abs(S2.o) < .3 && Math.abs(S2.v) < 6){ S2.o = 0; S2.v = 0; shdPut(); shdClear(); return; }
  S2.raf = 1; moAdd(shdFrame);
}
function shdClear(){
  const S2 = SHD;
  if(S2.sh){ S2.sh.style.removeProperty("transform"); S2.sh.style.removeProperty("will-change"); }
  if(S2.m){ S2.m.classList.remove("shd"); S2.m.style.removeProperty("--shd"); }
  S2.sh = null; S2.m = null; S2.drag = null; S2.go = false; S2.o = 0; S2.v = 0; S2.t = 0;
}
function sheetDrag(m){
  const sh = m.querySelector(".sheet"); if(!sh) return;
  const horiz = m.classList.contains("amodal");
  let d = null;
  const NOPE = ".lgs, .lotwheel, .lw-wrap, input, textarea, select, canvas, .ot-vol, .ctp-lot, .seg, [data-lgui], [data-lgth]";
  sh.addEventListener("pointerdown", e => {
    if(e.button > 0 || (e.target.closest && e.target.closest(NOPE))) return;
    if(!horiz && (sh.scrollTop > 4 || e.clientY - sh.getBoundingClientRect().top > 64)) return;   // its head only
    const S2 = SHD;
    if(S2.sh !== sh){ shdClear(); S2.sh = sh; S2.m = m; S2.h = horiz; S2.o = 0; S2.v = 0; }       // else: seize the spring mid-flight
    S2.size = Math.max(1, horiz ? sh.offsetWidth : sh.offsetHeight);
    d = { x: e.clientX, y: e.clientY, o0: S2.o, on: false, lx: e.clientX, ly: e.clientY, lt: performance.now(), v: 0 };
    S2.drag = d; S2.go = false;
    sh.style.willChange = "transform";
    m.classList.add("shd");
  }, { passive: true });
  const move = e => {
    if(!d) return;
    const S2 = SHD, dx = e.clientX - d.x, dy = e.clientY - d.y;
    if(!d.on){
      if(Math.max(Math.abs(dx), Math.abs(dy)) < 8) return;
      const ok = horiz ? (Math.abs(dx) > Math.abs(dy) * 1.4 && dx < 0) : (Math.abs(dy) > Math.abs(dx) * 1.2 && dy > 0);
      if(!ok){ d = null; SHD.drag = null; return; }
      d.on = true;
    }
    let o = d.o0 + (horiz ? -dx : dy);
    if(o < 0) o *= .32;                                            // pushed the wrong way it goes rubbery, not nowhere
    const now = performance.now(), ms = now - d.lt;
    if(ms > 8){ d.v = ((horiz ? -(e.clientX - d.lx) : e.clientY - d.ly) / ms) * 1000; d.lx = e.clientX; d.ly = e.clientY; d.lt = now; }
    S2.o = o; S2.v = d.v;
    shdPut();
    if(e.cancelable) e.preventDefault();
  };
  sh.addEventListener("pointermove", move, { passive: false });
  const up = () => {
    if(!d) return;
    const S2 = SHD, was = d.on; d = null; S2.drag = null;
    if(!was){ shdClear(); return; }
    // thrown, or pulled past a third of itself: it leaves. Otherwise it springs home from where it is, at the
    // speed it was let go at — the release is a continuation, not a new animation
    S2.go = S2.v > 620 || (S2.o > S2.size * .32 && S2.v > -180);
    if(S2.go) S2.v = Math.max(S2.v, 420);
    S2.t = 0;
    if(!S2.raf){ S2.raf = 1; moAdd(shdFrame); }
  };
  sh.addEventListener("pointerup", up, { passive: true });
  sh.addEventListener("pointercancel", up, { passive: true });
}
function openSheet(html, sheetCls, modalCls){
  const from = _morphFrom && _morphFrom.isConnected && performance.now() - _morphT < 450 && glassOn("morph") ? _morphFrom : null;
  _morphFrom = null;
  closeTFPop(true);
  const swap = !!modalEl || !!document.querySelector(".modal.closing:not(.morph)");
  closeModal(true);
  document.querySelectorAll(".modal.closing").forEach(m => m.remove());
  modalEl = document.createElement("div");
  modalEl.className = "modal" + (swap ? " swap" : "") + (modalCls ? " " + modalCls : "");
  modalEl.innerHTML = `<div class="sheet ${sheetCls||""}"><button class="iconbtn close" data-close>✕</button>${html}</div>`;
  document.body.appendChild(modalEl);

  glassDrops(modalEl);                                            // Market / Pending, SELL / BUY flow on

/* a sheet's scroll indicator of its own — the browser's overlay bar ran past their rounded corners (user: «ползунок
   вверх вниз, он выскакивает»): a thin bar inside the straight part of the edge, clear of the corners, shown while
   it scrolls and fading after */
function scrollInd(sc, host){
  if(!sc || !host || sc._ind) return;
  const bar = document.createElement("i"); bar.className = "sc-ind"; bar.setAttribute("aria-hidden", "true");
  host.appendChild(bar); sc._ind = bar;
  let raf = 0, t = 0;
  const draw = () => {
    raf = 0;
    const sh = sc.scrollHeight, ch = sc.clientHeight;
    if(!sc.isConnected || sh <= ch + 1){ bar.classList.remove("on"); return; }
    const r = sc.getBoundingClientRect(), hr = host.getBoundingClientRect(), cs = getComputedStyle(sc);
    const rt = parseFloat(cs.borderTopRightRadius) || 0, rb = parseFloat(cs.borderBottomRightRadius) || 0;
    const top = r.top - hr.top + Math.max(6, rt + 2), bot = r.bottom - hr.top - Math.max(6, rb + 2), track = Math.max(24, bot - top);
    const h = Math.max(28, track * ch / sh), y = top + (track - h) * clamp(sc.scrollTop / (sh - ch), 0, 1);
    bar.style.height = h.toFixed(1) + "px";
    bar.style.transform = "translate(" + (r.right - hr.left - 6).toFixed(1) + "px," + y.toFixed(1) + "px)";
    bar.classList.add("on");
    clearTimeout(t); t = setTimeout(() => bar.classList.remove("on"), 900);
  };
  sc.addEventListener("scroll", () => { if(!raf) raf = requestAnimationFrame(draw); }, { passive: true });
}
/* modalEl lets go at once (the app sees no sheet); the element slides down and is removed after */
function closeModal(now){
  if(!modalEl) return;
  const m = modalEl;
  modalEl = null;
  if(m._closed){ const f = m._closed; m._closed = null; f(); }    // whatever the sheet turned on while it was open
  otMenuClose(true); closeLotList();
  if(m.querySelector(".ot-sheet")) OT = null;
  if(now === true){ if(m.classList.contains("morph")) lgStop("sheet"); morphShow(m); m.remove(); return; }
  if(m.contains(document.activeElement)) document.activeElement.blur();   // no keyboard riding down with it
  if(m.classList.contains("amodal")){                             // a panel goes back to its edge, at the speed it has
    const sh = m.querySelector(".am-sheet");
    if(sh){
      const W = Math.max(1, sh.offsetWidth || 320);
      let x = SHD.sh === sh ? -SHD.o : 0, v = SHD.sh === sh ? -SHD.v : 0;
      shdClear();
      document.body.classList.remove("amenu-open");
      sh.style.willChange = "transform";
      m.classList.add("shd");
      let t0 = 0;
      const step = now => {
        if(!sh.isConnected) return;
        const dt = t0 ? Math.min(Math.max((now - t0) / 1000, 0), 1 / 30) : MO.dt0; t0 = now;
        v = MO.sp(v, x, -W - 12, MO.P.large, dt); x += v * dt;
        if(x <= -W){ m.remove(); return; }
        sh.style.transform = "translate3d(" + x.toFixed(1) + "px,0,0)";
        m.style.setProperty("--shd", (1 - Math.min(1, -x / W)).toFixed(3));
        moAdd(step);
      };
      moAdd(step);
      return;
    }
  }
  if(m.classList.contains("morph") && morphClose(m)) return;       // the drop drains back into its button, sheet and all
  morphShow(m);
  m.classList.add("closing");
  setTimeout(() => m.remove(), 200);
}

/* In-app confirmation sheet. NEVER use window.confirm() for this — in Telegram's

/* =========================================================================
   Live number updates (called every UI frame, doesn't rebuild DOM)
   ========================================================================= */
function setTxt(id, txt, cls){
  const e = document.getElementById(id);
  if(!e) return;
  txt = String(txt);
  if(e.tagName === "INPUT"){ if(document.activeElement !== e && e.value !== txt) e.value = txt; return; }   // never under the user's typing
  if(e.textContent !== txt) e.textContent = txt;              // skip no-op DOM writes (most fields don't change every 120ms)
  if(cls !== undefined){
    const next = e.className.replace(/\b(pos|neg)\b/g,"").trim() + (cls?(" "+cls):"");
    if(e.className !== next) e.className = next;
  }
}
/* guarantee a value ALWAYS shows in full — shrink font (to a readable floor) only if it would clip.
   Skips the work when neither the text length nor the box width changed. The box width is read once
   per element (again after a resize / the web font arriving): reading clientWidth on every 120 ms
   update, right after the prices were written, forced a layout of the whole page each time. */
let _fitGen = 0;
if(document.fonts && document.fonts.ready) document.fonts.ready.then(() => { _fitGen++; });
function fitText(el, minPx){
  if(!el) return;
  if(el._fitGen !== _fitGen){ el._fitGen = _fitGen; el._fitW = el.clientWidth; }
  const key = el.textContent.length + "@" + el._fitW;
  if(el._fitKey === key) return;
  el._fitKey = key;
  if(el.style.fontSize) el.style.fontSize = "";    // let CSS drive the natural size first (a no-op write would lay the page out again)
  const floor = minPx || 12;
  let guard = 0;
  while(el.scrollWidth > el.clientWidth + 1 && guard++ < 22){
    const cur = parseFloat(getComputedStyle(el).fontSize) || 20;
    const next = Math.max(floor, cur - 1);
    el.style.fontSize = next + "px";
    if(next === floor) break;
  }
}
