<title>XAUCORE — DEMO XAUUSD Simulator</title>
<meta name="description" content="XAUCORE — fully synthetic DEMO XAUUSD trading simulator. No real quotes, brokers or accounts.">
<meta name="theme-color" content="#f4f5f7">
<script>/* apply the saved theme before first paint — no light flash */try{if(localStorage.getItem("xc_theme")==="dark")document.documentElement.dataset.theme="dark";}catch(e){}</script>

<link rel="manifest" href="/manifest.webmanifest">

<style>
/* Open Sans — self-hosted (no external requests), whole app uses one sans-serif */
@font-face{font-family:'Open Sans';font-style:normal;font-weight:300 800;font-display:swap;src:url(/fonts/opensans-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Open Sans';font-style:normal;font-weight:300 800;font-display:swap;src:url(/fonts/opensans-latin-ext.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Open Sans';font-style:normal;font-weight:300 800;font-display:swap;src:url(/fonts/opensans-cyrillic.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Open Sans';font-style:normal;font-weight:300 800;font-display:swap;src:url(/fonts/opensans-cyrillic-ext.woff2) format('woff2');unicode-range:U+0460-052F,U+1C80-1C8A,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F}
:root{
  --bg:#f4f5f7; --card:#ffffff; --ink:#1a1d21; --ink2:#6b7280; --ink3:#9aa1ab;
  --line:#e8eaed; --green:#0aa85f; --green-bg:#e7f7ef; --red:#e5342b;
  --red-bg:#fdecea; --orange:#f5820d; --orange-bg:#fff2e2; --blue:#2f7bf6;
  --radius:16px; --shadow:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  --font:'Open Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  /* --- theming tokens (see [data-theme="dark"] below) --- */
  --field-bg:#fbfbfc;        /* inputs / sunken surfaces */
  --press:#eef0f2;           /* :active / hover background */
  --raise:#ffffff;           /* small raised chip (segmented "on") */
  --invert:#111418;          /* dark CTA buttons, toasts, floating bar */
  --invert-ink:#ffffff;
  --scrim:rgba(0,0,0,.4);    /* modal backdrop */
  --buy-line:#b7e6cf; --sell-line:#f6c9c4;
  --chart-bg:#ffffff; --chart-grid:#eef0f2; --chart-axis:#9aa1ab;
  --chart-cross:#9aa1ab; --chart-tag:#111418; --chart-glass:rgba(255,255,255,.92);
}
:root[data-theme="dark"]{
  --bg:#0e1116; --card:#171b22; --ink:#e7e9ec; --ink2:#9aa3b0; --ink3:#69707c;
  --line:#272d38; --green:#2ec27e; --green-bg:rgba(46,194,126,.16); --red:#f0564b;
  --red-bg:rgba(240,86,75,.16); --orange:#f5920d; --orange-bg:rgba(245,146,13,.16); --blue:#3b82f6;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.35);
  --field-bg:#0f141b; --press:#20262f; --raise:#2c333e;
  --invert:#242b35; --invert-ink:#f2f4f7;
  --scrim:rgba(0,0,0,.62);
  --buy-line:rgba(46,194,126,.45); --sell-line:rgba(240,86,75,.45);
  --chart-bg:#12151b; --chart-grid:#232936; --chart-axis:#8a929e;
  --chart-cross:#8a929e; --chart-tag:#2b323d; --chart-glass:rgba(20,24,30,.92);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* The whole page is ONE normal document scroll on <html> — no nested scroll containers.
   overflow-x:clip prevents horizontal overflow WITHOUT turning overflow-y into a
   scroll container (which `hidden` would do). */
html{overflow-x:clip;overscroll-behavior-y:none}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:var(--font);
  font-size:15px;line-height:1.35}
body{max-width:520px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);width:100%;overflow-x:clip}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select{font-family:inherit;font-size:inherit;color:inherit;min-width:0}
img,canvas,svg,video{max-width:100%}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
#app{padding-bottom:92px;overflow-x:clip;max-width:100%}
.row>*{min-width:0}
.row .v{text-align:right;overflow-wrap:anywhere}
.appbar{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;padding:12px 14px;min-height:52px}
.appbar .ttl{font-weight:700;font-size:18px;display:flex;align-items:center;gap:6px}
.appbar .sp{flex:1}
.iconbtn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--ink2);font-size:18px}
.iconbtn:active{background:var(--line)}
.badge-demo{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--orange);
  background:var(--orange-bg);border:1px solid #f6cfa0;padding:3px 7px;border-radius:999px;white-space:nowrap}
.subtabs{display:flex;gap:2px;background:var(--card);border-bottom:1px solid var(--line);padding:0 8px;overflow-x:auto;position:sticky;top:52px;z-index:30}
.subtabs button{padding:12px 12px;font-weight:600;color:var(--ink3);font-size:13.5px;white-space:nowrap;border-bottom:2px solid transparent}
.subtabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.wrap{padding:12px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:13px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row+.row{margin-top:8px}
.k{color:var(--ink2)}
.v{font-weight:600}
.pos{color:var(--green)!important}
.neg{color:var(--red)!important}
.warn-banner{background:var(--orange);color:#fff;padding:10px 14px;font-size:13px;font-weight:600;text-align:center}
.err-banner{background:var(--red);color:#fff;padding:10px 14px;font-size:13px;font-weight:600;text-align:center}

/* trade panel — ПРОДАТЬ | лоты | КУПИТЬ. Must fit full Bid/Ask on ~360-412px with no clipping. */
.tradepanel{display:grid;grid-template-columns:minmax(0,1fr) minmax(58px,88px) minmax(0,1fr);gap:6px;align-items:stretch;width:100%}
.tbtn{border-radius:14px;padding:12px 5px;text-align:center;display:flex;flex-direction:column;gap:5px;justify-content:center;min-height:92px;border:1px solid transparent;overflow:hidden;min-width:0}
.tbtn .lbl{font-weight:800;font-size:clamp(10px,3vw,13.5px);letter-spacing:.02em;white-space:nowrap}
.tbtn .px{display:block;width:100%;font-size:clamp(14px,4.7vw,21px);font-weight:800;white-space:nowrap;overflow:hidden;letter-spacing:-.01em;line-height:1.15}
.tbtn .sub{font-size:10.5px;opacity:.75;font-weight:600}
.tbtn.sell{background:var(--red-bg);color:var(--red);border-color:var(--sell-line)}
.tbtn.buy{background:var(--green-bg);color:var(--green);border-color:var(--buy-line)}
.tbtn:active{filter:brightness(.96)}
.tbtn:disabled{opacity:.45}
.lotbox{background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 3px;gap:4px;min-width:0}
.lotbox .cap{font-size:8.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.02em;font-weight:700;text-align:center;line-height:1.15}
.lotctl{display:flex;align-items:center;gap:3px;width:100%}
.lotctl button{width:24px;height:28px;flex:0 0 auto;border-radius:8px;background:var(--line);font-size:16px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center}
.lotctl button:active{background:var(--press)}
.lotctl .val{flex:1 1 auto;min-width:30px;text-align:center;font-weight:800;font-size:15px;border:none;background:none;width:100%;padding:2px 0}
@media (max-width:400px){
  .tradepanel{grid-template-columns:minmax(0,1fr) minmax(64px,82px) minmax(0,1fr);gap:4px}
  .tbtn{padding:11px 3px}
  .tbtn .lbl{font-size:10px}
  .lotbox{padding:6px 2px}
  .lotbox .cap{font-size:7.5px}
  .lotctl{gap:2px}
  .lotctl button{width:20px;height:26px;font-size:14px}
  .lotctl .val{font-size:14px;min-width:28px}
}
.lotctl .val:focus{outline:2px solid var(--blue);border-radius:6px}
.spreadchip{display:inline-flex;gap:6px;align-items:center;background:var(--line);color:var(--ink2);font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;margin-top:10px}
.miniquick{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.miniquick button{background:var(--line);border-radius:9px;padding:6px 10px;font-weight:700;font-size:12px;color:var(--ink2)}
.miniquick button:active{background:var(--press)}
.loterr{color:var(--red);font-size:12px;font-weight:600;margin-top:8px;min-height:0}

.bignew{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;width:min(492px,calc(100% - 24px));
  background:var(--invert);color:var(--invert-ink);font-weight:800;letter-spacing:.02em;padding:15px;border-radius:14px;text-align:center;z-index:35;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.bignew:active{filter:brightness(.9)}

/* bottom nav */
.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;background:var(--card);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.bottomnav button{padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);font-size:10.5px;font-weight:600}
.bottomnav button.on{color:var(--blue)}
.bottomnav .ic{font-size:19px;line-height:1;position:relative}
.navpill{position:absolute;top:-4px;right:-11px;background:var(--blue);color:#fff;border-radius:999px;font-size:9px;font-weight:800;padding:1px 4px;min-width:14px;text-align:center}

/* list rows */
.lrow{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px;display:flex;flex-direction:column;gap:6px}
.lrow .top{display:flex;justify-content:space-between;align-items:baseline}
.lrow .sym{font-weight:800}
.tag{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:.03em}
.tag.buy{background:var(--green-bg);color:var(--green)}
.tag.sell{background:var(--red-bg);color:var(--red)}
.lrow .mid{display:flex;justify-content:space-between;color:var(--ink2);font-size:12.5px}
.lrow .pnl{font-weight:800;font-size:16px}
.muted{color:var(--ink3);text-align:center;padding:32px 10px;font-size:13.5px}

/* chart */
.chartwrap{background:var(--card);border-radius:0;max-width:100%;overflow:hidden}
.tfbar{display:flex;gap:4px;padding:8px 8px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tfbar::-webkit-scrollbar{display:none}
.tfbar button{flex:1 1 auto;min-width:40px;padding:9px 6px;border-radius:9px;font-weight:800;font-size:12.5px;color:var(--ink2);background:var(--line)}
.tfbar button.on{background:var(--blue);color:#fff}
#chartCanvas,#miniCanvas,#domCanvas{width:100%;display:block;max-width:100%}
/* pan-y lets a vertical swipe scroll the PAGE even when it starts on the chart;
   horizontal drag / pinch still go to the chart's own JS handlers */
#chartCanvas{touch-action:pan-y}
#miniCanvas{touch-action:auto}
.chartbox{position:relative;background:var(--card);max-width:100%;overflow:hidden}
.chartinfo{position:absolute;left:8px;top:6px;right:8px;font-size:10px;font-weight:600;color:var(--ink2);background:var(--chart-glass);border-radius:8px;padding:4px 7px;pointer-events:none;line-height:1.35;white-space:normal}
.chartzoom{position:absolute;left:8px;bottom:26px;display:flex;flex-direction:column;gap:6px;z-index:5}
.chartzoom button{width:36px;height:36px;border-radius:11px;background:var(--chart-glass);border:1px solid var(--line);font-size:18px;font-weight:800;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center}
.chartzoom button:active{background:var(--line)}
.chartzoom button.rst{font-size:14px}

/* forms / modal */
.modal{position:fixed;inset:0;background:var(--scrim);z-index:80;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;padding:16px 14px 26px}
.sheet h2{margin:2px 0 14px;font-size:17px}
.sheet .close{position:absolute;right:16px;top:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--ink2);font-weight:700;margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
.field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--field-bg);color:var(--ink)}
.field .hint{font-size:11.5px;color:var(--ink3);margin-top:4px}
.seg{display:flex;gap:4px;background:var(--line);border-radius:11px;padding:3px}
.seg button{flex:1;padding:9px;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink2)}
.seg button.on{background:var(--raise);color:var(--ink);box-shadow:var(--shadow)}
.btn{display:block;width:100%;padding:14px;border-radius:13px;font-weight:800;text-align:center;margin-top:6px}
.btn.green{background:var(--green);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.dark{background:var(--invert);color:var(--invert-ink)}
.btn.ghost{background:var(--line);color:var(--ink)}
.btn:active{filter:brightness(.95)}
.btn:disabled{opacity:.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl-tbl .row{padding:5px 0;border-bottom:1px dashed var(--line)}
.pl-tbl .row:last-child{border-bottom:none}
.menu-item{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-weight:600}
.menu-item:active{background:var(--press)}
.toast-wrap{position:fixed;left:50%;transform:translateX(-50%);top:64px;z-index:100;width:min(492px,calc(100% - 20px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:var(--invert);color:var(--invert-ink);border-radius:12px;padding:10px 13px;font-size:12.5px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:tin .25s ease}
.toast.g{background:#0b7a45}.toast.r{background:#c02a22}.toast.o{background:#c96a08}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.dom-grid{display:grid;grid-template-columns:1fr 88px 1fr;font-size:12px;font-variant-numeric:tabular-nums}
.dom-grid>div{padding:5px 8px;border-bottom:1px solid var(--line)}
.dom-bid{text-align:right;color:var(--green);position:relative}
.dom-ask{text-align:left;color:var(--red);position:relative}
.dom-px{text-align:center;font-weight:800}
.dom-bar{position:absolute;top:0;bottom:0;opacity:.14}
.dom-bar.b{right:0;background:var(--green)}
.dom-bar.a{left:0;background:var(--red)}
.evt{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.evt:last-child{border-bottom:none}
.evt .nm{font-weight:700}
.evt .impact{font-size:10px;font-weight:800;padding:1px 5px;border-radius:5px;background:var(--orange-bg);color:var(--orange)}
.evt small{color:var(--ink3)}
hr.d{border:none;border-top:1px solid var(--line);margin:12px 0}
.pill-toggle{display:flex;gap:6px}
.pill-toggle button{flex:1 1 0;min-width:0;padding:9px 4px;border-radius:9px;background:var(--line);font-weight:800;font-size:12px;color:var(--ink2);white-space:nowrap}
.pill-toggle button.on{background:var(--blue);color:#fff}

/* macro news engine */
.news-btns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 8px}
.news-btns button{background:var(--orange-bg);color:var(--orange);border:1px solid #f3c98f;border-radius:11px;padding:12px 4px;font-weight:800;font-size:12.5px;letter-spacing:.02em}
.news-btns button:active{filter:brightness(.94)}
.news-btns button:disabled{opacity:.35}
.news-btns button.wide{grid-column:span 3;background:var(--invert);color:var(--invert-ink);border-color:var(--invert)}
.news-lock{position:sticky;top:0;z-index:60;background:linear-gradient(90deg,#f5820d,#e5342b);color:#fff;padding:10px 14px 11px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.2)}
.news-lock .nl-title{font-size:11px;font-weight:800;letter-spacing:.06em;opacity:.95}
.news-lock .nl-count{font-size:28px;font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.news-lock .nl-sub{font-size:10px;font-weight:600;opacity:.92}
.news-res .row{padding:6px 0;border-bottom:1px dashed var(--line)}
.news-res .row:last-child{border-bottom:none}
.ne-card{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.ne-card summary{font-weight:800;font-size:13px;cursor:pointer;list-style:none}
.ne-card summary::-webkit-details-marker{display:none}
.ne-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.ne-grid .field{margin-bottom:4px}
.ne-grid .field label{font-size:10px}
.ne-grid .field input,.ne-grid .field select{padding:8px 9px;font-size:13px}
.lastnews{background:var(--field-bg);border-radius:10px;padding:9px 11px;font-size:12px;margin-top:4px}
.lastnews b{font-weight:800}

/* ticks-per-second control */
.tps-val{font-weight:900;font-size:20px;font-variant-numeric:tabular-nums;color:var(--blue)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:2px 0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:7px;border-radius:999px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;margin-top:-8.5px;border-radius:50%;background:var(--blue);border:3px solid var(--card);box-shadow:0 1px 5px rgba(0,0,0,.25)}
input[type=range]::-moz-range-track{height:7px;border-radius:999px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--blue);border:3px solid var(--card)}
.tps-presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tps-presets button{flex:1 1 auto;min-width:54px;background:var(--line);border-radius:9px;padding:10px 4px;font-weight:800;font-size:12.5px;color:var(--ink2)}
.tps-presets button.on{background:var(--blue);color:#fff}
.tps-presets button:active{filter:brightness(.95)}

/* manual market control (god mode) */
.godpanel{background:#1b1f24;color:#fff;border-radius:16px;padding:13px 13px 14px;margin-bottom:12px;box-shadow:0 6px 20px rgba(0,0,0,.28)}
.godpanel .gp-hd{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.06em;color:#ffb85c}
.godpanel .gp-hd .dot{width:8px;height:8px;border-radius:50%;background:#ffb85c;box-shadow:0 0 8px #ffb85c}
.godpanel .gp-px{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;margin:6px 0 2px}
.godpanel .gp-sub{font-size:11px;color:#9aa4af;font-weight:600;margin-bottom:4px}

/* ---------------- utils ---------------- */
let gSpare = null;
function gauss(){
  if(gSpare !== null){ const s = gSpare; gSpare = null; return s; }
  let u,v,s;
  do{ u = Math.random()*2-1; v = Math.random()*2-1; s = u*u+v*v; }while(s>=1||s===0);
  const m = Math.sqrt(-2*Math.log(s)/s);
  gSpare = v*m; return u*m;
}
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const rnd = (a,b)=>a + Math.random()*(b-a);
function roundTo(x,d){ const p = Math.pow(10,d); return Math.round((x+Number.EPSILON)*p)/p; }
function fmt(x,d){ return Number(x).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function money(x){ const s = x<0?"-":""; return s + "$" + fmt(Math.abs(x),2); }
function signMoney(x){ const s = x>0?"+":(x<0?"-":""); return s + "$" + fmt(Math.abs(x),2); }
function walletFmt(x){                                       // "3,000,000,000 USD" / "1,234.50 USD"
  const n = Math.max(0, Number(x) || 0);

}

function pad2(n){ return String(n).padStart(2,"0"); }

function simTimeStr(){ const d = simDate(); return pad2(d.getUTCHours())+":"+pad2(d.getUTCMinutes())+":"+pad2(d.getUTCSeconds()); }
function simDateStr(t){ const d = new Date(t==null?S.simClock:t); return d.getUTCFullYear()+"-"+pad2(d.getUTCMonth()+1)+"-"+pad2(d.getUTCDate()); }
function fmtDur(ms){
  const s = Math.floor(ms/1000);
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), ss = s%60;

let _sessJitterHour = -1, _sessJitter = 1;
function sessionInfo(){
  const d = simDate();
  const h = d.getUTCHours() + d.getUTCMinutes()/60;
  const hourKey = Math.floor(S.simClock/3600000);
  if(hourKey !== _sessJitterHour){ _sessJitterHour = hourKey; _sessJitter = clamp(0.78 + Math.abs(gauss())*0.42, 0.6, 1.9); }

  const asian  = (h>=0 && h<9);
  const london = (h>=7 && h<16);
  const ny     = (h>=12 && h<21);
  const late   = (h>=21 && h<24);
  const names = [];
  if(asian)  names.push("Asian");
  if(london) names.push("London");
  if(ny)     names.push("New York");
  if(late)   names.push("Late");
  let vol = 0.55;
  if(asian)  vol = Math.max(vol, 0.85);     // low / medium
  if(london) vol = Math.max(vol, 1.25);     // increased activity
  if(ny)     vol = Math.max(vol, 1.40);     // high activity
  if(london && ny) vol = 1.68;              // overlap
  if(late)   vol = Math.max(0.7, vol*0.75); // usually calmer — but not absolute
  if(!names.length) names = ["Off-hours"];
  vol *= _sessJitter;                        // random variation — sessions aren't absolute
  return { names, vol: clamp(vol, 0.4, 2.6) };
}

/* generate `count` synthetic OHLC bars of `sec` seconds each, ending at `endMid` at time `endMs` */
function genBars(count, sec, endMid, endMs){
  const digits = S.symbol.digits;
  const bars = [];
  const perBar = 42/3.4 * Math.sqrt(sec/86400);      // stdev per bar (typical daily range ~$42)
  let m = endMid + gauss() * perBar * Math.sqrt(count) * 0.5;
  let anchor = m;
  const tEnd = Math.floor(endMs/1000/sec) * sec;
  const t0 = tEnd - count*sec;
  const steps = Math.max(4, Math.min(24, Math.round(sec/30)));
  for(let i=0;i<count;i++){
    const t = t0 + i*sec;
    const hh = new Date(t*1000).getUTCHours();
    let sv = 0.75;
    if(hh>=7 && hh<16) sv = 1.2;
    if(hh>=12 && hh<21) sv = 1.35;
    if(hh>=12 && hh<16) sv = 1.7;
    const o = m; let hi = o, lo = o;
    const sVol = perBar * sv / Math.sqrt(steps);
    for(let k=0;k<steps;k++){
      anchor += (endMid - anchor) * 0.0025;
      m += (anchor - m) * 0.02 + gauss() * sVol;
      if(Math.random() < 0.02) m += gauss() * sVol * 3;
      hi = Math.max(hi, m); lo = Math.min(lo, m);
    }
    bars.push({ t, o:roundTo(o,digits), h:roundTo(hi,digits), l:roundTo(lo,digits), c:roundTo(m,digits), v:Math.round(rnd(30,300)*Math.sqrt(sec/60)) });
  }
  // ease the last few closes onto endMid so all timeframes agree on "now"
  const d = endMid - bars[bars.length-1].c;
  const n = Math.min(bars.length, 15);
  for(let i=bars.length-n;i<bars.length;i++){
    const w = (i-(bars.length-n))/n;
    bars[i].c += d*w; bars[i].o += d*w*0.6;
    bars[i].h = Math.max(bars[i].h, bars[i].c, bars[i].o);
    bars[i].l = Math.min(bars[i].l, bars[i].c, bars[i].o);
  }
  bars[bars.length-1].c = endMid;
  return bars;
}
function aggregateFrom(m1, sec){
  const out = [];
  for(const b of m1){
    const bt = Math.floor(b.t / sec) * sec;
    const last = out[out.length-1];
    if(!last || last.t !== bt){
      out.push({ t:bt, o:b.o, h:b.h, l:b.l, c:b.c, v:b.v });
    }else{
      last.h = Math.max(last.h, b.h);
      last.l = Math.min(last.l, b.l);
      last.c = b.c;
      last.v += b.v;
    }
  }
  return out;
}

/* =========================================================================
   MARKET ENGINE — autonomous regime-switching tick engine (NO STATIC ANCHOR)

   * `S.price.mid` (== currentMarketPrice) is the SINGLE SOURCE OF TRUTH.
     Where the price goes, it stays — every next tick builds from the actual
     current price. No initialPrice / basePrice / reset / mean-reversion-to-start.
     The only hard limit is price > 0.01.
   * MARKET REGIME ENGINE: a regime (STRONG_BULL / BULL / RANGE / DISTRIBUTION /
     BEAR / STRONG_BEAR / ACCUMULATION / RECOVERY) lasts several game-days to weeks
     and switches via a Markov transition matrix.  RANGE-like regimes keep price
     circulating around a DYNAMIC EMA equilibrium (which itself follows price, so a
     flat can form at ANY level — 2100, 5800, anywhere).  Trend regimes have pure
     directional drift + momentum + noise and no pull.
   * 1 simulated trading day = market.dayDurationMin real minutes (default 50).
     Each day draws its own volatility band (target intraday Range) — LOW / NORMAL
     / ACTIVE / EXTREME — with volatility CLUSTERING across days.
   * NEWS + MANUAL IMPULSE are added ON TOP of the auto price and persist afterward.
   ========================================================================= */
const RT_MS = 60;                    // real-time engine frame
let _tickAcc = 0;
let _simDebtMs = 0;                   // unconsumed sim-time carried to the next tick
let _tickBuf = [];                    // in-memory synthetic tick log
function currentVolFactor(){
  const sess = sessionInfo();
  return sess.vol * (S.price.volCluster||1) * (S.news.active ? volCurveAt(S.news.scenario, S.news.progress) : 1);
}
function weightedKey(obj){
  const keys = Object.keys(obj);
  const total = keys.reduce((s,k)=>s+(obj[k]||0), 0) || 1;
  let r = Math.random()*total, acc = 0;
  for(const k of keys){ acc += (obj[k]||0); if(r <= acc) return k; }
  return keys[keys.length-1];
}

/* ---- MARKET REGIME (multi-day, Markov transitions) ---- */
function regimeCfg(){ return MARKET_REGIMES[(S.regime && S.regime.name) || "RANGE"]; }
function nextRegimeName(cur){
  const row = MARKET_TRANSITIONS[cur];
  if(!row) return weightedKey({ RANGE:.30, BULL:.28, ACCUMULATION:.12, RECOVERY:.10, BEAR:.14, DISTRIBUTION:.06 });
  return weightedKey(row);
}
/* real-time within one game-day (ms). Time is ACCUMULATED, never derived from
   an absolute Date.now() endpoint — so the whole simulation stays frozen while
   the user is away and resumes exactly where it stopped. */
function dayDurationMs(){ return Math.max(S.market.dayDurationMin || 50, 1) * 60000; }
function regimeDurationMs(){ return (S.regime ? S.regime.durDays : 8) * dayDurationMs(); }

function startRegime(forcedName){
  const cur = S.regime ? S.regime.name : null;
  const name = forcedName || nextRegimeName(cur);
  const cfg = MARKET_REGIMES[name];
  const durDays = rnd(cfg.durDays[0], cfg.durDays[1]);
  const dayR = S.day ? S.day.targetRange : 35;
  S.regime = {
    name, ageMs: 0, durDays,
    channelHalf: dayR * rnd(1.4, 3.8)             // multi-day range channel half-width
  };
  // breakout kick when leaving a range-ish regime for a directional one
  if(cur && /RANGE|ACCUMULATION|DISTRIBUTION/.test(cur) && !/RANGE|ACCUMULATION|DISTRIBUTION/.test(name)){
    S.price.vel += dayR * rnd(0.15, 0.55) * (cfg.drift >= 0 ? 1 : -1);
  }
  S._needRender = true;
}
function advanceRegime(){
  if(S.regime && (S.regime.ageMs || 0) >= regimeDurationMs()){
    const prev = S.regime.name;
    startRegime(null);
    toast("o", "MARKET REGIME → " + MARKET_REGIMES[S.regime.name].label + "  (было " + MARKET_REGIMES[prev].label + ")");
  }
}

/* ---- daily volatility band (target intraday Range) with volatility clustering ---- */
function pickDayVol(){
  const pr = S.market.dayVolProbs || dayVolProbDefaults();
  const bias = clamp((S.price.volCluster || 1) - 1, -0.45, 1.6);   // recent activity biases the band
  const adj = {
    LOW:     Math.max(0.02, (pr.LOW||0)    * (1 - bias*0.55)),
    NORMAL:  (pr.NORMAL||0),
    ACTIVE:  (pr.ACTIVE||0) * (1 + bias*0.45),
    EXTREME: (pr.EXTREME||0)* (1 + bias*1.30)
  };
  const band = weightedKey(adj);
  const [lo,hi] = DAYVOL_RANGE[band];
  let range = rnd(lo, hi);
  if(band === "EXTREME") range += expRand()*16;               // no hard upper cap
  return { band, targetRange: range };
}
function startNewDay(open){
  const { band, targetRange } = pickDayVol();
  S.daySeq = (S.daySeq || 0) + 1;
  S.day = {
    index: S.daySeq, elapsedMs: 0,
    band, targetRange,
    open, high: open, low: open, close: open,
    regimeAtOpen: S.regime ? S.regime.name : "RANGE"
  };
}
function rolloverDay(){
  const D = S.day;
  D.close = S.price.mid;
  const stat = {
    index: D.index, open: D.open, high: D.high, low: D.low, close: D.close,
    range: D.high - D.low, change: D.close - D.open,
    changePct: (D.close - D.open) / (D.open || 1) * 100,
    band: D.band, regime: S.regime ? MARKET_REGIMES[S.regime.name].label : "-",
    endedAt: Date.now()
  };
  S.dayLog.unshift(stat);
  if(S.dayLog.length > 250) S.dayLog.pop();
  // synthetic inter-session gap: $0 .. $2.5 either way — NEVER a reset to a base price
  const gap = rnd(0, 2.5) * (Math.random() < 0.5 ? 1 : -1);
  const newOpen = Math.max(0.01, roundTo(D.close + gap, S.symbol.digits));
  S.price.mid = newOpen; S.price.prevMid = newOpen;
  const dd = simDate();
  S.simClock = Date.UTC(dd.getUTCFullYear(), dd.getUTCMonth(), dd.getUTCDate() + 1, 0, 0, 0);
  startNewDay(newOpen);
  checkRollover();
  S._needRender = true;
  toast("o", "DAY " + stat.index + " · O " + pxfmt(stat.open) + "  C " + pxfmt(stat.close) +
    "  Range $" + fmt(stat.range, 2) + " · " + signMoney(stat.change) + " · " + stat.regime);
}

/* ---- activity level -> tick frequency ---- */
function marketActivity(){
  return sessionInfo().vol * (S.price.volCluster || 1) * regimeCfg().vol
       * (S.day ? clamp(S.day.targetRange / 42, 0.6, 3.2) : 1);
}

function daySpeedNow(){ return 1440 / Math.max(S.market.dayDurationMin || 50, 1); }   // sim-minutes per real-minute
function normalTps(){ return clamp(S.market.ticksPerSecond || 2, 0.1, 20); }

/* accumulate ACTIVE wall-time (capped) into the day/regime clocks. A big delta —
   tab throttled, backgrounded, or reopened after minutes/hours/days — counts as a
   single frame, so nothing advances while the user is away. */
let _lastFrameReal = Date.now();
function newsFreezesTime(){
  return S.news.active && S.news.scenario && S.news.scenario.oneCandle;
}
function accumulateActiveTime(){
  const now = Date.now();
  let d = now - _lastFrameReal;
  _lastFrameReal = now;
  if(!(d > 0)) return;
  if(d > 400) d = RT_MS;                                   // gap -> one frame, never a leap
  if(S.manual.enabled && S.manual.frozen) return;          // God Mode PAUSE also stops the day clock
  if(newsFreezesTime()) return;                            // NFP: the world holds for the 20s impulse
  d *= simSpeed();                                         // accelerator (applied AFTER the gap cap)
  if(S.day)    S.day.elapsedMs   = (S.day.elapsedMs   || 0) + d;
  if(S.regime) S.regime.ageMs    = (S.regime.ageMs    || 0) + d;
}

/* ---- RT frame (60ms): day/regime lifecycle + the FAST driver for news & manual impulse.
        Ordinary market ticks come from normalTickTimer (see restartNormalTicks). ---- */
function engineFrame(){
  const nowR = Date.now();
  const newsOn = S.news.active;
  const impulseOn = !!S.manual.impulse;
  const closed = marketClosed();

  accumulateActiveTime();
  if(S.day && (S.day.elapsedMs || 0) >= dayDurationMs()) rolloverDay();
  advanceRegime();

  if(newsOn || impulseOn){
    // NFP-style "one candle" release: sim-time HOLDS, only the news impulse drives price
    const oneShot = newsOn && S.news.scenario && S.news.scenario.oneCandle;
    const hz = newsOn ? rnd(S.newsEngine.tickHzNewsMin, S.newsEngine.tickHzNewsMax) : rnd(18, 34);
    _tickAcc += hz * RT_MS / 1000;
    let nTicks = clamp(Math.floor(_tickAcc), 0, 60);
    _tickAcc -= Math.floor(_tickAcc);
    if(!oneShot) _simDebtMs += RT_MS * daySpeedNow() * simSpeed();
    if(nTicks > 0){
      const simPerTick = oneShot ? 0 : _simDebtMs / nTicks;
      _simDebtMs = 0;
      for(let i=0;i<nTicks;i++){
        if(!oneShot){
          S.simClock += simPerTick;
          priceStep((simPerTick/1000) * (closed ? 0.2 : 1));   // the day keeps moving under the news
        }
        if(impulseOn) applyManualImpulse();
        if(newsOn)    stepNews();
        applyPriceDerived();
        pushTick();
        updateCandles();
        processPendings();
        processPositionSLTP();
      }
    }
  }else{
    _tickAcc = 0; _simDebtMs = 0;      // no news catch-up spike when it resumes
  }

  finishFrame(nowR, newsOn);
}
function finishFrame(nowR, newsOn){
  if(S.news.active && nowR >= S.news.endReal) endNews();
  if(S.lock.active && nowR >= S.lock.until){ S.lock.active = false; S._needRender = true; }
  if(Math.random() < 0.02) checkEvents();
  recalcAccount();
  checkStopOut();
  save();
}

/* ---- ordinary-market tick generator — its own timer at exactly 1000 / ticksPerSecond ms ---- */
let normalTickTimer = null;
function restartNormalTicks(){
  if(normalTickTimer){ clearInterval(normalTickTimer); normalTickTimer = null; }
  if(!_loopRunning) return;                        // don't run ticks while paused / tab hidden
  const ms = Math.max(50, Math.round(1000 / normalTps()));
  normalTickTimer = setInterval(normalTickFire, ms);
}
function normalTickFire(){
  try{
    if(S.news.active || S.manual.impulse) return;                 // news / impulse drive price via engineFrame
    if(S.manual.enabled && S.manual.frozen) return;               // God Mode PAUSE
    if(marketClosed()){ recalcAccount(); return; }
    const tps = normalTps();
    const gameMs = (1000 / tps) * daySpeedNow() * simSpeed();     // game-time advanced per real tick (× accelerator)
    // keep each price sub-step small (~<=14 game-sec) so candles stay smooth at any TPS / accelerator
    let sub = clamp(Math.round(gameMs / 14000), 1, 40);
    if(sub < 2 && marketActivity() > 2.6 && Math.random() < 0.18) sub = 2;   // occasional micro-burst
    const stepMs = gameMs / sub;
    for(let i=0;i<sub;i++){
      S.simClock += stepMs;
      priceStep(stepMs / 1000);
      applyPriceDerived();
      pushTick();
      updateCandles();
    }
    processPendings();
    processPositionSLTP();
    recalcAccount();
    checkStopOut();
    save();
  }catch(e){ console.error(e); }
}

/* compat wrapper used by tests — advances the market ~a few game-minutes */
function marketTick(){
  for(let i=0;i<40;i++){ priceStep(4); applyPriceDerived(); pushTick(); }
  S.simClock += 160000;
  updateCandles(); processPendings(); processPositionSLTP();
  recalcAccount(); checkStopOut(); save();
}

/* ---- the price step (dt in GAME seconds).  No anchor. ---- */
function priceStep(dt){
  const P = S.price, M = S.market, RG = regimeCfg();
  dt = Math.max(dt, 0.002);

  const dayRange = S.day ? S.day.targetRange : 35;
  const dayStdev = dayRange / 3.2;                 // close-to-close stdev ~ Range / 3.2
  const sf = sessionInfo().vol;

  // volatility clustering with LONG memory — high-vol periods persist for days (modest ±)
  const persist = clamp(M.volClusterPersist || 0.992, 0.90, 0.9995);
  P.volCluster = clamp(persist*(P.volCluster || 1) + (1-persist)*(0.72 + Math.abs(gauss())*0.7), 0.5, 2.4);

  const volMul = RG.vol * sf * P.volCluster * (M.intradayNoise || 1);
  const sigma = (dayStdev / Math.sqrt(86400)) * Math.sqrt(dt) * volMul;
  const shock = gauss() * sigma;

  // momentum (AR-1 velocity)
  P.vel = clamp(RG.mom, 0, 0.92) * (P.vel || 0) + shock;

  // regime directional drift ($ per game-day). Scale with daily stdev but CAP it so an
  // extreme-vol day does not create runaway trend drift.
  const driftPerDay = RG.drift * clamp(dayStdev, 4, 13) * (M.regimeDriftScale || 1)
                    + MACRO_DRIFT * (M.macroBull || 1);
  P.mid += P.vel + driftPerDay * (dt / 86400);

  // DYNAMIC EQUILIBRIUM — range-like regimes circulate around the slow EMA (which follows price)
  if(RG.rangePull > 0){
    const pull = 1 - Math.exp(-RG.rangePull * dt / 90);
    const dev = P.mid - P.ema;
    const half = (S.regime && S.regime.channelHalf) || dayRange * 2;
    const wall = Math.abs(dev) > half ? clamp((Math.abs(dev)/half - 1) * 0.6, 0, 0.4) : 0;
    P.mid += (P.ema - P.mid) * (pull + wall);
    // rare real breakout out of a long consolidation
    if(Math.random() < 0.00008 * dt){
      const dir = dev >= 0 ? 1 : -1;
      startRegime(dir > 0 ? (Math.random()<0.5?"BULL":"STRONG_BULL") : (Math.random()<0.5?"BEAR":"STRONG_BEAR"));
      P.vel += dir * dayStdev * rnd(0.8, 1.8);
    }
  }

  // the EMAs FOLLOW the price — this is what keeps the flat centre non-static
  P.ema     += (P.mid - P.ema)     * (1 - Math.exp(-dt / 5400));   // ~1.5 game-hour
  P.emaFast += (P.mid - P.emaFast) * (1 - Math.exp(-dt / 900));    // ~15 game-min

  microShock(dt);

  if(P.mid < 0.01) P.mid = 0.01;
  trackDayExtremes();
  P.lastVol = Math.max(1, Math.round(Math.abs(P.vel)/Math.max(sigma,1e-9) * rnd(2,8) + rnd(1,5)));
}
function normalMicroStep(dt){ priceStep(dt); }   // back-compat alias

/* small ordinary market shock ($2-5 common, $5-10, rarely $10-20) — never $50+ */
let _lastShockMin = -1;
function microShock(dt){
  if(S.news.active || S.manual.impulse) return;
  const simMin = Math.floor(S.simClock/60000);
  if(simMin === _lastShockMin) return;
  _lastShockMin = simMin;
  if(Math.random() > 0.012) return;                // ~ a handful per game-day
  const r = Math.random();
  const mag = r < 0.70 ? rnd(2,5) : r < 0.93 ? rnd(5,10) : rnd(10,20);
  const dir = Math.random() < 0.5 ? 1 : -1;
  S.price.mid += dir*mag;
  S.price.vel += dir*mag*0.30;
  S.price.volCluster = Math.min(5, (S.price.volCluster || 1) + 0.7);
  S.price.lastVol = Math.round(mag*9);
}
function trackDayExtremes(){
  const D = S.day; if(!D) return;
  if(S.price.mid > D.high) D.high = S.price.mid;
  if(S.price.mid < D.low)  D.low  = S.price.mid;
}

/* ---- MANUAL MARKET CONTROL (God Mode) ---- */
function manualSyncAll(){
  applyPriceDerived(); updateCandles(); trackDayExtremes();
  processPendings(); processPositionSLTP(); recalcAccount(); checkStopOut();
  pushTick(); save();
}
function manualSetPrice(v){
  if(!isFinite(v) || v <= 0.01){ toast("r", "Некорректная цена"); return; }
  S.price.mid = v; S.price.prevMid = v; S.price.vel = 0;
  S.price.ema = v; S.price.emaFast = v;
  manualSyncAll(); toast("", "Цена установлена: " + pxfmt(v));
}
function manualNudge(d){
  S.price.mid = Math.max(0.01, S.price.mid + d);
  S.price.vel += d * 0.2;
  S.price.lastVol = Math.max(2, Math.round(Math.abs(d) * 14 + rnd(2, 8)));
  manualSyncAll();
}
function manualTick(dir){
  const st = Math.max(0.01, Math.abs(S.manual.stepSize || 0.2));
  manualNudge((dir >= 0 ? 1 : -1) * st);
}
function manualMove(dir){
  const mv = Math.max(0.01, Math.abs(S.manual.moveSize || 1));
  manualNudge((dir >= 0 ? 1 : -1) * mv);
  toast("", (dir >= 0 ? "▲ +$" : "▼ -$") + fmt(mv, 2) + "  →  " + pxfmt(S.price.mid));
}
function manualPause(on){
  if(!S.manual.enabled) return;
  S.manual.frozen = !!on;
  if(on) S.manual.impulse = null;                 // a running impulse would fight a pause
  toast("o", on ? "⏸ Авто Price Engine остановлен" : "▶ Авто Price Engine возобновлён");
  S._needRender = true;
}
function startManualImpulse(dir, usd, sec){
  if(S.news.active){ toast("o", "Идёт новость — дождитесь окончания"); return; }
  if(!isFinite(usd) || usd <= 0 || !isFinite(sec) || sec <= 0){ toast("r", "Проверьте параметры импульса"); return; }
  const now = Date.now();
  S.manual.impulse = { startReal: now, endReal: now + sec*1000, dir: dir >= 0 ? 1 : -1, usd, sec, delta: 0 };
  S._needRender = true;
  toast("o", "Импульс " + (dir >= 0 ? "UP" : "DOWN") + " $" + fmt(usd,2) + " / " + sec + "s");
}
function applyManualImpulse(){
  const im = S.manual.impulse, P = S.price;
  if(!im) return;                                   // impulse finished earlier in this frame
  const p = clamp((Date.now() - im.startReal) / Math.max(im.endReal - im.startReal, 1), 0, 1);
  const ease = p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2;    // easeInOutQuad
  const newDelta = im.dir * im.usd * ease + gauss() * im.usd * 0.014;
  const applied = newDelta - im.delta;
  im.delta = newDelta;
  P.mid = Math.max(0.01, P.mid + applied);
  P.vel = 0.4*P.vel + applied*0.5;
  P.lastVol = Math.max(3, Math.round(Math.abs(applied)*28 + rnd(6,22)));
  trackDayExtremes();
  if(p >= 1){
    S.manual.impulse = null;
    S._needRender = true;
    toast("g", "Импульс завершён (" + (im.dir>0?"+":"-") + "$" + fmt(im.usd,2) + ")");
  }
}

/* ---- news micro-step: news impulse added ON TOP of the market; persists after ---- */
function stepNews(){
  const N = S.news, sc = N.scenario, P = S.price;
  if(!N.active || !sc) return;
  const p = clamp((Date.now() - N.startReal) / (sc.duration*1000), 0, 1);
  N.progress = p;
  const targetDelta = pathOffsetAt(sc, p);
  const nsig = sc.noiseBase * volCurveAt(sc, p);
  N._vel = 0.45*(N._vel || 0) + gauss()*nsig;
  let nd = N.delta + (targetDelta - N.delta) * clamp(sc.pullStrength, 0.02, 0.6) + N._vel;
  if(Math.random() < 0.06) nd += gauss()*nsig*2.6;
  const applied = nd - N.delta;
  N.delta = nd;
  P.mid = Math.max(0.01, P.mid + applied);
  N.high = Math.max(N.high, P.mid);
  N.low  = Math.min(N.low,  P.mid);
  N.ticks++;
  trackDayExtremes();
  P.lastVol = Math.max(3, Math.round(Math.abs(applied)/Math.max(nsig,1e-9) * rnd(20,60) + rnd(10,40)));
}
function newsMicroStep(){ stepNews(); }   // back-compat alias

/* ---- derive bid/ask/spread from mid + dynamic spread engine ---- */
function applyPriceDerived(){
  const P = S.price, d = S.symbol.digits, base = S.market.baseSpread;
  const mv = Math.abs(P.mid - (P.prevMid||P.mid));
  let spread;
  if(S.trading.spreadMode === "fixed"){
    spread = S.trading.fixedSpread;
  }else{
    const sf = sessionInfo().vol;
    spread = base * (0.75 + 0.28*sf) + mv * 0.7;                 // session + micro-move widening
    if(S.news.active){
      const cfg = S.newsEngine.perEvent[S.news.type];
      const p = S.news.progress || 0;
      const shape = clamp(Math.exp(-2.4*p) + 0.55*Math.exp(-26*Math.pow(p-0.5,2)) + 0.35, 0.1, 1.3);
      spread = base * (1 + (cfg.spreadMul - 1) * shape) + mv * 3.2;   // impulse spikes
    }else if(S.news.decayUntil && Date.now() < S.news.decayUntil){
      const k = (S.news.decayUntil - Date.now()) / 4000;
      spread *= (1 + 3.0*k);                                     // gradual return to normal
    }
    if(S.manual.impulse) spread = base*(1.6 + 2.4*(1-Math.abs(S.manual.impulse.delta/Math.max(S.manual.impulse.usd,1)))) + mv*3;
    spread = clamp(spread, base*0.6, base*60);                   // spread guard only — not a price corridor
  }
  if(marketClosed()) spread *= 3;
  P.prevMid = P.mid;
  P.mid = roundTo(P.mid, d);
  P.spread = roundTo(spread, d);
  P.bid = roundTo(P.mid - spread/2, d);
  P.ask = roundTo(P.mid + spread/2, d);
  P.volume += P.lastVol || 1;
}

function pushTick(){
  _tickBuf.push({ t:S.simClock, bid:S.price.bid, ask:S.price.ask, mid:S.price.mid,
                  spread:S.price.spread, volume:S.price.lastVol||0, vol:+currentVolFactor().toFixed(2) });
  if(_tickBuf.length > 400) _tickBuf.splice(0, _tickBuf.length - 400);
}

/* =========================================================================
   MACRO NEWS ENGINE — scenario generator
   ========================================================================= */
function expRand(){ return -Math.log(1 - Math.random()); }
function weightedIdx(weights){
  const total = weights.reduce((s,w)=>s+w,0) || 1;
  let r = Math.random()*total, acc = 0;
  for(let i=0;i<weights.length;i++){ acc += weights[i]; if(r <= acc) return i; }
  return weights.length - 1;
}
function weightedMove(cfg){
  const dist = cfg.dist;
  const dMin = dist[0][0], dMax = dist[dist.length-1][1];
  const remap = x => cfg.minMove + (x - dMin)/(dMax - dMin || 1) * (cfg.maxMove - cfg.minMove);
  let r = Math.random(), acc = 0, pick = dist[dist.length-1], isTop = true;
  for(let i=0;i<dist.length;i++){ acc += dist[i][2]; if(r <= acc){ pick = dist[i]; isTop = (i === dist.length-1); break; } }
  let v = remap(rnd(pick[0], pick[1]));
  if(isTop && cfg.allowExtreme && Math.random() < 0.4){
    v += expRand() * (cfg.maxMove - cfg.minMove) * 0.38;         // heavy tail — no hard cap
  }
  if(!cfg.allowExtreme) v = Math.min(v, cfg.maxMove);
  return Math.max(v, cfg.minMove * 0.5);
}
function describePattern(sc){
  const d = sc.mainDir > 0 ? "UP" : "DOWN", o = sc.mainDir > 0 ? "DOWN" : "UP";
  if(sc.fakeout && sc.reversal) return "FAKEOUT "+o+" → "+d+" → "+o;
  if(sc.fakeout)  return "FAKEOUT "+o+" → "+d;
  if(sc.reversal) return "BREAKOUT "+d+" → REVERSAL "+o;
  if(sc.twoWay)   return d+" → "+o+" (two-way)";
  return d;
}
/* ---- NFP — ONE strong 20s impulse, mostly one-directional, random strength tier.
        Renders as a SINGLE news candle (sim-time holds for the 20 real seconds).
        Direction is a coin-flip BUY-side / SELL-side; the move does NOT snap back. ---- */
const NFP_TIERS = [
  { name:"слабый",           lo:6,   hi:14,  w:0.30 },
  { name:"средний",          lo:15,  hi:30,  w:0.34 },
  { name:"сильный",          lo:32,  hi:52,  w:0.22 },
  { name:"очень сильный",    lo:56,  hi:88,  w:0.11 },
  { name:"экстремальный",    lo:100, hi:185, w:0.03 }
];
function generateNFPScenario(){
  const cfg = S.newsEngine.perEvent.NFP;
  const dur = clamp(cfg.duration || 20, 3, 120);
  const tier = NFP_TIERS[weightedIdx(NFP_TIERS.map(t=>t.w))];
  let move = rnd(tier.lo, tier.hi);
  move = Math.max(move, (cfg.minMove || 5) * 0.6);
  if(!cfg.allowExtreme) move = Math.min(move, cfg.maxMove || 110);
  const upBias = cfg.upProb / ((cfg.upProb + cfg.downProb) || 1);
  const dir = Math.random() < upBias ? 1 : -1;                 // BUY-side (+) / SELL-side (-)
  const twoWay = Math.random() < 0.05;                          // ~5% sharp reversal / two-way
  const m = dir * move;
  let cp;
  if(!twoWay){
    // ~95%: one clean directional impulse (minor wobble only), then it holds
    cp = [[0,0],
          [0.14, m*rnd(0.30,0.48)],
          [0.42, m*rnd(0.78,0.97)],
          [0.72, m*rnd(0.94,1.08)],
          [1.00, m*rnd(0.90,1.10)]];
  }else{
    // ~5%: violent spike one way, then reverses hard THROUGH the start to the other side
    const spike  = -dir * move * rnd(0.45, 0.80);
    const settle =  dir * move * rnd(0.85, 1.20);
    cp = [[0,0],
          [0.16, spike],
          [0.30, spike*0.55],
          [0.55, settle*0.35],
          [0.80, settle*0.92],
          [1.00, settle]];
  }
  const R = Math.abs(move) * (twoWay ? 1.75 : 1.12);
  const sc = {
    type:"NFP", duration: dur, oneCandle:true, tier: tier.name,
    R, cp, mainDir: dir, twoWay, fakeout:false, reversal:twoWay, impulses:1,
    noiseBase: clamp(move / dur / 42, 0.02, 1.1),
    pullStrength: 0.16,
    volA: 2.6 + move/40, volB: 1.0 + move/120
  };
  sc.pattern = twoWay
    ? (dir>0 ? "SPIKE вниз → разворот в BUY-side" : "SPIKE вверх → разворот в SELL-side")
    : (dir>0 ? "BUY-side · однонаправленный ("+tier.name+")" : "SELL-side · однонаправленный ("+tier.name+")");
  return sc;
}
function generateScenario(type){
  if(type === "NFP") return generateNFPScenario();
  const cfg = S.newsEngine.perEvent[type];
  const R = weightedMove(cfg);                        // planned total range ($)
  const upBias = cfg.upProb / (cfg.upProb + cfg.downProb || 1);
  const mainDir = Math.random() < upBias ? 1 : -1;
  const twoWay   = Math.random() < cfg.twoWayProb;
  const fakeout  = Math.random() < cfg.fakeoutProb;
  const reversal = Math.random() < cfg.reversalProb;

  // Split the total travel R between the main direction and the counter direction.
  // Always keep a real counter-move so Total Range != |final - start|.
  let mainShare;
  if(twoWay)        mainShare = rnd(0.50, 0.68);
  else if(reversal) mainShare = rnd(0.55, 0.72);
  else              mainShare = rnd(0.70, 0.86);
  const mainBudget = R * mainShare, counterBudget = R * (1 - mainShare);
  const hiOff = mainDir > 0 ?  mainBudget : counterBudget;
  const loOff = mainDir > 0 ? -counterBudget : -mainBudget;
  const mainExt = mainDir > 0 ? hiOff : loOff;
  const oppExt  = mainDir > 0 ? loOff : hiOff;

  // phase control points (progress, offset-from-start $) — 5 phases per spec
  const spikeDir = fakeout ? -mainDir : mainDir;
  const o1 = spikeDir * (fakeout ? Math.abs(oppExt) : Math.abs(mainExt)) * rnd(0.35, 0.80); // 0-2s initial spike
  const o2 = mainExt * rnd(0.90, 1.05);                                                     // 2-8s main impulse
  let   o3 = (twoWay || reversal) ? oppExt * rnd(0.80, 1.05)                                 // 8-14s continuation / reversal
                                  : mainExt * rnd(0.85, 1.00);
  let   o4 = (reversal ? oppExt : mainExt) * rnd(0.45, 0.90);                                // 14-18s secondary impulse
  let   o5 = reversal ? oppExt * rnd(0.25, 0.80)                                             // 18-20s final movement
          : twoWay    ? mainExt * rnd(0.15, 0.55) * (Math.random()<0.5 ? 1 : -0.4)
          :             mainExt * rnd(0.40, 0.85);
  const lim = 1.2;
  const cp = [[0,0],[0.10,o1],[0.40,o2],[0.70,o3],[0.90,o4],[1.0,o5]]
             .map(c => [c[0], clamp(c[1], loOff*lim, hiOff*lim)]);

  const impulses = 2 + Math.floor(Math.random()*5);
  const sc = {
    type, duration: cfg.duration, R, cp, mainDir, twoWay, fakeout, reversal, impulses,
    hiOff, loOff,
    noiseBase: clamp(R / cfg.duration / 26, 0.03, 3.0),
    pullStrength: 0.18,
    volA: 2.0 + R/55, volB: 0.9 + R/110
  };
  sc.pattern = describePattern(sc);
  return sc;
}
function pathOffsetAt(sc, p){
  const cp = sc.cp;
  for(let i=1;i<cp.length;i++){
    if(p <= cp[i][0]){
      const [pa,oa] = cp[i-1], [pb,ob] = cp[i];
      let t = (p - pa) / (pb - pa || 1);
      t = t*t*(3 - 2*t);                                   // smoothstep
      return oa + (ob - oa) * t;
    }
  }
  return cp[cp.length-1][1];
}
function volCurveAt(sc, p){
  if(!sc) return 1;
  p = clamp(p||0, 0, 1);
  return 1 + sc.volA*Math.exp(-3.6*p) + sc.volB*Math.exp(-42*Math.pow(p-0.72,2));
}

/* ---- trading lock ---- */
function tradingLocked(){ return S.lock.active && Date.now() < S.lock.until; }
function lockSecondsLeft(){ return Math.max(0, (S.lock.until - Date.now())/1000); }
function guardLock(){
  if(tradingLocked()){
    toast("o", "🔒 TRADING LOCKED — новость ("+lockSecondsLeft().toFixed(1)+"s)");
    return true;
  }
  return false;
}

/* ---- launch / finish a news event ---- */
function startNews(type, ev){
  if(!NEWS_TYPES.includes(type)) return;
  if(S.news.active){ toast("o","Новость уже идёт — дождитесь завершения"); return; }
  const cfg = S.newsEngine.perEvent[type];
  const sc = generateScenario(type);
  const now = Date.now();
  S.news = {
    active:true, type, scenario:sc,
    startReal: now, endReal: now + sc.duration*1000,
    startPrice: S.price.mid, high: S.price.mid, low: S.price.mid,
    progress:0, ticks:0, decayUntil:0, result:null, delta:0, _vel:0
  };
  S.lock = { active:true, until: now + sc.duration*1000 };
  S._needRender = true;
  if(ev) ev.released = true;
  toast("o", "📰 "+NEWS_LABEL[type]+" RELEASED — TRADING LOCKED "+sc.duration+"s");
  closeModal();
  save();
}
function endNews(){
  const N = S.news, sc = N.scenario;
  N.active = false;
  S.lock = { active:false, until:0 };          // trading unlocks exactly when the event ends
  N.decayUntil = Date.now() + 4500;
  // seal a "one candle" release: nudge sim-time past the current M1 so the next
  // tick opens a FRESH candle instead of extending the (now huge) news candle.
  if(sc && sc.oneCandle) S.simClock += (TF.M1 + 1) * 1000;
  // the news move is already baked into price.mid tick by tick — it simply persists,
  // and the EMA equilibrium re-forms around the new level.
  const start = N.startPrice, final = S.price.mid;
  const res = {
    type: N.type, label: NEWS_LABEL[N.type],
    start, final, high: N.high, low: N.low,
    totalRange: N.high - N.low,
    upExc: N.high - start, downExc: N.low - start,
    finalMove: final - start,
    duration: sc.duration, ticks: N.ticks,
    pattern: sc.pattern, plannedR: sc.R, tier: sc.tier || null, oneCandle: !!sc.oneCandle,
    fakeout: sc.fakeout, reversal: sc.reversal, twoWay: sc.twoWay, impulses: sc.impulses,
    endedAt: Date.now()
  };
  N.result = res;
  N.delta = 0; N._vel = 0;
  S.newsLog.unshift(res);
  if(S.newsLog.length > 40) S.newsLog.pop();
  S.price.vel += (res.finalMove) * 0.04;        // a little follow-through momentum
  // strong macro data can instantly break the current regime (spec 6.3)
  if(Math.abs(res.finalMove) > sc.R*0.35 && Math.random() < (S.newsEngine.newsBreaksRegimeProb || 0.4)){
    const up = res.finalMove >= 0;
    startRegime(up ? (Math.random()<0.5?"STRONG_BULL":"BULL") : (Math.random()<0.5?"STRONG_BEAR":"BEAR"));
    toast("o", "📰 Новость сломала режим → " + MARKET_REGIMES[S.regime.name].label);
  }
  S._needRender = true;
  toast("g", "🔓 TRADING UNLOCKED — "+res.label+" complete");
  showNewsResult(res);
  save();
}

/* offline Monte-Carlo of a scenario (no timers) — used by the self-test */
function simulateNewsOffline(type){
  const sc = generateScenario(type);
  const steps = sc.duration * 30;
  let mid = 4457.13, start = mid, hi = mid, lo = mid, vel = 0;
  for(let i=0;i<steps;i++){
    const p = i/steps;
    const target = start + pathOffsetAt(sc, p);
    const nsig = sc.noiseBase * volCurveAt(sc, p);
    vel = 0.45*vel + gauss()*nsig;
    mid += (target - mid)*sc.pullStrength + vel;
    if(Math.random() < 0.06) mid += gauss()*nsig*2.6;
    hi = Math.max(hi, mid); lo = Math.min(lo, mid);
  }
  return { type, start, final: mid, high: hi, low: lo,
    totalRange: hi - lo, upExc: hi - start, downExc: lo - start, finalMove: mid - start,
    pattern: sc.pattern, plannedR: sc.R, mainDir: sc.mainDir,
    fakeout: sc.fakeout, reversal: sc.reversal, twoWay: sc.twoWay };
}

/* =========================================================================
   DAY / REGIME ENGINE — offline simulation + statistics (self-test)
   Runs the real price math (no timers) over many game-days with regime switching.
   ========================================================================= */
function simDaysOffline(nDays){
  nDays = nDays || 100;
  const START = 4457;
  let price = START, ema = price, vel = 0, vc = 1;
  let minP = price, maxP = price, peak = price, maxDD = 0;
  const days = [];
  let regName = weightedKey({ RANGE:.4, BULL:.3, BEAR:.2, ACCUMULATION:.1 });
  let regDaysLeft = rnd(MARKET_REGIMES[regName].durDays[0], MARKET_REGIMES[regName].durDays[1]);
  let channelHalf = 35 * rnd(1.4, 3.8);
  const regimeCounts = {};
  const stepsPerDay = 900, dtSec = 86400 / stepsPerDay;
  for(let d=0; d<nDays; d++){
    regimeCounts[regName] = (regimeCounts[regName] || 0) + 1;
    // day volatility band (with clustering bias)
    const pr = S.market.dayVolProbs || dayVolProbDefaults();
    const bias = clamp(vc - 1, -0.45, 1.6);
    const adj = { LOW:Math.max(0.02,(pr.LOW||0)*(1-bias*0.55)), NORMAL:(pr.NORMAL||0),
                  ACTIVE:(pr.ACTIVE||0)*(1+bias*0.45), EXTREME:(pr.EXTREME||0)*(1+bias*1.3) };
    const band = weightedKey(adj);
    let range = rnd(DAYVOL_RANGE[band][0], DAYVOL_RANGE[band][1]);
    if(band === "EXTREME") range += expRand()*16;
    const dayStdev = range / 3.2;
    const dOpen = price;
    let hi = price, lo = price;
    for(let s=0;s<stepsPerDay;s++){
      const RG = MARKET_REGIMES[regName];
      vc = clamp((S.market.volClusterPersist||0.992)*vc + (1-(S.market.volClusterPersist||0.992))*(0.72 + Math.abs(gauss())*0.7), 0.5, 2.4);
      const sf = 0.80 + 0.55*Math.abs(Math.sin((d*stepsPerDay+s)/stepsPerDay * Math.PI * 1.7));
      const sigma = (dayStdev/Math.sqrt(86400)) * Math.sqrt(dtSec) * RG.vol * sf * vc * (S.market.intradayNoise||1);
      vel = clamp(RG.mom,0,0.92)*vel + gauss()*sigma;
      const driftPerDay = RG.drift*clamp(dayStdev,4,13)*(S.market.regimeDriftScale||1) + MACRO_DRIFT*(S.market.macroBull||1);
      price += vel + driftPerDay*(dtSec/86400);
      if(RG.rangePull > 0){
        const pull = 1 - Math.exp(-RG.rangePull*dtSec/90);
        const dev = price - ema;
        const wall = Math.abs(dev) > channelHalf ? clamp((Math.abs(dev)/channelHalf - 1)*0.6, 0, 0.4) : 0;
        price += (ema - price)*(pull + wall);
      }
      ema += (price - ema)*(1 - Math.exp(-dtSec/5400));
      if(s % 60 === 0 && Math.random() < 0.10){          // a few small shocks per day
        const r = Math.random(); const mag = r<0.7?rnd(2,5):r<0.93?rnd(5,10):rnd(10,20);
        price += (Math.random()<0.5?1:-1)*mag; vc = Math.min(5, vc+0.7);
      }
      if(price < 0.01) price = 0.01;
      hi = Math.max(hi, price); lo = Math.min(lo, price);
      peak = Math.max(peak, price);
      maxDD = Math.max(maxDD, (peak - price)/peak);
    }
    minP = Math.min(minP, lo); maxP = Math.max(maxP, hi);
    days.push({ range: hi-lo, band, regime: regName, open: dOpen, close: price, change: price-dOpen });
    price = Math.max(0.01, price + rnd(0,2.5)*(Math.random()<0.5?1:-1));   // inter-session gap
    if(--regDaysLeft <= 0){
      regName = nextRegimeName(regName);
      regDaysLeft = rnd(MARKET_REGIMES[regName].durDays[0], MARKET_REGIMES[regName].durDays[1]);
      channelHalf = range * rnd(1.4, 3.8);
    }
  }
  return { days, priceStart: START, priceEnd: price, minPrice: minP, maxPrice: maxP,
           maxDrawdownPct: maxDD*100, regimeCounts };
}
function runDayTests(n){
  n = n || 100;
  const sim = simDaysOffline(n);
  const R = sim.days.map(d => d.range).sort((a,b)=>a-b);
  const mean = R.reduce((a,b)=>a+b,0)/n;
  const sd = Math.sqrt(R.reduce((a,b)=>a+(b-mean)*(b-mean),0)/n);
  const q = p => R[clamp(Math.floor(p*(n-1)),0,n-1)];
  const band = (lo,hi) => +(R.filter(x=>x>=lo && x<hi).length/n*100).toFixed(0);
  const byBand = {};
  for(const d of sim.days){ (byBand[d.band] = byBand[d.band] || []).push(d.range); }
  const bandMeans = {};
  for(const k in byBand) bandMeans[k] = { n: byBand[k].length, meanRange: +(byBand[k].reduce((a,b)=>a+b,0)/byBand[k].length).toFixed(1) };
  return {
    n, meanRange:+mean.toFixed(1), medianRange:+q(.5).toFixed(1),
    minRange:+R[0].toFixed(1), maxRange:+R[n-1].toFixed(1), stdev:+sd.toFixed(1),
    bands: { "<15":band(0,15), "15-25":band(15,25), "25-45":band(25,45),
             "45-75":band(45,75), "75-150":band(75,150), "150+":+(R.filter(x=>x>=150).length/n*100).toFixed(0) },
    bandMeans, regimeCounts: sim.regimeCounts,
    priceStart:+sim.priceStart.toFixed(0), priceEnd:+sim.priceEnd.toFixed(0),
    priceMin:+sim.minPrice.toFixed(0), priceMax:+sim.maxPrice.toFixed(0),
    netMovePct:+((sim.priceEnd-sim.priceStart)/sim.priceStart*100).toFixed(1),
    maxDrawdownPct:+sim.maxDrawdownPct.toFixed(1)
  };
}
function simulateDayOffline(){ return simDaysOffline(1).days[0]; }   // back-compat

/* ---------------- candles ---------------- */
function updateCandles(){
  const tsec = Math.floor(S.simClock/1000);
  const price = S.price.mid;
  const vol = S.price.lastVol;
  for(const tf of TF_ORDER){
    const arr = S.candles[tf] || (S.candles[tf] = []);
    const bt = Math.floor(tsec / TF[tf]) * TF[tf];
    const last = arr[arr.length-1];
    if(!last || last.t < bt){
      arr.push({ t:bt, o:price, h:price, l:price, c:price, v:vol });
      if(arr.length > TF_CAP[tf]) arr.splice(0, arr.length - TF_CAP[tf]);
    }else{
      last.h = Math.max(last.h, price);
      last.l = Math.min(last.l, price);
      last.c = price;
      last.v += vol;
    }
  }
}

/* ---------------- commission ---------------- */
function commissionFor(volume, price){
  const t = S.trading.commissionType;
  const c = S.trading.commission;
  const cs = S.symbol.contractSize;
  const px = price || S.price.mid;
  if(t === "usd_per_lot")     return volume * c;
  if(t === "quote_per_lot")   return volume * c;              // quote currency = USD for XAUUSD
  if(t === "usd_per_million"){ const notional = volume * cs * px; return notional/1e6 * c; }
  if(t === "percent"){         const notional = volume * cs * px; return notional * c/100; }
  return volume * c;
}

/* ---------------- P/L ---------------- */
function grossPL(pos, bid, ask){
  const b = bid==null?S.price.bid:bid, a = ask==null?S.price.ask:ask;
  const cs = S.symbol.contractSize;
  if(pos.side === "buy")  return (b - pos.entry) * pos.volume * cs;
  else                    return (pos.entry - a) * pos.volume * cs;
}
function closePriceFor(pos){ return pos.side === "buy" ? S.price.bid : S.price.ask; }
function posMetrics(pos){
  const gross = grossPL(pos);
  const closeComm = commissionFor(pos.volume, closePriceFor(pos));
  const comm = pos.openCommission + closeComm;
  const swap = pos.swap;
  const net = gross + swap - comm;
  return { gross, openComm: pos.openCommission, closeComm, comm, swap, net };
}

/* ---------------- account / margin ---------------- */
function usedMargin(){
  const cs = S.symbol.contractSize, lev = S.symbol.leverage;
  let m = 0;
  for(const p of S.positions){
    m += (p.volume * cs * S.price.mid) / lev;
  }
  return m;
}
function recalcAccount(){
  let floating = 0, swaps = 0;
  for(const p of S.positions){ floating += grossPL(p); swaps += p.swap; }
  S._acc = {
    balance: S.account.balance,
    floating,
    swaps,
    equity: S.account.balance + floating + swaps,
    margin: usedMargin()
  };
  S._acc.freeMargin = S._acc.equity - S._acc.margin;
  S._acc.marginLevel = S._acc.margin > 0 ? (S._acc.equity / S._acc.margin * 100) : Infinity;
}

/* ---------------- slippage ----------------
   depends on volatility, spread, speed and (during news) the event's slip curve */
function slippage(){
  if(!S.trading.slippageOn) return 0;
  let mx = S.market.normalSlippage;                       // normal: 0 .. normalSlippage
  if(S.news.active){
    const cfg = S.newsEngine.perEvent[S.news.type];
    const p = S.news.progress || 0;
    const shape = clamp(Math.exp(-2*p) + 0.35, 0.2, 1.35);
    const spreadFactor = clamp(S.price.spread / Math.max(S.market.baseSpread, 0.01), 1, 8);
    mx = S.market.normalSlippage * cfg.slipMul * shape * (0.5 + spreadFactor/4);
  }else if(currentVolFactor() > 1.9){
    mx *= 2.5;                                            // high normal volatility
  }
  const v = Math.abs(gauss())*mx*0.7 + Math.random()*mx*0.4;
  return roundTo(Math.min(v, mx*2.5), S.symbol.digits);
}

/* ---------------- open / close ---------------- */
function validateLot(v){
  const {minLot,maxLot,lotStep} = S.symbol;
  if(!isFinite(v) || v <= 0) return "Объём должен быть больше 0";
  if(v < minLot) return "Минимальный объём "+fmt(minLot,2);
  if(v > maxLot) return "Максимальный объём "+fmt(maxLot,2);
  const steps = v / lotStep;
  if(Math.abs(steps - Math.round(steps)) > 1e-6) return "Объём должен быть кратен "+fmt(lotStep,2);
  return null;
}
function openPosition(side, volume, opts){
  opts = opts || {};
  if(guardLock()) return null;
  if(marketClosed()){ toast("r","Рынок закрыт — исполнение недоступно"); return null; }
  const err = validateLot(volume);
  if(err){ toast("r", err); return null; }
  recalcAccount();
  let px = side === "buy" ? S.price.ask : S.price.bid;
  const slip = slippage();
  if(slip>0) px = roundTo(px + (side==="buy" ? slip : -slip), S.symbol.digits);

  // margin check
  const reqM = (volume * S.symbol.contractSize * S.price.mid) / S.symbol.leverage;
  if(reqM > S._acc.freeMargin + 1e-6){
    toast("r","Недостаточно свободной маржи (нужно "+money(reqM)+")");
    return null;
  }
  // validate SL/TP sides
  if(opts.sl != null){
    if(side==="buy"  && opts.sl >= px){ toast("r","SL для BUY должен быть ниже цены входа"); return null; }
    if(side==="sell" && opts.sl <= px){ toast("r","SL для SELL должен быть выше цены входа"); return null; }
  }
  if(opts.tp != null){
    if(side==="buy"  && opts.tp <= px){ toast("r","TP для BUY должен быть выше цены входа"); return null; }
    if(side==="sell" && opts.tp >= px){ toast("r","TP для SELL должен быть ниже цены входа"); return null; }
  }
  const openComm = commissionFor(volume, px);
  const pos = {
    id: S.seq.pos++, symbol: S.symbol.name, side, volume: roundTo(volume,2),
    entry: px, openTime: S.simClock, sl: opts.sl||null, tp: opts.tp||null,
    openCommission: openComm, swap: 0, slippage: slip,
    lastSwapDay: simDateStr()
  };
  S.account.balance -= openComm;   // commission charged on OPEN
  S.positions.push(pos);
  recalcAccount();
  toast("g", (side==="buy"?"BUY":"SELL")+" "+fmt(volume,2)+" @ "+pxfmt(px)+"  •  comm "+money(openComm)+(slip>0?"  •  slip "+pxfmt(slip):""));
  save();
  return pos;
}
function closePosition(id, reason){
  const i = S.positions.findIndex(p=>p.id===id);
  if(i<0) return;
  const pos = S.positions[i];
  const m = posMetrics(pos);
  const exit = closePriceFor(pos);
  S.account.balance += m.gross + m.swap - m.closeComm;   // openComm already taken at open
  S.positions.splice(i,1);
  S.history.unshift({
    id: pos.id, symbol: pos.symbol, side: pos.side, volume: pos.volume,
    entry: pos.entry, exit,
    openTime: pos.openTime, closeTime: S.simClock,
    gross: m.gross, commission: m.comm, swap: m.swap, net: m.gross + m.swap - m.comm,
    reason: reason || "manual", slippage: pos.slippage
  });
  if(S.history.length > 500) S.history.pop();
  recalcAccount();
  const cls = m.gross + m.swap - m.comm >= 0 ? "g":"r";
  toast(cls, "Закрыта #"+pos.id+"  "+signMoney(m.gross+m.swap-m.comm)+(reason?"  ("+reason+")":""));
  save();
}
function modifyPosition(id, sl, tp){
  if(guardLock()) return;
  const p = S.positions.find(x=>x.id===id);
  if(!p) return;
  // Reject an SL/TP that already sits on the wrong side of the market — that would
  // trigger on the very next tick. Editing a position must NEVER auto-close it.
  const bid = S.price.bid, ask = S.price.ask;
  if(sl != null && isFinite(sl)){
    if(p.side === "buy"  && sl >= bid){ toast("r", "SL для BUY должен быть ниже Bid "+pxfmt(bid)+" — позиция не изменена"); return; }
    if(p.side === "sell" && sl <= ask){ toast("r", "SL для SELL должен быть выше Ask "+pxfmt(ask)+" — позиция не изменена"); return; }
  }
  if(tp != null && isFinite(tp)){
    if(p.side === "buy"  && tp <= bid){ toast("r", "TP для BUY должен быть выше Bid "+pxfmt(bid)+" — позиция не изменена"); return; }
    if(p.side === "sell" && tp >= ask){ toast("r", "TP для SELL должен быть ниже Ask "+pxfmt(ask)+" — позиция не изменена"); return; }
  }
  p.sl = (sl != null && isFinite(sl)) ? sl : null;
  p.tp = (tp != null && isFinite(tp)) ? tp : null;
  toast("g", "Позиция #"+id+" изменена — SL "+(p.sl?pxfmt(p.sl):"—")+" · TP "+(p.tp?pxfmt(p.tp):"—"));
  save();
}

/* ---------------- SL / TP ---------------- */
function processPositionSLTP(){
  for(const p of [...S.positions]){
    const bid = S.price.bid, ask = S.price.ask;
    if(p.side === "buy"){
      if(p.sl != null && bid <= p.sl){ closePosition(p.id, "SL"); continue; }
      if(p.tp != null && bid >= p.tp){ closePosition(p.id, "TP"); continue; }
    }else{
      if(p.sl != null && ask >= p.sl){ closePosition(p.id, "SL"); continue; }
      if(p.tp != null && ask <= p.tp){ closePosition(p.id, "TP"); continue; }
    }
  }
}

/* ---------------- pending orders ---------------- */
function addPending(o){
  if(guardLock()) return null;
  const err = validateLot(o.volume);
  if(err){ toast("r", err); return null; }
  const ord = {
    id: S.seq.ord++, symbol: S.symbol.name, type: o.type, volume: roundTo(o.volume,2),
    price: o.price, sl: o.sl||null, tp: o.tp||null, createTime: S.simClock
  };
  S.pendings.push(ord);
  toast("", o.type.replace("_"," ").toUpperCase()+" "+fmt(o.volume,2)+" @ "+pxfmt(o.price));
  save();
  return ord;
}
function cancelPending(id){
  if(guardLock()) return;
  const i = S.pendings.findIndex(o=>o.id===id);
  if(i>=0){ S.pendings.splice(i,1); toast("","Ордер отменён"); save(); }
}
function processPendings(){
  const bid = S.price.bid, ask = S.price.ask;
  for(const o of [...S.pendings]){
    let trig = false, side = "buy";
    if(o.type === "buy_limit"  && ask <= o.price){ trig = true; side = "buy"; }
    if(o.type === "sell_limit" && bid >= o.price){ trig = true; side = "sell"; }
    if(o.type === "buy_stop"   && ask >= o.price){ trig = true; side = "buy"; }
    if(o.type === "sell_stop"  && bid <= o.price){ trig = true; side = "sell"; }
    if(!trig) continue;
    const i = S.pendings.findIndex(x=>x.id===o.id);
    if(i>=0) S.pendings.splice(i,1);
    // open at trigger price (+slippage for stop orders)
    const isStop = o.type.includes("stop");
    let px = o.price;
    if(isStop){ const sl = slippage(); px = roundTo(px + (side==="buy"?sl:-sl), S.symbol.digits); }
    const openComm = commissionFor(o.volume, px);
    if((o.volume*S.symbol.contractSize*S.price.mid)/S.symbol.leverage > (S._acc?S._acc.freeMargin:1e9)+1e-6){
      toast("r","Ордер #"+o.id+" не исполнен — недостаточно маржи"); save(); continue;
    }
    S.account.balance -= openComm;
    S.positions.push({
      id: S.seq.pos++, symbol: S.symbol.name, side, volume: o.volume, entry: px,
      openTime: S.simClock, sl: o.sl, tp: o.tp, openCommission: openComm, swap: 0,
      slippage: isStop?roundTo(Math.abs(px-o.price),S.symbol.digits):0, lastSwapDay: simDateStr()
    });
    toast("g", "Исполнен "+o.type.replace("_"," ")+" #"+o.id+" @ "+pxfmt(px));
    save();
  }
}

/* ---------------- rollover / swap ---------------- */
function checkRollover(){
  const day = simDateStr();
  if(S.lastSimDay == null){ S.lastSimDay = day; return; }
  if(day === S.lastSimDay) return;
  // crossed midnight (possibly several days if timeMultiplier huge)
  const prev = new Date(S.lastSimDay+"T00:00:00Z");
  const cur = new Date(day+"T00:00:00Z");
  let daysCrossed = Math.round((cur - prev)/86400000);
  S.lastSimDay = day;
  if(daysCrossed < 1) return;

  const wd = simDate().getUTCDay();
  let mult = 1;
  if(wd === S.trading.tripleSwapDay) mult = 3;
  mult += (daysCrossed - 1); // accumulate any skipped days simply

  let anySwap = false;
  for(const p of S.positions){
    const rate = p.side === "buy" ? S.trading.swapLong : S.trading.swapShort;
    const amt = rate * p.volume * mult;   // USD per lot per day
    p.swap += amt;
    p.lastSwapDay = day;
    anySwap = true;
  }
  if(anySwap){
    toast("o", "🌙 Rollover — swap начислен"+(mult>=3?" (x"+mult+")":""));
  }
  recalcAccount();
  save();
}

/* ---------------- stop out / margin call ---------------- */
let marginCallShown = false;
function checkStopOut(){
  recalcAccount();
  const ml = S._acc.marginLevel;
  if(!isFinite(ml)){ marginCallShown = false; return; }
  if(ml < S.trading.marginCallLevel && ml >= S.trading.stopOutLevel){
    if(!marginCallShown){ toast("o", "⚠ MARGIN CALL — Margin Level "+fmt(ml,1)+"%"); marginCallShown = true; }
  }else if(ml >= S.trading.marginCallLevel){
    marginCallShown = false;
  }
  let guard = 0;
  while(S._acc.marginLevel < S.trading.stopOutLevel && S.positions.length && guard++ < 50){
    // close most losing position first
    let worst = null, worstPL = Infinity;
    for(const p of S.positions){
      const pl = grossPL(p) + p.swap;
      if(pl < worstPL){ worstPL = pl; worst = p; }
    }
    toast("r", "🛑 STOP OUT — закрыта позиция #"+worst.id+" (Margin Level "+fmt(S._acc.marginLevel,1)+"%)");
    closePosition(worst.id, "Stop Out");
    recalcAccount();
  }
}

/* Economic calendar is informational only — macro news is user-triggered
   via the Macro News Engine buttons (NFP / CPI / PPI / FOMC / FED SPEECH). */
function checkEvents(){
  const pending = S.events.filter(e=>!e.released);
  if(pending.length <= 1){
    const defs = [
      { name:"NFP (Non-Farm Payrolls)", unit:"K", prev:180, fc:190, mins: 30 },
      { name:"CPI y/y",                  unit:"%", prev:3.0, fc:2.9, mins: 75 },
      { name:"PPI m/m",                  unit:"%", prev:0.2, fc:0.3, mins:120 },
      { name:"FOMC Rate Decision",       unit:"%", prev:4.50,fc:4.50,mins:175 },
      { name:"FED Press Conference",     unit:"",  prev:0,  fc:0,   mins:200 }
    ];
    for(const d of defs){
      S.events.push({ id:S.seq.evt++, name:d.name, unit:d.unit, previous:d.prev, forecast:d.fc,
        actual:null, impact:3, time:S.simClock + d.mins*60000, released:false, manual:false });
    }
    if(S.events.length > 30) S.events.splice(0, S.events.length - 30);
  }
}
function addManualEvent(o){
  S.events.push({
    id: S.seq.evt++, name: o.name, unit: o.unit||"",
    previous: o.previous, forecast: o.forecast,
    actual: (o.actual===""||o.actual==null)?null:Number(o.actual),
    impact: o.impact||2, time: S.simClock + (o.delaySec||30)*1000,
    released:false, manual:true
  });
  toast("o", "Создано событие: "+o.name+" (через "+(o.delaySec||30)+"с)");
  save();
}

/* =========================================================================
   THEME (light / dark) — one set of CSS tokens on <html data-theme>.
   Switching only flips the attribute + S.ui.theme; it never touches the
   simulator state (price, engine, positions, orders all live in S).
   ========================================================================= */
let _themeColors = null;                // cache; cleared by applyTheme()
function currentTheme(){ return (S && S.ui && S.ui.theme === "dark") ? "dark" : "light"; }
function applyTheme(t){
  t = (t === "dark") ? "dark" : "light";
  document.documentElement.dataset.theme = t;
  _themeColors = null;
  const mc = document.querySelector('meta[name="theme-color"]');
  if(mc) mc.setAttribute("content", t === "dark" ? "#0e1116" : "#f4f5f7");
  try{ localStorage.setItem("xc_theme", t); }catch(e){}
}
function setTheme(t){
  if(!S.ui) S.ui = {};
  S.ui.theme = (t === "dark") ? "dark" : "light";
  applyTheme(S.ui.theme);
  save();
  render();
  toast("", S.ui.theme === "dark" ? "🌙 Тёмная тема" : "☀️ Светлая тема");
}
/* canvas can't read CSS vars directly — resolve them once per theme */
function themeColors(){
  if(_themeColors) return _themeColors;
  const cs = getComputedStyle(document.documentElement);
  const g = (n, fb) => { const v = cs.getPropertyValue(n).trim(); return v || fb; };
  _themeColors = {
    bg:    g("--chart-bg", "#ffffff"),
    grid:  g("--chart-grid", "#eef0f2"),
    axis:  g("--chart-axis", "#9aa1ab"),
    cross: g("--chart-cross", "#9aa1ab"),
    tag:   g("--chart-tag", "#111418"),
    up:    g("--green", "#0aa85f"),
    down:  g("--red", "#e5342b"),
    blue:  g("--blue", "#2f7bf6"),
  };
  return _themeColors;
}

function watchSparkSVG(){
  const c = (S.candles.M1 || []).slice(-48).map(b => b.c);
  if(c.length < 2) return "";
  const lo = Math.min(...c), hi = Math.max(...c), rng = (hi - lo) || 1;
  const W = 118, H = 38;
  const pts = c.map((v,i) => `${(i/(c.length-1)*W).toFixed(1)},${(H - 2 - (v-lo)/rng*(H-4)).toFixed(1)}`).join(" ");
  const D = S.day;
  const col = (D ? (S.price.mid - D.open) : (c[c.length-1] - c[0])) >= 0 ? "var(--green)" : "var(--red)";
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function watchStats(){
  const D = S.day;
  const chg = D ? (S.price.mid - D.open) : 0;
  const chgPct = D ? chg / (D.open || 1) * 100 : 0;
  const spr = Math.round((S.price.ask - S.price.bid) / Math.pow(10, -S.symbol.digits));
  return { chg, chgPct, spr, hi: D ? D.high : S.price.mid, lo: D ? D.low : S.price.mid };
}

function upcomingEventsMarkup(n){
  const up = S.events.filter(e=>!e.released).sort((a,b)=>a.time-b.time).slice(0,n);

  const rows = [...up, ...rec];
  if(!rows.length) return `<div class="hint">Нет событий</div>`;
  return rows.map(e=>{
    const mins = Math.round((e.time - S.simClock)/60000);
    const when = e.released ? `<small>вышло</small>` : `<small>через ~${mins} мин</small>`;
    return `<div class="evt">
      <div><div class="nm">${e.name} <span class="impact">${"★".repeat(e.impact)}</span></div>

function walletLog(type, amount, note){
  S.wallet.ledger = S.wallet.ledger || [];
  S.wallet.ledger.unshift({ type, amount: roundTo(amount, 2), ts: Date.now(), note: note || "" });
  if(S.wallet.ledger.length > 60) S.wallet.ledger.length = 60;
}
function walletSync(){
  save();
  if(typeof xcPushState === "function") xcPushState(true);
  render();                          // screenWallet re-reads S.wallet.balance — no duplicated state
}
function walletDeposit(amount){
  const a = roundTo(Number(amount), 2);
  if(!isFinite(a) || a <= 0) return { ok:false, msg:"Введите сумму больше 0" };
  S.wallet.balance = roundTo(S.wallet.balance + a, 2);
  walletLog("deposit", a);
  walletSync();
  toast("g", "Кошелёк пополнен на " + walletFmt(a));
  return { ok:true };
}
function walletWithdraw(amount){
  const a = roundTo(Number(amount), 2);
  if(!isFinite(a) || a <= 0) return { ok:false, msg:"Введите сумму больше 0" };
  if(a > S.wallet.balance + 1e-6) return { ok:false, msg:"Недостаточно средств. Доступно: " + walletFmt(S.wallet.balance) };
  S.wallet.balance = roundTo(S.wallet.balance - a, 2);
  walletLog("withdraw", a);
  walletSync();
  toast("g", "Выведено " + walletFmt(a));
  return { ok:true };
}
/* ПЕРЕВЕСТИ — architecture only. Wire the real transfer here later. */
function walletTransfer(recipient, amount){
  const a = roundTo(Number(amount), 2);
  if(!recipient || !String(recipient).trim()) return { ok:false, msg:"Укажите получателя" };
  if(!isFinite(a) || a <= 0) return { ok:false, msg:"Введите сумму больше 0" };
  if(a > S.wallet.balance + 1e-6) return { ok:false, msg:"Недостаточно средств. Доступно: " + walletFmt(S.wallet.balance) };
  // TODO: perform the transfer (debit wallet, credit recipient, log). Not enabled yet.
  return { ok:false, pending:true, msg:"Переводы будут подключены позже — операция не выполнена" };
}

function historyStats(){
  const h = S.history;
  const s = { total:h.length, wins:0, losses:0, winRate:0, grossProfit:0, grossLoss:0,
    net:0, commission:0, swap:0, volume:0, largestWin:0, largestLoss:0, avg:0 };
  for(const t of h){
    s.net += t.net; s.commission += t.commission; s.swap += t.swap; s.volume += t.volume;
    if(t.net >= 0){ s.wins++; s.grossProfit += t.net; if(t.net>s.largestWin) s.largestWin=t.net; }
    else { s.losses++; s.grossLoss += t.net; if(t.net<s.largestLoss) s.largestLoss=t.net; }
  }
  s.winRate = s.total? s.wins/s.total*100 : 0;
  s.avg = s.total? s.net/s.total : 0;
  return s;
}

function domRows(){
  const step = 0.05 + S.price.spread*0.15;
  const asks = [], bids = [];
  let acc = S.price.ask;
  const aLevels = [];
  for(let i=1;i<=5;i++){ acc = roundTo(acc + step*rnd(0.7,1.5), 2); aLevels.push(acc); }
  for(let i=5;i>=1;i--){ asks.push({px:aLevels[i-1], sz: Math.round(rnd(3,45)*i)}); }
  acc = S.price.bid;
  for(let i=1;i<=5;i++){ acc = roundTo(acc - step*rnd(0.7,1.5), 2); bids.push({px:acc, sz: Math.round(rnd(3,45)*i)}); }
  const maxSz = Math.max(...asks.map(a=>a.sz), ...bids.map(b=>b.sz), 1);
  let html = "";
  for(const a of asks){
    html += `<div></div><div class="dom-px mono">${pxfmt(a.px)}</div><div class="dom-ask mono"><span class="dom-bar a" style="width:${a.sz/maxSz*100}%"></span>${a.sz}</div>`;
  }
  html += `<div class="dom-bid mono" style="color:var(--ink2)">спред</div><div class="dom-px mono" style="color:var(--orange)">${pxfmt(S.price.spread)}</div><div class="dom-ask mono" style="color:var(--ink2)"></div>`;
  for(const b of bids){

  }
  return html;
}

/* ---------- DEBUG CONSOLE — simulated day statistics ---------- */
function dayStats(days){
  if(!days.length) return null;
  const R = days.map(d=>d.range).sort((a,b)=>a-b);
  const n = R.length, mean = R.reduce((a,b)=>a+b,0)/n;
  const sd = Math.sqrt(R.reduce((a,b)=>a+(b-mean)*(b-mean),0)/n);
  const med = n%2 ? R[(n-1)/2] : (R[n/2-1]+R[n/2])/2;
  return { n, mean, med, min:R[0], max:R[n-1], sd };
}
