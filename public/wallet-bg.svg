<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1024"/>
      <stop offset="0.14" stop-color="#121030"/>
      <stop offset="0.26" stop-color="#2a1c3a"/>
      <stop offset="0.36" stop-color="#5c2c3a"/>
      <stop offset="0.44" stop-color="#a8452a"/>
      <stop offset="0.50" stop-color="#e07a2c"/>
      <stop offset="0.545" stop-color="#ffb352"/>
      <stop offset="0.59" stop-color="#c9682a"/>
      <stop offset="0.68" stop-color="#4a2617"/>
      <stop offset="0.82" stop-color="#180f0c"/>
      <stop offset="1" stop-color="#0a0706"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.56" cy="0.545" r="0.42">
      <stop offset="0" stop-color="#ffe6b0" stop-opacity="0.9"/>
      <stop offset="0.28" stop-color="#ffb54e" stop-opacity="0.5"/>
      <stop offset="0.7" stop-color="#ef8a34" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ef8a34" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb765" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff9a44" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0706" stop-opacity="0"/>
      <stop offset="1" stop-color="#040302" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.4" r="0.9">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
    <pattern id="win" width="13" height="17" patternUnits="userSpaceOnUse">
      <rect x="2.5" y="2.6" width="5.4" height="7.4" fill="#ffce7c" opacity="0.24"/>
    </pattern>
    <pattern id="winFar" width="11" height="15" patternUnits="userSpaceOnUse">
      <rect x="2.2" y="2.4" width="4.4" height="6" fill="#ffd58a" opacity="0.16"/>
    </pattern>
    <pattern id="winLit" width="55" height="70" patternUnits="userSpaceOnUse">
      <rect x="4" y="8" width="5.4" height="7.4" fill="#ffe6ac" opacity="0.92"/>
      <rect x="32" y="41" width="5.4" height="7.4" fill="#fff2ce" opacity="0.72"/>
      <rect x="17" y="55" width="5" height="7" fill="#ffcf7c" opacity="0.6"/>
      <rect x="44" y="21" width="5" height="7" fill="#ffdc98" opacity="0.5"/>
    </pattern>

    <clipPath id="near">
      <rect x="-30" y="430" width="150" height="670"/><rect x="98" y="356" width="94" height="744"/>
      <rect x="176" y="242" width="126" height="858"/><rect x="288" y="470" width="82" height="630"/>
      <rect x="356" y="168" width="118" height="932"/><rect x="458" y="376" width="98" height="724"/>
      <rect x="542" y="292" width="136" height="808"/><rect x="662" y="204" width="88" height="896"/>
      <rect x="738" y="418" width="124" height="682"/><rect x="846" y="140" width="158" height="960"/>
      <rect x="988" y="344" width="92" height="756"/><rect x="1068" y="262" width="120" height="838"/>
      <rect x="1174" y="440" width="96" height="660"/><rect x="1254" y="196" width="140" height="904"/>
      <rect x="1374" y="384" width="92" height="716"/><rect x="1452" y="300" width="128" height="800"/>
      <rect x="1562" y="428" width="112" height="672"/>
    </clipPath>
    <clipPath id="far">
      <rect x="-20" y="512" width="120" height="588"/><rect x="86" y="548" width="96" height="552"/>
      <rect x="170" y="486" width="128" height="614"/><rect x="290" y="536" width="80" height="564"/>
      <rect x="360" y="452" width="118" height="648"/><rect x="470" y="522" width="102" height="578"/>
      <rect x="560" y="470" width="140" height="630"/><rect x="700" y="500" width="96" height="600"/>
      <rect x="792" y="540" width="120" height="560"/><rect x="912" y="460" width="164" height="640"/>
      <rect x="1074" y="524" width="94" height="576"/><rect x="1168" y="486" width="150" height="614"/>
      <rect x="1316" y="536" width="96" height="564"/><rect x="1408" y="470" width="140" height="630"/>
      <rect x="1540" y="524" width="118" height="576"/>
    </clipPath>
  </defs>

  <rect width="1600" height="1100" fill="url(#sky)"/>
  <rect width="1600" height="1100" fill="url(#sun)"/>
  <rect x="0" y="470" width="1600" height="200" fill="url(#haze)"/>

  <!-- far skyline -->
  <rect width="1600" height="1100" fill="#2a1f2c" opacity="0.82" clip-path="url(#far)"/>
  <g clip-path="url(#far)"><rect x="0" y="420" width="1600" height="300" fill="url(#winFar)"/></g>

  <!-- near skyline -->
  <rect width="1600" height="1100" fill="#0a0b12" clip-path="url(#near)"/>
  <g clip-path="url(#near)">
    <rect x="0" y="120" width="1600" height="560" fill="url(#win)"/>
    <rect x="0" y="120" width="1600" height="560" fill="url(#winLit)"/>
  </g>
  <g stroke="#0a0b12" stroke-width="6">
    <line x1="415" y1="168" x2="415" y2="96"/><line x1="925" y1="140" x2="925" y2="60"/>
    <line x1="1324" y1="196" x2="1324" y2="124"/><line x1="235" y1="242" x2="235" y2="188"/>
  </g>
  <g fill="#ffdca0"><circle cx="925" cy="64" r="3.4" opacity="0.9"/><circle cx="415" cy="100" r="3" opacity="0.8"/></g>

  <!-- room / floor -->
  <rect x="0" y="640" width="1600" height="460" fill="url(#floor)"/>
  <g stroke="#000" stroke-opacity="0.26" stroke-width="3">
    <line x1="320" y1="0" x2="320" y2="1100"/><line x1="640" y1="0" x2="640" y2="1100"/>
    <line x1="960" y1="0" x2="960" y2="1100"/><line x1="1280" y1="0" x2="1280" y2="1100"/>
  </g>

  <rect width="1600" height="1100" fill="url(#vig)"/>
</svg>
