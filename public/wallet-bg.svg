<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0c15"/>
      <stop offset="0.16" stop-color="#0f0e18"/>
      <stop offset="0.27" stop-color="#1c1720"/>
      <stop offset="0.34" stop-color="#3a2318"/>
      <stop offset="0.40" stop-color="#6e3e1c"/>
      <stop offset="0.44" stop-color="#8a4d1e"/>
      <stop offset="0.49" stop-color="#4a2a15"/>
      <stop offset="0.62" stop-color="#1a120d"/>
      <stop offset="1" stop-color="#0a0807"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.6" cy="0.44" r="0.6">
      <stop offset="0" stop-color="#ffcf88" stop-opacity="0.6"/>
      <stop offset="0.4" stop-color="#ef9a44" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#ef9a44" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ceil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2013" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#2c2013" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0807" stop-opacity="0"/>
      <stop offset="1" stop-color="#050403" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.36" r="0.85">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.62"/>
    </radialGradient>
    <pattern id="lights" width="22" height="28" patternUnits="userSpaceOnUse">
      <rect x="3" y="4" width="2.4" height="3.2" fill="#f9cd74" opacity="0.95"/>
      <rect x="12" y="14" width="2.4" height="3.2" fill="#ffe19a" opacity="0.6"/>
      <rect x="7" y="21" width="2" height="2.8" fill="#eaad55" opacity="0.5"/>
      <rect x="16" y="8" width="2" height="2.8" fill="#f9cd74" opacity="0.32"/>
    </pattern>
  </defs>

  <rect width="1600" height="1200" fill="url(#sky)"/>
  <rect width="1600" height="1200" fill="url(#glow)"/>

  <!-- office ceiling + two warm light strips -->
  <rect width="1600" height="150" fill="url(#ceil)"/>
  <rect x="100" y="26" width="1400" height="6" rx="3" fill="#ffd591" opacity="0.55"/>
  <rect x="240" y="76" width="1120" height="5" rx="2.5" fill="#ffc07a" opacity="0.32"/>

  <!-- far skyline (hazy, warm-lit) -->
  <g fill="#20161a" opacity="0.9">
    <rect x="0" y="430" width="94" height="360"/><rect x="88" y="474" width="72" height="316"/>
    <rect x="152" y="404" width="114" height="386"/><rect x="260" y="462" width="66" height="328"/>
    <rect x="318" y="372" width="124" height="418"/><rect x="440" y="446" width="90" height="344"/>
    <rect x="526" y="346" width="76" height="444"/><rect x="598" y="430" width="134" height="360"/>
    <rect x="726" y="392" width="92" height="398"/><rect x="814" y="344" width="154" height="446"/>
    <rect x="964" y="432" width="82" height="358"/><rect x="1040" y="410" width="114" height="380"/>
    <rect x="1150" y="470" width="72" height="320"/><rect x="1218" y="384" width="134" height="406"/>
    <rect x="1348" y="446" width="98" height="344"/><rect x="1442" y="486" width="84" height="304"/>
    <rect x="1522" y="424" width="90" height="366"/>
  </g>

  <!-- near skyline (near-black) -->
  <g fill="#0c0a10">
    <rect x="-20" y="520" width="156" height="360"/><rect x="126" y="566" width="98" height="314"/>
    <rect x="218" y="474" width="144" height="406"/><rect x="356" y="558" width="82" height="322"/>
    <rect x="434" y="430" width="122" height="450"/><rect x="552" y="546" width="154" height="334"/>
    <rect x="700" y="496" width="98" height="384"/><rect x="794" y="566" width="124" height="314"/>
    <rect x="914" y="456" width="176" height="424"/><rect x="1084" y="540" width="94" height="340"/>
    <rect x="1174" y="500" width="154" height="380"/><rect x="1322" y="566" width="92" height="314"/>
    <rect x="1408" y="466" width="144" height="414"/><rect x="1542" y="544" width="122" height="336"/>
  </g>
  <g stroke="#0c0a10" stroke-width="5">
    <line x1="495" y1="430" x2="495" y2="374"/><line x1="1002" y1="456" x2="1002" y2="392"/>
    <line x1="1480" y1="466" x2="1480" y2="410"/>
  </g>

  <!-- city window lights -->
  <rect x="0" y="330" width="1600" height="470" fill="url(#lights)" opacity="0.55"/>
  <rect x="0" y="330" width="1600" height="470" fill="url(#lights)" opacity="0.32" transform="translate(9 6)"/>

  <!-- the dark room / marble floor below -->
  <rect x="0" y="620" width="1600" height="580" fill="url(#floor)"/>

  <!-- floor-to-ceiling glass mullions -->
  <g stroke="#000" stroke-opacity="0.3" stroke-width="3">
    <line x1="320" y1="0" x2="320" y2="1200"/><line x1="640" y1="0" x2="640" y2="1200"/>
    <line x1="960" y1="0" x2="960" y2="1200"/><line x1="1280" y1="0" x2="1280" y2="1200"/>
    <line x1="0" y1="112" x2="1600" y2="112"/>
  </g>

  <rect width="1600" height="1200" fill="url(#vig)"/>
</svg>
