# fly.io deployment for XAUCORE.  Steps:
#   fly launch --no-deploy        (creates the app; keep this fly.toml)
#   fly volumes create xaucore_data --size 1 --region <your-region>
#   fly deploy
#   fly certs add xaucore.io && fly certs add www.xaucore.io
#   -> then add the A / AAAA (or CNAME) records fly shows to your DNS provider

app = "xaucore"
primary_region = "fra"          # change to a region near you / near your volume

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8777"
  DB_PATH = "/data/xaucore.db"

[[mounts]]
  source = "xaucore_data"
  destination = "/data"

[http_service]
  internal_port = 8777
  force_https = true
  auto_stop_machines = "stop"    # machine sleeps when idle — the sim is frozen anyway
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

[[http_service.checks]]
  interval = "30s"
  timeout = "4s"
  grace_period = "5s"
  method = "GET"
  path = "/api/health"
